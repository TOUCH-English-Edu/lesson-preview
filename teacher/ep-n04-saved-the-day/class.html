    '<nav class="cnav" id="cnav" aria-label="Screens"><button type="button" data-nav="home" title="First screen (Home)" aria-label="First screen">⏮</button>' +
    '<button type="button" data-nav="-1" title="Back (←)" aria-label="Back">‹</button>' +
    '<button type="button" class="cpos" id="cpos" aria-haspopup="listbox" aria-expanded="false" title="Jump to a screen"></button>' +
    '<button type="button" data-nav="1" title="Next (→)" aria-label="Next">›</button></nav>' +
    '<div class="cjump" id="cjump" role="listbox" aria-label="Jump to a screen" hidden>' + EP.screens.map(function (x, i) {
      return '<button type="button" role="option" data-jump="' + i + '"><b>' + (i + 1) + "</b>" + EP.esc(x.title) + "<small>" + EP.esc(x.phase) + "</small></button>";
    }).join("") + "</div>" +
    '<div class="cnote" id="cnote"></div>' +
    '<p class="hud" aria-hidden="true"><kbd>→</kbd> next · <kbd>T</kbd> teacher · <kbd>N</kbd> names · <kbd>G</kbd> grammar · <kbd>F</kbd> full screen · <kbd>Home</kbd> first</p>';
  // the key hint sits over the top of the stage, so it leaves at the first key or click, or after four seconds
  function hudGone() { var h = document.querySelector(".hud"); if (h) h.classList.add("gone"); }
  setTimeout(hudGone, 4000);
  window.addEventListener("keydown", hudGone, { once: true, capture: true });
  window.addEventListener("pointerdown", hudGone, { once: true, capture: true });
  var pos = EP.readHash();
  // a click that only brings the page into focus (e.g. inside a frame) does not move the lesson on
  var hadFocus = document.hasFocus();
  window.addEventListener("pointerdown", function () { hadFocus = document.hasFocus(); }, true);
  var stage = EP.mountStage(document.getElementById("stage"), { tools: true, onClick: function () { if (hadFocus) go(1); hadFocus = true; } });
  var tp = EP.drawer("tpanel", "Teacher panel · private");
  var np = EP.drawer("npanel", "Names · tap a learner");
  var names = EP.mountNames(np, function () { return pos; }, function (text) { stage.quote(text); });
  tp.onOpen = drawTeacher;
  function drawTeacher() {
    tp.body.innerHTML = EP.teacherHTML(pos.screen, pos.step) +
      '<p class="keys"><kbd>→</kbd>/<kbd>Space</kbd> next · <kbd>←</kbd> back · <kbd>T</kbd> this panel · <kbd>N</kbd> names · <kbd>G</kbd> grammar tip · <kbd>F</kbd> full screen · <kbd>M</kbd> motion · <kbd>X</kbd> sound FX · <kbd>Home</kbd> first screen · <kbd>End</kbd> last screen · <kbd>Esc</kbd> close</p>' +
      '<p class="keys">Learner phone: <a href="' + EP.esc(EP.studentURL()) + '" target="_blank" rel="noopener">phone.html</a> (follows this page in the same browser).</p>';
  }
  function show() {
    // a rendering problem on one screen must never stop the navigation: the position still moves and shows
    try { stage.show(pos.screen, pos.step); } catch (err) { if (window.console) console.warn("screen " + (pos.screen + 1) + " did not draw fully:", err); }
    document.getElementById("cpos").textContent = (pos.screen + 1) + " / " + EP.screens.length;
    document.documentElement.setAttribute("data-pos", "s=" + (pos.screen + 1) + "&k=" + pos.step);
    EP.writeHash(pos.screen, pos.step);
    EP.sync.post(pos);
    document.title = (pos.screen + 1) + " · " + EP.screens[pos.screen].title + " · " + EP.L.title;
    if (tp.isOpen()) drawTeacher();
    if (np.isOpen()) names.draw();
  }
  // a listening step plays before it can be passed (stage.guardNext): the answers never come by accident
  function go(dir) { if (dir > 0 && stage.guardNext && stage.guardNext()) return; var before = pos.screen; pos = EP.move(pos, dir); if (pos.screen !== before) EP.stop(); show(); }
  function jump(i, step) { EP.stop(); pos = { screen: Math.max(0, Math.min(EP.screens.length - 1, i)), step: step || 0 }; show(); closeJump(); }
  // the counter: shows on mouse move, fades after a while; the jump list
  var nav = document.getElementById("cnav"), list = document.getElementById("cjump"), navTimer = null;
  function wake() { var cn = document.getElementById("cnote"); if (cn) { cn.classList.add("on"); clearTimeout(wake.t2); wake.t2 = setTimeout(function () { if (!document.querySelector(".note-panel")) cn.classList.remove("on"); }, 2600); }
    nav.classList.add("on"); clearTimeout(navTimer); navTimer = setTimeout(function () { if (list.hidden && !nav.matches(":hover")) nav.classList.remove("on"); }, 2600); }
  function closeJump() { list.hidden = true; document.getElementById("cpos").setAttribute("aria-expanded", "false"); }
  document.addEventListener("pointermove", wake, { passive: true });
  if (EP.note) EP.note.mount(document.getElementById("cnote"), { page: "class", where: function () { return pos; }, jump: function (s, k) { jump(s, k); } });
  wake();
  nav.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var a = b.getAttribute("data-nav");
    if (a === "home") jump(0);
    else if (a) go(+a);
    else if (b.id === "cpos") {
      list.hidden = !list.hidden;
      b.setAttribute("aria-expanded", list.hidden ? "false" : "true");
      if (!list.hidden) { var cur = list.querySelector('[data-jump="' + pos.screen + '"]'); list.querySelectorAll("[data-jump]").forEach(function (x) { x.classList.toggle("cur", x === cur); }); if (cur) { cur.scrollIntoView({ block: "nearest" }); cur.focus(); } }
    }
    wake();
  });
  list.addEventListener("click", function (e) { var b = e.target.closest("[data-jump]"); if (b) jump(+b.getAttribute("data-jump")); });
  show();
  if (pos.panel === "t") tp.open();
  if (pos.panel === "n") np.open();
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    var k = e.key;
    if (k === "Home") { e.preventDefault(); jump(0); return; }
    if (k === "End") { e.preventDefault(); jump(EP.screens.length - 1); return; }
    if (k === "Escape" && !list.hidden) { closeJump(); return; }
    if (k === "ArrowRight" || k === "PageDown" || (k === " " && !(e.target.closest && e.target.closest("button")))) { e.preventDefault(); go(1); }
    else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); go(-1); }
    else if (k === "t" || k === "T") tp.toggle();
    else if (k === "n" || k === "N") np.toggle();
    else if (k === "g" || k === "G") stage.toggleTip();
    else if (k === "m" || k === "M") { if (EP.setMotion) EP.setMotion(!EP.motionOn()); }
    else if (k === "x" || k === "X") { if (EP.fx) EP.fx.toggle(); }
    else if (k === "f" || k === "F") { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); }
    else if (k === "Escape") { if (!EP.closeDrawers() && !stage.closeAll()) EP.stop(); }
  });
})();

</script>
