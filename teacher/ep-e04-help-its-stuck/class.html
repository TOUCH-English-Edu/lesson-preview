      // A half-written note is never lost (Marco 2026-10-03: the panel closed by accident and the text was gone):
      // whatever is in the box is kept as a draft in this browser on every keystroke and on close, and comes back
      // the next time the panel opens, on any screen, until it is sent. A click outside no longer closes a panel
      // that holds text; 取消, Esc and the button still do, and the draft stays.
      var DRAFT = "touch:ep:note-draft:" + L.id + ":" + opts.page;
      function draft(v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(DRAFT) || "null"); if (v) localStorage.setItem(DRAFT, JSON.stringify(v)); else localStorage.removeItem(DRAFT); } catch (e) { return null; } }
      function keepDraft() {
        if (!panel) return;
        var t = panel.querySelector("textarea").value;
        if (t.trim()) draft({ text: t, screen: opts.where().screen + 1, at: Date.now() }); else draft(null);
      }
      function close() { keepDraft(); if (panel) panel.remove(); panel = null; btn.setAttribute("aria-expanded", "false"); badge(); }
      function open() {
        badge();
        var w = opts.where();
        panel = document.createElement("div");
        panel.className = "note-panel";
        panel.setAttribute("role", "dialog");
        panel.setAttribute("aria-label", "提意见");
        panel.innerHTML = '<p class="nw">第 ' + (w.screen + 1) + " 页 · 第 " + w.step + " 步 · " + esc(EP.screens[w.screen].title) + "</p>" +
          '<div class="nchips" data-g="kind">' + KINDS.map(function (k) { return '<button type="button" data-v="' + k[0] + '" aria-pressed="' + (k[0] === kind) + '">' + k[1] + "</button>"; }).join("") + "</div>" +
          '<div class="nchips small" data-g="size"><span>班级人数（可不填）</span>' + SIZES.map(function (k) { return '<button type="button" data-v="' + k + '" aria-pressed="' + (k === size) + '">' + k + "</button>"; }).join("") + "</div>" +
          '<textarea maxlength="1500" placeholder="这一页哪里要改？例如：奶奶的图可以再大一点。" aria-label="意见"></textarea>' +
          '<div class="nrow"><span class="nmsg" role="status"></span><span><button type="button" class="ncancel">取消</button> <button type="button" class="nsend">送出</button></span></div>' +
          mineHTML(w, opts);
        (opts.panelHost || document.body).appendChild(panel);
        var r = btn.getBoundingClientRect();
        if (!opts.panelHost) {
          panel.style.top = Math.min(window.innerHeight - 20, r.bottom + 8) + "px";
          panel.style.right = Math.max(8, window.innerWidth - r.right) + "px";
        }
        btn.setAttribute("aria-expanded", "true");
        var ta0 = panel.querySelector("textarea"), d = draft();
        if (d && d.text) {
          ta0.value = d.text;
          var hint = document.createElement("p");
          hint.className = "ndraft";
          hint.textContent = "这是你还没送出的草稿" + (d.screen && d.screen !== w.screen + 1 ? "（原本写在第 " + d.screen + " 页，送出时会记在现在这一页）" : "") + "。";
          ta0.parentNode.insertBefore(hint, ta0);
        }

      }
      btn.addEventListener("click", function (e) { e.stopPropagation(); if (panel) close(); else open(); });
      // keys and clicks inside the panel never reach the lesson (no slide moves while typing)
      document.addEventListener("keydown", function (e) {
        if (!panel) return;
        if (panel.contains(e.target)) { e.stopPropagation(); if (e.key === "Escape") close(); return; }
        if (e.key === "Escape") { close(); e.stopPropagation(); }
      }, true);
      document.addEventListener("click", function (e) {
        if (!panel) return;
        if (panel.contains(e.target)) {
          e.stopPropagation();
          var a = e.target.closest("a.nmi");
          if (a) { e.preventDefault(); location.href = a.getAttribute("href"); return; }
          var b = e.target.closest("button");
          if (!b) return;
          if (b.hasAttribute("data-go")) {
            var g2 = b.getAttribute("data-go").split(":"), s2 = +g2[0], k2 = +g2[1];
            close();
            if (opts.jump) opts.jump(s2, k2);
            else { location.hash = "s=" + (s2 + 1) + "&k=" + k2; location.reload(); }
            return;
          }
          var g = b.parentElement.getAttribute("data-g");
          if (g === "kind") { kind = b.getAttribute("data-v"); panel.querySelectorAll('[data-g="kind"] button').forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); }
          else if (g === "size") { size = size === b.getAttribute("data-v") ? "" : b.getAttribute("data-v"); panel.querySelectorAll('[data-g="size"] button').forEach(function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-v") === size); }); }
          else if (b.classList.contains("ncancel")) close();
          else if (b.classList.contains("nsend")) {
            var ta = panel.querySelector("textarea"), text = ta.value.trim(), msg = panel.querySelector(".nmsg");
            if (!text) { ta.focus(); return; }
            var w = opts.where();
            var body = { lesson: L.id, code: L.code, screen: w.screen + 1, step: w.step, kind: kind, text: text.slice(0, 1500), page: opts.page };
            if (size) body.size = size;
            b.disabled = true; msg.textContent = "送出中…";
            send(body).then(function (st) {
              b.disabled = false;
              if (st === 204) {
                keep({ lesson: L.id, code: L.code, screen: body.screen, step: body.step, kind: kind, page: opts.page, title: EP.screens[w.screen].title, text: body.text, at: Date.now() });
                ta.value = ""; draft(null); badge(); msg.textContent = MSG[204] + "（已存进「我留过的意见」）"; setTimeout(close, 1400); return;
              }
              if (st === 404) { try { sessionStorage.setItem(OFF, "1"); } catch (x) {} close(); buttons.forEach(function (x) { x.remove(); }); return; }
              msg.textContent = MSG[st] || MSG[503];
            });
          }
          return;
        }
        // a click outside closes the panel and does nothing else (it does not move the lesson on)
        if (!btn.contains(e.target)) {
          e.stopPropagation(); e.preventDefault();
          if (panel.querySelector("textarea").value.trim()) { var m2 = panel.querySelector(".nmsg"); m2.textContent = "还没送出：按「送出」，或按「取消」先收起来（文字会留着）。"; return; }
          close();
        }
      }, true);
      return wrap;
    }
  };
})();

</script>
<script>
// Episode lessons · the projected stage: one 16:9 screen built from the content's blocks, revealed step by
// step. EP.stageHTML draws a screen; EP.paint shows a step; EP.mountStage runs it with the dock tools.
(function () {
  var EP = window.EP, L = EP.L, esc = EP.esc, rich = EP.rich;
  function at(n) { return typeof n === "number" && n > 0 ? ' data-at="' + n + '"' : ""; }
  // TIME YOU CAN SEE: every element that stands for one part of the formula carries its place in time
  // (class tz tz-P | tz-P2 | tz-F, and data-tz for the arrival). The finish and the depth are in ep.css.
  function tz(t) { return ' tz tz-' + esc(t); }
  function tzd(t) { return ' data-tz="' + esc(t) + '"'; }
  // THE TIME LINE (drafts E + D, docs/mock/timeline-sketch.html): a glowing beam grey (past) → blue (now) →
  // orange (future), filled up to the newest revealed part; a cyan bead travels along the filled part and fades,
  // again and again; ticks with the time words, each lighting as the bead passes. Only the bead moves.
  // Positions are set by EP.timeLayout after each step (horizontal under side-by-side parts, vertical beside
  // stacked ones).
  var TIMEWORDS = [["last week", "P", 0.30], ["yesterday", "P", 0.70], ["now", "P2", 0.5], ["tomorrow", "F", 0.30], ["next time", "F", 0.70]];
  function beamHTML(dir) {
    return '<div class="tbeam ' + dir + '" aria-hidden="true"><i class="track"></i><i class="beam"></i><i class="nowdot"></i>' +
      TIMEWORDS.map(function (t, k) { return '<span class="tk" data-k="' + k + '" data-p="' + t[1] + '"><i></i><b>' + t[0] + "</b></span>"; }).join("") +
      '<i class="bead"></i></div>';
  }
  // The time line belongs to PPF lessons only (parts P, P2, F): a formula whose parts are not places in time
  // (OREO: opinion, reason, example, opinion again) gets no beam, no time words and no receding past.
  function tline() { return EP.timeFormula ? '<div class="tline">' + beamHTML("h") + "</div>" : ""; }
  function vbeam() { return EP.timeFormula ? beamHTML("v") : ""; }
  // the colour family of a part as CSS variables (puffy cards of a formula that is not PPF)
  function pcVars(t, i, n) {
    var c = EP.partCol(t), r = n > 1 ? -2 + 4 * i / (n - 1) : 0;
    return "--c1:" + c.c1 + ";--c2:" + c.c2 + ";--c3:" + c.c3 + ";--r:" + r.toFixed(2) + "deg";
  }
  // "the customer's phone", but "Mr. Tan's phone": a name (capitals after its first letter) keeps them and takes no "the"
  function ownerPhone(who) { return /[A-Z]/.test(who.slice(1)) ? who + "'s phone" : "the " + who.toLowerCase() + "'s phone"; }
  // one side of a two-sided task card: face down on the stage (only its owner reads it, on the phone)
  function sideHTML(sd, flipAt) {
    var who = sd.who || "Card", notes = [].concat(sd.notes || sd.text || []);
    return '<div class="tside"' + (flipAt ? ' data-flip="' + esc(flipAt) + '"' : "") + '><div class="in">' +
      '<div class="face cover"><span class="ic" aria-hidden="true">' + esc(sd.icon || "🔒") + "</span><b>" + esc(who) + "</b><small>" + esc(sd.hint || "🔒 Secret · on " + ownerPhone(who)) + "</small></div>" +
      '<div class="face open"><b>' + (sd.icon ? esc(sd.icon) + " " : "") + esc(who) + "</b>" + bullets(notes) + "</div></div></div>";
  }
  // poll colours: the content may set its own (`colors`), else a calm categorical set
  var POLLCOL = ["#2f6fd0", "#e0792e", "#8a96ab", "#7a4fc4", "#14a38b", "#c0405c"];
  var curSc = null, titleDone = false;
  // a short list inside a card or a task-card side: ["…", "…"] → bullet lines (rich text)
  function bullets(items, cls) {
    return items && items.length ? '<ul class="' + (cls || "clist") + '">' + items.map(function (x) { return "<li>" + rich(x) + "</li>"; }).join("") + "</ul>" : "";
  }
  // a picture for a part: the item's own (a scene id or a list of ids, first one that exists), else the lesson's
  // partPics {P: [...], P2: [...], F: [...]}
  EP.partPic = function (tagName, own) {
    if (own === false) return ""; // a part may opt out of the lesson's partPics
    var list = [].concat(own || [], (L.partPics || {})[tagName] || []);
    for (var k = 0; k < list.length; k++) { var src = EP.asset("scene:" + list[k]); if (src) return src; }
    return "";
  };
  function glassPair(tagName, wrong, right, revealAt, pic, hint) {
    var src = EP.partPic(tagName, pic);
    return '<div class="glasswrap tzg-' + esc(tagName || "P2") + '">' + (src ? '<span class="gbg" style="background-image:url(\'' + esc(src) + '\')"></span>' : "") +
      '<div class="glass"><div class="gl bad"><span class="mk" aria-hidden="true">✕</span><span>' + rich(wrong) + "</span></div>" +
      (hint ? '<div class="ghint">' + esc(hint) + "</div>" : "") +
      '<div class="gl ok"' + tzd(tagName) + at(revealAt) + '><span class="mk" aria-hidden="true">✓</span><span>' + rich(right) + "</span></div></div></div>";
  }
  function tag(t, withLabel) {
    var p = EP.part(t);
    return '<span class="tag t-' + esc(EP.partCls(t)) + '"' + EP.tagStyle(t) + ">" + esc(p.name) + (withLabel ? "<small>" + esc(p.label) + "</small>" : "") + "</span>";
  }

  // ---------- phone apps (sketch C): the event itself, inside a real-looking phone ----------
  var APPS = {
    lock: function (b) {
      return '<div class="lock"><div class="d">' + esc(b.date || "") + '</div><div class="t">' + esc(b.time || "9:41") + "</div>" +
        (b.items || []).map(function (n) {
          return '<div class="notif"' + at(n.at) + '><span class="ni">' + (n.avatar ? '<span class="av">' + EP.face(n.avatar, n.from) + "</span>" : esc(n.icon || "")) + '</span><div class="nh">' + esc(n.from) + "<span>" + esc(n.time || "") + "</span></div><p>" + rich(n.text) + "</p></div>";
        }).join("") + "</div>";
    },
    chat: function (b) {
      return hd(b, true) + '<div class="chat">' + bubbles(b) + reason(b) + "</div>";
    },
    sms: function (b) {
      return hd(b, false) + '<div class="sms"><div class="day">Today</div>' + bubbles(b) + reason(b) + "</div>";
    },
    email: function (b) {
      return '<div class="app-hd"><span class="back">‹</span><div><b>' + esc(b.name || "Inbox") + "</b></div></div>" +
        '<div class="mail"><div class="from"><span class="av">' + EP.face(b.fromAvatar, b.from) + "</span><div><b>" + esc(b.from) + "</b><small>" + esc(b.addr || "") + '</small></div></div><div class="subj">' + esc(b.subject || "") + "</div>" +
        (b.items || []).map(function (m) { return "<div" + at(m.at) + ">" + rich(m.text) + "</div>"; }).join("") + reason(b) + "</div>";
    },
    // An incoming call. `video: true` says "Incoming video call …"; `video: "<scene id>"` shows the other side's camera
    // (the picture fills the call screen, a small self-view in the corner); `label` sets the top line yourself.
    call: function (b) {
      var ln = EP.line(b.line), vsrc = typeof b.video === "string" ? EP.asset("scene:" + b.video) : "";
      var label = b.label || (b.video ? (vsrc ? "Video call" : "Incoming video call …") : "Incoming call …");
      var play = ln ? '<div class="lnk">' + EP.playBtn(b.line, "Hear the call") + '<span class="bars" aria-hidden="true"></span><span>Hear it</span></div>' : "";
      if (vsrc) {
        return '<div class="call vcall"><img class="vfeed" src="' + esc(vsrc) + '" alt="' + esc(b.videoAlt || "") + '"><div class="vtop"><small>' + esc(label) + "</small><b>" + esc(b.name) + "</b>" +
          (b.sub ? "<small>" + esc(b.sub) + "</small>" : "") + '</div><span class="vself" aria-hidden="true"></span>' + play + '<div class="btns" aria-hidden="true"><i>✕</i></div></div>';
      }
      return '<div class="call"><small>' + esc(label) + '</small><div class="cav">' + EP.face(b.avatar, b.name) + "</div><b>" + esc(b.name) + "</b><small>" + esc(b.sub || "") + "</small>" +
        play + '<div class="btns" aria-hidden="true"><i>✕</i><i>✆</i></div></div>';
    }
  };
  function hd(b, chat) {
    var v = (b.items || []).filter(function (m) { return m.voice; })[0], who = v ? EP.line(v.voice).who : "";
    return '<div class="app-hd"><span class="back">‹</span><span class="av"' + (who ? ' data-speaker="' + esc(who) + '"' : "") + ">" + EP.face(b.avatar, b.name) + "</span><div><b>" + esc(b.name) + "</b>" +
      (b.sub ? "<small>" + esc(b.sub) + "</small>" : "") + "</div></div>";
  }
  function bubbles(b) {
    return (b.items || []).map(function (m) {
      var inner;
      if (m.voice) {
        inner = '<div class="vnote">' + EP.playBtn(m.voice, "Play the voice message") + '<span class="bars"></span><span class="d">' + esc(m.dur || "") + "</span></div>";
      } else if (m.line) {
        inner = "“" + rich(EP.line(m.line).text) + "”";
      } else inner = rich(m.text);
      return '<div class="bub' + (m.me ? " me" : "") + (m.quote ? " quote" : "") + (!m.voice && !m.typing ? " zoomable" : "") + (m.typing ? " typing" : "") + (m.grow ? " grow-src" : "") + '"' + at(m.at) + ">" + inner + (m.time ? "<time>" + esc(m.time) + "</time>" : "") + "</div>";
    }).join("");
  }
  function reason(b) {
    var r = b.reason;
    if (!r) return "";
    var tone = r.tone || (b.stamp && b.stamp.kind === "bad" ? "bad" : "");
    return '<div class="reason ' + tone + '"' + at(r.at) + ">" + rich(r.text) + "</div>";
  }

  // one stage chat bubble (the `chat` block, and the reactions under a `compare`)
  function sbHTML(m) {
    var ln = m.line ? EP.line(m.line) : null, who = m.who || (ln && !m.me ? ln.who : "");
    if (ln && m.text == null && !m.quote) {
      return '<div class="sb' + (m.me ? " me" : "") + '"' + at(m.at) + '>' + '<span class="av">' + EP.face(m.avatar, who) + "</span><div><small>" + esc(who) + "</small>" +
        '<span class="svnote">' + EP.playBtn(m.line, "Play: " + who) + '<span class="bars" aria-hidden="true"></span>' + (m.dur ? '<span class="d">' + esc(m.dur) + "</span>" : "") + "</span></div></div>";
    }
    var text = m.text != null ? m.text : ln ? "“" + ln.text + "”" : "";
    var play = ln && m.play ? '<span class="svnote mini">' + EP.playBtn(m.line, "Play: " + who) + '<span class="bars" aria-hidden="true"></span>' + (m.dur ? '<span class="d">' + esc(m.dur) + "</span>" : "") + "</span>" : "";
    return '<div class="sb' + (m.me ? " me" : "") + '"' + at(m.at) + ">" + (who ? '<span class="av">' + EP.face(m.avatar, who) + "</span>" : "") +
      "<div><small>" + esc(m.label || who || "Your reply") + "</small>" + rich(text) + (m.flag ? '<span class="flag">' + rich(m.flag, { words: false }) + "</span>" : "") + play + "</div></div>";
  }
  // ---------- blocks ----------
  var B = {
    title: function (b) {
      var pur = curSc && curSc.purpose && !titleDone ? purposeHTML(curSc) : "";
      titleDone = true;
      return '<div class="b-title' + (b.small ? " small" : "") + '"' + at(b.at) + ">" + (b.kicker ? '<span class="k">' + esc(b.kicker) + "</span>" : "") + "<h1>" + rich(b.text) + "</h1>" + (b.sub ? "<p>" + rich(b.sub) + "</p>" : "") + pur + "</div>";
    },
    note: function (b) { return '<div class="note ' + (b.tone || "") + '"' + at(b.at) + ">" + EP.richBlock(b.text) + "</div>"; },
    // A card. `items: [...]` adds bullet lines under the text; `drop: {at, text}` rules the option out at that
    // step: the card falls back and greys out with a red mark (its space is kept), e.g. R11 "Repair: not worth it".
    card: function (b) {
      var drop = b.drop ? '<span class="dropmark"' + at(b.drop.at) + ">" + rich(b.drop.text || "✗ Dropped") + "</span>" : "";
      return '<div class="card ' + (b.tone || "") + (b.drop ? " dropcard" : "") + '"' + at(b.at) + (b.drop ? ' data-drop="' + esc(b.drop.at) + '"' : "") + ">" +
        (b.title ? "<h3>" + esc(b.title) + "</h3>" : "") + (b.text ? (b.drop ? '<span class="ctext">' + EP.richBlock(b.text) + "</span>" : EP.richBlock(b.text)) : "") + bullets(b.items) + drop + "</div>";
    },
    phone: function (b) {
      var stamp = b.stamp ? '<div class="stamp ' + esc(b.stamp.kind || "bad") + '"' + at(b.stamp.at) + ">" + esc(b.stamp.text) + "</div>" : "";
      var scr = b.app === "lock" ? "lockbg" : b.app === "call" ? "callbg" : "";
      return EP.iphone(APPS[b.app](b) + stamp, { cls: b.tilt === false ? "" : "tilt", scr: scr, style: "--pw:" + (b.w || "24cqw"), time: b.app === "lock" ? "" : (b.clock || "9:41") }); // a lock screen has its own big clock: no time in the status bar
    },
    // A picture. Real files keep their own shape (ratio, default 3:2), so nothing is cropped; until the file
    // exists a striped placeholder of the same shape shows the caption. overlay: [{kind "say", text, pos, at}]
    scene: function (b) {
      var src = EP.asset("scene:" + b.id);
      var style = ' style="aspect-ratio:' + esc(b.ratio || "3/2") + (b.w ? ";width:" + esc(b.w) : "") + '"';
      // overlay kinds: say (speech bubble) · pin (a label with a dot) · lbl (a plain label) · label (a place label, blue
      // text and border) · sticker · ring (a glowing frame round a spot: pos gives left/top/width/height; round: true
      // for a circle)
      var ov = (b.overlay || []).map(function (o) {
        var kind = o.kind === "label" ? "lbl ov-label" : o.kind || "say";
        return '<div class="ov ov-' + kind.replace(/[^\w -]/g, "") + (o.round ? " round" : "") + '" style="' + esc(o.pos || "") + '"' + at(o.at) + (kind === "ring" ? ' aria-hidden="true">' : ">" + rich(o.text)) + "</div>";
      }).join("");
      var cls = "scene" + (b.tilt ? " tilt" : "");
      var data = ' data-mood="' + esc(b.mood || "calm") + '"' + (b.speaker ? ' data-speaker="' + esc(b.speaker) + '"' : "");
      if (src) return '<figure class="' + cls + ' has-img"' + style + data + at(b.at) + '><span class="sc-in"><img src="' + esc(src) + '" alt="' + esc(b.caption) + '"></span>' + ov + "</figure>";
      return '<figure class="' + cls + '"' + style + data + at(b.at) + ' role="img" aria-label="Picture to come: ' + esc(b.caption) + '"><span class="si" aria-hidden="true">🖼️</span><span class="sc">' + esc(b.caption) + '</span><span class="sn">Picture to come</span>' + ov + "</figure>";
    },
    // Notifications as readable cards on the stage (the hook)
    notifs: function (b) {
      return '<div class="snotifs"' + at(b.at) + ">" + b.items.map(function (n) {
        return '<div class="snotif"' + at(n.at) + '><span class="ni" aria-hidden="true">' + (n.avatar ? '<span class="av">' + EP.face(n.avatar, n.from) + "</span>" : esc(n.icon || "")) + '</span><div class="nh">' + esc(n.from) + "<span>" + esc(n.time || "") + "</span></div><p>" + rich(n.text) + "</p></div>";
      }).join("") + "</div>";
    },
    // Chat lines at stage size (beside a picture): {who, avatar, text} or {me, text, flag, label?}. {who, line, dur?} is a
    // voice message (play button and waveform: listen first, no text); add `quote: true` to show its words instead, and
    // `play: true` as well to keep a small play button under the words (words AND voice). A `me` bubble says "Your
    // reply" unless it has a `label` ("Before", "After" …).
    chat: function (b) {
      return '<div class="schat"' + at(b.at) + ">" + b.items.map(sbHTML).join("") + "</div>";
    },
    listen: function (b) {
      return '<div class="listen"' + at(b.at) + ">" + EP.playBtn(b.lines, "Play: " + (b.label || "")) + "<span>" + rich(b.label || "Listen", { words: false }) + '</span><span class="wave" aria-hidden="true"></span><span class="dur">' + esc(b.dur || "") + "</span></div>";
    },
    qa: function (b) {
      return '<div class="qa"' + at(b.at) + ">" + (b.title ? "<h3>" + esc(b.title) + "</h3>" : "") + "<ol>" + b.items.map(function (x) {
        return '<li><span class="q">' + rich(x.q) + '</span><span class="a"' + at(b.answersAt) + ">" + rich(x.a) + "</span></li>";
      }).join("") + "</ol></div>";
    },
    list: function (b) {
      return '<div class="list' + (b.small ? " small" : "") + (b.bullets ? " bullets" : "") + '"' + at(b.at) + ">" + (b.title ? "<h3>" + esc(b.title) + "</h3>" : "") +
        '<div class="grid" style="--n:' + (b.cols || 1) + '">' + b.items.map(function (x) {
          return '<div class="it"' + at(x.at) + ">" + (x.icon ? '<span class="ic" aria-hidden="true">' + esc(x.icon) + "</span>" : "") + "<span>" + rich(x.text) + "</span>" +
            (x.tag ? '<span class="sk" title="' + esc(EP.subskill(x.tag)) + '">' + esc(x.tag) + "</span>" : "") + "</div>";
        }).join("") + "</div></div>";
    },
    // PAST / PRESENT / FUTURE as puffy picture cards in a row (approved 2026-10-03, docs/mock/cards-sketch.src.html):
    // a thick rounded white card with a coloured lip, a soft gloss, a pill tab, a picture (part.pic or the
    // lesson's partPics), the part's question and the sentence; a slight tilt; FUTURE fully dashed; the E+D time
    // line underneath. `layout: "stack"` keeps the older stacked cards.
    ppf: function (b) {
      if (b.layout === "stack") {
        return '<div class="ppf ' + (EP.timeFormula ? "tstack" : "pstack") + '">' + vbeam() + b.parts.map(function (p) {
          var pic = EP.partPic(p.tag, p.pic);
          return '<div class="part' + tz(p.tag) + (pic ? " with-pic" : "") + '" data-part="' + esc(p.tag) + '"' + tzd(p.tag) + " data-focus" + at(p.at) + ">" + tag(p.tag, true) + "<p>" + rich(p.text) + "</p>" +
            (pic ? '<img class="ppic" src="' + esc(pic) + '" alt="' + esc(p.picAlt || "") + '">' : "") + "</div>";
        }).join("") + "</div>";
      }
      // a row of as many cards as the formula has parts (PPF 3, OREO 4); PPF keeps its time finishes and tilts,
      // other formulas take their part colours and a gentle fan of tilts
      var n = b.parts.length;
      return '<div class="ppf pcards' + (EP.timeFormula ? "" : " pc-free") + '" style="--n:' + n + '">' + b.parts.map(function (p, i) {
        var part = EP.part(p.tag), pic = EP.partPic(p.tag, p.pic);
        return '<div class="pc puffy' + tz(p.tag) + '" data-part="' + esc(p.tag) + '"' + tzd(p.tag) + at(p.at) + (EP.timeFormula ? "" : ' style="' + pcVars(p.tag, i, n) + '"') + '><span class="ptab">' + esc(part.name) + "</span>" +
          '<div class="pcpic">' + (pic ? '<img src="' + esc(pic) + '" alt="' + esc(p.picAlt || "") + '">' : "") + "</div>" +
          '<p class="pq">' + esc(part.label) + '</p><p class="psay">' + rich(p.text) + "</p></div>";
      }).join("") + tline() + "</div>";
    },
    // WRONG + RIGHT on one frosted glass card over a soft picture of that part's scene (approved 2026-10-03).
    // {type:"pair", part, wrong, right, hint?, pic?, at} — the right line rises in at `at`; its space is kept.
    pair: function (b) { return glassPair(b.part, b.wrong, b.right, b.at, b.pic, b.hint); },
    wordwall: function (b) {
      var from = b.flipFrom || 1;
      return '<div class="ww">' + L.words.map(function (w, i) {
        return '<div class="wcard" data-flip="' + (from + i) + '" data-cur="' + (from + i) + '"><div class="in">' +

    poll: function (b) {

  // ---------- one screen ----------
  EP.stageHTML = function (sc, opts) {

      '<span class="switches">' + (EP.gloss ? EP.gloss.seg("in-dock") : "") + '<button type="button" class="sw" data-tool="fx" aria-pressed="false" title="Sound effects (X)">FX</button>' +

      L.parts.map(function (p) { return '<span class="tag t-' + esc(EP.partCls(p.tag)) + '"' + EP.tagStyle(p.tag) + ">" + esc(p.name) + "</span><span>" + esc(p.label) + "</span>"; }).join("") + "</div></div>" +

  // THE PURPOSE LINE: why this page, and how it follows the last one (`purpose`, one line, plain English). Under the

  function purposeHTML(sc) { return sc.purpose ? '<p class="purpose"><span>' + rich(sc.purpose) + "</span></p>" : ""; }
  // THE TRANSCRIPT: after the answers, the full text of what was heard, so learners can check what they missed.
  // A frosted card over one side of the stage (`side`: "left" default, or "right"; `w` its width, default 44cqw), as

  // `hideAt` (if set); the teacher can close it (×). Each line keeps its play button.
  function transcriptsHTML(sc) {
    return EP.listens(sc).filter(function (x) { return typeof x.transcriptAt === "number"; }).map(function (x) {

        timer.h = setInterval(function () { timer.left--; if (timer.left <= 0) { timer.left = 0; clearInterval(timer.h); timer.h = null; if (EP.fx) EP.fx.play("chime2"); } drawTimer(); }, 1000);
      }
      drawTimer();
    }
    function gameBlock(s) { var it = null; s.cols.forEach(function (c) { c.blocks.forEach(function (b) { if (b.type === "game") it = b; }); }); return it; }
    function paintScore() {
      if (!api.el) return;
      api.el.querySelectorAll("[data-team]").forEach(function (b) { b.querySelector("b").textContent = scores[b.getAttribute("data-team")] || 0; });
    }
    function pop(sel, btnSel, force) {
      var p = api.el.querySelector(sel), b = btnSel && api.el.querySelector(btnSel);
      var show = force == null ? p.hidden : force;
      api.el.querySelectorAll(".pop").forEach(function (x) { if (x !== p) x.hidden = true; });
      api.el.querySelectorAll(".tool[aria-expanded]").forEach(function (x) { if (x !== b) x.setAttribute("aria-expanded", "false"); });
      p.hidden = !show;
      if (b) b.setAttribute("aria-expanded", show ? "true" : "false");
      return show;
    }
    api.toggleTip = function () { return pop(".tipcard", '[data-tool="tip"]'); };
    api.closeAll = function () {
      if (!api.el) return false;
      var any = false;
      api.el.querySelectorAll(".pop,.readout").forEach(function (x) { if (!x.hidden) any = true; x.hidden = true; });
      if (EP.gloss && EP.gloss.isOpen()) { EP.gloss.close(); any = true; }
      api.el.querySelectorAll(".tool[aria-expanded]").forEach(function (x) { x.setAttribute("aria-expanded", "false"); });
      return any;
    };
    // "Read it to the class": the answer, without the name
    api.quote = function (text) {
      var q = api.el.querySelector(".readout");
      if (!q) return;
      api.closeAll();
      q.querySelector("small").textContent = "A learner wrote";
      q.querySelector("p").textContent = text;
      q.hidden = false;
    };
    // typing the length: Enter or leaving the field sets it; Escape puts the old value back
    host.addEventListener("change", function (e) { if (e.target.hasAttribute("data-tm")) { var n = parseTime(e.target.value); if (n) setSeconds(n); else drawTimer(); } });
    host.addEventListener("keydown", function (e) {
      if (!e.target.hasAttribute || !e.target.hasAttribute("data-tm")) return;
      e.stopPropagation();
      if (e.key === "Enter") e.target.blur();
      if (e.key === "Escape") { e.target.value = EP.fmt(timer.left); e.target.blur(); }
    });
    host.addEventListener("focusout", function (e) { if (e.target.hasAttribute && e.target.hasAttribute("data-tm")) setTimeout(drawTimer, 0); });
    host.addEventListener("click", function (e) {
      var wd = e.target.closest(".wch, .gw");
      if (wd && EP.gloss) { EP.gloss.open(wd); return; }
      if (EP.gloss && EP.gloss.isOpen() && !e.target.closest(".gloss")) { EP.gloss.close(); if (!e.target.closest("button")) return; }
      var t = e.target.closest("button, a, textarea, input, select");
      if (t) {
        if (t.hasAttribute("data-lplay")) { playListen(); return; }
        if (t.hasAttribute("data-tsclose")) { t.closest(".tscript").classList.add("closed"); return; }
        if (t.hasAttribute("data-close")) { t.closest(".pop,.readout").hidden = true; api.el.querySelectorAll(".tool[aria-expanded]").forEach(function (x) { x.setAttribute("aria-expanded", "false"); }); return; }
        var tool = t.getAttribute("data-tool");
        if (tool === "tip") pop(".tipcard", '[data-tool="tip"]');
        else if (tool === "ppf") pop(".legend", '[data-tool="ppf"]');
        else if (tool === "timer") toggleTimer();
        else if (tool === "reset") resetTimer();
        else if (tool === "tminus" || tool === "tplus") setSeconds((timer.h ? seconds() : timer.left) + (tool === "tplus" ? 30 : -30));
        else if (t.hasAttribute("data-tchoice")) {
          api.el.querySelectorAll("[data-tchoice]").forEach(function (c) { c.removeAttribute("data-picked"); });
          t.setAttribute("data-picked", "");
          setSeconds(sc().timerChoices[+t.getAttribute("data-tchoice")].seconds);
        }
        else if (t.hasAttribute("data-hand")) { EP.pollHand(api.el, sc(), t, e.shiftKey ? -1 : 1); }
        else if (tool === "fx") { if (EP.fx) EP.fx.toggle(); }
        else if (t.classList.contains("w") && t.closest(".dock")) { if (EP.showWord) EP.showWord(api.el, t.getAttribute("data-w"), true); if (EP.gloss) EP.gloss.open(t); }
        else if (tool === "motion") { if (EP.setMotion) EP.setMotion(!EP.motionOn()); }
        else if (t.hasAttribute("data-team")) { var k = t.getAttribute("data-team"); scores[k] = (scores[k] || 0) + (e.shiftKey ? -1 : 1); if (scores[k] < 0) scores[k] = 0; paintScore(); if (EP.swell) EP.swell(t.querySelector("b"), api.el); if (EP.fx) EP.fx.play("pop"); }
        return;
      }
      if (e.target.closest(".pop,.readout,.tscript")) return;
      // a message inside a stage phone (a quoted voice message, a text) opens large, like a magnifying glass
      var qb = e.target.closest(".bub.quote, .bub.zoomable");
      if (qb && !qb.closest(".pre") && qb.closest(".st-main")) { zoom(qb); return; }
      if (opts.onClick) opts.onClick(e);
    });
    function zoom(bub) {
      var q = api.el.querySelector(".readout");
      if (!q) return;
      api.closeAll();
      var ph = bub.closest(".iph"), who = ph ? (ph.querySelector(".app-hd b") || {}).textContent : "";
      q.querySelector("small").textContent = bub.classList.contains("me") ? "You wrote" : who ? who + (bub.classList.contains("quote") ? " said" : " wrote") : "The message";
      q.querySelector("p").innerHTML = bub.innerHTML.replace(/<time>.*?<\/time>/, "");
      q.hidden = false;
    }
    api.timer = { toggle: toggleTimer, reset: resetTimer };
    return api;
  };

})();

</script>
<script>
// Episode lessons · teacher-only panels (class.html, review.html): the private teacher panel (T) and the
// name panel (N). Never loaded into the student page.
(function () {
  var EP = window.EP, L = EP.L, esc = EP.esc, rich = EP.rich;

  // ---------- the teacher text for one screen ----------
  function stepLabel(k) { return k === 0 ? "Start" : "Click " + k; }
  EP.teacherHTML = function (i, step, opts) {
    opts = opts || {};
    var sc = EP.screens[i], t = sc.teacher || {}, n = EP.steps(sc), cur = EP.sayIndex(sc, step);
    var meta = '<div class="tp-meta"><span>Screen ' + (i + 1) + " / " + EP.screens.length + "</span><span>" + esc(sc.phase) + "</span><span>" + sc.min + " min</span>" +
      (n ? "<span>Step " + step + " / " + n + "</span>" : "") + (sc.ladder ? "<span>Ladder: " + esc(sc.ladder) + "</span>" : "") +
      (sc.who ? "<span>Who: " + esc(sc.who) + "</span>" : "") +
      ((sc.trains || []).length ? "<span>Trains: " + sc.trains.map(function (x) { return esc(x + " " + EP.subskill(x)); }).join(", ") + "</span>" : "") + "</div>";
    var steps = (t.say || []).map(function (s, k) {
      var last = k === (t.say.length - 1) && n > k;
      return '<li class="' + (k === cur ? "now" : k < cur ? "done" : "") + '"><b>' + (last ? stepLabel(k) + (n > k ? "–" + n : "") : stepLabel(k)) + "</b><span>" + esc(s) + "</span></li>";
    }).join("");
    var more = Object.keys(t.more || {}).map(function (k) { return '<div class="tp-more"><b>' + esc(k) + "</b>" + esc(t.more[k]) + "</div>"; }).join("");
    var g = EP.tipAt(sc, step);
    return meta +
      '<div class="tp-sec' + (opts.wide ? " wide" : "") + '"><h5>Goal of this screen</h5><p>' + esc(t.goal || "") + "</p></div>" +
      '<div class="tp-sec"><h5>What to say and do</h5><ol class="tp-steps">' + steps + "</ol></div>" +
      '<div class="tp-sec">' + (t.answers ? "<h5>Answers</h5><p>" + esc(t.answers) + "</p>" : "") +
      (t.flex ? '<h5 style="margin-top:8px">Flex · four versions</h5>' + EP.flexHTML(t.flex) : "") +
      (g ? '<h5 style="margin-top:8px">Grammar tip (G)</h5><p>' + esc(g.title) + ": " + esc(EP.plain(g.rule)) + "</p>" : "") + "</div>" +
      (more ? '<div class="tp-sec' + (opts.wide ? " wide" : "") + '">' + more + "</div>" : "");
  };

  // ---------- drawers ----------
  EP.drawer = function (id, title) {
    var d = document.createElement("aside");
    d.className = "drawer";
    d.id = id;
    d.setAttribute("aria-label", title);
    d.setAttribute("aria-hidden", "true");
    d.innerHTML = '<header><h3>' + esc(title) + '</h3><button type="button" data-x aria-label="Close">Esc ×</button></header><div class="dbody"></div>';
    document.body.appendChild(d);
    var api = {
      el: d, body: d.querySelector(".dbody"),
      open: function () { EP.closeDrawers(d); d.classList.add("open"); d.setAttribute("aria-hidden", "false"); api.onOpen && api.onOpen(); },
      close: function () { d.classList.remove("open"); d.setAttribute("aria-hidden", "true"); },
      toggle: function () { if (d.classList.contains("open")) api.close(); else api.open(); },
      isOpen: function () { return d.classList.contains("open"); }
    };
    d.querySelector("[data-x]").addEventListener("click", api.close);
    (EP._drawers = EP._drawers || []).push(api);
    return api;
  };
  EP.closeDrawers = function (except) {
    var any = false;
    (EP._drawers || []).forEach(function (x) { if (x.el !== except && x.isOpen()) { x.close(); any = true; } });
    return any;
  };

  // ---------- name panel: tap a learner, see what they wrote, mark it ----------
  // getPos() → {screen, step}; onRead(text) puts the answer on the stage without the name
  EP.mountNames = function (drawer, getPos, onRead) {
    var cur = 0, roster = L.roster || [];
    var ACT = [["used", "Used the skill ✓"], ["practise", "Practise this: "], ["read", "Read it to the class"]];
    function answerOf(p, sc) {
      var a = p.answers && p.answers[sc.id];
      if (a) return { text: a.text, need: a.need, here: true };
      var order = EP.screens.map(function (x) { return x.id; }), idx = order.indexOf(sc.id), last = null;
      order.forEach(function (id, k) { if (k < idx && p.answers && p.answers[id]) last = { text: p.answers[id].text, need: p.answers[id].need, from: EP.screens[k].title }; });
      return last ? { text: last.text, need: last.need, from: last.from, here: false } : null;
    }
    function needOf(a, sc) { return (a && a.need) || (sc.trains || [])[0] || L.subskills[0]; }
    function draw() {
      var sc = EP.screens[getPos().screen], all = EP.marks.get(), m = all[sc.id] || {};
      var p = roster[cur], a = answerOf(p, sc), need = needOf(a, sc);
      drawer.body.innerHTML = '<p class="np-fake">Demo: these 8 learners and their answers are invented. Live answers from real phones need the platform (sign-in and saving).</p>' +
        '<div class="np-grid">' + roster.map(function (r, k) {
          var mk = m[r.name], has = r.answers && r.answers[sc.id];
          return '<button type="button" data-i="' + k + '" class="' + (k === cur ? "cur " : "") + (mk ? "m-" + mk : "") + '">' + esc(r.name) +
            "<small>" + (mk === "used" ? "used it ✓" : mk === "practise" ? "practise " + esc(needOf(answerOf(r, sc), sc)) : mk === "read" ? "read to class" : has ? "answered" : "—") + "</small></button>";
        }).join("") + "</div>" +
        '<div class="np-sheet"><b style="font:800 16px var(--display)">' + esc(p.name) + (a && a.here ? " wrote" : "") + "</b>" +
        (a ? (a.here ? "" : '<p class="np-note">Nothing on this screen. Last answer (' + esc(a.from) + "):</p>") + '<div class="ans">' + esc(a.text) + "</div>" : '<p class="np-note">No answer yet.</p>') +
        '<div class="np-acts">' + ACT.map(function (x) {
          var label = x[0] === "practise" ? x[1] + EP.subskill(need) : x[1];
          return '<button type="button" data-a="' + x[0] + '" class="' + (m[p.name] === x[0] ? "on" : "") + '"' + (!a && x[0] === "read" ? " disabled" : "") + ">" + esc(label) + "</button>";
        }).join("") + "</div>" +
        '<p class="np-note">' + (m[p.name] === "practise" ? "After class, " + esc(p.name) + "'s phone shows an orange card: “Your teacher wants you to practise: " + esc(EP.subskill(need)) + "”. A tap is a hint, not a score." :
          m[p.name] === "used" ? "Marked: used " + esc(EP.subskill(need).toLowerCase()) + " on this screen." : "Saved on this device only, for the demo.") + "</p></div>";
    }
    drawer.body.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      if (b.hasAttribute("data-i")) { cur = +b.getAttribute("data-i"); draw(); return; }
      var act = b.getAttribute("data-a");
      if (!act) return;
      var sc = EP.screens[getPos().screen], all = EP.marks.get(), m = all[sc.id] || {}, p = roster[cur];
      if (act === "read") { var a = answerOf(p, sc); if (a) { m[p.name] = "read"; all[sc.id] = m; EP.marks.set(all); drawer.close(); onRead(a.text); } return; }
      m[p.name] = m[p.name] === act ? undefined : act;
      all[sc.id] = m;
      EP.marks.set(all);
      draw();
    });
    drawer.onOpen = draw;
    return { draw: draw };
  };
})();

</script>
<script>
// Episode lessons · class.html: what is projected. One stage that scales to the window.
// → / Space / click: next step, then next screen · ← back · T teacher panel · N names · G grammar tip ·
// F fullscreen · Esc closes panels · Home first screen · End last screen. Phones in the same browser follow.
// The page never depends on the URL: #s=…&k=… is read when present (a plain tab), and ignored when a host frame
// drops it (the claude.ai review copy). A small counter (top left, shows on mouse move) gives ‹ › and a jump list,
// because inside a frame the keys only work after the page has focus, and the first click into an unfocused page
// only gives it focus: it does not move the lesson on.
(function () {
  var EP = window.EP;
  document.body.classList.add("ep-class");
  var app = document.getElementById("app");
  app.innerHTML = '<div class="class-wrap"><div id="stage" style="display:contents"></div></div>' +
    '<nav class="cnav" id="cnav" aria-label="Screens"><button type="button" data-nav="home" title="First screen (Home)" aria-label="First screen">⏮</button>' +
    '<button type="button" data-nav="-1" title="Back (←)" aria-label="Back">‹</button>' +
    '<button type="button" class="cpos" id="cpos" aria-haspopup="listbox" aria-expanded="false" title="Jump to a screen"></button>' +
    '<button type="button" data-nav="1" title="Next (→)" aria-label="Next">›</button></nav>' +
    '<div class="cjump" id="cjump" role="listbox" aria-label="Jump to a screen" hidden>' + EP.screens.map(function (x, i) {
      return '<button type="button" role="option" data-jump="' + i + '"><b>' + (i + 1) + "</b>" + EP.esc(x.title) + "<small>" + EP.esc(x.phase) + "</small></button>";
    }).join("") + "</div>" +
    '<div class="cnote" id="cnote"></div>' +
    '<p class="hud" aria-hidden="true"><kbd>→</kbd> next · <kbd>T</kbd> teacher · <kbd>N</kbd> names · <kbd>G</kbd> grammar · <kbd>F</kbd> full screen · <kbd>Home</kbd> first</p>';
  // the key hint sits over the top of the stage, so it leaves at the first key or click, or after four seconds
  function hudGone() { var h = document.querySelector(".hud"); if (h) h.classList.add("gone"); }
  setTimeout(hudGone, 4000);
  window.addEventListener("keydown", hudGone, { once: true, capture: true });
  window.addEventListener("pointerdown", hudGone, { once: true, capture: true });
  var pos = EP.readHash();
  // a click that only brings the page into focus (e.g. inside a frame) does not move the lesson on
  var hadFocus = document.hasFocus();
  window.addEventListener("pointerdown", function () { hadFocus = document.hasFocus(); }, true);
  var stage = EP.mountStage(document.getElementById("stage"), { tools: true, onClick: function () { if (hadFocus) go(1); hadFocus = true; } });
  var tp = EP.drawer("tpanel", "Teacher panel · private");
  var np = EP.drawer("npanel", "Names · tap a learner");
  var names = EP.mountNames(np, function () { return pos; }, function (text) { stage.quote(text); });
  tp.onOpen = drawTeacher;
  function drawTeacher() {
    tp.body.innerHTML = EP.teacherHTML(pos.screen, pos.step) +
      '<p class="keys"><kbd>→</kbd>/<kbd>Space</kbd> next · <kbd>←</kbd> back · <kbd>T</kbd> this panel · <kbd>N</kbd> names · <kbd>G</kbd> grammar tip · <kbd>F</kbd> full screen · <kbd>M</kbd> motion · <kbd>X</kbd> sound FX · <kbd>Home</kbd> first screen · <kbd>End</kbd> last screen · <kbd>Esc</kbd> close</p>' +
      '<p class="keys">Learner phone: <a href="' + EP.esc(EP.studentURL()) + '" target="_blank" rel="noopener">phone.html</a> (follows this page in the same browser).</p>';
  }
  function show() {
    // a rendering problem on one screen must never stop the navigation: the position still moves and shows
    try { stage.show(pos.screen, pos.step); } catch (err) { if (window.console) console.warn("screen " + (pos.screen + 1) + " did not draw fully:", err); }
    document.getElementById("cpos").textContent = (pos.screen + 1) + " / " + EP.screens.length;
    document.documentElement.setAttribute("data-pos", "s=" + (pos.screen + 1) + "&k=" + pos.step);
    EP.writeHash(pos.screen, pos.step);
    EP.sync.post(pos);
    document.title = (pos.screen + 1) + " · " + EP.screens[pos.screen].title + " · " + EP.L.title;
    if (tp.isOpen()) drawTeacher();
    if (np.isOpen()) names.draw();
  }
  // a listening step plays before it can be passed (stage.guardNext): the answers never come by accident
  function go(dir) { if (dir > 0 && stage.guardNext && stage.guardNext()) return; var before = pos.screen; pos = EP.move(pos, dir); if (pos.screen !== before) EP.stop(); show(); }
  function jump(i, step) { EP.stop(); pos = { screen: Math.max(0, Math.min(EP.screens.length - 1, i)), step: step || 0 }; show(); closeJump(); }
  // the counter: shows on mouse move, fades after a while; the jump list
  var nav = document.getElementById("cnav"), list = document.getElementById("cjump"), navTimer = null;
  function wake() { var cn = document.getElementById("cnote"); if (cn) { cn.classList.add("on"); clearTimeout(wake.t2); wake.t2 = setTimeout(function () { if (!document.querySelector(".note-panel")) cn.classList.remove("on"); }, 2600); }
    nav.classList.add("on"); clearTimeout(navTimer); navTimer = setTimeout(function () { if (list.hidden && !nav.matches(":hover")) nav.classList.remove("on"); }, 2600); }
  function closeJump() { list.hidden = true; document.getElementById("cpos").setAttribute("aria-expanded", "false"); }
  document.addEventListener("pointermove", wake, { passive: true });
  if (EP.note) EP.note.mount(document.getElementById("cnote"), { page: "class", where: function () { return pos; }, jump: function (s, k) { jump(s, k); } });
  wake();
  nav.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var a = b.getAttribute("data-nav");
    if (a === "home") jump(0);
    else if (a) go(+a);
    else if (b.id === "cpos") {
      list.hidden = !list.hidden;
      b.setAttribute("aria-expanded", list.hidden ? "false" : "true");
      if (!list.hidden) { var cur = list.querySelector('[data-jump="' + pos.screen + '"]'); list.querySelectorAll("[data-jump]").forEach(function (x) { x.classList.toggle("cur", x === cur); }); if (cur) { cur.scrollIntoView({ block: "nearest" }); cur.focus(); } }
    }
    wake();
  });
  list.addEventListener("click", function (e) { var b = e.target.closest("[data-jump]"); if (b) jump(+b.getAttribute("data-jump")); });
  show();
  if (pos.panel === "t") tp.open();
  if (pos.panel === "n") np.open();
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    var k = e.key;
    if (k === "Home") { e.preventDefault(); jump(0); return; }
    if (k === "End") { e.preventDefault(); jump(EP.screens.length - 1); return; }
    if (k === "Escape" && !list.hidden) { closeJump(); return; }
    if (k === "ArrowRight" || k === "PageDown" || (k === " " && !(e.target.closest && e.target.closest("button")))) { e.preventDefault(); go(1); }
    else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); go(-1); }
    else if (k === "t" || k === "T") tp.toggle();
    else if (k === "n" || k === "N") np.toggle();
    else if (k === "g" || k === "G") stage.toggleTip();
    else if (k === "m" || k === "M") { if (EP.setMotion) EP.setMotion(!EP.motionOn()); }
    else if (k === "x" || k === "X") { if (EP.fx) EP.fx.toggle(); }
    else if (k === "f" || k === "F") { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); }
    else if (k === "Escape") { if (!EP.closeDrawers() && !stage.closeAll()) EP.stop(); }
  });
})();

</script>
