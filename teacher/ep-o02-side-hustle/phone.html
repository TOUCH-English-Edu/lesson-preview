      // whatever is in the box is kept as a draft in this browser on every keystroke and on close, and comes back
      // the next time the panel opens, on any screen, until it is sent. A click outside no longer closes a panel
      // that holds text; 取消, Esc and the button still do, and the draft stays.
      var DRAFT = "touch:ep:note-draft:" + L.id + ":" + opts.page;
      function draft(v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(DRAFT) || "null"); if (v) localStorage.setItem(DRAFT, JSON.stringify(v)); else localStorage.removeItem(DRAFT); } catch (e) { return null; } }
      function keepDraft() {
        if (!panel) return;
        var t = panel.querySelector("textarea").value;
        if (t.trim()) draft({ text: t, screen: opts.where().screen + 1, at: Date.now() }); else draft(null);
      }
      function close() { keepDraft(); if (panel) panel.remove(); panel = null; btn.setAttribute("aria-expanded", "false"); badge(); }
      function open() {
        badge();
        var w = opts.where();
        panel = document.createElement("div");
        panel.className = "note-panel";
        panel.setAttribute("role", "dialog");
        panel.setAttribute("aria-label", "提意见");
        panel.innerHTML = '<p class="nw">第 ' + (w.screen + 1) + " 页 · 第 " + w.step + " 步 · " + esc(EP.screens[w.screen].title) + "</p>" +
          '<div class="nchips" data-g="kind">' + KINDS.map(function (k) { return '<button type="button" data-v="' + k[0] + '" aria-pressed="' + (k[0] === kind) + '">' + k[1] + "</button>"; }).join("") + "</div>" +
          '<div class="nchips small" data-g="size"><span>班级人数（可不填）</span>' + SIZES.map(function (k) { return '<button type="button" data-v="' + k + '" aria-pressed="' + (k === size) + '">' + k + "</button>"; }).join("") + "</div>" +
          '<textarea maxlength="1500" placeholder="这一页哪里要改？例如：奶奶的图可以再大一点。（截图可以直接贴上）" aria-label="意见"></textarea>' +
          '<div class="npics"></div><div class="npickrow"><button type="button" class="npick">📎 加图片（最多 3 张）</button>' +
          '<input type="file" class="nfile" accept="image/png,image/jpeg,image/webp" multiple hidden></div>' +
          '<div class="nrow"><span class="nmsg" role="status"></span><span><button type="button" class="ncancel">取消</button> <button type="button" class="nsend">送出</button></span></div>' +
          mineHTML(w, opts);
        (opts.panelHost || document.body).appendChild(panel);
        var r = btn.getBoundingClientRect();
        if (!opts.panelHost) {
          panel.style.top = Math.min(window.innerHeight - 20, r.bottom + 8) + "px";
          panel.style.right = Math.max(8, window.innerWidth - r.right) + "px";
        }
        btn.setAttribute("aria-expanded", "true");
        var ta0 = panel.querySelector("textarea"), d = draft();
        if (d && d.text) {
          ta0.value = d.text;
          var hint = document.createElement("p");
          hint.className = "ndraft";
          hint.textContent = "这是你还没送出的草稿" + (d.screen && d.screen !== w.screen + 1 ? "（原本写在第 " + d.screen + " 页，送出时会记在现在这一页）" : "") + "。";
          ta0.parentNode.insertBefore(hint, ta0);
        }
        ta0.addEventListener("input", keepDraft);
        drawPics();
        panel.querySelector(".nfile").addEventListener("change", function (e) { addPics(e.target.files); e.target.value = ""; });
        ta0.addEventListener("paste", function (e) {
          var items = (e.clipboardData && e.clipboardData.files) || [];
          if (items.length) { e.preventDefault(); addPics(items); }
        });
        ta0.focus();
      }
      function drawPics() {
        if (!panel) return;
        var box = panel.querySelector(".npics");
        box.innerHTML = pics.map(function (p, i) { return '<span class="npic"><img src="' + p.url + '" alt="图片 ' + (i + 1) + '"><button type="button" data-rm="' + i + '" aria-label="拿掉这张">✕</button></span>'; }).join("");
        var pick = panel.querySelector(".npick"); pick.disabled = pics.length >= MAXPICS;
        pick.textContent = pics.length ? "📎 再加图片（" + pics.length + "/" + MAXPICS + "）" : "📎 加图片（最多 3 张）";
      }
      function addPics(list) {
        var files = [].slice.call(list).filter(function (f) { return /^image\/(png|jpeg|webp)$/.test(f.type); });
        var msg = panel && panel.querySelector(".nmsg");
        if (!files.length) { if (msg) msg.textContent = "只收 PNG、JPG、WebP 图片。"; return; }
        files.slice(0, MAXPICS - pics.length).forEach(function (f) {
          shrink(f).then(function (b) { if (pics.length >= MAXPICS) return; pics.push({ blob: b, url: URL.createObjectURL(b) }); drawPics(); });
        });
        if (files.length > MAXPICS - pics.length && msg) msg.textContent = "每条意见最多 3 张图片。";
      }
      // send the pictures of a saved note one by one; on failure keep the rest for 重试
      function sendPics(msg, done) {
        var i = 0, failed = [], total = pending.left.length;
        (function next() {
          if (i >= pending.left.length) {
            if (!failed.length) { pending = null; done(true); return; }
            pending.left = failed.map(function (f) { return f.p; });
            msg.innerHTML = esc("意见已送出，但 " + failed.length + " 张图片没有送出（" + (PICMSG[failed[0].st] || PICMSG[503]) + "）。") + ' <button type="button" class="nretry">重试图片</button>';
            done(false); return;
          }
          var p = pending.left[i++];
          msg.textContent = "上传图片 " + i + "/" + total + "…";
          upload(pending.id, pending.token, p.n, p.blob).then(function (st) {
            if (st !== 204 && !(st >= 200 && st < 300)) failed.push({ p: p, st: st });
            next();
          });
        })();
      }
      btn.addEventListener("click", function (e) { e.stopPropagation(); if (panel) close(); else open(); });
      // keys and clicks inside the panel never reach the lesson (no slide moves while typing)
      document.addEventListener("keydown", function (e) {
        if (!panel) return;
        if (panel.contains(e.target)) { e.stopPropagation(); if (e.key === "Escape") close(); return; }
        if (e.key === "Escape") { close(); e.stopPropagation(); }
      }, true);
      document.addEventListener("click", function (e) {
        if (!panel) return;
        if (panel.contains(e.target)) {
          e.stopPropagation();
          var a = e.target.closest("a.nmi");
          if (a) { e.preventDefault(); location.href = a.getAttribute("href"); return; }
          var b = e.target.closest("button");
          if (!b) return;
          if (b.hasAttribute("data-go")) {
            var g2 = b.getAttribute("data-go").split(":"), s2 = +g2[0], k2 = +g2[1];
            close();
            if (opts.jump) opts.jump(s2, k2);
            else { location.hash = "s=" + (s2 + 1) + "&k=" + k2; location.reload(); }
            return;
          }
          var g = b.parentElement.getAttribute("data-g");
          if (b.classList.contains("npick")) { panel.querySelector(".nfile").click(); return; }
          if (b.hasAttribute("data-rm")) { var rm = pics.splice(+b.getAttribute("data-rm"), 1)[0]; if (rm) URL.revokeObjectURL(rm.url); drawPics(); return; }
          if (b.classList.contains("nretry") && pending) {
            var m3 = panel.querySelector(".nmsg");
            sendPics(m3, function (ok) { if (ok) { m3.textContent = "图片都送出了，谢谢。"; setTimeout(close, 1200); } });
            return;
          }
          if (g === "kind") { kind = b.getAttribute("data-v"); panel.querySelectorAll('[data-g="kind"] button').forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); }
          else if (g === "size") { size = size === b.getAttribute("data-v") ? "" : b.getAttribute("data-v"); panel.querySelectorAll('[data-g="size"] button').forEach(function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-v") === size); }); }
          else if (b.classList.contains("ncancel")) close();
          else if (b.classList.contains("nsend")) {
            var ta = panel.querySelector("textarea"), text = ta.value.trim(), msg = panel.querySelector(".nmsg");
            if (!text) { ta.focus(); return; }
            var w = opts.where();
            var body = { lesson: L.id, code: L.code, screen: w.screen + 1, step: w.step, kind: kind, text: text.slice(0, 1500), page: opts.page };
            if (size) body.size = size;
            b.disabled = true; msg.textContent = "送出中…";
            send(body).then(function (res) {
              var st = res.st;
              b.disabled = false;
              if (st === 204) {
                var withPics = pics.length;
                keep({ lesson: L.id, code: L.code, screen: body.screen, step: body.step, kind: kind, page: opts.page, title: EP.screens[w.screen].title, text: body.text, pics: withPics, at: Date.now() });
                ta.value = ""; draft(null); badge();
                var finish = function () { msg.textContent = MSG[204] + "（已存进「我留过的意见」）"; setTimeout(close, 1400); };
                if (!withPics) { finish(); return; }
                if (!res.d.id || !res.d.uploadToken) { pics = []; drawPics(); msg.textContent = "意见已送出，但这次图片没有送出（平台没有给上传码）。"; return; }
                pending = { id: res.d.id, token: res.d.uploadToken, left: pics.map(function (p, i) { return { n: i + 1, blob: p.blob }; }) };
                pics.forEach(function (p) { URL.revokeObjectURL(p.url); }); pics = []; drawPics();
                sendPics(msg, function (ok) { if (ok) finish(); });
                return;
              }
              if (st === 404) { try { sessionStorage.setItem(OFF, "1"); } catch (x) {} close(); buttons.forEach(function (x) { x.remove(); }); return; }
              msg.textContent = MSG[st] || MSG[503];
            });
          }
          return;
        }
        // a click outside closes the panel and does nothing else (it does not move the lesson on)
        if (!btn.contains(e.target)) {
          e.stopPropagation(); e.preventDefault();
          if (panel.querySelector("textarea").value.trim()) { var m2 = panel.querySelector(".nmsg"); m2.textContent = "还没送出：按「送出」，或按「取消」先收起来（文字会留着）。"; return; }
          close();
        }
      }, true);
      return wrap;
    }
  };
})();

<script>
// Episode lessons · the learner's phone: the current screen with the learner's part only.
// Kinds: look · tap (vote / pick a word / pick a part) · sort (the formula's parts, or its own `bins`) · write (with starter
// chips) · speak (hold-to-talk timer, then tick the parts used; no speech recognition) · words.
// Answers stay on this device (localStorage, under the lesson id). EP.mountPhone(host, opts) → {show}
(function () {
  var EP = window.EP, L = EP.L, esc = EP.esc, rich = EP.rich;
  // a part's colour from the formula's table (PPF, OREO, or a neutral slate for any other tag)
  function COLOR(t) { return EP.partCol(t).solid; }

  EP.mountPhone = function (host, opts) {
    opts = opts || {};
    var st = { screen: -1, step: 0, live: false, mic: null, micStart: 0, micTick: null, mode: {}, fresh: false, typed: {}, done: {} };
    var root;
    if (opts.framed) {
      host.innerHTML = EP.iphone('<div class="ph" aria-live="polite"></div>', { scr: "phscr", label: "" });
      host.querySelector(".iph").removeAttribute("role");
      root = host.querySelector(".ph");
    } else {
      host.innerHTML = '<div class="ph"></div>';
      root = host.querySelector(".ph");
    }
    function sc() { return EP.screens[st.screen]; }
    function key() { var p = sc().phone || {}; return p.key || sc().id; }
    function data() { return EP.answers.get()[key()] || {}; }
    function save(d) { EP.answers.patch(key(), d); }
    // The screen's phone part, with the chosen role's own words on top: `byRole: {"<role>": {ask, starters, listener}}`
    // (a two-sided task: the customer is not told "You are the assistant"). Roles are the task cards' side names.
    function phonePart() {
      var p = sc().phone || { kind: "look" };
      if (!p.byRole) return p;
      var cards = stageCards(), role = data().role;
      var name = cards && role != null ? ((cards.filter(function (x) { return x.sides; })[0] || {}).sides || [])[role] : null;
      var over = name ? p.byRole[name.who] : null;
      return over ? Object.assign({}, p, over) : p;
    }

    function header() {
      var s = sc(), p = phonePart();
      // LIVE while this phone follows the class page; on its own, nothing (only a way back if a class is running here)
      var last = EP.sync.last(), recent = last && Date.now() - last.t < 6 * 3600 * 1000;
      var liveChip = opts.noLive ? "" : st.live ? '<span class="liveon" title="Following the class"><i></i>LIVE</span>' :
        (recent ? '<button type="button" class="live off" data-back-live><i></i>Back to class</button>' : "");
      // Sound effects on a learner's phone are off by default (twelve phones dinging is noise); the speaker turns them on
      var fxChip = EP.fx && !opts.framed ? '<button type="button" class="fxsw" data-fxsw aria-pressed="' + EP.fx.on() + '" aria-label="Sound effects ' + (EP.fx.on() ? "on" : "off") + '">' + (EP.fx.on() ? "🔈" : "🔇") + "</button>" : "";
      return '<header class="ph-top"><div class="row"><span>TOUCH · ' + esc(L.code) + " · " + esc(L.title) + "</span>" + '<span class="ph-right">' + liveChip + (EP.gloss ? EP.gloss.seg("on-phone") : "") + fxChip + '<span class="note-slot"></span></span></div>' +
        "<h1>" + esc(s.title) + "</h1>" + (s.purpose ? '<p class="purpose">' + esc(EP.plain(s.purpose)) + "</p>" : "") + (p.ask ? '<p class="ask">' + esc(p.ask) + "</p>" : "") +
        '<div class="ph-prog" aria-hidden="true"><i style="width:' + Math.round((st.screen + 1) / EP.screens.length * 100) + '%"></i></div></header>';
    }
    function nav() {
      var n = EP.steps(sc());
      return '<nav class="ph-nav" aria-label="Move"><button type="button" data-nav="-1"' + (st.screen === 0 && st.step === 0 ? " disabled" : "") + ">‹ Back</button><span>" + (st.screen + 1) + " / " + EP.screens.length +
        (n ? " · " + st.step + "/" + n : "") + '</span><button type="button" class="pri" data-nav="1"' + (st.screen === EP.screens.length - 1 && st.step >= n ? " disabled" : "") + ">Next ›</button></nav>";
    }

    // ---------- kinds ----------
    var K = {};
    K.look = function (p) {
      // `text` items may be {text, at} (round 4): shown from that step, so the phone never runs ahead of the stage;
      // plain strings always show
      var text = Array.isArray(p.text) ? p.text.filter(function (x) { return typeof x === "string" || (x.at || 0) <= st.step; }).map(function (x) { return typeof x === "string" ? x : x.text; }) : p.text;
      return '<div class="ph-card ph-look"><h2>' + esc(p.title || sc().title) + "</h2>" + (text && text.length ? '<div class="ph-q" style="margin-top:6px">' + EP.richBlock(text) + "</div>" : "") +
        (p.list ? "<ul>" + p.list.map(function (x) { return "<li>" + rich(x) + "</li>"; }).join("") + "</ul>" : "") + '</div><p class="ph-done">Look up at the big screen.</p>';
    };
    // TODAY'S COMMUNICATION GOAL on the phone: the stage's `goal` block, as cards (phone `kind: "goal"`)
    K.goal = function () {
      var g = null;
      sc().cols.forEach(function (c) { c.blocks.forEach(function (b) { if (b.type === "goal") g = b; }); });
      if (!g) return K.look({});
      // the same split as the stage: a short headline (before " — ") and the rest under it; the skills arrive one per
      // click when they have their own `at`
      var gp = String(g.goal || "").split(/\s+—\s+/), gh = gp.shift(), items = (g.practise || []).filter(function (x) { return st.step >= (typeof x.at === "number" ? x.at : g.practiseAt || 0); });
      return '<div class="ph-card ph-goal"><p class="ph-cap">' + esc(g.kicker || "Today's communication goal") + '</p><p class="ph-q gl">' + rich(gh) + "</p>" + (gp.length ? '<p class="gsub">' + rich(gp.join(" — ")) + "</p>" : "") + "</div>" +
        (items.length ? '<div class="ph-card ph-goal"><p class="ph-cap">' + esc(g.practiseTitle || "After this lesson, you will practise how to:") + "</p>" + items.map(function (x) {
          return '<div class="gi"><span class="ic" aria-hidden="true">' + esc(x.icon || "") + "</span><div><b>" + rich(x.title) + "</b><span>" + rich(x.text || "") + "</span></div></div>";
        }).join("") + "</div>" : "") +
        (st.step >= (g.whyAt || 0) ? '<div class="ph-card ph-goal"><p class="ph-cap">' + esc(g.whyTitle || "Why this skill is useful") + "</p>" + (g.why || []).map(function (x) {
          return '<div class="gy"><b>' + esc(x.label) + "</b><span>" + rich(x.text) + "</span></div>";
        }).join("") + "</div>" : "");
    };
    K.tap = function (p) {
      var d = data(), picks = d.picks || {}, out = "";
      var items = p.items.map(function (it, i) { return { it: it, i: i }; }).filter(function (x) { return (x.it.at || 0) <= st.step; });
      // one at a time: the question being asked now on top, the answered ones below it
      if (p.oneAtATime) items.reverse();
      items.forEach(function (x) {
        var it = x.it, i = x.i, pick = picks[i], poll = it.answer == null;
        var revealed = !poll && (typeof it.revealAt === "number" ? st.step >= it.revealAt : pick != null);
        var two = it.options.every(function (o) { return o.length <= 6; });
        var fb = "";
        if (poll) fb = pick != null ? '<p class="ph-fb ok">Thanks ✓</p>' : "";
        else if (revealed) fb = '<p class="ph-fb ' + (pick === it.answer ? "ok" : pick != null ? "no" : "") + '"' + (pick === it.answer ? ' data-rk="' + st.screen + ":" + i + '"' : "") + ">" + (pick === it.answer ? "✓ Right. " : pick != null ? "Not this time. " : "") + rich(it.say || "") + "</p>";
        else if (pick != null) fb = '<p class="ph-fb">Sent ✓ ' + (st.live ? "The answer comes on the big screen." : "Tap Next to see the answer.") + "</p>";
        out += '<div class="ph-card' + (revealed && p.oneAtATime ? " ph-old" : "") + '" data-item="' + i + '">' + (p.items.length > 1 ? '<p class="ph-cap">' + (i + 1) + " of " + p.items.length + "</p>" : "") +
          '<p class="ph-q">' + rich(it.prompt) + '</p><div class="ph-opts' + (two ? " two" : "") + '">' + it.options.map(function (o, k) {
            var cls = (pick === k ? "sel " : "") + (revealed && k === it.answer ? "right " : "") + (revealed && pick === k && k !== it.answer ? "wrong" : "");
            return '<button type="button" data-pick="' + i + ":" + k + '" class="' + cls + '"' + (revealed ? " disabled" : "") + ' aria-pressed="' + (pick === k) + '">' + esc(o) + "</button>";
          }).join("") + "</div>" + fb + "</div>";
      });
      // `context` (round 4): a card above the questions, e.g. the brainstorm question while the class talks (E10 screen 7)
      var ctx = context(p.context);
      return ctx + (out || (ctx ? "" : '<p class="ph-done">Wait for the first question on the big screen.</p>'));
    };
    // SORT: tap a chip to put each item in a bin. Bins are the formula's parts (item `part`), or the block's own
    // `bins: ["➕ Plus", "➖ Minus"]` (item `bin`: the bin's index; `binColors` optional), e.g. R11's price tags.
    var BINCOL = ["#13866f", "#c0405c", "#2f6fd0", "#e0792e", "#7a4fc4"];
    K.sort = function (p) {
      var d = data(), place = d.place || {};
      var own = Array.isArray(p.bins);
      var bins = own ? p.bins.map(function (b, k) { return { key: "b" + k, name: b, label: "", color: (p.binColors || [])[k] || BINCOL[k % BINCOL.length] }; }) :
        L.parts.map(function (x) { return { key: x.tag, name: EP.part(x.tag).name, label: EP.part(x.tag).label, color: COLOR(x.tag), tag: x.tag }; });
      function want(it) { return own ? "b" + it.bin : it.part; }
      // `revealAt`: right / wrong marks wait for that step (the class checks together on the big screen)
      var shown = typeof p.revealAt !== "number" || st.step >= p.revealAt;
      var pool = p.items.map(function (it, i) { return i; }).filter(function (i) { return !place[i]; });
      var right = p.items.filter(function (it, i) { return place[i] === want(it); }).length;
      return (pool.length ? '<div class="ph-sort sent">' + pool.map(function (i) {
        return '<div class="ph-card"><p class="ph-q">' + rich(p.items[i].text) + '</p><div class="chips">' + bins.map(function (bn) {
          return '<button type="button" data-place="' + i + ":" + esc(bn.key) + '" style="background:' + bn.color + '" aria-label="Put in ' + esc(EP.plain(bn.name)) + '">' + esc(bn.name) + "</button>";
        }).join("") + "</div></div>";
      }).join("") + "</div>" : "") +
        '<div class="ph-bins">' + bins.map(function (bn) {
          var inBin = p.items.map(function (it, i) { return i; }).filter(function (i) { return place[i] === bn.key; });
          return '<div class="ph-bin tzp' + (EP.timeFormula && bn.tag ? " tzp-" + bn.tag : "") + '"><b style="color:' + bn.color + '">' + esc(bn.name) + (bn.label ? " · " + esc(bn.label) : "") + (bn.tag === "P2" && EP.timeFormula ? ' <span class="nowpill">now</span>' : "") + "</b>" + inBin.map(function (i) {
            var ok = want(p.items[i]) === bn.key;
            return '<div class="pl ' + (!shown ? "wait" : ok ? "ok" : "no") + '"><span>' + rich(p.items[i].text) + '</span><button type="button" data-unplace="' + i + '">Move</button></div>';
          }).join("") + "</div>";
        }).join("") + "</div>" +
        (!shown ? (!pool.length ? '<p class="ph-fb">Sent ✓ ' + (st.live ? "The answers come on the big screen." : "Tap Next to see the answers.") + "</p>" : "") :
          right === p.items.length ? '<p class="ph-fb ok" data-rk="' + st.screen + ':sort">✓ All ' + EP.numberWord(p.items.length) + (own ? " sorted." : " in the right part.") + "</p>" : !pool.length ? '<p class="ph-fb no">Some are in the wrong ' + (own ? "group" : "part") + ' (✗). Tap Move and try again.</p>' : "");
    };
    function starters(list, insert) {
      return list && list.length ? '<div class="ph-starters">' + list.map(function (s) { return '<button type="button"' + (insert ? ' data-ins="' + esc(s) + '"' : "") + ">" + esc(s) + "</button>"; }).join("") + "</div>" : "";
    }
    function voiceBlock(p) {
      if (!p.voice) return "";
      var ln = EP.line(p.voice), show = st.step >= (p.transcriptAt || 0);
      var from = p.voiceFrom || ln.who;
      // what kind of clip it is (`voiceLabel`: "video call", "call" …; default "voice message") and its length

      return '<div class="ph-card"' + (show ? ' data-zoom="' + esc(from) + '"' : "") + '><div class="ph-who"><span class="av">' + EP.face(p.voiceAvatar, from) + "</span>" + esc(from) + " · " + esc(label) + (show ? zoomBtn() : "") + '</div><div class="ph-voice" style="margin-top:8px">' + EP.playBtn(p.voice, "Play: " + from + " · " + label) + EP.scrub(p.voice, dur) + "</div>" +
        (show ? '<p class="ph-q zsrc" style="margin-top:8px;font-style:italic">“' + rich(ln.text) + "”</p>" : '<p class="ph-fb">No text yet: listen first.</p>') +
        (p.questions && st.step < (p.writeAt || 0) ? '<ol class="ph-qs">' + p.questions.map(function (q) { return "<li>" + esc(q) + "</li>"; }).join("") + "</ol>" : "") + "</div>";
    }
    function stageDur(id) {
      var found = "";
      (function walk(o) {
        if (found || !o || typeof o !== "object") return;
        if (Array.isArray(o)) { o.forEach(walk); return; }
        if (o.dur && (o.voice === id || o.line === id || (Array.isArray(o.lines) && o.lines.length === 1 && o.lines[0] === id))) { found = o.dur; return; }
        Object.keys(o).forEach(function (k) { walk(o[k]); });
      })(sc().cols);
      return found;
    }
    // a message on the learner's phone (a `context` chat bubble, a voice message's words) can be made big: tap it or
    // its 🔍, like the magnifier on the stage (colleague's note E10-4)
    function zoomBtn() { return '<button type="button" class="ph-zbtn" data-zoombtn aria-label="Make the message bigger">🔍</button>'; }
    // `context` may be a list of bubbles with `at`: the phone shows the newest one that has arrived (E10 push-back: the
    // doubt being answered now)
    function context(c) {
      if (Array.isArray(c)) c = c.filter(function (x) { return (x.at || 0) <= st.step; }).pop();
      if (!c) return "";
      // no `who`: a plain card with a caption (`title`), not a message from someone
      if (!c.who) return '<div class="ph-card">' + (c.title ? '<p class="ph-cap">' + esc(c.title) + "</p>" : "") + EP.richBlock(c.text) + "</div>";
      return '<div class="ph-card" data-zoom="' + esc(c.who) + '"><div class="ph-who"><span class="av">' + EP.face(c.avatar, c.who) + "</span>" + esc(c.who) + zoomBtn() + '</div><div class="ph-bubble zsrc" style="margin-top:6px">' + EP.richBlock(c.text) + "</div></div>";
    }
    function openZoom(card) {
      var src = card.querySelector(".zsrc");
      if (!src) return;
      closeZoom();
      var z = document.createElement("div");
      z.className = "ph-zoom";
      z.setAttribute("role", "dialog");
      z.setAttribute("aria-label", "The message, big");
      z.innerHTML = '<button type="button" class="x" data-zoomclose aria-label="Close">×</button><small>' + esc(card.getAttribute("data-zoom") || "") + '</small><div class="zt">' + src.innerHTML + "</div>";
      root.appendChild(z);
      z.querySelector("[data-zoomclose]").focus();
    }
    function closeZoom() { var z = root.querySelector(".ph-zoom"); if (z) z.remove(); }
    // starters that close for a later round: `startersUntil: <step>` hides them from that step on (O07: round 3)
    function startersOpen(p) { return p.startersUntil == null || st.step < p.startersUntil; }
    function writer(p, d) {
      var list = p.wordStarters ? L.words.map(function (w) { return "★ " + w.word; }) : p.starters;
      if (!startersOpen(p)) list = null;
      if (d.text && !d.editing) {
        return '<div class="ph-bubble me saved"><small>Your answer · saved</small>' + esc(d.text) + '</div><button type="button" class="btn sec" data-edit>Edit</button>';
      }
      return '<div class="ph-card"><p class="ph-q">' + rich(p.prompt || "") + "</p>" + (list ? '<p class="ph-cap" style="margin:8px 0 4px">Tap to start with</p>' + starters(list, true) : "") +
        '<textarea data-draft aria-label="Your answer" placeholder="Write here …" style="margin-top:8px">' + esc(d.draft != null ? d.draft : d.text || "") + "</textarea>" +
        '<button type="button" class="btn" data-save style="margin-top:8px;width:100%">Save my answer</button></div>';
    }
    K.write = function (p) {
      var d = data(), out = voiceBlock(p) + context(p.context);
      if (p.compareWith) {
        var old = EP.answers.get()[p.compareWith];
        out += '<div class="ph-bubble me"' + (old && old.text ? " data-typeout" : "") + '><small>Your first reply</small><span class="tx">' + (old && old.text ? esc(old.text) : "<i>Your first reply isn't saved on this phone: look at your paper or the chat.</i>") + "</span></div>";
      }
      if (st.step < (p.writeAt || 0)) return out + '<p class="ph-done">Answer the questions aloud. Writing comes next.</p>';
      out += writer(p, d);
      if (p.note) out += '<p class="ph-fb">' + esc(p.note) + "</p>";
      if (p.better && d.text && !d.editing) {
        var b = d.better || {};
        out += '<div class="ph-card"><p class="ph-q"><b>What is better now?</b> Tick what your new reply has.</p><div class="ph-ticks" style="margin-top:8px">' +
          p.better.map(function (x, k) { return '<button type="button" data-better="' + k + '" aria-pressed="' + !!b[k] + '">' + esc(x) + "</button>"; }).join("") + "</div></div>";
      }

    };
    K.speak = function (p) {
      var d = data(), mode = st.mode[key()] || (d.text && !d.secs ? "write" : "speak"), out = "";

      out += context(p.context);
      // `cards: "stage"`: the stage's one-sided task cards too (E10 round 3: pick a case, see only its notes)
      var cards = p.cards === "stage" ? stageCards(true) : p.cards || stageCards();
      if (cards) {
        var c = d.card != null ? cards[d.card] : null, sided = cards.some(function (x) { return x.sides; });
        // two-sided cards (an information gap): choose your role first; the phone shows only that side
        var sides0 = sided ? (cards.filter(function (x) { return x.sides; })[0].sides || []) : [];
        var roles = sides0.map(function (sd) { return sd.who; });
        var role = sided && d.role != null ? d.role : null;
        out += '<div class="ph-card"><p class="ph-cap">Your card</p>' + (sided ? '<div class="ph-tabs" role="group" aria-label="Your role" style="margin-top:6px">' + roles.map(function (r, k) {
          return '<button type="button" data-role="' + k + '" aria-pressed="' + (role === k) + '">' + (sides0[k].icon ? esc(sides0[k].icon) + " " : "") + esc(r) + "</button>";
        }).join("") + "</div>" : "") +
          '<div class="ph-cards" style="margin-top:6px">' + cards.map(function (x, k) {
          return '<button type="button" data-card="' + k + '" class="' + (d.card === k ? "sel" : "") + '" aria-pressed="' + (d.card === k) + '">' + esc(x.letter) + "<small>" + esc(x.title) + "</small></button>";
        }).join("") + "</div>";
        if (sided) {
          var sd = c && role != null ? (c.sides || [])[role] : null;
          // a side may ask its holder to decide about some of its notes (`decide: {options: ["SCAM", "SAFE"], items:
          // [note index …]}`): tap buttons under those notes, so the listener's product is on the phone (E10)
          var dec = sd && sd.decide, picks = dec ? ((d.decide || {})[d.card] || {}) : {};
          out += sd ? '<div class="ph-side" style="margin-top:10px"><b>' + (sd.icon ? esc(sd.icon) + " " : "") + esc(sd.who) + " · card " + esc(c.letter) + "</b><ul>" + [].concat(sd.notes || sd.text || []).map(function (x, k) {
            var ask = dec && (dec.items || []).indexOf(k) >= 0;
            return "<li>" + rich(x) + (ask ? '<span class="ph-decide" role="group" aria-label="Your decision">' + dec.options.map(function (o, j) {
              return '<button type="button" data-decide="' + k + ":" + j + '" aria-pressed="' + (picks[k] === j) + '">' + esc(o) + "</button>";
            }).join("") + "</span>" : "") + "</li>";
          }).join("") +
            '</ul><p class="ph-fb">Only you can see this. Keep it hidden from the others.</p></div>' : '<p class="ph-fb">Choose your role, then a card letter.</p>';
        } else {
          out += c ? (c.facts ? '<div class="ph-facts">' + EP.factsHTML(c) + "</div>" : "") + '<div class="ph-notes" style="margin-top:10px">' + EP.order.filter(function (t) { return (c.notes || {})[t] != null; }).map(function (t) {
            return '<div><b style="color:' + COLOR(t) + '">' + esc(EP.part(t).name) + "</b><span>" + rich(c.notes[t]) + "</span></div>";
          }).join("") + "</div>" : '<p class="ph-fb">' + chooseLine(cards) + "</p>";
        }
        out += "</div>";
      }
      // `listener` as a list: the questions every listener should be able to answer (E10 task: did the message land?)
      if (Array.isArray(p.listener) && p.listener.length) out += '<div class="ph-card"><p class="ph-cap">' + esc(p.listenerTitle || "When you listen") + '</p><ul class="ph-lq">' + p.listener.map(function (q) { return "<li>" + rich(q) + "</li>"; }).join("") + "</ul></div>";
      if (mode === "write") {
        // the write view's own prompt (`writePrompt`): who it is for and how long ("Write your warning to that person …")

      }
      if (p.starters && startersOpen(p)) out += '<div class="ph-card"><p class="ph-cap" style="margin-bottom:6px">Starters</p>' + starters(p.starters, false) + "</div>";
      // `mic: false`: no hold-to-talk timer (E10 task, round 3: the phone shows only the case and the listener's questions;
      // the teacher times the warning on the stage)
      if (p.mic === false) { if (p.listener && !Array.isArray(p.listener)) out += '<p class="ph-fb">' + esc(p.listener) + "</p>"; return out; }
      var running = !!st.mic, secs = d.secs || 0;
      out += '<button type="button" class="ph-mic' + (running ? " on" : "") + '" data-mic aria-label="Hold to talk">' + (running ? "Talking …" : "HOLD<br>TO TALK") + "<big>" + EP.fmt(running ? (Date.now() - st.micStart) / 1000 : secs) + "</big></button>" +
        '<p class="ph-fb" style="text-align:center">Aim: about ' + EP.fmt(p.seconds || 60) + ". Nothing is recorded: the button only times you.</p>";

        var parts = d.parts || {};

          '<div class="ph-ticks" style="margin-top:8px">' + L.parts.map(function (x) {
            return '<button type="button" data-part="' + x.tag + '" aria-pressed="' + !!parts[x.tag] + '">' + esc(x.name) + " · " + esc(x.label) + "</button>";

    };
    // "Choose A, B, C, or ★ for your own story." (E10) · "Choose a card: A, B, C or D."
    function chooseLine(cards) {

    }
    // the screen's own task cards (a taskcards block on the stage) when the phone does not list its own
    function stageCards(any) {
      var it = null;
      sc().cols.forEach(function (c) { c.blocks.forEach(function (b) { if (b.type === "taskcards" && b.items.some(function (x) { return x.sides || (any && x.notes); })) it = b.items; }); });
      return it;
    }
    K.words = function () {
      var ww = null;
      sc().cols.forEach(function (c) { c.blocks.forEach(function (b) { if (b.type === "wordwall") ww = b; }); });

          EP.playTextBtn("Bella", w.word + ". " + w.example, "Say " + w.word) + "<i>" + (now ? "Guess: what does it mean?" : esc(w.ipa)) + "</i>" +
          '<div class="mean">' + rich(w.meaning) + "<br><b style=\"font:700 14px var(--body);color:var(--f-ink)\">“" + rich(w.example) + "”</b></div></div>";

    // THE TRANSCRIPT (screen `listen` with `transcriptAt`): the full text of what was heard, at the same step as on
    // the stage, and it stays (`hideAt` only clears the stage). A phone that already shows the same voice line with its
    // text (`voice` + `transcriptAt`) skips it.
    function transcript(p) {
      var own = p.voice && st.step >= (p.transcriptAt || 0) ? p.voice : null;
      return EP.listens(sc()).filter(function (x) {
        return typeof x.transcriptAt === "number" && st.step >= x.transcriptAt && (x.lines || []).indexOf(own) < 0;
      }).map(function (x) {
        return '<div class="ph-card ph-tscript"><p class="ph-cap">' + esc(x.title || "What we heard · the full text") + "</p>" +
          '<div class="ph-voice tsplay">' + EP.playBtn(x.lines || [], "Play it all again") + EP.scrub(x.lines || []) + "</div>" + (x.lines || []).map(function (id) {
          var ln = EP.line(id);
          return ln ? '<p class="tl follow" data-line="' + esc(id) + '">' + EP.playBtn(id, "Play again: " + ln.who) + "<span><b>" + esc(ln.who === "Grandmother" ? "Grandma" : ln.who) + '</b> <span class="tt">' + rich(ln.text) + "</span></span></p>" : "";
        }).join("") + "</div>";
      }).join("");
    }
    function render() {
      var p = phonePart();
      var focused = document.activeElement && root.contains(document.activeElement) && document.activeElement.hasAttribute("data-draft");
      var scrollBox = opts.framed ? root.querySelector(".ph-scroll") : null, keep = scrollBox ? scrollBox.scrollTop : 0;
      root.innerHTML = '<div class="ph-scroll">' + header() + '<main class="ph-body">' + transcript(p) + (K[p.kind] || K.look)(p) + "</main></div>" + nav();
      if (focused) { var ta = root.querySelector("[data-draft]"); if (ta) { ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; } }

      var fresh = st.fresh;
      st.fresh = false;
      var rks = [].slice.call(root.querySelectorAll("[data-rk]")).map(function (x) { return x.getAttribute("data-rk"); }).filter(function (k) { return !st.done[k]; });
      rks.forEach(function (k) { st.done[k] = 1; });

      if (fresh) [].forEach.call(root.querySelectorAll(".ph-body > *"), function (x, i) { x.style.setProperty("--d", Math.min(i, 6) * 60 + "ms"); x.classList.add("arrive"); });
      var tw = root.querySelector("[data-typeout] .tx");

        st.typed[st.screen] = 1;
        var full = tw.textContent, n = 0, per = Math.max(1, Math.ceil(full.length / 70));
        tw.textContent = ""; tw.classList.add("ph-typing");

          n += per;
          if (!tw.isConnected) { clearInterval(h); return; }
          tw.textContent = full.slice(0, n);
          if (n >= full.length) { clearInterval(h); tw.classList.remove("ph-typing"); }
        }, 22);
      }
    }
    var api = {
      show: function (i, step, live) {
        var changed = i !== st.screen;
        if (changed) stopMic(false);
        st.fresh = changed;
        st.screen = i; st.step = step;
        if (live != null) st.live = live;
        render();
        if (changed) { var s = opts.framed ? root.querySelector(".ph-scroll") : null; if (s) s.scrollTop = 0; else if (!opts.framed) window.scrollTo(0, 0); }
        else if (opts.framed) scrollToNewest();
      },
      pos: function () { return { screen: st.screen, step: st.step }; },
      setLive: function (v) { st.live = v; render(); }
    };
    function scrollToNewest() {
      var p = sc().phone || {};

    }

    // ---------- hold to talk ----------
    function startMic() {

    }

      if (!st.mic) return;

        var d = data(), secs = Math.round((Date.now() - st.micStart) / 1000);

    root.addEventListener("pointerdown", function (e) { if (e.target.closest("[data-mic]")) { e.preventDefault(); try { e.target.closest("[data-mic]").setPointerCapture(e.pointerId); } catch (x) {} startMic(); } });

    });
    root.addEventListener("keyup", function (e) {
      if (e.target.closest && e.target.closest("[data-mic]") && (e.key === " " || e.key === "Enter")) { e.preventDefault(); stopMic(); setTimeout(function () { var m = root.querySelector("[data-mic]"); if (m) m.focus(); }, 0); }
    });

    root.addEventListener("input", function (e) {
      if (e.target.hasAttribute("data-draft")) { var d = data(); d.draft = e.target.value; save(d); }

      if (e.target.closest(".ph-zoom") && !e.target.closest("button, .wch, .gw")) { closeZoom(); return; }

      var d = data(), a;
      if (b.hasAttribute("data-zoomclose")) { closeZoom(); return; }
      if (b.hasAttribute("data-zoombtn")) { openZoom(b.closest("[data-zoom]")); return; }
      if ((a = b.getAttribute("data-nav"))) { opts.onNav && opts.onNav(+a); return; }
            if (b.hasAttribute("data-fxsw")) { EP.fx.toggle(); render(); if (EP.fx.on()) EP.fx.play("pop", 0.05); return; }
      if (b.hasAttribute("data-back-live")) { opts.onBackLive && opts.onBackLive(); return; }
      if ((a = b.getAttribute("data-pick"))) { var q = a.split(":"); d.picks = d.picks || {}; d.picks[q[0]] = +q[1]; save(d); render(); return; }
      if ((a = b.getAttribute("data-place"))) { var r = a.split(":"); d.place = d.place || {}; d.place[r[0]] = r[1]; save(d); render(); return; }
      if ((a = b.getAttribute("data-unplace")) != null) { d.place = d.place || {}; delete d.place[a]; save(d); render(); return; }
      if ((a = b.getAttribute("data-ins"))) {
        var ta = root.querySelector("[data-draft]");
        if (ta) { var v = ta.value.replace(/\s+$/, ""); ta.value = (v ? v + " " : "") + a.replace(/^★\s*/, "").replace(/\s*…\s*$/, "") + " "; ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; d.draft = ta.value; save(d); }
        return;
      }
      if (b.hasAttribute("data-save")) {
        var t = (root.querySelector("[data-draft]") || {}).value || "";
        if (!t.trim()) { root.querySelector("[data-draft]").focus(); return; }
        d.text = t.trim(); d.draft = null; d.editing = false; d.at = Date.now(); save(d); render(); return;
      }
      if (b.hasAttribute("data-edit")) { d.editing = true; d.draft = d.text; save(d); render(); var t2 = root.querySelector("[data-draft]"); if (t2) t2.focus(); return; }
      if ((a = b.getAttribute("data-better")) != null) { d.better = d.better || {}; d.better[a] = !d.better[a]; save(d); render(); return; }
      if ((a = b.getAttribute("data-decide"))) { var dq = a.split(":"); d.decide = d.decide || {}; d.decide[d.card] = d.decide[d.card] || {}; d.decide[d.card][dq[0]] = +dq[1]; save(d); render(); return; }
      if ((a = b.getAttribute("data-card")) != null) { d.card = +a; save(d); render(); return; }
      if ((a = b.getAttribute("data-role")) != null) { d.role = +a; save(d); render(); return; }
      if ((a = b.getAttribute("data-part"))) { d.parts = d.parts || {}; d.parts[a] = !d.parts[a]; save(d); render(); return; }
      if ((a = b.getAttribute("data-mode"))) { st.mode[key()] = a; render(); return; }
    });
    return api;
  };
})();

</script>
<script>
// Episode lessons · phone.html: the learner's own phone. Follows class.html when both are open in the same
// browser (BroadcastChannel, with localStorage as the fallback); has its own Back / Next so it also works alone.
(function () {
  var EP = window.EP;
  document.body.classList.add("ep-phone");
  var app = document.getElementById("app");
  var pos = EP.readHash(), last = EP.sync.last();
  var live = false;
  // Open during a lesson that is running in this browser: start where the class is
  if (last && !location.hash && Date.now() - last.t < 6 * 3600 * 1000) { pos = { screen: last.screen, step: last.step }; live = true; }
  var noteBtn = null;
  var phone = EP.mountPhone(app, {
    // the "✎ 提意见" button lives once; every redraw puts it back in the header
    decorate: function (root) {
      var slot = root.querySelector(".note-slot");
      if (!slot || !EP.note) return;
      if (!noteBtn) noteBtn = EP.note.mount(slot, { page: "phone", cls: "on-phone", where: function () { return pos; } });
      else slot.appendChild(noteBtn);
    },
    onNav: function (dir) { live = false; pos = EP.move(pos, dir); show(); },
    onBackLive: function () { var l = EP.sync.last(); if (l) { pos = { screen: l.screen, step: l.step }; live = true; show(); } }
  });
  function show() {
    phone.show(pos.screen, pos.step, live);
    EP.writeHash(pos.screen, pos.step);
    document.title = EP.screens[pos.screen].title + " · " + EP.L.title;
  }
  // Every move of the class page brings the phone back to the class (the teacher leads); between moves the
  // learner may page on their own, and the chip offers the way back.
  EP.sync.listen(function (m) {
    if (!EP.screens[m.screen]) return;
    pos = { screen: m.screen, step: m.step };
    live = true;
    show();
  });
  show();
})();

</script>
</body>
</html>
