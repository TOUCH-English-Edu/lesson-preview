/* phone: the card is a sheet above the Back / Next bar */
.gloss.sheet,.gloss.in-frame{width:auto;left:12px;right:12px;bottom:72px;top:auto;border-radius:18px;padding:14px 16px 12px;font-size:14.5px}
.gloss.sheet{position:fixed;max-width:536px;margin:0 auto}
.gloss.in-frame{position:absolute}
.gloss.sheet .gh b,.gloss.in-frame .gh b{font-size:19px}
.gloss.sheet .gipa,.gloss.in-frame .gipa{font-size:13px}
.gloss.sheet .gplay,.gloss.in-frame .gplay{width:34px;height:34px;font-size:12px}
.gloss.sheet .gm,.gloss.in-frame .gm{font-size:17px}
.gloss.sheet .gm:lang(zh-Hans),.gloss.in-frame .gm:lang(zh-Hans){font-size:19px}
.gloss.sheet .gen,.gloss.sheet .guse,.gloss.in-frame .gen,.gloss.in-frame .guse{font-size:13.5px}
.gloss.sheet .gx,.gloss.in-frame .gx{font-size:22px;right:8px;top:4px}
.ph{position:relative}
.mo .gloss{animation:ep-arrive .32s cubic-bezier(.2,.8,.3,1) both}
/* class.html: a small screen counter, top left; shows on mouse move; ‹ › and a jump list */
.cnav{position:fixed;left:10px;top:10px;z-index:30;display:flex;gap:4px;align-items:center;background:rgba(11,19,36,.82);border-radius:99px;padding:4px;opacity:0;transition:opacity .4s;backdrop-filter:blur(6px)}
.cnav.on,.cnav:focus-within,.cnav:hover{opacity:1}
.cnav button{border:0;background:transparent;color:#dfe7fb;font:800 13px var(--body);border-radius:99px;padding:5px 10px;cursor:pointer}
.cnav button:hover{background:rgba(255,255,255,.12)}
.cnav .cpos{background:rgba(255,255,255,.12);min-width:64px}
.cjump{position:fixed;left:10px;top:52px;z-index:31;width:min(320px,90vw);max-height:min(70vh,560px);overflow:auto;background:#fff;color:#16202e;border-radius:14px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.cjump button{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:7px 8px;border-radius:9px;font:700 14px var(--body);color:#16202e;cursor:pointer}
.cjump button:hover,.cjump button.cur{background:#eef2fb}
.cjump b{font:800 12px var(--display);color:#15357b}
.cjump small{font:700 11px var(--body);color:#5c6779}
/* "✎ 提意见": a note about this screen, sent to the platform (src/ep/note.js) */
.note-btn{border:0;border-radius:99px;background:#e0a12e;color:#2a1c00;font:800 12.5px var(--body);padding:5px 12px;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);white-space:nowrap}
.cnote{position:fixed;right:10px;top:10px;z-index:30;opacity:0;transition:opacity .4s}
.cnote.on,.cnote:focus-within,.cnote:hover{opacity:1}
.pnote{margin-left:10px;vertical-align:3px}
.on-phone .note-btn{padding:2px 9px;font-size:11.5px}
.note-panel{position:fixed;z-index:60;width:min(360px,calc(100vw - 24px));background:#fff;color:#16202e;border-radius:16px;padding:14px;box-shadow:0 18px 50px rgba(14,36,86,.4);font:14px/1.5 var(--body);display:grid;gap:9px}
.note-panel .nw{margin:0;font:800 13px var(--body);color:#15357b}
.nchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nchips > span{font:700 12px var(--body);color:#5c6779;margin-right:2px}
.nchips button{border:2px solid #dfe5f0;background:#fff;color:#16202e;border-radius:99px;padding:4px 12px;font:800 13px var(--body);cursor:pointer}
.nchips.small button{padding:2px 9px;font-size:12px}
.nchips button[aria-pressed="true"]{background:#15357b;border-color:#15357b;color:#fff}
.note-panel textarea{font:inherit;width:100%;min-height:92px;border:2px solid #dfe5f0;border-radius:12px;padding:8px 10px;resize:vertical;color:#16202e;background:#fff}
.nrow{display:flex;gap:8px;align-items:center;justify-content:space-between}
.nrow button{font:800 13px var(--body);border-radius:99px;padding:7px 14px;border:2px solid #dfe5f0;background:#fff;color:#16202e;cursor:pointer}
.nrow .nsend{background:#15357b;border-color:#15357b;color:#fff}
.nmsg{font-size:12.5px;color:#5c6779}
.note-btn.has{box-shadow:inset 0 -2px 0 rgba(0,0,0,.15),0 0 0 2px #fff,0 0 0 4px #15357b}
.nmine{border-top:1px solid #e6ebf3;padding-top:8px}
.nmine summary{cursor:pointer;font:800 13px var(--body);color:#15357b}
.nml{display:grid;gap:6px;margin-top:8px;max-height:min(42vh,320px);overflow:auto}
.nmi{display:grid;gap:2px;text-align:left;border:1.5px solid #e6ebf3;background:#f7f9fc;border-radius:10px;padding:7px 10px;font:13px/1.45 var(--body);color:#16202e;cursor:pointer;text-decoration:none}
.nmi[disabled]{cursor:default}
.nmi b{font:800 12px var(--body);color:#15357b}
.nmi b small{font-weight:600;color:#5c6779}
.nmi span{white-space:pre-wrap;overflow-wrap:anywhere}
.nmi.here{border-color:#e0a12e;background:#fff8ea}
.nmh{margin:4px 0 0;font:800 12px var(--body);color:#5c6779}
.nmine-none{margin:0;font-size:12px;color:#7a8496}
.npics{display:flex;gap:6px;flex-wrap:wrap}
.npics:empty{display:none}
.npic{position:relative;width:64px;height:48px;border-radius:8px;overflow:hidden;border:1.5px solid #dfe5f0;background:#f2f5fa}
.npic img{width:100%;height:100%;object-fit:cover;display:block}
.npic button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(22,32,46,.75);color:#fff;font:700 11px/20px var(--body);padding:0;cursor:pointer}
.npickrow .npick{font:700 12.5px var(--body);border:1.5px dashed #b9c4d6;background:#fff;color:#15357b;border-radius:99px;padding:5px 12px;cursor:pointer}
.npickrow .npick[disabled]{opacity:.5;cursor:default}
.nmsg .nretry{font:800 12px var(--body);border-radius:99px;padding:3px 10px;border:1.5px solid #15357b;background:#fff;color:#15357b;cursor:pointer;margin-left:4px}
.ndraft{margin:0;font:700 12px/1.4 var(--body);color:#8a5a00;background:#fff4dc;border-radius:8px;padding:5px 8px}
.note-toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:70;background:#15357b;color:#fff;font:700 14px/1.4 var(--body);padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(14,36,86,.35);max-width:calc(100vw - 24px)}

/* the language switch: an iOS-style segmented control (EN · 中文 · BM) with a sliding white thumb */
.seg3{--i:0;--h:2.4em;position:relative;display:inline-grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:.18em;border-radius:99em;background:rgba(118,118,128,.18);font:700 1em var(--body);isolation:isolate;flex:none}
.seg3 .thumb{position:absolute;z-index:-1;top:.18em;bottom:.18em;left:.18em;width:calc((100% - .36em) / 3);border-radius:99em;background:#fff;box-shadow:0 .12em .3em rgba(0,0,0,.14),0 .05em .05em rgba(0,0,0,.06);transform:translateX(calc(var(--i) * 100%));transition:transform .45s cubic-bezier(.34,1.32,.64,1)}
.seg3 button{position:relative;border:0;background:transparent;color:inherit;font:inherit;min-width:3.4em;height:var(--h);padding:0 .9em;border-radius:99em;cursor:pointer;white-space:nowrap;transition:color .25s,opacity .25s;opacity:.78}
.seg3 button[aria-checked="true"]{opacity:1;color:#0b1324}
.seg3 button:focus-visible{outline:.14em solid var(--f-gold);outline-offset:-.14em}
.seg3 button:active{transform:scale(.96)}
html:not(.mo) .seg3 .thumb{transition:none}
/* in the dock (on navy): dark track, white thumb */
.seg3.in-dock{font-size:.95cqw;color:#dfe7fb;background:rgba(255,255,255,.12);margin-right:.3cqw}
.seg3.in-dock button{min-width:3.6em;height:2.5em}
/* in the meaning card */
.seg3.in-card{font-size:1.05cqw;margin-top:.8cqw;color:#16202e}
.gloss.sheet .seg3.in-card,.gloss.in-frame .seg3.in-card{font-size:13px;margin-top:10px}
.gloss.sheet .seg3.in-card button,.gloss.in-frame .seg3.in-card button{height:34px;min-width:58px}
/* on the phone header (on navy) */
.seg3.on-phone{font-size:11.5px;color:#fff;background:rgba(255,255,255,.16)}
.seg3.on-phone button{height:28px;min-width:38px;padding:0 7px}
/* timed screens: the dock carries the timer too, so everything in it sits a little tighter */
.dock.timed{gap:1.2cqw;padding:0 1.6cqw}
.dock.timed .tools{gap:.4cqw}
.dock.timed .tool{padding:.55cqw .75cqw;font-size:.98cqw}
.dock.timed .seg3.in-dock{font-size:.82cqw}
.dock.timed .seg3.in-dock button{min-width:3.1em;padding:0 .6em}
.dock.timed .words{gap:.45cqw .5cqw}
.dock.timed .w{font-size:.95cqw;padding:.3cqw .65cqw}
.dock.timed .timer .tm{width:4.4cqw;font-size:1.2cqw}
.dock.timed .tchip{font-size:.78cqw;padding:.25cqw .45cqw}
/* phone header: the lesson name gives way; the controls wrap under it when there is no room */
.ph-top .row{flex-wrap:wrap;row-gap:6px}
.ph-top .row > span:first-child{flex:1 1 130px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-top .ph-right{flex-wrap:wrap;justify-content:flex-end}
.ph-top .live{white-space:nowrap}
/* the beam's colours belong to the whole track (grey past → blue now → orange future); only the filled part shows */
.tbeam.h .beam{width:auto;right:0;background-size:100% 100%;clip-path:inset(0 calc(100% - var(--len)) 0 0 round 1cqw);transition:clip-path .9s cubic-bezier(.3,.7,.2,1)}
.tbeam.v .beam{height:auto;bottom:0;clip-path:inset(0 0 calc(100% - var(--len)) 0 round 1cqw);transition:clip-path .9s cubic-bezier(.3,.7,.2,1)}
.tbeam .beam{box-shadow:none;filter:drop-shadow(0 0 .5cqw rgba(76,203,255,.55))}

/* ======================= PUFFY PICTURE CARDS (PPF) · approved 2026-10-03 ======================= */
.puffy{position:relative;border-radius:2.4cqw;background:#fff;box-shadow:0 .55cqw 0 var(--lip,#cfd8e8),0 1.6cqw 3cqw rgba(14,36,86,.18);transform-origin:50% 100%}
.puffy::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0) 30%)}
.pcards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));grid-template-rows:minmax(0,1fr) auto;gap:1.6cqw 2.6cqw;padding:1.6cqw .6cqw 0}
.pc{--lip:var(--c2);padding:1cqw 1cqw 1.3cqw;display:flex;flex-direction:column;gap:.7cqw;--rest:rotate(var(--r));transform:var(--rest);min-height:0;align-self:start;
  transition:transform .55s cubic-bezier(.2,1.4,.3,1),filter .4s,opacity .4s}
.pc.tz-P{--c1:#6b7fa3;--c2:#b9c4d8;--c3:#e8edf5;--r:-2.5deg}
.pc.tz-P2{--c1:#1f5fb8;--c2:#9cc0ee;--c3:#e4effc;--r:0deg}
.pc.tz-F{--c1:#e0792e;--c2:#f3c39b;--c3:#fff1e4;--r:2.5deg;outline:.25cqw dashed #e0792e;outline-offset:.45cqw}
.pc .ptab{position:absolute;z-index:2;top:-1.5cqw;left:1.5cqw;font:800 1.2cqw var(--display);letter-spacing:.04em;color:#fff;background:var(--c1);border-radius:99cqw;padding:.5cqw 1.3cqw;box-shadow:0 .35cqw 0 var(--c2)}
.pc .pcpic{border-radius:1.6cqw;overflow:hidden;aspect-ratio:16/9;background:var(--c3);flex:none}
.pc .pcpic img{width:100%;height:100%;object-fit:cover;display:block}
.pc .pq{margin:0;font:800 1.3cqw var(--body);color:var(--c1);letter-spacing:.03em}
.pc .psay{margin:0;font:600 1.42cqw/1.36 var(--body);color:var(--f-ink)}
.pc[data-depth="1"]{--rest:translateY(1.2cqw) scale(.94) rotate(var(--r));filter:saturate(.75)}
.pc[data-depth="2"]{--rest:translateY(2cqw) scale(.9) rotate(var(--r));filter:saturate(.6)}
.pcards .tline{grid-column:1 / -1}
.mo .pc.arrive{animation:pc-pop .6s cubic-bezier(.2,1.4,.3,1) var(--d,0ms) both}
@keyframes pc-pop{0%{opacity:0;transform:translateY(5cqw) scale(.8) rotate(var(--r))}100%{opacity:1;transform:var(--rest)}}

/* ======================= FROSTED GLASS PAIR (✕ wrong + ✓ right) · approved 2026-10-03 ======================= */
.glasswrap{position:relative;border-radius:1.6cqw;overflow:hidden;padding:.8cqw;isolation:isolate;flex:none}
.glasswrap .gbg{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center;filter:saturate(1.2);transform:scale(1.1)}
.glasswrap:not(:has(.gbg)){background:linear-gradient(135deg,var(--f-canvas),#dfe8fa)}
.glass{position:relative;border-radius:1.3cqw;padding:.75cqw .9cqw;display:grid;gap:.5cqw;
  background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.46));-webkit-backdrop-filter:blur(1.4cqw) saturate(1.4);backdrop-filter:blur(1.4cqw) saturate(1.4);
  box-shadow:inset 0 .12cqw 0 rgba(255,255,255,.9),inset 0 -.12cqw 0 rgba(255,255,255,.35),0 .8cqw 2cqw rgba(14,36,86,.18);border:.12cqw solid rgba(255,255,255,.7)}
.gl{display:flex;align-items:center;gap:.7cqw;font:700 1.28cqw/1.28 var(--body);color:#16202e}
.gl .mk{width:2.1cqw;height:2.1cqw;border-radius:50%;display:grid;place-items:center;font:800 1.1cqw var(--display);color:#fff;flex:none;
  box-shadow:inset 0 .15cqw 0 rgba(255,255,255,.45),0 .3cqw .7cqw rgba(0,0,0,.18)}
.gl.bad .mk{background:radial-gradient(circle at 35% 30%,#ef7d90,#d4475f)}
.gl.bad s.bad{color:#c23652;background:none;text-decoration:underline;text-decoration-color:#d4475f;text-decoration-thickness:.18cqw;padding:0}
.gl.ok .mk{background:radial-gradient(circle at 35% 30%,#5fe0c4,#14a38b)}
.gl.ok b.good{color:#0f8a75}
.ghint{font:600 1.02cqw/1.3 var(--body);color:#38445a;padding-left:2.8cqw}
.mo .gl.ok.arrive{animation:gl-rise .55s cubic-bezier(.2,1.3,.3,1) var(--d,0ms) both}
@keyframes gl-rise{0%{opacity:0;transform:translateY(-1cqw) scale(.96)}100%{opacity:1;transform:none}}
/* inside Time control and Fix it */
.tcol .tb{gap:.5cqw}
.tcol .glasswrap{margin-top:.2cqw}
.fcard .glasswrap{margin-top:auto}
.fcard{gap:.45cqw}
.pcards{grid-template-rows:auto auto;align-content:start;row-gap:2.4cqw}
.pc .pcpic{aspect-ratio:2.25/1}
.pc .psay{font-size:1.38cqw}
.pc[data-depth="1"]{--rest:translateY(.7cqw) scale(.95) rotate(var(--r))}
.pc[data-depth="2"]{--rest:translateY(1.2cqw) scale(.91) rotate(var(--r))}

/* ======================= FORMULAS THAT ARE NOT PPF (OREO …) · 2026-10-03 =======================
   The part colours come from EP.partCol (inline --c1/--c2/--c3 on puffy cards, .t-<tag> on tags). No time line,
   no time words, no receding past: those belong to PAST / PRESENT / FUTURE only. */
.pc-free{column-gap:1.8cqw;padding-top:1.9cqw}
.pc-free .pc{padding:.9cqw .9cqw 1.1cqw;gap:.6cqw}
.pc-free .pc .ptab{font-size:1.08cqw;padding:.45cqw 1.1cqw;left:1.2cqw}
.pc-free .pc .pq{font-size:1.15cqw}
.pc-free .pc .psay{font-size:1.4cqw;line-height:1.34}
.pc-free .pc .pcpic{aspect-ratio:16/10}
.ppf.pstack{display:grid;gap:1.1cqw}

/* a card with bullet lines (`items`) */
.clist{margin:.4cqw 0 0;padding:0;list-style:none;display:grid;gap:.35cqw}
.clist li{position:relative;padding-left:1.3cqw;font:600 1.32cqw/1.32 var(--body)}
.clist li::before{content:"";position:absolute;left:.15cqw;top:.55em;width:.5cqw;height:.5cqw;border-radius:50%;background:var(--f-gold)}

/* an option that is ruled out (`drop`): it falls back, greys out, and a red mark lands on it; its space stays */
.dropcard{position:relative;transform:var(--rest);transform-origin:20% 0}
.dropcard.dropped{--rest:translateY(1.6cqw) rotate(-3.5deg) scale(.96);background:#f1f3f6;box-shadow:0 .2cqw .5cqw rgba(20,33,50,.06)}
.dropcard.dropped > :not(.dropmark){filter:grayscale(1);opacity:.5}
.mo .dropcard{transition:transform .7s cubic-bezier(.5,-.2,.4,1.4),background .6s,box-shadow .6s}
.mo .dropcard > *{transition:filter .6s,opacity .6s}
.dropmark{position:absolute;right:-.6cqw;top:-1.2cqw;z-index:2;--rest:rotate(6deg);transform:var(--rest);background:#fff;color:var(--bad);border:.22cqw solid var(--bad);border-radius:.9cqw;padding:.3cqw .8cqw;font:800 1.2cqw/1.25 var(--body);box-shadow:0 .6cqw 1.4cqw rgba(192,64,92,.25);white-space:nowrap}

/* a checklist that ticks (her needs) */
.cklist{background:#fff;border-radius:1.5cqw;padding:.8cqw 1.1cqw;box-shadow:0 .6cqw 1.6cqw rgba(20,33,50,.08);display:grid;gap:.45cqw}
.cklist h3{margin:0;font:800 1.1cqw var(--body);letter-spacing:.12em;color:var(--f-muted);text-transform:uppercase}
.ck{display:grid;grid-template-columns:2.1cqw 1fr;gap:.7cqw;align-items:start}
.ck .box{width:2.1cqw;height:2.1cqw;border-radius:.6cqw;border:.2cqw solid #c3cbd9;background:#fff;display:grid;place-items:center;color:#fff;font:800 1.3cqw/1 var(--display);transform:var(--rest);position:relative}
.ck .ckt{display:grid;gap:.1cqw;min-width:0}
.ck .ask{font:700 1.05cqw/1.3 var(--body);color:var(--f-muted)}
.ck .ans{font:700 1.25cqw/1.25 var(--body);color:var(--f-ink)}
.ck:has(.ans:not(.pre)) .box,.ck.heard .box{background:var(--present);border-color:var(--present)}
.ck:has(.ans:not(.pre)) .box::after,.ck.heard .box::after{content:"✓"}
.ck.heard .ans.pre{opacity:1;visibility:visible}
.mo .ck.heard .box,.mo .ck:has(.ans.arrive) .box{animation:ep-swell .55s cubic-bezier(.34,1.56,.64,1)}

/* LIVE POLL: the class's answers as bars */
.poll{background:#fff;border-radius:1.5cqw;padding:1cqw 1.2cqw;box-shadow:0 .6cqw 1.6cqw rgba(20,33,50,.08);display:grid;gap:.55cqw}
.poll h3{margin:0;display:flex;align-items:baseline;gap:1cqw;font:800 1.1cqw var(--body);letter-spacing:.12em;color:var(--f-muted);text-transform:uppercase}
.poll .ptot{margin-left:auto;font:700 1cqw var(--body);letter-spacing:0;text-transform:none;color:var(--f-muted)}
.plegend{display:flex;flex-wrap:wrap;gap:.4cqw 1.1cqw;font:700 1.05cqw var(--body);color:var(--f-ink)}
.plegend span{display:inline-flex;align-items:center;gap:.4cqw}
.plegend i{width:1cqw;height:1cqw;border-radius:.3cqw;display:inline-block}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.8cqw;align-items:center}
.prow .plab{font:700 1.25cqw/1.2 var(--body);min-width:2.4cqw}
.prow.one .plab{min-width:7.5cqw}
.multi .prow .plab{font-size:1.7cqw;line-height:1}
.pbar{height:1.9cqw;border-radius:99cqw;background:#edf1f7;overflow:hidden;display:flex;box-shadow:inset 0 .12cqw .3cqw rgba(20,33,50,.08)}
.pbar i{display:block;height:100%;width:0;flex:none}
.pbar.stack i + i{box-shadow:inset .15cqw 0 0 rgba(255,255,255,.85)}
.pbar:not(.stack) i{border-radius:99cqw}
.pbar i.zero{box-shadow:none}
.mo .pbar i{transition:width .7s cubic-bezier(.34,1.3,.64,1)}
.pnums{display:inline-flex;gap:.3cqw}
.pnum{position:relative;transform:var(--rest);border:0;min-width:2.3cqw;height:2cqw;border-radius:.7cqw;padding:0 .45cqw;font:800 1.1cqw var(--display);color:#fff;background:var(--pc);box-shadow:inset 0 .1cqw 0 rgba(255,255,255,.3),0 .2cqw 0 rgba(0,0,0,.18);cursor:pointer}
.pnum:active{--rest:translateY(2px);box-shadow:none}
.poll.compact{padding:.7cqw 1cqw;gap:.4cqw}
.poll.compact .prow .plab{font-size:1.1cqw}
.poll.compact .pbar{height:1.5cqw}
.poll.compact .pnum{height:1.7cqw;font-size:1cqw}

/* two-sided task cards: each side face down on the stage, its owner reads it on the phone */
.tcards.two .tcard{overflow:visible}
.tsides{display:grid;grid-template-columns:1fr 1fr;gap:.8cqw;padding:.4cqw 1.1cqw 1.1cqw;flex:1;min-height:0}
.tside{perspective:60cqw;min-height:9cqw}
.tside .in{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.mo .tside .in{transition:transform .6s cubic-bezier(.34,1.3,.64,1)}
.tside.flip .in{transform:rotateY(180deg)}
.tside .face{position:absolute;inset:0;border-radius:1.2cqw;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:.8cqw .9cqw;display:flex;flex-direction:column;gap:.3cqw}
.tside .cover{align-items:center;justify-content:center;text-align:center;color:#fff;background:repeating-linear-gradient(135deg,#1c3f8c 0 .7cqw,#15357b .7cqw 1.4cqw);box-shadow:inset 0 0 0 .2cqw rgba(255,255,255,.18),0 .5cqw 1.2cqw rgba(14,36,86,.18)}
.tside:nth-child(2) .cover{background:repeating-linear-gradient(135deg,#7a4a12 0 .7cqw,#6a3f0e .7cqw 1.4cqw)}
.tside .cover .ic{font-size:2.3cqw;line-height:1}
.tside .cover b{font:800 1.35cqw/1.15 var(--display)}
.tside .cover small{font:700 .95cqw/1.25 var(--body);opacity:.85}
.tside .open{transform:rotateY(180deg);background:var(--f-canvas);overflow:hidden}
.tside .open b{font:800 1.1cqw var(--body);color:var(--f-brand)}
.tside .open .clist li{font-size:1.05cqw}

/* the learner's side of a two-sided card, on the phone */
.ph-side{background:var(--f-canvas);border-radius:12px;padding:10px 12px}
.ph-side b{font:800 13px var(--body);color:var(--f-brand)}
.ph-side ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px;font-size:14.5px}

/* a voice message in a stage chat (listen first: no text) */
.svnote{display:flex;align-items:center;gap:.8cqw;margin-top:.2cqw;min-width:14cqw}
.svnote .play{width:2.8cqw;height:2.8cqw;background:#1a7f64;box-shadow:0 .25cqw 0 #0f5a46}
.svnote .bars{flex:1;height:1.7cqw;background:repeating-linear-gradient(90deg,#7e8a84 0 .22cqw,transparent .22cqw .5cqw);border-radius:.3cqw;opacity:.75}
.svnote .d{font:700 1cqw var(--body);color:var(--f-muted)}
.svnote.mini{min-width:12cqw;max-width:22cqw;margin-top:.5cqw}
.mo .svnote:has(.play.playing) .bars{animation:ep-wave .45s ease-in-out infinite alternate}
/* two-sided task cards: the sides fill the card evenly. A side that is never turned over on the stage shows only its
   cover; one with a reveal step stacks both faces in one grid cell, so it is as tall as its longer face */
.tcards.two .tcard{display:flex;flex-direction:column}
.tsides{align-items:stretch}
.tside{min-height:6.5cqw;display:grid}
.tside .in{display:grid;height:auto}
.tside .face{position:relative;inset:auto;grid-area:1 / 1}
.tside:not([data-flip]) .open{display:none}
/* kit rows of a formula that is not PPF: a little tighter (longer part labels, no time rail) */
.kit:not(.tstack){gap:.65cqw}
.kit:not(.tstack):not(.compact) .krow{padding:.7cqw 1.1cqw;row-gap:.3cqw}
.kit.compact:not(.tstack) .krow{grid-template-columns:max-content 1fr}
.kit.compact:not(.tstack) .krow .tag{min-width:8cqw}
/* picture overlays besides "say": a pin (points at a spot: a gold label with a dot on its left edge) and a plain label */
.ov-pin{background:#fff;color:var(--f-ink);border-radius:99cqw;padding:.35cqw .9cqw .35cqw 1.5cqw;font:800 1.45cqw/1.2 var(--body);box-shadow:0 .5cqw 1.2cqw rgba(14,36,86,.28);white-space:nowrap}
.ov-pin::before{content:"";position:absolute;left:.45cqw;top:50%;width:.7cqw;height:.7cqw;margin-top:-.35cqw;border-radius:50%;background:var(--f-gold);box-shadow:0 0 0 .25cqw rgba(224,161,46,.35)}
.ov-lbl{background:rgba(255,255,255,.92);color:var(--f-ink);border-radius:.7cqw;padding:.3cqw .7cqw;font:700 1.1cqw/1.25 var(--body);box-shadow:0 .4cqw 1cqw rgba(14,36,86,.2)}
/* card text scales with the stage (15px at a 1280 stage, as approved, and smaller with a smaller stage) */
:where(.ep-stage) .card{font-size:1.171875cqw}
/* a full-width stack of parts: room on the right for the part in focus, which comes forward */
.ppf.pstack{padding-right:2.6cqw}
/* a word sticker slapped onto a picture (overlay kind "sticker"): lands with the stamp thud */
.ov-sticker{--rest:rotate(-5deg);transform:var(--rest);background:#fff;color:var(--f-brand-dd);border:.25cqw solid var(--f-gold);border-radius:.8cqw;padding:.35cqw .9cqw;font:800 1.35cqw/1.2 var(--display);box-shadow:0 .5cqw 1.2cqw rgba(14,36,86,.3);white-space:nowrap}
.ov-sticker:nth-of-type(even){--rest:rotate(4deg)}
/* STORY STRIP: numbered panels in one row on a thin line */
.strip{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:1.2cqw;align-items:start;padding-top:1.6cqw}
.strip .sline{position:absolute;left:3%;right:3%;top:2.4cqw;height:.3cqw;border-radius:1cqw;background:linear-gradient(90deg,rgba(21,53,123,.15),rgba(21,53,123,.35));z-index:0}
.strip .sp{position:relative;z-index:1;display:flex;flex-direction:column;gap:.6cqw;background:#fff;border-radius:1.5cqw;padding:1.6cqw .8cqw .9cqw;box-shadow:0 .6cqw 1.6cqw rgba(20,33,50,.08)}
.strip .sdot{position:absolute;top:-1.5cqw;left:50%;margin-left:-1.5cqw;width:3cqw;height:3cqw;border-radius:50%;background:var(--f-brand);color:#fff;display:grid;place-items:center;font:800 1.3cqw var(--display);box-shadow:0 0 0 .35cqw #fff}
.strip.lettered .sdot{background:var(--f-gold);color:#2a1c00;transform:rotate(-4deg)}
.strip .sbeat{font:800 1cqw var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--f-muted);text-align:center}
.strip .scene{border-radius:1.1cqw}
.strip .stx{margin:0;font:600 1.2cqw/1.32 var(--body)}
.strip .listen{padding:.35cqw .8cqw .35cqw .35cqw;font-size:1.05cqw;gap:.5cqw}
.strip .listen .play{width:2.4cqw;height:2.4cqw}
.strip .sp.tz-P{background:#f2f4f7}
.strip .sp.tz-P .sdot{background:#7d8aa3}
.strip .sp.tz-P2{box-shadow:0 .12cqw .25cqw rgba(20,33,50,.14),0 1.1cqw 2.4cqw rgba(14,36,86,.17)}
/* 2026-10-03 polish. Two-sided task cards: a side is always as tall as its face-down cover, whatever its hidden notes
   hold (the full notes are on the learner's phone). Turned over for a debrief (revealAt), the notes scroll inside the
   side instead of pushing the card past the stage. */
.tside[data-flip]{min-height:8.5cqw}
.tside[data-flip] .open{position:absolute;inset:0;overflow-y:auto;scrollbar-width:thin}
.tside[data-flip] .open .clist li{font-size:.95cqw}
/* a video call that shows the other side's camera (phone app "call" with video: "<scene id>") */
.call.vcall{position:relative;padding:0;gap:0;justify-content:flex-end;overflow:hidden;background:#111}
.call.vcall .vfeed{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.call.vcall .vtop{position:absolute;left:0;right:0;top:0;padding:4cqw 5cqw 8cqw;display:flex;flex-direction:column;align-items:center;gap:1cqw;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
.call.vcall .vtop small{color:#e2e8f0}
.call.vcall .vself{position:absolute;right:4cqw;top:24cqw;width:20cqw;height:30cqw;border-radius:3cqw;background:linear-gradient(160deg,#5a6b85,#2b3445);box-shadow:0 0 0 .6cqw rgba(255,255,255,.7)}
.call.vcall .lnk{position:relative;margin:0 auto 3cqw;background:rgba(0,0,0,.45)}
.call.vcall .btns{position:relative;justify-content:center}
/* a glowing ring on a picture (overlay kind "ring"): points at the button the step talks about, e.g. on an app
   screenshot. pos sets left/top/width/height in % of the picture; round: true draws a circle. */
.ov-ring{border:.28cqw solid var(--f-gold);border-radius:1cqw;box-shadow:0 0 0 .35cqw rgba(224,161,46,.35),0 0 1.6cqw .3cqw rgba(224,161,46,.65);pointer-events:none}
.ov-ring.round{border-radius:50%}
.mo .ov-ring:not(.pre){animation:ovring 1.6s ease-in-out 3}
@keyframes ovring{0%,100%{box-shadow:0 0 0 .35cqw rgba(224,161,46,.35),0 0 1.6cqw .3cqw rgba(224,161,46,.65)}50%{box-shadow:0 0 0 .7cqw rgba(224,161,46,.18),0 0 2.6cqw .6cqw rgba(224,161,46,.85)}}
@media (prefers-reduced-motion:reduce){.mo .ov-ring:not(.pre){animation:none}}
/* overlay kind "label": a place word on a screen picture (blue text, a thin blue border), clearly not part of the app */
.ov-label{color:var(--f-brand);border:.15cqw solid var(--f-brand);border-radius:1cqw;padding:.2cqw .6cqw;font:800 1.05cqw/1.25 var(--body);white-space:nowrap;background:#fff}

/* ======================= REWORK 2026-10-03 (the colleague's review) ======================= */
/* the purpose line: why this page and how it follows the last one */
/* it costs one short line: the header tightens a little when it is there */
.st-hd:has(.purpose){gap:.25cqw}
.st-hd:has(.purpose) h2{font-size:2.4cqw}
.st-main:has(.st-hd .purpose){gap:1cqw}
.st-hd .purpose,.b-title .purpose{margin:0;font:600 1.2cqw/1.3 var(--body);color:var(--f-brand);display:flex;gap:.6cqw;align-items:baseline;max-width:none}
.st-hd .purpose::before,.b-title .purpose::before{content:"↳";font-weight:800;color:var(--f-gold)}
.ph-top .purpose{margin:0;font:600 13px/1.35 var(--body);color:#ffe2a8}
.rv-phone .ph-top .purpose{font-size:12px}

/* points as lists: one point per line */
ul.pts{margin:.3em 0 0;padding:0;list-style:none;display:grid;gap:.25em}
ul.pts li{position:relative;padding-left:1.05em}
ul.pts li::before{content:"";position:absolute;left:.2em;top:.55em;width:.38em;height:.38em;border-radius:50%;background:var(--f-gold)}
.note.do ul.pts li::before{background:#fff}

/* listening: a bigger, clearer play button; the one to press now glows */
/* (same bar height as before, so no screen grows: the button fills the pill) */
.listen{font-size:1.45cqw;padding:.2cqw 1.8cqw .2cqw .2cqw}
.listen .play{width:4cqw;height:4cqw}
.svnote .play{width:3cqw;height:3cqw}
.strip .listen .play{width:2.8cqw;height:2.8cqw}
.play.lnow:not(.playing){box-shadow:0 0 0 .45cqw rgba(224,161,46,.55),0 .4cqw 1cqw rgba(21,53,123,.3)}
.mo .play.lnow:not(.playing){animation:ep-lnow 1.4s ease-in-out infinite}
@keyframes ep-lnow{0%,100%{box-shadow:0 0 0 .2cqw rgba(224,161,46,.6),0 .4cqw 1cqw rgba(21,53,123,.3)}50%{box-shadow:0 0 0 .8cqw rgba(224,161,46,.2),0 .4cqw 1cqw rgba(21,53,123,.3)}}
/* sound off on a listening step: a big prompt above the dock */
.lprompt{position:absolute;right:3cqw;bottom:11.2cqw;z-index:8;display:flex;align-items:center;gap:1.2cqw;border:0;border-radius:99cqw;
  background:var(--f-brand);color:#fff;padding:.9cqw 2.4cqw .9cqw .9cqw;box-shadow:0 0 0 .35cqw rgba(224,161,46,.7),0 1.2cqw 3cqw rgba(13,34,83,.4);cursor:pointer;text-align:left}
.lprompt .pi{width:4.2cqw;height:4.2cqw;border-radius:50%;background:var(--f-gold);color:#2a1c00;display:grid;place-items:center;font-size:1.8cqw;padding-left:.3cqw}
.lprompt b{display:block;font:800 1.9cqw var(--display)}
.lprompt small{display:block;font:600 1.1cqw var(--body);color:#c7d4f3}
.ltoast{position:absolute;left:50%;top:1.2cqw;transform:translateX(-50%);z-index:11;background:#15357b;color:#fff;font:700 1.3cqw var(--body);padding:.7cqw 1.6cqw;border-radius:99cqw;box-shadow:0 .8cqw 2cqw rgba(13,34,83,.35);white-space:nowrap}
/* the transcript, after the answers */
.tscript{position:absolute;top:2cqw;max-height:calc(100% - 13cqw);left:3cqw;width:44cqw;z-index:8;overflow:auto;background:rgba(255,255,255,.96);backdrop-filter:blur(.6cqw);-webkit-backdrop-filter:blur(.6cqw);
  border-radius:1.8cqw;padding:1.6cqw 2cqw;box-shadow:0 1.6cqw 4cqw rgba(13,34,83,.3),0 0 0 .12cqw rgba(21,53,123,.12);border-top:.5cqw solid var(--f-brand)}
.tscript.side-right{left:auto;right:3cqw}
.tscript.closed{display:none}
.tscript h4{margin:0 2.4cqw .9cqw 0;font:800 1.15cqw var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--f-muted)}
.tscript .x{position:absolute;right:1cqw;top:.8cqw;border:0;background:none;font:800 2cqw var(--body);color:var(--f-muted);cursor:pointer}
.tscript .tl{margin:0 0 .9cqw;display:flex;gap:1cqw;align-items:flex-start;font:600 1.5cqw/1.45 var(--body);color:var(--f-ink)}
.tscript .tl .play{width:2.6cqw;height:2.6cqw;margin-top:.1cqw}
.tscript .tl b{color:var(--f-brand);font-weight:800}
.ep-prep .tscript,.ep-prep .lprompt,.ep-prep .ltoast{display:none}
.bub.quote{cursor:zoom-in}
.ph-tscript .tl{margin:8px 0 0;display:flex;gap:10px;align-items:flex-start;font:600 15px/1.45 var(--body)}
.ph-tscript .tl .play{width:32px;height:32px;font-size:12px;flex:none}
.ph-tscript .tl b{color:var(--f-brand)}
.ph ul.pts{font-size:15px}
.svnote.mini .play{width:2.4cqw;height:2.4cqw}
/* the magnifier on the learner's phone: a message (context bubble, a voice message's words) made big */
.ph-zbtn{margin-left:auto;border:0;background:var(--f-canvas);border-radius:99px;width:30px;height:30px;font-size:14px;line-height:1;display:grid;place-items:center;cursor:zoom-in}
.ph .zsrc{cursor:zoom-in}
.ph-zoom{position:fixed;inset:0;z-index:60;background:rgba(13,34,83,.94);color:#fff;padding:56px 22px 28px;display:flex;flex-direction:column;gap:10px;overflow:auto;cursor:zoom-out}
.iph .ph-zoom{position:absolute}
.ph-zoom small{font:800 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:#ffe2a8}
.ph-zoom .zt{font:600 26px/1.42 var(--body)}
.ph-zoom .zt ul.pts{font-size:inherit}
.ph-zoom .zt ul.pts li::before{background:#ffe2a8}
.ph-zoom .x{position:absolute;top:12px;right:14px;border:0;background:rgba(255,255,255,.16);color:#fff;width:40px;height:40px;border-radius:50%;font:700 24px/1 var(--body)}
.ph-zoom .wch,.ph-zoom .gw{text-decoration-color:rgba(255,255,255,.6)}
/* the magnifier on the stage: every text message inside a stage phone opens large when tapped */
.iph .bub.zoomable{cursor:zoom-in}
/* a two-sided card's side that decides (E10 listener: SCAM / SAFE for each message) */
.ph-decide{display:flex;gap:6px;margin-top:6px}
.ph-decide button{flex:1;border:2px solid var(--f-line);background:#fff;border-radius:10px;padding:6px 8px;font:800 13px var(--body);color:var(--f-ink)}
.ph-decide button[aria-pressed="true"]{border-color:var(--f-brand);background:var(--f-brand);color:#fff}


/* SCRUB BARS (2026-10-04): every voice player has a progress bar to drag back to a part, with "0:12 / 0:35".
   Sizes follow the font size of the place it sits in (em), so one rule serves the stage, a stage phone and the phone. */
.scrub{--p:0;--sc:var(--f-brand,#1f5fb8);flex:1;min-width:0;display:flex;align-items:center;gap:.7em}
.scrub input{flex:1;min-width:3em;margin:0;height:1.6em;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;touch-action:none}
.scrub input:focus{outline:none}
.scrub input:focus-visible{outline:.15em solid var(--f-gold,#e0a526);outline-offset:.15em;border-radius:99px}
.scrub input::-webkit-slider-runnable-track{height:.5em;border-radius:99px;background:linear-gradient(90deg,var(--sc) calc(var(--p) * 100%),rgba(120,135,160,.28) 0)}
.scrub input::-moz-range-track{height:.5em;border-radius:99px;background:rgba(120,135,160,.28)}
.scrub input::-moz-range-progress{height:.5em;border-radius:99px;background:var(--sc)}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:1.25em;height:1.25em;margin-top:-.375em;border-radius:50%;background:#fff;border:.2em solid var(--sc);box-shadow:0 .1em .35em rgba(0,0,0,.25)}
.scrub input::-moz-range-thumb{width:1em;height:1em;border-radius:50%;background:#fff;border:.2em solid var(--sc);box-shadow:0 .1em .35em rgba(0,0,0,.25)}
.scrub .stime{flex:none;font-weight:700;font-size:.85em;color:var(--f-muted,#6b7280);white-space:nowrap;font-variant-numeric:tabular-nums}
.scrub.on .stime{color:var(--sc)}
.listen .lbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:0;padding:.1cqw 0}
.listen .llab{line-height:1.15}
.listen .scrub{font-size:1.1cqw}
.listen .scrub input{height:1.3em}
.vnote .scrub{--sc:#1a7f64;font-size:3.4cqw}
.svnote .scrub{--sc:#1a7f64;font-size:1.05cqw}
.svnote.mini .scrub{font-size:.95cqw}
.call .lnk .scrub{--sc:#9ae6b4;font-size:3.2cqw;min-width:30cqw}
.call .lnk .scrub .stime{color:#e6fff0}
.tsplay{display:flex;align-items:center;gap:1cqw;margin:0 0 1.1cqw;padding:.5cqw .9cqw .5cqw .5cqw;border-radius:99cqw;background:var(--f-bg-soft,#eef3fb)}
.tsplay .play{width:2.6cqw;height:2.6cqw;flex:none}
.tsplay .scrub{font-size:1.05cqw}
.ph-voice .scrub{--sc:var(--ok);font-size:13px}
.ph-voice .scrub .stime{color:var(--ok)}
.ph-tscript .tsplay{margin:8px 0 2px;padding:6px 10px;border-radius:14px;background:var(--f-bg-soft,#eef3fb)}
.ph-tscript .tsplay .play{width:34px;height:34px;font-size:12px}
.mo .scrub.on input::-webkit-slider-thumb{box-shadow:0 0 0 .3em color-mix(in srgb,var(--sc) 25%,transparent),0 .1em .35em rgba(0,0,0,.25)}

/* TODAY'S COMMUNICATION GOAL (the curriculum lead's template, 2026-10-04): the goal line, three "practise how to"
   rows with their icons, and why the skill is useful. The block is the whole page (no header). */
.goal{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.3cqw;padding-right:var(--castw,0)}
.goal .gk{align-self:flex-start;background:var(--f-brand);color:#fff;font:800 1.1cqw var(--display);letter-spacing:.1em;text-transform:uppercase;border-radius:1cqw;padding:.5cqw 1.2cqw}
.goal .gl{margin:0;font:800 2.75cqw/1.2 var(--display);color:var(--f-brand-dd);letter-spacing:-.01em;text-wrap:balance;max-width:84cqw}
.goal .gcols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.6cqw}
.goal .gpr,.goal .gwhy{background:#fff;border-radius:1.8cqw;box-shadow:0 .8cqw 2.2cqw rgba(20,33,50,.08);padding:1.7cqw 2cqw;display:flex;flex-direction:column;gap:1.7cqw;min-height:0}
.goal h3{margin:0;font:800 1.6cqw var(--display);color:var(--f-brand)}
.goal .gi{display:flex;gap:1.2cqw;align-items:flex-start}
.goal .gi .ic{flex:none;width:4.4cqw;height:4.4cqw;border-radius:1.1cqw;background:var(--f-gold-soft);display:grid;place-items:center;font-size:2.4cqw;line-height:1}
.goal .gi b{display:block;font:800 1.95cqw/1.25 var(--display);color:var(--f-ink)}
.goal .gi div > span{display:block;font:600 1.55cqw/1.4 var(--body);color:var(--f-muted)}
.goal .gwhy{background:linear-gradient(160deg,#fff 0,#f4f7ff 100%)}
.goal .gy{border-left:.45cqw solid var(--f-gold);padding:.2cqw 0 .2cqw 1.1cqw}
.goal .gy b{display:block;font:800 1.65cqw var(--display);color:var(--f-brand-dd);margin-bottom:.3cqw}
.goal .gy > span{display:block;font:600 1.55cqw/1.45 var(--body);color:var(--f-ink)}
.ph-goal .gl{font:800 18px/1.3 var(--display);color:var(--f-brand-dd)}
.ph-goal .gi{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.ph-goal .gi .ic{flex:none;font-size:22px;line-height:1.2}
.ph-goal .gi b,.ph-goal .gy b{display:block;font:800 15px/1.3 var(--display);color:var(--f-ink)}
.ph-goal .gi div > span,.ph-goal .gy > span{display:block;font:600 14px/1.45 var(--body);color:var(--f-muted)}
.ph-goal .gy{margin-top:10px;border-left:4px solid var(--f-gold);padding-left:10px}
/* THE GOAL PAGE, round 3 (note 61, 2026-10-09): something to look forward to, not a wall of text. A short headline, the
   three skills as stops on a route (an empty outline that fills in, one per click), and "why" as a band of two cards
   with a picture or an icon. Avoided on purpose: cream panels, numbered 01/02/03 labels, long paragraphs side by side. */
.goal.g2{gap:1.5cqw}
.g2 .ghero{display:flex;flex-direction:column;gap:.45cqw}
.g2 .gl{font:800 3.5cqw/1.08 var(--display);max-width:84cqw}
.g2 .gsub{margin:0;font:600 1.75cqw/1.35 var(--body);color:var(--f-muted);max-width:72cqw;text-wrap:balance}
.g2 h3{margin:0 0 .8cqw;font:800 1.05cqw var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--f-muted)}
.g2 .gstops{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:1.8cqw;position:relative;align-items:start}
.g2 .gstops::before{content:"";position:absolute;left:12%;right:12%;top:4.1cqw;border-top:.28cqw dashed #b3c2e4;z-index:0}
.g2 .gstop{display:grid;position:relative;z-index:1}
.g2 .gstop > *{grid-area:1/1}
.g2 .gghost{display:flex;justify-content:center;padding-top:1.3cqw}
.g2 .gin{background:#fff;border-radius:1.8cqw;box-shadow:0 .9cqw 2.4cqw rgba(14,36,86,.12);padding:1.3cqw 1.5cqw 1.4cqw;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.55cqw}
.g2 .gdisc{width:5.6cqw;height:5.6cqw;border-radius:50%;display:grid;place-items:center;font-size:2.7cqw;line-height:1;background:#fff;border:.3cqw solid var(--f-gold);box-shadow:0 .5cqw 1.3cqw rgba(224,161,46,.28)}
.g2 .gin .gdisc{margin-top:-.1cqw}
.g2 .gghost .gdisc{background:rgba(255,255,255,.5);border:.24cqw dashed #a3b4dc;box-shadow:none;filter:grayscale(1);opacity:.45}
.g2 .gin b{display:block;font:800 1.8cqw/1.18 var(--display);color:var(--f-ink);text-wrap:balance}
.g2 .gtx{display:block;font:600 1.4cqw/1.38 var(--body);color:var(--f-muted);text-wrap:balance}
.g2 .gtx.faded{display:none}
.g2 .gys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.8cqw}
.g2 .gy2{background:#fff;border-radius:1.6cqw;box-shadow:0 .7cqw 1.9cqw rgba(20,33,50,.08);padding:1cqw 1.4cqw 1cqw 1cqw;display:flex;gap:1.2cqw;align-items:center;border-left:.5cqw solid var(--f-gold)}
.g2 .gy2 b{display:block;font:800 1.5cqw/1.2 var(--display);color:var(--f-brand-dd);margin-bottom:.25cqw}
.g2 .gy2 div > span{display:block;font:600 1.38cqw/1.4 var(--body);color:var(--f-ink)}
.g2 .gyi{flex:none;width:5.6cqw;height:5.6cqw;border-radius:1.4cqw;display:grid;place-items:center;font-size:2.8cqw;background:#e8eefc}
.g2 .gpics{display:flex;gap:.6cqw;flex:none}
.g2 .gpics figure{margin:0;width:8.6cqw}
.g2 .gpics img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:1cqw;box-shadow:0 .4cqw 1cqw rgba(14,36,86,.16)}
.g2 .gpics figcaption{margin-top:.3cqw;font:800 .85cqw var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--f-muted);text-align:center}
.ph-goal .gsub{margin:4px 0 0;font:600 14px/1.4 var(--body);color:var(--f-muted)}

/* ANSWER A DOUBT WITH BECAUSE: one doubt at a time (all in one grid cell), the answer as claim → because → reason */
.bcz{flex:1;min-height:0;display:grid}
.bcz-it{grid-area:1/1;display:flex;flex-direction:column;gap:1.3cqw;min-height:0}
.bcz-n{align-self:flex-start;font:800 1.05cqw var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--f-muted)}
.bcz-doubt{display:flex;gap:1.2cqw;align-items:center}
.bcz-doubt .av{flex:none;width:5cqw;height:5cqw;border-radius:50%;overflow:hidden;background:#d7deea;color:#9aa6ba;display:grid;place-items:center;box-shadow:0 .4cqw 1cqw rgba(20,33,50,.15)}
.bcz-doubt .av .face{display:block;width:100%;height:100%;background-repeat:no-repeat}
.bcz-doubt .av .sil{width:80%;height:80%}
.bcz-doubt > div{position:relative;background:#fff;border-radius:2cqw;padding:1.2cqw 2cqw;box-shadow:0 .8cqw 2.4cqw rgba(20,33,50,.12)}
.bcz-doubt > div::before{content:"";position:absolute;left:-1.1cqw;top:50%;margin-top:-1cqw;border:1cqw solid transparent;border-right:1.2cqw solid #fff;border-left:0}
.bcz-doubt small{display:block;font:800 1.05cqw var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--f-muted)}
.bcz-doubt p{margin:0;font:800 2.7cqw/1.2 var(--display);color:var(--f-ink)}
.bcz-ans{display:flex;flex-direction:column;align-items:stretch;gap:.7cqw;margin-left:6.2cqw}
.bcz-claim,.bcz-why{border-radius:1.4cqw;padding:1cqw 1.6cqw;font:700 1.85cqw/1.35 var(--body)}
.bcz-claim{background:#fff;color:var(--f-ink);box-shadow:0 .5cqw 1.4cqw rgba(20,33,50,.08)}
.bcz-why{background:var(--ok-soft);color:#14513b;box-shadow:0 .5cqw 1.4cqw rgba(20,80,59,.1)}
.bcz-bec{align-self:center;display:flex;align-items:center;gap:1cqw;font:800 2.3cqw var(--display);letter-spacing:.04em;color:#2a1c00;background:linear-gradient(90deg,var(--f-gold),#f2c768);border-radius:99cqw;padding:.5cqw 2.4cqw;box-shadow:0 .5cqw 1.6cqw rgba(224,161,46,.45)}
.bcz-bec i{display:block;width:1.2cqw;height:1.2cqw;border-right:.35cqw solid #2a1c00;border-bottom:.35cqw solid #2a1c00;transform:rotate(45deg) translate(-.2cqw,-.2cqw)}

/* HINTS on a card laid over the bottom of a phone column (warm-up reveal): labelled groups of short points */
.col.dev > .hint{position:absolute;z-index:7;left:50%;bottom:.4cqw;width:min(100%,25cqw);transform:translateX(-50%);background:#fff;border-radius:1.4cqw;padding:.8cqw 1.2cqw;
  box-shadow:0 1cqw 2.6cqw rgba(20,33,50,.2);border-top:.6cqw solid var(--f-brand);display:flex;flex-direction:column;gap:.4cqw}
.hint.bad{border-top-color:var(--bad)}
.hint.ok{border-top-color:var(--ok)}
.hint .hg b{display:inline-block;font:800 .95cqw var(--display);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--f-brand);border-radius:.6cqw;padding:.2cqw .7cqw;margin-bottom:.3cqw}
.hint.bad .hg:first-child b{background:var(--bad)}
.hint.ok .hg:first-child b{background:var(--ok)}
.hint ul.pts{margin:0;font:700 1.25cqw/1.35 var(--body);color:var(--f-ink)}
.col.dev:has(> .hint) .stamp{top:28%}
.tcard.nofaces{justify-content:flex-start}
.tcard.nofaces .top{padding-bottom:1cqw}

/* WHAT THE LISTENER GETS (summary): what you say → the listener's words, one row per skill */
.eff{flex:1;min-height:0;display:flex;flex-direction:column;gap:.9cqw}
.eff-h{display:grid;grid-template-columns:minmax(0,1fr) 3cqw minmax(0,1.15fr);gap:1cqw;font:800 1.05cqw var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--f-muted)}
.eff-r{display:grid;grid-template-columns:minmax(0,1fr) 3cqw minmax(0,1.15fr);gap:1cqw;align-items:center}
.eff-you{display:flex;gap:1cqw;align-items:center;background:#fff;border-radius:1.4cqw;padding:.8cqw 1.2cqw;box-shadow:0 .5cqw 1.4cqw rgba(20,33,50,.08);font:700 1.5cqw/1.3 var(--body);color:var(--f-ink);min-height:100%}
.eff-you .ic{flex:none;width:3.2cqw;height:3.2cqw;border-radius:.9cqw;background:var(--f-gold-soft);display:grid;place-items:center;font-size:1.8cqw;line-height:1}
.eff-ar{font:800 2.2cqw var(--display);color:var(--f-gold);text-align:center}
.eff-they{display:flex;gap:1cqw;align-items:center}
.eff-they .av{flex:none;width:3.6cqw;height:3.6cqw;border-radius:50%;overflow:hidden;background:#d7deea;color:#9aa6ba;display:grid;place-items:center}
.eff-they .av .face{display:block;width:100%;height:100%;background-repeat:no-repeat}
.eff-they .av .sil{width:80%;height:80%}
.eff-they > div{flex:1;background:var(--ok-soft);border-radius:1.4cqw;padding:.7cqw 1.2cqw;font:700 1.5cqw/1.3 var(--body);color:#14513b}
.eff-they small{display:block;font:800 .95cqw var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--f-muted)}
.eff-r.bad .eff-you{background:#f1f3f7;color:var(--f-muted)}
.eff-r.bad .eff-ar{color:#a7b0c0}
.eff-r.bad .eff-they > div{background:#f1f3f7;color:var(--f-muted)}
.tcards:has(> .tcard.nofaces){flex:none}
.ph-card .ph-tabs{background:#e9eef8}
.ph-card .ph-tabs button{font-size:15px;padding:10px 8px}
.dolist.big > div{font-size:1.75cqw;padding:1.4cqw 1.8cqw}
.dolist.big > div b{font-size:2.2cqw}
.dolist.big{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4cqw}
.kit .nchips{display:flex;flex-wrap:wrap;gap:.4cqw;align-items:center}
.kit .nchips > b{font:800 .95cqw var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--f-muted);margin-right:.2cqw}
.kit .nchip{background:#fff;border:.12cqw solid var(--f-line);border-radius:.7cqw;padding:.15cqw .7cqw;font-weight:700;line-height:1.35}
.bcz-msg{align-self:flex-start;margin-left:6.2cqw;max-width:44cqw;background:#e9f6ee;border-radius:1.2cqw;padding:.7cqw 1.2cqw;border-left:.45cqw solid #1a7f64;box-shadow:0 .4cqw 1.2cqw rgba(20,33,50,.08)}
.bcz-msg small{display:block;font:800 .95cqw var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--f-muted)}
.bcz-msg p{margin:.15cqw 0 0;font:600 1.35cqw/1.35 var(--body);color:var(--f-ink)}
.kit .nchip{font-size:1.1cqw}

/* ======================= FROSTED POP-UPS + TEXT FOLLOWS THE VOICE · lesson `popups: "glass"` (2026-10-08) =======================
   Marco's notes 58–60: every card that pops over the stage (the transcript, the meaning card, the magnifier, the tip
   and the legend) takes the glass pair's material — translucent white, what is behind it blurred and a little more
   saturated, a light white rim, a soft shadow — instead of a flat white panel. Text contrast: the glass keeps at least
   ~62% white over a dark navy card behind it, so the ink stays above 6:1 on anything the stage puts there.
   Only lessons with `popups: "glass"` get it (core.js sets html.ep-glass); the rest are unchanged until he says so. */
.ep-glass .tscript,.ep-glass .gloss,.ep-glass .readout,.ep-glass .pop{
  background:linear-gradient(160deg,rgba(255,255,255,.80),rgba(244,248,255,.62));
  -webkit-backdrop-filter:blur(2cqw) saturate(1.6);backdrop-filter:blur(2cqw) saturate(1.6);
  border:.12cqw solid rgba(255,255,255,.78);
  box-shadow:inset 0 .14cqw 0 rgba(255,255,255,.95),inset 0 -.12cqw 0 rgba(255,255,255,.4),0 1.4cqw 3.6cqw rgba(14,36,86,.22),0 .2cqw .6cqw rgba(14,36,86,.08)}
.ep-glass .readout small,.ep-glass .tscript h4{color:#4a566b}
.ep-glass .tscript .tsplay{background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 .1cqw rgba(255,255,255,.8)}
/* on the learner's phone: the meaning card is a glass sheet, the magnifier a frosted veil over the page */
.ep-glass .gloss.sheet,.ep-glass .gloss.in-frame{-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border-width:1px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 14px 36px rgba(14,36,86,.25),0 2px 6px rgba(14,36,86,.08)}
.ep-glass .ph-zoom{background:rgba(236,241,252,.58);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);color:#16202e}
.ep-glass .ph-zoom small{color:#4a566b}
.ep-glass .ph-zoom .zt ul.pts li::before{background:var(--f-gold)}
.ep-glass .ph-zoom .x{background:rgba(255,255,255,.7);color:#16202e;box-shadow:0 2px 8px rgba(14,36,86,.15)}
.ep-glass .ph-zoom .wch,.ep-glass .ph-zoom .gw{text-decoration-color:inherit}
.mo.ep-glass .readout:not([hidden]),.mo.ep-glass .pop:not([hidden]){animation:ep-arrive .32s cubic-bezier(.2,.8,.3,1) both}

/* the text follows the voice: the line being heard is lit (a gold edge on a pale gold wash), the word being heard
   has a soft gold mark, like the e-learning explainer cards. Colours stay with Motion off; only the fades go. */
.ep-glass .tl.follow{margin-left:-.6cqw;margin-right:-.6cqw;padding:.35cqw .6cqw;border-radius:1cqw}
.ep-glass .ph-tscript .tl.follow{margin:6px -8px 0;padding:5px 8px;border-radius:12px}
.ep-glass .tl.fnow{background:linear-gradient(90deg,rgba(255,238,196,.82),rgba(255,255,255,.55));box-shadow:inset .3cqw 0 0 #e0a12e,0 .3cqw .9cqw rgba(14,36,86,.08)}
.ep-glass .ph-tscript .tl.fnow{box-shadow:inset 3px 0 0 #e0a12e}
.ep-glass .tl .fw{border-radius:.3em}
.ep-glass .tl .fw.fon{background:#ffe7a8;box-shadow:0 0 0 .12em #ffe7a8;color:#16202e}
.mo.ep-glass .tl.follow{transition:background-color .25s,box-shadow .25s}
.mo.ep-glass .tl .fw{transition:background-color .12s,box-shadow .12s}
/* the transcript's title and player stay put; only its lines scroll (by hand, or by themselves as the voice goes on) */
.ep-glass .tscript{display:flex;flex-direction:column;overflow:hidden}
.ep-glass .tscript > h4,.ep-glass .tscript > .tsplay{flex:none}
.ep-glass .tscript .tsbody{flex:1 1 auto;min-height:0;overflow:auto;margin:-.6cqw -1cqw 0;padding:.6cqw 1cqw 0;scrollbar-width:thin;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 .6cqw,#000 calc(100% - 1.6cqw),transparent);mask-image:linear-gradient(180deg,transparent,#000 .6cqw,#000 calc(100% - 1.6cqw),transparent)}
.ep-glass .tscript .tsbody .tl:last-child{margin-bottom:1.2cqw}

/* ---------- ROUND 3 (2026-10-09): blocks for the curriculum lead's sketches (E10 screens 7, 8, 12) ----------
   Her content and layout, our craft. Avoided on purpose: cream panels (white cards on the blue canvas instead), italic
   accent words, numbered 01/02/03 labels (a plain gold numeral square), pill-shaped buttons. */
/* a column whose hidden blocks take no room (`swap: true`): one block takes another's place */
.col.swap > [data-at].pre{display:none}
/* row: blocks side by side inside a column */
.brow{display:grid;gap:1.4cqw;align-items:stretch;min-height:0;flex:none}
.brow.top{align-items:start}
.bcol{display:flex;flex-direction:column;gap:.8cqw;min-width:0;min-height:0}
/* panel: one side of a case study */
.panel{background:#fff;border-radius:1.8cqw;box-shadow:0 .9cqw 2.4cqw rgba(14,36,86,.10);padding:1cqw 1.4cqw 1.1cqw;display:flex;flex-direction:column;gap:.6cqw;min-width:0;height:100%}
.panel .plabel{align-self:flex-start;font:800 .95cqw var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--f-brand);background:#e6edfb;border-radius:.7cqw;padding:.35cqw .8cqw}
.panel.later .plabel{background:#fdecd6;color:#8a4f08}
.panel h3{margin:0;font:800 1.5cqw/1.2 var(--display);color:var(--f-brand-dd)}
.panel .scene.has-img img{border-radius:1.2cqw}
/* a chat bubble that is the message being discussed */
.sb.hl{background:#fff;border:.18cqw solid #f0cf8c;border-left:.6cqw solid var(--f-gold);font:700 1.55cqw/1.3 var(--display);color:var(--f-ink);box-shadow:0 .6cqw 1.6cqw rgba(224,161,46,.16)}
.schat.compact{gap:.5cqw}
.schat.compact .sb{padding:.5cqw .9cqw;align-items:center;box-shadow:none;background:#f3f6fc;border-radius:1cqw;font-size:1.3cqw}
.schat.compact .sb .av{width:2.4cqw;height:2.4cqw}
.schat.compact .sb > div{display:flex;align-items:baseline;gap:1cqw}
.schat.compact .sb small{margin:0;min-width:9cqw}
/* a quoted message */
.bquote{background:#fff;border:.15cqw solid #d9e2f3;border-radius:1.3cqw;padding:.9cqw 1.2cqw;display:flex;flex-direction:column;gap:.4cqw}
.bquote small{font:600 1.15cqw/1.35 var(--body);color:var(--f-muted)}
.bquote p{margin:0;font:800 1.75cqw/1.25 var(--display);color:var(--f-ink)}
/* banner: a line that frames the page */
.banner{background:var(--f-brand-dd);color:#fff;border-radius:1.2cqw;padding:.75cqw 1.6cqw;font:700 1.45cqw/1.35 var(--body);text-align:center;flex:none}
.banner.small{font-size:1.25cqw;padding:.65cqw 1.1cqw;border-radius:1cqw}
.banner .wch,.banner .gw{text-decoration-color:rgba(255,255,255,.6)}
/* note tones: a short alarm line, a question in plain ink, a small caption */
.note.alert{align-self:flex-start;background:var(--bad-soft);color:var(--bad);font:800 1.3cqw/1.3 var(--body);padding:.5cqw 1.1cqw;border-radius:.9cqw}
.note.ask{background:transparent;padding:0;color:var(--f-ink);font:600 1.5cqw/1.38 var(--body)}
.note.label{background:transparent;padding:0;color:var(--f-muted);font:800 1cqw var(--body);letter-spacing:.08em;text-transform:uppercase}
/* think first: a question with prompt chips */
.prompts{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,3fr);gap:1.4cqw;align-items:center;background:#fff;border-radius:1.6cqw;padding:.9cqw 1.3cqw;box-shadow:0 .7cqw 1.8cqw rgba(20,33,50,.08);flex:none}
.prq small{display:block;font:800 .95cqw var(--body);letter-spacing:.1em;text-transform:uppercase;color:#a06a10}
.prq b{display:block;font:800 1.6cqw/1.2 var(--display);color:var(--f-brand-dd)}
.prchips{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:.8cqw}
.prchip{background:#eef3fd;border-radius:1.1cqw;padding:.6cqw .8cqw;text-align:center;display:flex;flex-direction:column;gap:.2cqw;justify-content:center}
.prchip:first-child{background:#fdf1df}
.prchip b{font:800 1.3cqw/1.2 var(--display);color:var(--f-brand-dd)}
.prchip > span{font:600 1.02cqw/1.3 var(--body);color:var(--f-muted)}
/* numbered steps of an activity */
.bsteps{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:1.4cqw;flex:none;align-items:stretch}
.bstep{background:#fff;border-radius:1.6cqw;box-shadow:0 .8cqw 2cqw rgba(20,33,50,.08);padding:1.1cqw 1.3cqw 1.2cqw;display:flex;flex-direction:column;gap:.55cqw;min-width:0}
.bstep.dark{background:linear-gradient(160deg,var(--f-brand),var(--f-brand-dd));color:#fff;box-shadow:0 1cqw 2.6cqw rgba(13,34,83,.3)}
.bsh{display:flex;align-items:center;gap:.8cqw}
.bsn{flex:none;width:2.6cqw;height:2.6cqw;border-radius:.6cqw;background:var(--f-gold);color:#fff;display:grid;place-items:center;font:800 1.5cqw var(--display)}
.bst{font:800 1.05cqw var(--body);letter-spacing:.1em;text-transform:uppercase;color:#b9770e}
.bstep.dark .bst{color:var(--f-gold)}
.bshead{margin:0;font:800 1.5cqw/1.25 var(--display);color:var(--f-brand-dd)}
.bstep.dark .bshead{color:#fff;font-size:1.85cqw}
.bstx{font:600 1.25cqw/1.38 var(--body);color:var(--f-ink)}
.bstep.dark .bstx{color:#e6ecfa}
.bstx p,.bstx ul{margin:0}
.sboxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6cqw}
.sbox{border-radius:.9cqw;padding:.5cqw .6cqw;text-align:center;background:color-mix(in srgb,var(--c) 12%,#fff);border-top:.3cqw solid var(--c)}
.sbox b{display:block;font:800 .9cqw var(--body);letter-spacing:.08em;color:var(--c)}
.sbox span{display:block;font:600 1.05cqw/1.25 var(--body);color:var(--f-ink)}
.sbox:last-child{border-top-style:dashed}
.pts.gdots{list-style:none;margin:0;padding:0;display:grid;gap:.35cqw;font:700 1.25cqw/1.3 var(--body)}
.pts.gdots li{display:flex;gap:.6cqw;align-items:baseline}
.pts.gdots li::before{content:"";flex:none;width:.75cqw;height:.75cqw;border-radius:50%;background:var(--f-gold);transform:translateY(-.1cqw)}
.bschip{align-self:flex-start;background:rgba(255,255,255,.14);border:.12cqw solid rgba(255,255,255,.35);color:#fff;border-radius:.8cqw;padding:.35cqw .8cqw;font:700 1.05cqw var(--body)}
.bsfoot{margin:auto 0 0;font:600 1.1cqw/1.3 var(--body);color:var(--f-muted);text-align:center}
.bstep:not(.dark) .bsfoot.hl,.bsfoot b{color:var(--f-ink)}
/* task cards: the kind as a coloured label */
.tcard .letter.kind{align-self:flex-start;display:inline-block;background:var(--f-brand);color:#fff;border-radius:.5cqw;padding:.25cqw .6cqw;font-size:.85cqw}
.tcard .letter.kind.k-daily-life{background:var(--f-gold);color:#fff}
.tcards.many .tcard .top > div{display:flex;flex-direction:column;align-items:flex-start;gap:.35cqw}
/* compare: what happened next, under each side */
.cmp .cres{border-radius:1cqw;padding:.55cqw 1cqw;font:800 1.25cqw/1.3 var(--body)}
.cmp .cres.bad{background:var(--bad-soft);color:var(--bad)}
.cmp .cres.ok{background:var(--ok-soft);color:var(--ok)}
/* compare, stacked: Before above After in a narrow column; each side's reactions sit in a row */
.cmp.stack{gap:1cqw}
.cmp.stack .ccol{display:grid;grid-template-columns:minmax(0,1fr);gap:.6cqw}
.cmp.stack .bef{color:var(--f-ink);background:#f6f7fa;box-shadow:none;border:.15cqw solid #e1e5ee;padding:.9cqw 1.2cqw}
.cmp.stack .bef .lb{color:#8a93a3}
.cmp.stack .bef p{font:700 1.5cqw/1.3 var(--display);color:#4d5666}
.cmp.stack .aft{padding:.9cqw 1.2cqw}
.cmp.stack .aft .lb{color:#9a6510}
.cmp.stack .atx{font-size:1.3cqw}
.cmp.stack .creact{grid-template-columns:repeat(2,minmax(0,1fr));gap:.6cqw}
.cmp.stack .creact .sb{padding:.5cqw .8cqw;font-size:1.22cqw;margin:0}
.cmp.stack .creact .sb .av{width:2.4cqw;height:2.4cqw}
/* the phone's listener questions */
.ph-lq{margin:6px 0 0;padding-left:20px;font:700 15px/1.5 var(--body);color:var(--f-ink)}
.st-hd h2.s{font-size:2.2cqw;text-wrap:nowrap}
.schat.compact.row{grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr)}
.schat.compact.row .sb small{min-width:0}
.schat.compact.row .sb > div{flex-direction:column;gap:0}
.panel .ptop{display:flex;align-items:center;gap:1cqw;flex-wrap:wrap}
.prompts{padding:.75cqw 1.3cqw}
.sb.hl small{display:none}
.cmp.plain .ccol:first-child .bef{background:#f6f7fa;border:.15cqw solid #e1e5ee;box-shadow:none}
.cmp .creact.row2{grid-template-columns:repeat(2,minmax(0,1fr))}
.sb.hl{font-size:1.45cqw;padding:.7cqw 1cqw}
.banner.small{padding:.55cqw 1cqw}
.panel{gap:.45cqw}
.prq b{font-size:1.45cqw}
.bstep{padding:1cqw 1.2cqw 1cqw;gap:.45cqw}
.bshead{font-size:1.4cqw}
.sbox{padding:.4cqw .5cqw}
.banner{padding:.6cqw 1.6cqw}
.tcard.nofaces .top{padding-bottom:.8cqw}
.col:has(> .brow){gap:.9cqw}
/* Before / After labels: the word as a tag, the context small beside it (note 65: the contrast must be unmistakable) */
.cmp.plain .lb{display:flex;align-items:center;gap:.7cqw;flex-wrap:wrap}
.cmp.plain .lb .lbw{font:800 1.2cqw var(--display);letter-spacing:.06em;color:#fff;background:#8a93a3;border-radius:.6cqw;padding:.3cqw .8cqw}
.cmp.plain .aft .lb .lbw{background:var(--f-gold)}
.g2 .gl.long{font-size:2.9cqw}
.bstx,.bshead{text-wrap:pretty}
.col:has(> .brow){gap:.7cqw}
.panel{padding:.9cqw 1.4cqw .9cqw}
.prompts{padding:.6cqw 1.3cqw}
/* keep the old label heights so no other episode's screen grows (the tags are drawn inside the old line box) */
.cmp.plain .lb .lbw{font-size:1.05cqw;line-height:1;padding:.15cqw .6cqw}
.tcard .letter.kind{padding:.1cqw .55cqw;line-height:1.25}
/* ---------- round 4 (2026-10-10, notes 68–74) ---------- */
/* prompts, questions first: the question shows, a "?" holds the answer's place until the teacher reveals it (note 68) */
.prompts.qfirst .prchip{background:#eef3fd;gap:.45cqw;padding:.7cqw .8cqw}
.prompts.qfirst .prchip:first-child{background:#eef3fd}
.prqq{font:700 1.25cqw/1.3 var(--body);color:var(--f-ink);text-wrap:balance}
.pra{display:grid;justify-items:center}
.pra > *{grid-area:1/1}
.prghost{font:800 1.3cqw/1.5 var(--display);font-style:normal;color:#a3b4dc;border:.18cqw dashed #a3b4dc;border-radius:99cqw;padding:0 1.2cqw}
.pra b{font:800 1.3cqw/1.5 var(--display);color:#fff;background:var(--f-brand-dd);border-radius:99cqw;padding:0 1cqw}
/* the elaboration tool (note 70) */
.bcz.bctool .bcz-it{gap:.8cqw}
.bcz.bctool .bcz-n{color:var(--f-brand);background:#e6edfb;border-radius:.7cqw;padding:.3cqw .8cqw;font-size:.95cqw}
.bcz.bctool .bcz-doubt .av{width:4.2cqw;height:4.2cqw}
.bcz.bctool .bcz-doubt p{font-size:2.4cqw}
.bcz.bctool .bcz-doubt > div{padding:.9cqw 1.8cqw}
.bct-ask{margin:0 0 0 5.4cqw;font:700 1.5cqw/1.3 var(--body);font-style:italic;color:#5a6680}
.bct{display:flex;flex-direction:column;gap:.5cqw}
.bct-h{display:flex;align-items:baseline;gap:1cqw;flex-wrap:wrap}
.bct-h small{font:800 .95cqw var(--body);letter-spacing:.1em;text-transform:uppercase;color:#8a5a08;background:var(--f-gold-soft);border-radius:.7cqw;padding:.3cqw .8cqw}
.bct-h b{font:800 1.75cqw var(--display);color:var(--f-brand-dd)}
.bct-h b .lk,.bct-h b em{color:#c88a12;font-style:normal}
.bct-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.15fr);gap:.9cqw;align-items:stretch}
.bct-box{border-radius:1.2cqw;padding:.6cqw 1.1cqw;display:flex;flex-direction:column;gap:.2cqw;min-height:5.2cqw}
.bct-box.pt{background:#fff;border:.15cqw solid #d9e2f3}
.bct-box.rs{background:var(--ok-soft);border:.15cqw solid #bfe3d2}
.bct-box small{font:800 .9cqw var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--f-muted)}
.bct-v{display:grid;align-items:center;flex:1}
.bct-v > *{grid-area:1/1}
.bct-v > span{font:700 1.5cqw/1.3 var(--body);color:var(--f-ink)}
.bct-box.rs .bct-v > span{color:#14513b}
.bct-q{font:800 1.8cqw var(--display);font-style:normal;color:#a3b4dc}
.bct-bec{align-self:center;font:800 1.8cqw var(--display);color:#2a1c00;background:linear-gradient(90deg,var(--f-gold),#f2c768);border-radius:1.1cqw;padding:.9cqw 1.4cqw;box-shadow:0 .5cqw 1.4cqw rgba(224,161,46,.4)}
.bct-slot{display:grid}
.bct-slot > *{grid-area:1/1}
.bct-st{display:flex;flex-wrap:wrap;gap:.5cqw;align-items:center;align-content:center;border:.15cqw dashed #b3c2e4;border-radius:1.2cqw;padding:.6cqw 1cqw}
.bct-st small,.bct-full small{font:800 .9cqw var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--f-muted);margin-right:.4cqw}
.bct-st > span{font:600 1.2cqw/1.3 var(--body);color:var(--f-ink);background:#fff;border-radius:.8cqw;padding:.3cqw .8cqw;box-shadow:0 .2cqw .6cqw rgba(20,33,50,.08)}
.bct-full{background:var(--f-brand-dd);border-radius:1.2cqw;padding:.7cqw 1.4cqw}
.bct-full small{color:#b9c8ea}
.bct-full p{margin:.15cqw 0 0;font:800 1.7cqw/1.3 var(--display);color:#fff}
.bct-full .gw,.bct-full .wch{text-decoration-color:rgba(255,255,255,.6)}
/* banner with a label word (her footers) */
.banner.lbd{display:flex;align-items:center;gap:1.4cqw;text-align:left}
.banner .bnl{flex:none;font:800 .95cqw var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--f-gold)}
/* result line, chips, labelled rows, a person, before / after panels */
.bres{align-self:center;border-radius:99cqw;padding:.4cqw 1.4cqw;font:800 1.15cqw/1.3 var(--body);text-align:center}
.bres.bad{background:var(--bad-soft);color:var(--bad)}
.bres.ok{background:var(--ok-soft);color:var(--ok)}
.bchips small{display:block;font:700 1.1cqw var(--body);color:var(--f-muted);margin-bottom:.35cqw}
.bchips > div{display:flex;gap:.6cqw;flex-wrap:wrap}
.bchip{display:inline-flex;gap:.4cqw;align-items:center;font:700 1.2cqw/1.25 var(--body);color:var(--f-ink);background:#eef1f6;border:.12cqw solid #dde3ee;border-radius:.9cqw;padding:.35cqw .8cqw}
.bchip.bad{background:var(--bad-soft);border-color:#f3c9d1;color:var(--bad)}
.bchip i{font-style:normal}
.lrows{display:flex;flex-direction:column;gap:.55cqw}
.lrow{display:grid;grid-template-columns:10.5cqw minmax(0,1fr);gap:1cqw;align-items:center;background:color-mix(in srgb,var(--c) 7%,#fff);border:.12cqw solid color-mix(in srgb,var(--c) 25%,#fff);border-radius:1.1cqw;padding:.55cqw .9cqw}
.lrl{font:800 .9cqw/1.2 var(--body);letter-spacing:.07em;text-transform:uppercase;color:#fff;background:var(--c);border-radius:.6cqw;padding:.4cqw .5cqw;text-align:center}
.lrt{font:700 1.3cqw/1.32 var(--body);color:var(--f-ink)}
.bperson{display:flex;gap:1cqw;align-items:center;background:#fff;border-radius:1.3cqw;padding:.7cqw 1cqw;box-shadow:0 .5cqw 1.4cqw rgba(20,33,50,.08)}
.bperson .av{flex:none;width:4.4cqw;height:4.4cqw;border-radius:50%;overflow:hidden;background:#d7deea;display:grid;place-items:center}
.bperson .av .face{display:block;width:100%;height:100%;background-repeat:no-repeat}
.bperson b{display:block;font:800 1.2cqw var(--display);color:var(--f-brand-dd)}
.bperson > div > span{font:600 1.2cqw/1.3 var(--body);color:var(--f-ink)}
.panel.before{background:#f6f7fa;box-shadow:none;border:.15cqw solid #e1e5ee}
.panel.before .plabel{background:#8a93a3;color:#fff}
.panel.after{border-left:.5cqw solid var(--f-gold)}
.panel.after .plabel{background:var(--f-gold);color:#2a1c00}
.panel.before h3,.panel.after h3{font-size:1.25cqw;color:var(--f-muted)}
/* a toolkit: what the learner now has (E10 screen 14) */
.tkit{background:#fff;border-radius:1.6cqw;padding:.8cqw 1.1cqw;box-shadow:0 .7cqw 1.8cqw rgba(20,33,50,.08);display:flex;flex-direction:column;gap:.5cqw;flex:none}
.tkit h3{margin:0;font:800 .95cqw var(--body);letter-spacing:.1em;text-transform:uppercase;color:#a06a10}
.tkrow{display:grid;gap:.8cqw}
.tkc{background:#f4f7fd;border-radius:1.1cqw;padding:.55cqw .8cqw;display:flex;flex-direction:column;gap:.4cqw;min-width:0}

<script>
// Episode lessons · shared core (every page): content helpers, rich text, steps, audio, storage, sync,
// and the iPhone frame. Adds window.EP. Reads window.LESSON (the content file), window.AUDIO (recorded
// lines, from build.py) and window.EP_ASSETS (cast poses and scene pictures copied next to the pages).
(function () {
  var L = window.LESSON;
  var EP = (window.EP = { L: L });
  var ASSETS = window.EP_ASSETS || {};

  EP.esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  // ---------- words in the text ----------
  // Every word-wall word in visible text becomes a small gold chip (.wch, data-w = word id, data-g = glossary key);
  // every other glossary word becomes tappable (.gw, dotted underline). Forms come from words[].forms and
  // glossary[key].forms, so "fell for" finds "fall for".
  var FORM = {}, formList = [];
  function fkey(f) { return EP.esc(f).toLowerCase(); }
  (L.words || []).forEach(function (w) { (w.forms || [w.word]).forEach(function (f) { FORM[fkey(f)] = { w: w.id, g: w.word.toLowerCase() }; }); });
  Object.keys(L.glossary || {}).forEach(function (k) {
    var g = L.glossary[k];
    if ((L.words || []).some(function (w) { return w.word.toLowerCase() === k; })) return;
    (g.forms || [k]).forEach(function (f) { if (!FORM[fkey(f)]) FORM[fkey(f)] = { g: k }; });
  });
  formList = Object.keys(FORM).sort(function (a, b) { return b.length - a.length; });
  var WORD_RE = formList.length ? new RegExp("(^|[^A-Za-z])(" + formList.map(function (f) { return f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")(?![A-Za-z])", "gi") : null;
  function chip(text, hit) {
    if (hit.w) return '<span class="wch" data-w="' + hit.w + '" data-g="' + EP.esc(hit.g) + '" tabindex="0" role="button">' + text + "</span>";
    return '<span class="gw" data-g="' + EP.esc(hit.g) + '" tabindex="0" role="button">' + text + "</span>";
  }
  function markWords(html) {
    if (!WORD_RE) return html;
    var inside = 0;
    return html.split(/(<[^>]+>)/).map(function (part) {
      if (part.charAt(0) === "<") {
        if (/^<span class="(wch|gw)"/.test(part)) inside = 1;
        else if (inside && part === "</span>") inside = 0;
        return part;
      }
      if (inside) return part;
      return part.replace(WORD_RE, function (m, pre, word) { var hit = FORM[word.toLowerCase()]; return hit ? pre + chip(word, hit) : m; });
    }).join("");
  }
  // Content mark-up, applied after escaping:
  //   *starter phrase*   _linking word_   [word-wall word]   {wrong word}   ^corrected word^   a new line (\n)
  // Then every word-wall and glossary word is marked (opts.words === false to skip).
  // POINTS AS LISTS: a line that starts with "- " or "• " is one bullet point (one point per line); a run of them
  // becomes a list. A list of strings (`text: ["…", "…"]`) is drawn the same way (EP.richBlock).
  function points(h) {
    if (!/(^|\n)\s*[-•]\s/.test(h)) return h.replace(/\n/g, "<br>");
    var out = [], ul = [];
    function flush() { if (ul.length) { out.push('<ul class="pts">' + ul.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>"); ul = []; } }
    h.split("\n").forEach(function (ln) {
      var m = ln.match(/^\s*[-•]\s+(.*)$/);
      if (m) ul.push(m[1]);
      else { flush(); out.push(ln + "<br>"); }
    });
    flush();
    return out.join("").replace(/<br>$/, "").replace(/<br>(<ul)/g, "$1");
  }
  EP.rich = function (s, opts) {
    var h = EP.esc(s)
      .replace(/\{([^}]+)\}/g, '<s class="bad">$1</s>')
      .replace(/\^([^^]+)\^/g, '<b class="good">$1</b>')
      .replace(/\*([^*]+)\*/g, '<b class="sp">$1</b>')
      .replace(/(^|[\s(“"])_([^_]+)_/g, '$1<u class="lk">$2</u>')
      .replace(/\[([^\]]+)\]/g, function (m, x) { var hit = FORM[x.toLowerCase()]; return hit ? chip(x, hit) : '<span class="hl">' + x + "</span>"; });
    h = points(h);
    return opts && opts.words === false ? h : markWords(h);
  };
  // text that may be one string or a list of points
  EP.richBlock = function (s, opts) {
    if (Array.isArray(s)) return '<ul class="pts">' + s.map(function (x) { return "<li>" + EP.rich(x, opts) + "</li>"; }).join("") + "</ul>";
    return EP.rich(s, opts);
  };
  // Facts that belong to no side (O02 review M-1): a one-sided task card's `facts: {for: [...], against: [...]}` (labels
  // `factLabels`, default ["➕ For", "➖ Against"]) draws two plain lists above the part prompts, so a learner who stands
  // "against" never reads a minus under REASON. The stage card and the phone show the same lists.
  EP.factsHTML = function (c) {
    var f = c && c.facts;
    if (!f) return "";
    var lab = c.factLabels || ["➕ For", "➖ Against"];
    return '<div class="tfacts">' + [f["for"] || [], f.against || []].map(function (list, k) {
      return list.length ? '<div class="tf"><b>' + EP.esc(lab[k]) + "</b>" + EP.richBlock(list) + "</div>" : "";
    }).join("") + "</div>";
  };
  EP.glossKey = function (key) { return (L.glossary || {})[key] ? key : null; };
  // Plain text (for the voice and for aria labels): marks removed
  EP.plain = function (s) { return String(s || "").replace(/[{}^*\[\]]/g, "").replace(/(^|\s)_([^_]+)_/g, "$1$2"); };

  // ---------- the formula's parts ----------
  // A lesson names its parts in `parts` (PPF: P, P2, F · OREO: O, R, E, O2). Every part has a colour family
  // (c1 strong, c2 lip, c3 soft) from PARTCOL; a tag the table does not know takes a neutral slate, so a new
  // formula or a stray key never breaks a screen. A tag missing from `parts` still gets a sensible name.
  var PARTCOL = {
    P: { c1: "#6b7fa3", c2: "#b9c4d8", c3: "#e8edf5", solid: "var(--past)" },
    P2: { c1: "#1f5fb8", c2: "#9cc0ee", c3: "#e4effc", solid: "var(--present)" },
    F: { c1: "#e0792e", c2: "#f3c39b", c3: "#fff1e4", solid: "var(--future)" },
    O: { c1: "#6a3fc4", c2: "#c6b5ef", c3: "#f0ebfc", solid: "var(--op)" },
    R: { c1: "#0d8578", c2: "#9edbd1", c3: "#e1f5f1", solid: "var(--rs)" },
    E: { c1: "#b0610c", c2: "#efcb8e", c3: "#fff3de", solid: "var(--ex)" },
    O2: { c1: "#4f2c9e", c2: "#b9a3ea", c3: "#ece5fb", solid: "var(--op2)" }
  };
  var NEUTRAL = { c1: "#4f5d75", c2: "#c3cad6", c3: "#eef1f5", solid: "#4f5d75" };
  // any other formula (Optional organisers such as S1–S4): a calm set by the part's place in `parts`

<script>
// Episode lessons · tap a word → its meaning in the learner's language (no machine translation: the meanings are
// written in the content's `glossary`, with zh and ms, and checked by native readers). EP.gloss.open(el) opens a
// small card next to a word (.wch / .gw on the stage or the phone, or a dock chip); Esc or a tap outside closes it.
// Language: EN / 中文 / BM. Stage default EN (the teacher switches); phone default from the browser language.
// Remembered per device: touch:ep:lang-stage, touch:ep:lang-phone.
(function () {
  var EP = window.EP, L = EP.L, esc = EP.esc;
  var SCOPE = window.EP_FX_SCOPE === "phone" ? "phone" : "stage";
  var LANGS = ["en", "zh", "ms"], LABEL = { en: "EN", zh: "中文", ms: "BM" };
  function defaultLang() {
    if (SCOPE !== "phone") return "en";

  }

  if (LANGS.indexOf(lang) < 0) lang = defaultLang();
  var card = null, anchor = null;

  function entry(key) {
    key = String(key || "").toLowerCase();
    var w = (L.words || []).filter(function (x) { return x.word.toLowerCase() === key; })[0];
    // every word-wall word opens a card, even before its glossary entry is written (English only until then)
    var g = (L.glossary || {})[key] || (w ? {} : null);
    if (!g) return null;
    return { word: w ? w.word : key, ipa: g.ipa || (w && /^\//.test(w.ipa) ? w.ipa : ""), en: g.en || (w ? w.meaning : ""), zh: g.zh, ms: g.ms, use: g.use || (w ? w.example : "") };
  }
  function body(e) {
    var main = lang === "en" ? e.en : e[lang];
    return '<button type="button" class="gx" aria-label="Close">×</button>' +
      '<p class="gh"><b>' + esc(e.word) + "</b>" + (e.ipa ? ' <span class="gipa">' + esc(e.ipa) + "</span>" : "") +
      EP.playTextBtn("Bella", e.word, "Say " + e.word, "gplay") + "</p>" +
      '<p class="gm" lang="' + (lang === "zh" ? "zh-Hans" : lang === "ms" ? "ms" : "en") + '">' + esc(main || e.en) + "</p>" +
      (lang !== "en" && e.en ? '<p class="gen">' + esc(e.en) + "</p>" : "") +
      (e.use ? '<p class="guse">“' + esc(e.use) + "”</p>" : "") +
      EP.gloss.seg("in-card");
  }
  function place() {
    if (!card || !anchor) return;
    var stage = anchor.closest(".ep-stage");
    if (stage) {
      var sr = stage.getBoundingClientRect(), ar = anchor.getBoundingClientRect(), dock = stage.querySelector(".dock");
      var limit = (dock ? dock.getBoundingClientRect().top : sr.bottom) - sr.top - sr.width * 0.008;
      var gap = sr.width * 0.008, w = card.offsetWidth, h = card.offsetHeight;
      var left = Math.min(Math.max(ar.left - sr.left + ar.width / 2 - w / 2, gap), sr.width - w - gap);
      var top = ar.top - sr.top - h - gap;                         // above the word

    lang: function () { return lang; },
    label: function () { return LABEL[lang]; },

    seg: function (cls) {
      var i = LANGS.indexOf(lang);
      return '<div class="seg3 ' + (cls || "") + '" role="radiogroup" aria-label="Meaning language" style="--i:' + i + '"><span class="thumb" aria-hidden="true"></span>' +
        LANGS.map(function (l, k) {
          return '<button type="button" role="radio" data-lang="' + l + '" aria-checked="' + (k === i) + '" tabindex="' + (k === i ? 0 : -1) + '"' + (l === "zh" ? ' lang="zh-Hans"' : "") + ">" + LABEL[l] + "</button>";
        }).join("") + "</div>";
    },
    paint: function () {
      var i = LANGS.indexOf(lang);
      document.querySelectorAll(".seg3").forEach(function (s) {
        s.style.setProperty("--i", i);
        s.querySelectorAll("[data-lang]").forEach(function (b, k) { b.setAttribute("aria-checked", k === i ? "true" : "false"); b.tabIndex = k === i ? 0 : -1; });

      lang = l;

    isOpen: function () { return !!card; },
    open: function (el) {

  }, true);

  document.addEventListener("click", function (e) {
    var w = e.target.closest && e.target.closest(".wch, .gw");
    if (w && !w.closest(".ep-stage.mounted")) { e.stopPropagation(); EP.gloss.open(w); }
  });
  window.addEventListener("resize", place);
})();

</script>
<script>
// Episode lessons · "✎ 提意见": a short note about the screen that is showing, sent to the platform.
// The address is feedback.json's endpoint (build.py → window.EP_NOTE_ENDPOINT). POST as text/plain (a simple
// request, no preflight) with {lesson, code, screen, step, kind, size, text, page}. Answers: 204 saved ·
// 400 bad note · 403 wrong origin · 404 switched off (the button hides for the session) · 413 too big ·
// 429 too many · 503 save failed. On any failure the text stays so it can be sent again. No names are asked.
// EP.note.mount(host, {page, where, jump}) puts the button in host; where() → {screen, step} (0-based screen);
// jump(screen, step), when given, moves this page to a screen without reloading.
// "My notes" (Marco 2026-10-03, A): a reviewer could not see a note once it was sent. Every note that is saved is
// also kept in THIS browser (localStorage, never sent anywhere else) and listed in the panel: this screen first,
// then the rest of this lesson, then other lessons; a tap goes to that screen. The button shows how many notes the
// screen already has. Another device or a cleared browser shows none; the notes themselves are safe on the platform.
(function () {
  var EP = window.EP, L = EP.L, esc = EP.esc;
  var URL_ = window.EP_NOTE_ENDPOINT || "";
  var OFF = "touch:ep:note-off";
  function off() { try { return sessionStorage.getItem(OFF) === "1"; } catch (e) { return false; } }
  var KINDS = [["problem", "问题"], ["suggestion", "建议"], ["idea", "教学点子"]];
  var SIZES = ["1", "2–4", "5–7", "8–12"];
  var MSG = {
    204: "已送出，谢谢。",
    400: "这条意见没有送出：内容不对（1 到 1,500 个字）。文字还在。",
    403: "这个页面不能送意见（要从正式的课程网址打开）。文字还在。",
    413: "太长了，请短一点（最多 1,500 个字）。文字还在。",
    429: "十分钟内送太多条了，请过几分钟再送。文字还在。",
    503: "这次没有存进去，请稍后再按一次送出。文字还在。",
    net: "没有连上网络，请稍后再按一次送出。文字还在。"

    if (!URL_ || !window.fetch) return Promise.resolve("net");

    return fetch(URL_, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(body) })
      .then(function (r) {
        if (r.status >= 200 && r.status < 300) return r.json().then(function (d) { return { st: 204, d: d || {} }; }, function () { return { st: 204, d: {} }; });
        return { st: r.status };

  }

  // and sent one per request, raw, with the note's upload token (kept in memory only, valid 30 minutes).
  var MAXPICS = 3;
  var PICMSG = { 400: "图片不对", 403: "这个页面不能上传图片", 404: "图片功能关了", 410: "超过 30 分钟，图片不能再加到这条意见", 413: "图片太大", 415: "只收 PNG、JPG、WebP 图片", 503: "没有存进去", net: "没有连上网络" };

    return new Promise(function (ok) {
      var img = new Image(), u = URL.createObjectURL(file);

  }

    var label = (n.lesson === L.id ? "" : esc(n.code || n.lesson) + " · ") + "第 " + n.screen + " 页" + (title ? " · " + esc(title) : "") +
      " <small>" + esc(KIND_ZH[n.kind] || "") + " · " + when(n.at) + (n.pics ? " · 📎" + n.pics : "") + "</small>";
    var go = n.page === opts.page ? (n.lesson === L.id ? ' data-go="' + (n.screen - 1) + ":" + n.step + '"' :

    var tag = go && n.lesson !== L.id ? "a" : "button";
    return "<" + tag + ' class="nmi' + (here ? " here" : "") + '"' + (tag === "button" ? ' type="button"' : "") + go + (go ? "" : " disabled") + "><b>" + label + "</b><span>" + esc(n.text) + "</span></" + tag + ">";
  }

    var all = mine(), sc = w.screen + 1;

      '<div class="nml">' + here.map(function (n) { return item(n, true, opts); }).join("") + rest.map(function (n) { return item(n, false, opts); }).join("") +

      // how many notes this screen already has, on the button
      function badge() {
        var w = opts.where(), c = mine().filter(function (n) { return n.lesson === L.id && n.screen === w.screen + 1; }).length;
        var hasDraft = false; try { hasDraft = !!localStorage.getItem("touch:ep:note-draft:" + L.id + ":" + opts.page); } catch (e) {}
        btn.textContent = "✎ 提意见" + (c ? " · " + c : "") + (hasDraft ? " · 草稿" : "");
        btn.classList.toggle("has", c > 0);
      }
      badge();
      importNotes(function (all, fresh) {
        badge();
        var t = document.createElement("div");
        t.className = "note-toast"; t.textContent = "已放回 " + fresh + " 条你之前留的意见（按「✎ 提意见」看）" + (all > fresh ? "，其余 " + (all - fresh) + " 条本来就有" : "");
        document.body.appendChild(t); setTimeout(function () { t.remove(); }, 6000);
      });
      if (window.MutationObserver) new MutationObserver(badge).observe(document.documentElement, { attributes: true, attributeFilter: ["data-pos"] });
