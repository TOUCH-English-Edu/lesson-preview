<script>
// Shared engine for all TOUCH lesson pages: text + translation, speech, storage, and the practice widgets
// used by more than one page (unscramble, picture match, multiple choice).
(function () {
  var L = window.LESSON;
  var T = (window.T = { L: L });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  T.esc = esc;
  T.icon = function (n) { return (window.ICONS && ICONS[n]) || ""; };
  T.pic = function (name, cls) {
    var photo = window.PHOTOS && PHOTOS[name];
    var inner = photo ? '<img src="' + photo + '" alt="">' : (window.PICS && PICS[name]) || "";
    return '<span class="pic ' + (cls || "") + '" role="img" aria-label="' + esc(T.wordFor(name)) + '">' + inner + "</span>";
  };
  T.wordFor = function (pic) {
    var v = (L.vocab || []).filter(function (x) { return x.pic === pic; })[0];
    return v ? v.word : pic;
  };
  T.h = function (html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  };
  T.$ = function (sel, root) { return (root || document).querySelector(sel); };
  T.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  T.on = function (root, type, sel, fn) {
    root.addEventListener(type, function (e) {
      var el = e.target.closest(sel);
      if (el && root.contains(el)) fn(e, el);
    });
  };
  T.shuffle = function (arr) {
    var a = arr.slice();
    for (var tries = 0; tries < 6; tries++) {
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      if (a.length < 2 || a.join("|") !== arr.join("|")) break;
    }
    return a;
  };

  // ---------- Storage (swap TOUCH_PROGRESS_HOOK in later to save to Marco's system) ----------
  function mkStore(ns) {
    return {
      get: function (k, d) {
        try { var v = localStorage.getItem(ns + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; }
      },
      set: function (k, v) {
        try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) {}
        if (typeof window.TOUCH_PROGRESS_HOOK === "function") {
          try { window.TOUCH_PROGRESS_HOOK(L.id, k, v); } catch (e) {}
        }
      }
    };
  }
  T.store = mkStore("touch:" + L.id + ":");
  T.pref = mkStore("touch:");

  // ---------- Text with tap-to-translate words ----------
  var keys = Object.keys(L.glossary || {}).sort(function (a, b) { return b.length - a.length; });
  var glossRe = keys.length
    ? new RegExp("(^|[^A-Za-z])(" + keys.map(function (k) {
        return k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/'/g, "['’]");
      }).join("|") + ")(?![A-Za-z])", "gi")
    : null;
  T.g = function (text) {
    text = String(text);
    if (!glossRe || !L.translate) return esc(text);
    var out = "", last = 0;
    text.replace(glossRe, function (m, pre, word, off) {
      var start = off + pre.length;
      out += esc(text.slice(last, start)) +
        '<span class="gw" data-g="' + esc(word.toLowerCase().replace(/’/g, "'")) + '">' + esc(word) + "</span>";
      last = start + word.length;
      return m;
    });
    return out + esc(text.slice(last));
  };
  // Blanks "____" become a visible write-on line
  T.gb = function (text) {
    return T.g(text).replace(/_{2,}/g, '<span class="blank" role="img" aria-label="blank"></span>');
  };

  var LANGS = [
    { id: "en", label: "English only", sub: "No translation" },
    { id: "zh", label: "中文", sub: "Chinese" },
    { id: "ms", label: "Bahasa Melayu", sub: "Malay" }
  ];
  T.lang = T.pref.get("lang", "en");
  document.documentElement.setAttribute("data-lang", T.lang);

  T.globe = function () {
    if (!L.translate) return "";
    return '<div class="globe"><button class="globe-btn" aria-haspopup="true" aria-expanded="false">' + T.icon("globe") +
      '<span class="globe-cur">' + (T.lang === "en" ? "EN" : T.lang === "zh" ? "中文" : "BM") + '</span></button></div>';
  };

  // Link back to the lesson list (teacher or student hub, whichever this page sits in)
  T.home = function () {
    var href = (window.TOUCH_LINKS || {}).index;
    return href ? '<a class="home-link" href="' + esc(href) + '" aria-label="Back to all lessons">' + T.icon("left") + "<span>Lessons</span></a>" : "";
  };

  var pop;
  function hidePop() { if (pop) { pop.remove(); pop = null; } }
  function closeMenus() {
    T.$$(".globe-menu").forEach(function (m) { m.remove(); });
    T.$$(".globe-btn").forEach(function (b) { b.setAttribute("aria-expanded", "false"); });
  }
  function setLang(id) {
    T.lang = id;
    T.pref.set("lang", id);
    document.documentElement.setAttribute("data-lang", id);
    T.$$(".globe-cur").forEach(function (s) { s.textContent = id === "en" ? "EN" : id === "zh" ? "中文" : "BM"; });
    hidePop();
  }

  document.addEventListener("click", function (e) {
    var gb = e.target.closest(".globe-btn");
    var menuItem = e.target.closest(".globe-menu button");
    if (menuItem) { setLang(menuItem.getAttribute("data-lang")); closeMenus(); return; }
    if (gb) {
      var open = T.$(".globe-menu", gb.parentNode);
      closeMenus();
      if (!open) {
        var m = T.h('<div class="globe-menu" role="menu"><p>Choose a language, then tap a dotted word to see its meaning.</p>' +
          LANGS.map(function (l) {
            return '<button role="menuitemradio" aria-checked="' + (l.id === T.lang) + '" data-lang="' + l.id + '"><span>' + l.label +
              '</span><span style="font-size:12px;color:var(--muted)">' + (l.id === T.lang ? T.icon("check") : l.sub) + "</span></button>";
          }).join("") + "</div>");
        gb.parentNode.appendChild(m);
        gb.setAttribute("aria-expanded", "true");
      }
      return;
    }
    if (!e.target.closest(".globe-menu")) closeMenus();
  });

  // Capture phase: when a language is on, tapping a dotted word translates instead of pressing its button
  document.addEventListener("click", function (e) {
    var w = e.target.closest(".gw");
    if (!w || T.lang === "en") { hidePop(); return; }
    e.preventDefault();
    e.stopPropagation();
    var entry = (L.glossary || {})[w.getAttribute("data-g")];
    if (!entry) return;
    hidePop();
    pop = T.h('<div class="gpop" role="status"><small>' + esc(w.textContent) + "</small>" + esc(entry[T.lang]) + "</div>");
    pop.style.position = "fixed";
    document.body.appendChild(pop);
    var r = w.getBoundingClientRect(), pr = pop.getBoundingClientRect();
    var left = Math.max(8, Math.min(window.innerWidth - pr.width - 8, r.left + r.width / 2 - pr.width / 2));
    var top = r.top - pr.height - 8;
    if (top < 8) top = r.bottom + 8;
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }, true);
  window.addEventListener("scroll", hidePop, { passive: true });

  // ---------- Speech ----------
  T.rate = T.pref.get("rate", "normal");
  T.setRate = function (r) { T.rate = r; T.pref.set("rate", r); };
  var playingBtn;
  T.say = function (text, btn) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    if (playingBtn) playingBtn.classList.remove("playing");
    var u = new SpeechSynthesisUtterance(String(text).replace(/_{2,}/g, " blank "));
    var voices = speechSynthesis.getVoices();
    u.voice = voices.filter(function (v) { return v.lang === "en-GB"; })[0] || voices.filter(function (v) { return /^en/.test(v.lang); })[0] || null;
    u.lang = "en-GB";
    u.rate = T.rate === "slow" ? 0.7 : 0.92;
    if (btn) {
      playingBtn = btn;
      btn.classList.add("playing");
      u.onend = u.onerror = function () { btn.classList.remove("playing"); };
    }
    speechSynthesis.speak(u);
  };
  T.sayBtn = function (text, label) {
    return '<button class="say" data-say="' + esc(text) + '" aria-label="' + esc(label || "Listen: " + text) + '">' + T.icon("volume") + "</button>";
  };
  T.on(document, "click", "[data-say]", function (e, el) { T.say(el.getAttribute("data-say"), el); });

  // ---------- Shared practice widgets ----------
  T.tokens = function (sentence) { return sentence.match(/[A-Za-z0-9'’-]+|[.?!,]/g) || []; };
  function joinTokens(t) { return t.join(" ").replace(/\s+([.?!,])/g, "$1"); }

  // Unscramble: tap words to build the sentence; tap a placed word to send it back
  T.unscramble = function (host, answer, onResult) {
    var toks = T.tokens(answer);
    var order = T.shuffle(toks.map(function (_, i) { return i; }));
    host.innerHTML = '<div class="answer-line" aria-live="polite"></div><div class="tiles">' +
      order.map(function (i) { return '<button class="tile" data-i="' + i + '">' + esc(toks[i]) + "</button>"; }).join("") +
      '</div><div class="feedback"></div>';
    var line = T.$(".answer-line", host), tiles = T.$(".tiles", host), fb = T.$(".feedback", host);
    host.addEventListener("click", function (e) {
      var t = e.target.closest(".tile");
      if (!t || host.classList.contains("ok")) return;
      (t.parentNode === line ? tiles : line).appendChild(t);
      t.classList.toggle("placed", t.parentNode === line);
      fb.textContent = ""; fb.className = "feedback";
      if (line.children.length === toks.length) {
        var built = T.$$(".tile", line).map(function (x) { return x.textContent; });
        var ok = joinTokens(built) === joinTokens(toks);
        host.classList.toggle("ok", ok);
        fb.className = "feedback " + (ok ? "ok" : "no");
        fb.textContent = ok ? "Correct: " + joinTokens(toks) : "Not yet. Tap a word to move it back.";
        if (onResult) onResult(ok);
      }
    });
  };

  // Picture match: tap a word, then its picture. opts.speak reads the word aloud (self-study pages only)
  T.matchPics = function (host, names, onDone, opts) {
    var words = T.shuffle(names);
    host.innerHTML = '<div class="grid match-pics">' + names.map(function (n) {
      return '<button class="mpic" data-n="' + n + '">' + T.pic(n) + '<span class="slot"></span></button>';
    }).join("") + '</div><div class="match-words">' + words.map(function (n) {
      return '<button class="mword" data-n="' + n + '">' + esc(T.wordFor(n)) + "</button>";
    }).join("") + "</div>";
    var sel = null, done = 0;
    T.on(host, "click", ".mword", function (e, w) {
      if (sel) sel.classList.remove("sel");
      sel = sel === w ? null : w;
      if (sel) { sel.classList.add("sel"); if (opts && opts.speak) T.say(sel.textContent); }
    });
    T.on(host, "click", ".mpic", function (e, p) {
      if (!sel || p.classList.contains("ok")) return;
      if (sel.getAttribute("data-n") === p.getAttribute("data-n")) {
        p.classList.add("ok");
        T.$(".slot", p).textContent = sel.textContent;
        sel.classList.add("used"); sel.classList.remove("sel"); sel = null;
        done++;
        if (done === names.length && onDone) onDone();
      } else {
        p.classList.remove("no"); void p.offsetWidth; p.classList.add("no");
      }
    });
    host.revealAll = function () {
      T.$$(".mpic", host).forEach(function (p) { p.classList.add("ok"); T.$(".slot", p).textContent = T.wordFor(p.getAttribute("data-n")); });
      T.$$(".mword", host).forEach(function (w) { w.classList.add("used"); });
    };
  };

  // Multiple choice: first tap counts for the score, wrong taps stay amber.
  // The order on screen is mixed so the right answer has no fixed place; data-i stays the option's
  // index in the content file, and that index is what is checked (and what anything stored must use).
  // keepOrder = true shows the content order (for options that carry A/B/C letters matching a printed page).
  T.mcq = function (host, options, answer, onResult, renderOpt, keepOrder) {
    var shown = options.map(function (_, i) { return i; });
    if (!keepOrder) shown = T.shuffle(shown);
    host.innerHTML = shown.map(function (i) {
      return '<button class="opt" data-i="' + i + '">' + (renderOpt ? renderOpt(options[i], i) : T.g(options[i])) + "</button>";
    }).join("");
    var first = true, locked = false;
    T.on(host, "click", ".opt", function (e, b) {
      if (locked) return;
      var ok = +b.getAttribute("data-i") === answer;
      b.classList.add(ok ? "ok" : "no");
      if (ok) locked = true;
      if (onResult) onResult(ok, first);
      first = false;
    });
  };
})();

</script>
<script>
// Shared by the Level 2 pages (before / class / during / after): the cast, recorded voices,
// formula tags and the organiser widget. Loaded after engine.js; adds window.T2.
(function () {
  var L = T.L, esc = T.esc, icon = T.icon;
  var T2 = (window.T2 = {});

  // The company cast, the same people as the e-learning app
  var CAST = {
    "Mr. Tan": { role: "Manager", cls: "tan" },
    "Kumar": { role: "Sales", cls: "kumar" },
    "Ali": { role: "IT", cls: "ali" },
    "Mei Ling": { role: "Accounts", cls: "meiling" },
    "Siti": { role: "HR", cls: "siti" },
    "Amy": { role: "Coach", cls: "amy" },
    "Bella": { role: "", cls: "bella" }
  };
  T2.who = function (name) {
    var c = CAST[name] || { role: "", cls: "other" };
    return { name: name || "", role: c.role, cls: c.cls, initial: (name || "?").replace(/^Mr\.?\s*/, "").charAt(0) };
  };
  T2.avatar = function (name, cls) {
    var w = T2.who(name);
    return '<span class="avatar av-' + w.cls + " " + (cls || "") + '" aria-hidden="true">' + esc(w.initial) + "</span>";
  };

  // ---------- Recorded voices (optional) ----------
  // window.AUDIO = {"<who>|<text>": "audio/<file>.mp3"} is filled by build.py from lessons/audio/.
  // No file → the browser's own voice (T.say). Sound can be switched off; then no play buttons show.
  var AUDIO = window.AUDIO || {};
  T2.sound = T.pref.get("sound", true);
  function applySound() { document.body.classList.toggle("no-sound", !T2.sound); }
  T2.setSound = function (on) { T2.sound = !!on; T.pref.set("sound", T2.sound); applySound(); stop(); };
  applySound();

  var player = null, playingBtn = null, onEnd = null;
  function stop() {
    if (player) { player.pause(); player = null; }
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    if (playingBtn) { playingBtn.classList.remove("playing"); playingBtn = null; }
    onEnd = null;
  }
  T2.stop = stop;
  T2.hasClip = function (who, text) { return !!AUDIO[(who || "Bella") + "|" + text]; };
  T2.play = function (who, text, btn, done) {
    stop();
    var src = AUDIO[(who || "Bella") + "|" + text];
    playingBtn = btn || null;
    onEnd = done || null;
    if (btn) btn.classList.add("playing");
    function finish() { if (btn) btn.classList.remove("playing"); playingBtn = null; var f = onEnd; onEnd = null; if (f) f(); }
    if (src) {
      player = new Audio(src);
      player.addEventListener("ended", finish);
      player.addEventListener("error", function () { player = null; sayFallback(text, btn, finish); });
      player.play().catch(function () { player = null; sayFallback(text, btn, finish); });
    } else {
      sayFallback(text, btn, finish);
    }
  };
  function sayFallback(text, btn, finish) {
    if (!("speechSynthesis" in window)) { finish(); return; }
    var u = new SpeechSynthesisUtterance(String(text).replace(/…/g, "").replace(/_{2,}/g, " blank "));
    var voices = speechSynthesis.getVoices();
    u.voice = voices.filter(function (v) { return v.lang === "en-GB"; })[0] || voices.filter(function (v) { return /^en/.test(v.lang); })[0] || null;
    u.lang = "en-GB";
    u.rate = 0.92;
    u.onend = u.onerror = finish;
    speechSynthesis.speak(u);
  }
  // A round play button. who = the character whose voice reads it (default Bella).
  T2.playBtn = function (who, text, label, cls) {
    return '<button class="say play ' + (cls || "") + '" data-who="' + esc(who || "Bella") + '" data-text="' + esc(text) +
      '" aria-label="' + esc(label || "Listen") + '">' + icon("volume") + "</button>";
  };
  T.on(document, "click", ".play[data-text]", function (e, b) {
    e.stopPropagation();
    if (b === playingBtn) { stop(); return; }
    T2.play(b.getAttribute("data-who"), b.getAttribute("data-text"), b);
  });

  // ---------- Formula tags ----------
  // Tags come from the lesson's model parts: O R E O2 (OREO), P P2 F X (PPF + still open),
  // or S1 S2 S3 S4 when the formula is "Optional" (the lesson names its own steps).
  // L.formulaLabels {tag: label}, when present, replaces the labels shown for those tags everywhere.
  var LABELS = L.formulaLabels || {};
  T2.parts = function () { return (L.model && L.model.parts) || []; };
  // fallback = the label written beside the tag in the lesson (model part, build frame)
  T2.label = function (tag, fallback) {
    if (LABELS[tag]) return LABELS[tag];
    if (fallback) return fallback;
    var p = T2.parts().filter(function (x) { return x.tag === tag; })[0];
    return p ? p.label : tag;
  };
  T2.labelFor = function (tag) { return T2.label(tag); };
  T2.letter = function (tag) { return tag === "P2" ? "P" : tag === "X" ? "!" : /^S\d$/.test(tag) ? tag.charAt(1) : tag.charAt(0); };
  T2.tag = function (tag, cls) {
    return '<span class="ftag ft-' + esc(tag) + " " + (cls || "") + '" title="' + esc(T2.labelFor(tag)) + '">' + esc(T2.letter(tag)) + "</span>";
  };
  // The name shown for the formula: "OREO", "PPF", or the lesson's own name when the formula is optional
  T2.formulaName = function () { return L.formula === "Optional" ? (L.formulaName || "Steps") : (L.formula || ""); };
  // Option indexes in a mixed order, for pages that draw their own options (value stays the content index)
  T2.mixed = function (options) { return T.shuffle(options.map(function (_, i) { return i; })); };

  // A chat line from a character. side "B" puts it on the right (the student's side).
  T2.line = function (who, inner, side, extra) {
    var w = T2.who(who);
    return '<div class="line ' + (side || "A") + " " + (extra || "") + '">' + T2.avatar(who) +
      '<div class="says"><small>' + esc(w.name) + (w.role ? " · " + esc(w.role) : "") + "</small>" + inner + "</div></div>";
  };

  T2.fmt = function (s) { s = Math.max(0, s | 0); return Math.floor(s / 60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60); };

  // Countdown: host gets the digits, returns controls. onState(left, running) redraws whatever else needs it.
  T2.timer = function (seconds, onState) {
    var left = seconds, handle = null;
    function tick() { left--; if (left <= 0) { left = 0; clearInterval(handle); handle = null; } onState(left, !!handle); }
    var api = {
      toggle: function () { if (handle) { clearInterval(handle); handle = null; } else { if (left <= 0) left = seconds; handle = setInterval(tick, 1000); } onState(left, !!handle); },
      reset: function () { clearInterval(handle); handle = null; left = seconds; onState(left, false); },
      // A shorter round: the same clock, a new length
      set: function (n) { clearInterval(handle); handle = null; seconds = left = n; onState(left, false); },
      running: function () { return !!handle; },
      left: function () { return left; }
    };
    onState(left, false);
    return api;
  };

  // ---------- Organiser: put the mixed-up sentences into the formula boxes ----------
  // items: [{part, text}], order = the tags in order (from the model). opts.who reads the lines aloud.
  T2.organiser = function (host, items, order, opts) {
    opts = opts || {};
    var shuffled = T.shuffle(items.map(function (_, i) { return i; }));
    host.innerHTML = '<div class="org">' +
      '<div class="org-slots">' + order.map(function (tag, k) {
        return '<div class="org-slot" data-slot="' + k + '"><div class="org-lab">' + T2.tag(tag) + "<span>" + esc(T2.labelFor(tag)) + '</span></div><div class="org-drop"></div></div>';
      }).join("") + "</div>" +
      '<div class="org-pool">' + shuffled.map(function (i) {
        return '<div class="org-card" role="button" tabindex="0" data-i="' + i + '">' + (opts.who && !opts.noPlay ? T2.playBtn(opts.who, items[i].text, "Listen", "mini") : "") + "<span>" + T.g(items[i].text) + "</span></div>";
      }).join("") + "</div>" +
      '<div class="feedback org-fb" aria-live="polite"></div></div>';
    var pool = T.$(".org-pool", host), fb = T.$(".org-fb", host);
    function slots() { return T.$$(".org-slot", host); }
    function nextEmpty() { return slots().filter(function (s) { return !T.$(".org-card", s); })[0]; }
    function place(card, slot) { T.$(".org-drop", slot).appendChild(card); card.classList.add("placed"); }
    function check(silent) {
      var all = true, right = 0;
      slots().forEach(function (s, k) {
        var c = T.$(".org-card", s);
        s.classList.remove("ok", "no");
        if (!c) { all = false; return; }
        var ok = items[+c.dataset.i].part === order[k];
        s.classList.add(ok ? "ok" : "no");
        if (ok) right++;
      });
      if (!silent) {
        fb.className = "feedback org-fb " + (right === order.length ? "ok" : "no");
        fb.textContent = right === order.length ? "That's the order." : (all ? "Not quite. Tap a sentence to move it back." : "Fill every box first.");
      }
      if (right === order.length && opts.onDone) opts.onDone();
      return right === order.length;
    }
    host.addEventListener("click", function (e) {
      var card = e.target.closest(".org-card");
      if (!card || e.target.closest(".play")) return;
      if (card.classList.contains("placed")) {
        pool.appendChild(card); card.classList.remove("placed");
        slots().forEach(function (s) { s.classList.remove("ok", "no"); });
        fb.textContent = ""; fb.className = "feedback org-fb";
        return;
      }
      var slot = nextEmpty();
      if (!slot) return;
      place(card, slot);
      if (!nextEmpty()) check();
    });
    // The card holds its own play button, so it is not a <button>; give it the keyboard a button has
    host.addEventListener("keydown", function (e) {
      var card = e.target.closest(".org-card");
      if (card && e.target === card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); card.click(); }
    });
    return {
      check: function () { return check(); },
      reveal: function () {
        slots().forEach(function (s, k) {
          var want = items.map(function (it, i) { return it.part === order[k] ? i : -1; }).filter(function (i) { return i > -1; });
          // First still-unplaced item with this part goes into the slot
          var current = T.$(".org-card", s);
          if (current && items[+current.dataset.i].part === order[k]) return;
          if (current) { pool.appendChild(current); current.classList.remove("placed"); }
          var card = want.map(function (i) { return T.$('.org-card[data-i="' + i + '"]', host); }).filter(function (c) { return c && !c.classList.contains("placed"); })[0];
          if (card) place(card, s);
        });
        check();
      },
      reset: function () { T.$$(".org-card", host).forEach(function (c) { pool.appendChild(c); c.classList.remove("placed"); }); slots().forEach(function (s) { s.classList.remove("ok", "no"); }); fb.textContent = ""; }
    };
  };

  // A row of option buttons that reveals a sentence when the right one is picked
  T2.pick = function (host, options, answer, onRight) {
    T.mcq(host, options, answer, function (ok) { if (ok && onRight) onRight(); }, function (o) { return esc(o); });
  };
})();

</script>
<script>
// Level 2 student workbook for class time. Sections follow the teacher's slide numbers.
// On a phone it is a follow-along page (answers saved on the phone); printed (build.py opens it
// with ?print=1) it becomes the A4 handout with write-on lines. No sound here: paper does not speak.
(function () {
  var L = T.L, g = T.g, gb = T.gb, esc = T.esc, icon = T.icon;
  var PRINT = /[?&]print=1/.test(location.search);
  var LINKS = window.TOUCH_LINKS || {};
  document.body.classList.add("student", "workbook", "l2", "no-sound");
  if (PRINT) document.documentElement.classList.add("print");
  document.title = L.title + " · Student workbook";
  var S = L.scenario || {}, M = L.model, K = L.task;

  function num(n) { return "Slide " + (n < 10 ? "0" : "") + n; }
  function section(n, name, lead, inner) {
    return '<section class="card wb"><header><span class="step-n">' + num(n) + "</span><h2>" + esc(name) + "</h2></header>" +
      (lead ? '<p class="lead">' + esc(lead) + "</p>" : "") + inner + "</section>";
  }
  function field(key, placeholder, cls) {
    return '<input class="wline ' + (cls || "") + '" data-k="' + key + '" aria-label="' + esc(placeholder || "Your answer") + '" placeholder="' + esc(PRINT ? "" : placeholder || "") + '">';
  }
  function area(key, placeholder) {
    return '<textarea class="warea" data-k="' + key + '" aria-label="' + esc(placeholder) + '" placeholder="' + esc(PRINT ? "" : placeholder) + '"></textarea>';
  }

  var parts = [];
  parts.push('<header class="s-hero wb-cover"><img class="wb-logo" src="' + (window.TOUCH_LOGO || "") + '" alt="TOUCH English">' +
    '<div class="kicker">Student workbook · Level 2</div><h1>' + esc(L.title) + '</h1><div class="meta"><span class="tag">' + esc(L.fn) + '</span><span class="tag">' + esc(T2.formulaName()) +
    '</span><span class="tag">' + esc(L.taskType) + '</span></div><div class="wb-name">Name: <span class="wb-fill"></span> Date: <span class="wb-fill short"></span></div></header>');

  // 02 Goal + scenario
  parts.push(section(2, "Today's goal", "By the end of this lesson, I can:",
    '<p class="s-cando">' + g(L.cando) + '</p><div class="s-scn">' + [["Who", S.who], ["Situation", S.situation], ["Need", S.need], ["Goal", S.goal]].map(function (r) {
      return '<div class="s-scn-row"><span class="scn-k">' + r[0] + "</span><span>" + g(r[1] || "") + "</span></div>";
    }).join("") + "</div>" + (S.facts ? '<div class="s-facts">' + S.facts.map(function (f) {
      return "<div><b>" + esc(f.label) + "</b><ul>" + f.items.map(function (i) { return "<li>" + g(i) + "</li>"; }).join("") + "</ul></div>";
    }).join("") + "</div>" : "")));

  // 03 Warm-up
  parts.push(section(3, "Try it first", L.warmup.who + " asks: “" + L.warmup.opener + "” Say something for " + L.warmup.seconds + " seconds. Then note what you said.",
    area("warm", "What I said (a few words)")));

  // 04 Model
  parts.push(section(4, "A good message", M.who + "'s answer. Mark where each part starts.",
    '<div class="s-model"><p class="msg-block">' + g(M.parts.map(function (p) { return p.text; }).join(" ")) + '</p><div class="s-parts compact">' + M.parts.map(function (p) {
      return '<div class="s-part">' + T2.tag(p.tag) + "<div><b>" + esc(T2.label(p.tag, p.label)) + "</b>" + field("part-" + p.tag, "first words of this part") + "</div></div>";
    }).join("") + "</div></div>"));

  // 05 Organiser
  var order = T2.parts();
  parts.push(section(5, "Organise it", L.organiser.intro,
    '<div class="wb-org">' + T.shuffle(L.organiser.items).map(function (it, i) {
      return '<div class="wb-org-line"><span class="box"></span><span>' + g(it.text) + "</span></div>";
    }).join("") + '</div><p class="wb-starter">Write the letter: ' + order.map(function (p) { return "<b>" + esc(T2.letter(p.tag)) + "</b> = " + esc(T2.label(p.tag, p.label)); }).join(" · ") + "</p>"));

  // 06 Bank
  parts.push(section(6, "Useful language", "Tick the expressions you used today.",
    '<div class="wb-chunks l2">' + L.bank.map(function (grp, ci) {
      return '<div><h3>' + esc(grp.group) + "</h3>" + grp.items.map(function (t, k) {
        return '<label class="sent"><input type="checkbox" data-k="bank' + ci + "_" + k + '"><span>' + g(t) + "</span></label>";
      }).join("") + "</div>";
    }).join("") + "</div>"));

  // 07 Connectors
  parts.push(section(7, "Connect the ideas", "Choose the connector and write the new sentence.",
    '<ol class="wb-q">' + L.connectors.map(function (c, i) {
      return "<li><p>" + g(c.a) + ' <span class="conn-opts">[ ' + T2.mixed(c.options).map(function (k) { return esc(c.options[k]); }).join(" / ") + " ]</span> " + g(c.b) + "</p>" + field("conn" + i, "The joined sentence") + "</li>";
    }).join("") + "</ol>"));

  // 08 Time control
  parts.push(section(8, "Time control", "Circle the right form. Why?",
    '<ol class="wb-mcq">' + L.timeControl.map(function (t, i) {
      return "<li><p>" + gb(t.sentence) + ' <small class="why-hint">(' + esc(t.prompt) + ')</small></p><div class="wb-choices">' + T2.mixed(t.options).map(function (k) {
        return '<label><input type="radio" name="tc' + i + '" data-k="tc' + i + '" value="' + k + '"><span>' + esc(t.options[k]) + "</span></label>";
      }).join("") + "</div></li>";
    }).join("") + "</ol>"));

  // 09 Support
  parts.push(section(9, L.support.title, L.support.note,
    '<div class="sent-list">' + L.support.examples.map(function (x) { return '<div class="sent"><span>' + x + "</span></div>"; }).join("") + "</div>" + field("sup", "My own sentence", "wide")));

  // 10 Build
  parts.push(section(10, "Build your message", "Fill each part with your own idea. You will use the same parts in the task.",
    '<div class="wb-frames">' + L.build.frames.map(function (f) {
      return '<div class="wb-frame">' + T2.tag(f.tag) + "<div><b>" + esc(T2.label(f.tag, f.label)) + '</b><span class="starter-text">' + esc(f.starter) + "</span>" + area("build-" + f.tag, "…") + "</div></div>";
    }).join("") + "</div>"));

  // 11 Task
  parts.push(section(11, K.name, K.goal,
    '<ol class="wb-q">' + K.steps.map(function (s) { return "<li><p>" + g(s) + "</p></li>"; }).join("") + '</ol><div class="wb-sits">' + K.cards.map(function (c) {
      // With a listener text the task section names the card only; both sides go to the last pages, to cut
      return '<div class="wb-sit"><div><b>' + esc(c.title) + "</b>" + (c.listener ? "" : "<p>" + g(c.cue) + "</p>") + "</div></div>";
    }).join("") + "</div>" + // The listener's written product: one small note per round, with the lesson's own headings
    (K.note ? '<p class="wb-starter">' + esc(K.note.title || "Listener\u2019s note") + '</p><table class="wb-note"><thead><tr><th></th><th>Round 1</th><th>Round 2</th><th>Round 3</th></tr></thead><tbody>' +
      K.note.lines.map(function (l, i) { return "<tr><th>" + esc(l) + "</th>" + [1, 2, 3].map(function (r) { return "<td>" + field("note" + r + "-" + i, "") + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table>"
      : L.fn === "Narrate" ? '<p class="wb-starter">Partner\u2019s timeline, in order:</p>' + [1, 2, 3, 4, 5].map(function (n) { return field("tl" + n, n + "."); }).join("") : "") +
    '<p class="wb-starter">My partner\u2019s question or concern, and what I answered:</p>' + area("task-note", "…")));

  // 12 Respond
  parts.push(section(12, "Respond", L.respond.who + " asks. Write a short answer to one of these.",
    '<ol class="wb-q">' + L.respond.items.map(function (q, i) { return "<li><p>" + g(q) + "</p></li>"; }).join("") + "</ol>" +
    '<p class="wb-starter">Start with: ' + L.respond.starters.map(function (s) { return "<b>" + esc(s) + "</b>"; }).join(" · ") + "</p>" + area("respond", "My answer")));

  // 13 Transfer
  parts.push(section(13, "Transfer", L.transfer.prompt, '<p class="wb-starter">' + L.transfer.starters.map(function (s) { return "<b>" + esc(s) + "</b>"; }).join(" · ") + "</p>" + area("transfer", "Notes")));

  // 14 Evidence (self)
  parts.push(section(14, "Did I do it?", "Be honest. Tick what you did in the task.",
    '<div class="wb-chunks l2"><div>' + L.evidence.map(function (e, k) {
      return '<label class="sent"><input type="checkbox" data-k="ev' + k + '"><span>' + g(e) + "</span></label>";
    }).join("") + "</div></div>"));

  // 15 Feedback
  parts.push(section(15, "Feedback: how can I improve?", "Circle one number for each area. 1 = I need help · 2 = OK · 3 = Good",
    '<table class="wb-fb"><tbody>' + L.feedback.areas.map(function (a, r) {
      return "<tr><td>" + g(a) + "</td><td>" + [1, 2, 3].map(function (v) {
        return '<label class="lv"><input type="radio" name="fb' + r + '" data-k="fb' + r + '" value="' + v + '"><span>' + v + "</span></label>";
      }).join("") + "</td></tr>";
    }).join("") + '</tbody></table><p class="wb-action"><b>My improvement action:</b> ' + gb(L.feedback.action) + "</p>" + field("action", "Next time, I will…", "wide")));

  parts.push('<p class="s-foot">We believe in the power of practical speaking to inspire confidence<br><span class="wb-next">After class: open the ' + esc(LINKS.afterLabel || "After class review") + "</span></p>");

  // Speaker cards: the last page of the handout, to fold or cut, so the listener does not see the facts.
  // On the phone they stay closed until the speaker opens them.
  var gap = K.cards.filter(function (c) { return c.listener; });
  if (gap.length) {
    parts.push('<section class="card wb wb-cut"><header><span class="step-n">' + num(11) + "</span><h2>Listener cards: fold or cut</h2></header>" +
      '<p class="lead">Only the listener looks at a card. It says what to find out and write in the note.</p>' +
      "<details" + (PRINT ? " open" : "") + "><summary>I am the listener: show the cards</summary>" +
      '<div class="wb-sits">' + gap.map(function (c) {
        return '<div class="wb-sit"><div><b>' + esc(c.title) + "</b><p>" + g(c.listener) + "</p></div></div>";
      }).join("") + "</div></details></section>");
    parts.push('<section class="card wb wb-cut"><header><span class="step-n">' + num(11) + "</span><h2>Speaker cards: fold or cut</h2></header>" +
      '<p class="lead">Only the speaker looks at a card. The listener keeps this page folded.</p>' +
      "<details" + (PRINT ? " open" : "") + "><summary>I am the speaker: show the cards</summary>" +
      '<div class="wb-sits">' + gap.map(function (c) {
        return '<div class="wb-sit"><div><b>' + esc(c.title) + "</b><p>" + g(c.cue) + "</p></div></div>";
      }).join("") + "</div></details></section>");
  }

  T.$("#app").innerHTML =
    '<div class="s-top"><div class="in">' + T.home() + '<span class="brand"><b>TOUCH</b><i>ENGLISH</i></span><span class="page">Workbook</span>' +
    '<a class="btn small pdf-btn" href="' + esc(LINKS.pdf || "handout.pdf") + '" target="_blank" rel="noopener">' + icon("book") + " PDF</a>" + T.globe() + "</div></div>" +
    '<main class="s-main">' + parts.join("") + "</main>";

  if (!PRINT) {
    T.$$("[data-k]").forEach(function (el) {
      var k = el.getAttribute("data-k"), v = T.store.get("wb:" + k, null);
      if (v == null) return;
      if (el.type === "checkbox") el.checked = !!v;
      else if (el.type === "radio") el.checked = String(v) === el.value;
      else el.value = v;
    });
    document.addEventListener("change", function (e) {
      var el = e.target.closest("[data-k]");
      if (el) T.store.set("wb:" + el.getAttribute("data-k"), el.type === "checkbox" ? el.checked : el.value);
    });
    document.addEventListener("input", function (e) {
      var el = e.target.closest("input.wline, textarea.warea");
      if (el) T.store.set("wb:" + el.getAttribute("data-k"), el.value);
    });
  }
})();

</script>
