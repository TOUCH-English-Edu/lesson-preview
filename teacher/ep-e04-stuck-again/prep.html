      arriveListen(changed || step > prev);
      // Name it: the teacher decides (click = reveal, next click = next situation). Opt-in automatic advance:
      // a game block's `hold` (ms) or the page's opts.gameHold.
      clearTimeout(api.gameTimer);
      var gb = gameBlock(sc()), hold = gb && (gb.hold || opts.gameHold);
      if (gb && hold && step % 2 === 1 && step < EP.steps(sc())) {
        api.gameTimer = setTimeout(function () { if (opts.onAdvance) opts.onAdvance(); }, hold);
      }
    };
    // ---------- listening steps (EP.listens): the teacher's click plays, never reveal answers by accident ----------
    // Arriving on a listening step plays nothing (colleague's review 2026-10-04: listening never starts by itself): a
    // big "▶ Play the recording" button shows, and the next → (or a tap on it) plays the recording. The → after that
    // shows the answers, the next one the transcript. A step counts as heard once its voice has really played (still
    // playing, or played for at least a second: a voice the browser refused does not count).
    var heard = {}, tried = {}, vStart = null, warned = null, autoT = null;
    function lkey() { return api.screen + ":" + api.step; }
    function lspec() { return api.el ? EP.listenAt(sc(), api.step) : null; }
    function lbtn(spec) {
      var want = (spec.lines || []).join(","), all = [].slice.call(api.el.querySelectorAll(".st-main .play[data-lines], .ep-stage > .say .play[data-lines]")).filter(function (b) { return !b.closest(".pre") && !b.closest(".tscript"); });
      return all.filter(function (b) { return b.getAttribute("data-lines") === want; })[0] || all.filter(function (b) { return spec.lines.indexOf(b.getAttribute("data-lines").split(",")[0]) >= 0; })[0] || null;
    }
    function playListen() {
      var spec = lspec();
      if (!spec) return false;
      clearTimeout(autoT);
      var b = lbtn(spec);
      EP.play(spec.lines, b);
      paintListen();
      return true;
    }
    function isHeard() { var k = lkey(); return !!heard[k] || (EP.voicePlaying() && vStart && vStart.key === k); }
    function paintListen() {
      if (!api.el) return;
      var spec = lspec();
      api.el.classList.toggle("listen-step", !!spec);
      var pr = api.el.querySelector(".lprompt");
      if (pr) pr.hidden = !(spec && !isHeard() && !EP.voicePlaying());
      api.el.querySelectorAll(".play.lnow").forEach(function (b) { b.classList.remove("lnow"); });
      if (spec && !isHeard()) { var b = lbtn(spec); if (b) b.classList.add("lnow"); }
    }
    function arriveListen(forward) {
      clearTimeout(autoT); autoT = null; warned = null;
      var tt = api.el && api.el.querySelector(".ltoast");
      if (tt && forward) tt.hidden = true;
      if (forward) delete tried[lkey()];
      paintListen();
    }
    document.addEventListener("ep:voice", function (e) {
      var d = e.detail || {};
      if (d.state === "start") vStart = { key: lkey(), t: Date.now() };
      else if (vStart && Date.now() - vStart.t >= 1000) heard[vStart.key] = 1;
      paintListen();
    });
    document.addEventListener("ep:prefs", function () { if (!(EP.fx && EP.fx.on())) { clearTimeout(autoT); autoT = null; } paintListen(); });
    function toast(msg) {
      var t = api.el && api.el.querySelector(".ltoast");
      if (!t) return;
      t.textContent = msg; t.hidden = false;
      clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 2600);
    }
    // Called before a step forward. True = the step was used for listening, so the lesson does not move on:
    // a listening step not yet heard plays now; while it is still playing, the first → only says so.
    api.guardNext = function () {
      var spec = lspec();
      if (!spec) return false;
      // once only: if the voice cannot play here (no sound, a refused clip), the next → always goes on
      if (!isHeard() && !EP.voicePlaying() && !tried[lkey()]) { tried[lkey()] = 1; playListen(); toast("🎧 Listen"); return true; }
      if (EP.voicePlaying() && warned !== lkey()) { warned = lkey(); toast("🎧 Still playing"); return true; }
      return false;
    };
    function paintSwitches() {
      if (!api.el) return;

      if (m) m.setAttribute("aria-pressed", EP.motionOn && EP.motionOn() ? "true" : "false");

      if (!EP.fx && f) f.hidden = true;
      if (!EP.motion && m) m.hidden = true;
    }
    document.addEventListener("ep:prefs", paintSwitches);
    // the length for this screen: the teacher's change (this session only) or the content's suggestion
    function tkey() { return "touch:ep:timer:" + L.id + ":" + sc().id; }
    function seconds() { var v = null; try { v = +sessionStorage.getItem(tkey()); } catch (e) {} return v > 0 ? v : (sc().timer || 60); }
    function setSeconds(n) {
      n = Math.max(10, Math.min(3600, Math.round(n)));
      try { sessionStorage.setItem(tkey(), String(n)); } catch (e) {}
      clearInterval(timer.h); timer.h = null; timer.left = n; drawTimer();
    }
    function parseTime(v) {
      var m = String(v).trim().match(/^(\d{1,2})(?::(\d{1,2}))?$/);
      if (!m) return 0;
      return m[2] != null ? +m[1] * 60 + +m[2] : +m[1] * 60;
    }
    function drawTimer() {
      var g = api.el && api.el.querySelector(".timer");
      if (!g) return;
      var b = g.querySelector('[data-tool="timer"]'), tm = g.querySelector("[data-tm]");
      if (document.activeElement !== tm) tm.value = EP.fmt(timer.left);
      tm.readOnly = !!timer.h;
      g.classList.toggle("run", !!timer.h);
      g.classList.toggle("last", !!timer.h && timer.left <= 10 && timer.left > 0);
      b.textContent = timer.h ? "❚❚" : "▶";
      b.classList.toggle("run", !!timer.h);
      b.setAttribute("aria-label", (timer.h ? "Pause" : "Start") + " the timer, " + EP.fmt(timer.left));
      var full = seconds();
      g.querySelectorAll("[data-tchoice]").forEach(function (c) { var x = sc().timerChoices[+c.getAttribute("data-tchoice")]; c.setAttribute("aria-pressed", x.seconds === full && c === g.querySelector('[data-tchoice][data-picked]') ? "true" : "false"); });
    }
    function resetTimer() { clearInterval(timer.h); timer.h = null; timer.left = seconds(); drawTimer(); }

        timer.h = setInterval(function () { timer.left--; if (timer.left <= 0) { timer.left = 0; clearInterval(timer.h); timer.h = null; if (EP.fx) EP.fx.play("chime2"); } drawTimer(); }, 1000);

    }
    function gameBlock(s) { var it = null; s.cols.forEach(function (c) { c.blocks.forEach(function (b) { if (b.type === "game") it = b; }); }); return it; }
    function paintScore() {
      if (!api.el) return;
      api.el.querySelectorAll("[data-team]").forEach(function (b) { b.querySelector("b").textContent = scores[b.getAttribute("data-team")] || 0; });
    }
    function pop(sel, btnSel, force) {
      var p = api.el.querySelector(sel), b = btnSel && api.el.querySelector(btnSel);
      var show = force == null ? p.hidden : force;

    }
    api.toggleTip = function () { return pop(".tipcard", '[data-tool="tip"]'); };
    api.closeAll = function () {
      if (!api.el) return false;
      var any = false;
      api.el.querySelectorAll(".pop,.readout").forEach(function (x) { if (!x.hidden) any = true; x.hidden = true; });
      if (EP.gloss && EP.gloss.isOpen()) { EP.gloss.close(); any = true; }
      api.el.querySelectorAll(".tool[aria-expanded]").forEach(function (x) { x.setAttribute("aria-expanded", "false"); });
      return any;
    };
    // "Read it to the class": the answer, without the name
    api.quote = function (text) {
      var q = api.el.querySelector(".readout");
      if (!q) return;
      api.closeAll();
      q.querySelector("small").textContent = "A learner wrote";
      q.querySelector("p").textContent = text;
      q.hidden = false;
    };
    // typing the length: Enter or leaving the field sets it; Escape puts the old value back
    host.addEventListener("change", function (e) { if (e.target.hasAttribute("data-tm")) { var n = parseTime(e.target.value); if (n) setSeconds(n); else drawTimer(); } });
    host.addEventListener("keydown", function (e) {
      if (!e.target.hasAttribute || !e.target.hasAttribute("data-tm")) return;
      e.stopPropagation();
      if (e.key === "Enter") e.target.blur();
      if (e.key === "Escape") { e.target.value = EP.fmt(timer.left); e.target.blur(); }
    });
    host.addEventListener("focusout", function (e) { if (e.target.hasAttribute && e.target.hasAttribute("data-tm")) setTimeout(drawTimer, 0); });
    host.addEventListener("click", function (e) {
      if (e.target.closest(".scrub")) return; // a scrub bar: dragging it never moves the lesson on
      var wd = e.target.closest(".wch, .gw");
      if (wd && EP.gloss) { EP.gloss.open(wd); return; }
      if (EP.gloss && EP.gloss.isOpen() && !e.target.closest(".gloss")) { EP.gloss.close(); if (!e.target.closest("button")) return; }
      var t = e.target.closest("button, a, textarea, input, select");
      if (t) {
        if (t.hasAttribute("data-lplay")) { playListen(); return; }
        if (t.hasAttribute("data-tsclose")) { t.closest(".tscript").classList.add("closed"); return; }
        if (t.hasAttribute("data-close")) { t.closest(".pop,.readout").hidden = true; api.el.querySelectorAll(".tool[aria-expanded]").forEach(function (x) { x.setAttribute("aria-expanded", "false"); }); return; }
        var tool = t.getAttribute("data-tool");
        if (tool === "tip") pop(".tipcard", '[data-tool="tip"]');
        else if (tool === "ppf") pop(".legend", '[data-tool="ppf"]');
        else if (tool === "timer") toggleTimer();
        else if (tool === "reset") resetTimer();
        else if (tool === "tminus" || tool === "tplus") setSeconds((timer.h ? seconds() : timer.left) + (tool === "tplus" ? 30 : -30));
        else if (t.hasAttribute("data-tchoice")) {
          api.el.querySelectorAll("[data-tchoice]").forEach(function (c) { c.removeAttribute("data-picked"); });
          t.setAttribute("data-picked", "");
          setSeconds(sc().timerChoices[+t.getAttribute("data-tchoice")].seconds);
        }
        else if (t.hasAttribute("data-hand")) { EP.pollHand(api.el, sc(), t, e.shiftKey ? -1 : 1); }
        else if (tool === "fx") { if (EP.fx) EP.fx.toggle(); }
        else if (t.classList.contains("w") && t.closest(".dock")) { if (EP.showWord) EP.showWord(api.el, t.getAttribute("data-w"), true); if (EP.gloss) EP.gloss.open(t); }
        else if (tool === "motion") { if (EP.setMotion) EP.setMotion(!EP.motionOn()); }
        else if (t.hasAttribute("data-team")) { var k = t.getAttribute("data-team"); scores[k] = (scores[k] || 0) + (e.shiftKey ? -1 : 1); if (scores[k] < 0) scores[k] = 0; paintScore(); if (EP.swell) EP.swell(t.querySelector("b"), api.el); if (EP.fx) EP.fx.play("pop"); }
        return;
      }
      if (e.target.closest(".pop,.readout,.tscript")) return;
      // a message inside a stage phone (a quoted voice message, a text) opens large, like a magnifying glass
      var qb = e.target.closest(".bub.quote, .bub.zoomable");
      if (qb && !qb.closest(".pre") && qb.closest(".st-main")) { zoom(qb); return; }
      if (opts.onClick) opts.onClick(e);
    });
    function zoom(bub) {
      var q = api.el.querySelector(".readout");
      if (!q) return;
      api.closeAll();
      var ph = bub.closest(".iph"), who = ph ? (ph.querySelector(".app-hd b") || {}).textContent : "";
      q.querySelector("small").textContent = bub.classList.contains("me") ? "You wrote" : who ? who + (bub.classList.contains("quote") ? " said" : " wrote") : "The message";
      q.querySelector("p").innerHTML = bub.innerHTML.replace(/<time>.*?<\/time>/, "");
      q.hidden = false;
    }
    api.timer = { toggle: toggleTimer, reset: resetTimer };
    return api;
  };

})();

<script>
// Episode lessons · prep.html: the teacher's preparation view. A lesson snapshot, the flow by phase, then
// every screen with all its steps shown and numbered (red dots = the click that reveals it), notes beside it.
(function () {
  var EP = window.EP, L = EP.L, esc = EP.esc, S = L.snapshot || {};
  document.body.classList.add("ep-prep");
  var phases = [], mins = {};
  EP.screens.forEach(function (s) { if (!(s.phase in mins)) { phases.push(s.phase); mins[s.phase] = 0; } mins[s.phase] += s.min; });
  function cell(label, v, wide) {
    if (!v) return "";
    var body = Array.isArray(v) ? "<ul>" + v.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : esc(v);
    return '<div class="' + (wide ? "wide" : "") + '"><b>' + esc(label) + "</b>" + body + "</div>";
  }
  var snap = '<div class="snap">' +
    cell("Goal", S.goal) + cell("Speaking win", S.speakingWin) + cell("Formula", S.formula) +
    cell("Storyline · one day with the cast", S.storyline, true) +
    cell("Time control", S.timeControl) + cell("Expression tools", S.expressionTools) + cell("Connectors", S.connectors) +
    cell("Language support", S.languageSupport) + cell("Task", S.task) + cell("Transfer", S.transfer) +
    cell("Evidence of success", S.evidence) +
    cell("Word wall", L.words.map(function (w) { return w.word; }).join(" · ")) +
    cell("Sub-skills", L.subskills.map(function (x) { return x + " " + EP.subskill(x); }).join(" · ")) +
    cell("Speaking ladder", S.ladder, true) +
    cell("Timed screens (the dock shows a timer only here; − / + or type to change it before you start)", EP.screens.map(function (x, i) {
      return x.timer ? (i + 1) + " " + x.title + ": " + timerText(x) : null;
    }).filter(Boolean), true) + "</div>";
  function timerText(x) {
    return (x.timerChoices || []).length ? x.timerChoices.map(function (c) { return c.label + " " + EP.fmt(c.seconds); }).join(" · ") : EP.fmt(x.timer);
  }
  var flow = '<div class="flow">' + phases.map(function (p) { return "<span>" + esc(p) + " · " + mins[p] + " min</span>"; }).join("") + '<span class="tot">Total · ' + EP.total() + " min</span></div>";
  // listening steps: when the recording plays by itself, and the transcript the class sees after the answers
  function listening(sc) {
    var ls = EP.listens(sc).filter(function (x) { return x.lines && x.lines.length; });
    if (!ls.length) return "";
    return '<div class="tp-sec"><h5>Listening</h5>' + ls.map(function (x) {
      var txt = x.lines.map(EP.line).filter(Boolean).map(function (ln) { return "<b>" + esc(ln.who) + ":</b> " + esc(EP.plain(ln.text)); }).join("<br>");
      return "<p>" + (x.at ? "Click " + x.at : "Start") + ": the recording plays by itself (sound on), or the first → plays it." +
        (typeof x.transcriptAt === "number" ? " The full text shows at click " + x.transcriptAt + "." : "") + "</p><p>" + txt + "</p>";
    }).join("") + "</div>";
  }
  var rows = EP.screens.map(function (sc, i) {
    var t = sc.teacher || {}, n = EP.steps(sc);
    var steps = (t.say || []).map(function (s, k) {
      var last = k === t.say.length - 1 && n > k;
      return "<li><b>" + (k === 0 ? "Start" : "Click " + k) + (last ? "–" + n : "") + "</b><span>" + esc(s) + "</span></li>";
    }).join("");
    var more = Object.keys(t.more || {}).map(function (k) { return '<div class="tp-more"><b>' + esc(k) + "</b>" + esc(t.more[k]) + "</div>"; }).join("");
    var grammar = [].concat(sc.grammar || []).map(function (g) { return esc(g.title) + ": " + esc(EP.plain(g.rule)); }).join("<br>");
    return '<section class="prow" id="s' + (i + 1) + '"><div class="pstage" data-i="' + i + '"></div><div>' +
      '<h2>' + (i + 1) + " · " + esc(sc.title) + '<span class="pnote" data-i="' + i + '"></span></h2>' +
      '<div class="tp-meta"><span>' + esc(sc.phase) + "</span><span>" + sc.min + " min</span><span>" + n + " click" + (n === 1 ? "" : "s") + "</span>" +
      (sc.timer ? "<span>⏱ Timer " + esc(timerText(sc)) + "</span>" : "") +
      (sc.ladder ? "<span>Ladder: " + esc(sc.ladder) + "</span>" : "") + (sc.who ? "<span>Who: " + esc(sc.who) + "</span>" : "") +
      ((sc.trains || []).length ? "<span>Trains: " + esc(sc.trains.join(", ")) + "</span>" : "") + "</div>" +
      '<div class="tp-sec"><h5>Goal</h5><p>' + esc(t.goal || "") + "</p></div>" +
      '<div class="tp-sec"><h5>Steps</h5><ol class="tp-steps">' + steps + "</ol></div>" +
      (t.answers ? '<div class="tp-sec"><h5>Answers</h5><p>' + esc(t.answers) + "</p></div>" : "") +
      (t.flex ? '<div class="tp-sec"><h5>Flex · four versions</h5>' + EP.flexHTML(t.flex) + "</div>" : "") +
      (grammar ? '<div class="tp-sec"><h5>Grammar tip (G)</h5><p>' + grammar + "</p></div>" : "") +
      listening(sc) +
      (more ? '<div class="tp-sec">' + more + "</div>" : "") +
      '<p class="pp-phone"><b>On the phone:</b> ' + esc((sc.phone || {}).ask || "look up") + "</p></div></section>";
  }).join("");
  document.getElementById("app").innerHTML = '<main class="pp"><header><p class="kicker">' + esc(L.level) + " · " + esc(L.skill || L.fn) + " · " + esc(L.code) + " · preparation</p>" +
    "<h1>" + esc(L.title) + "</h1><p class=\"lead\">" + esc(L.draft || "") + ". Every screen with all its steps shown; a red number is the click that reveals that part. Open <a href=\"class.html\">class.html</a> to teach (T = your notes, N = names), <a href=\"review.html\">review.html</a> to see the phone beside it.</p></header>" +
    snap + flow + rows + "</main>";
  if (EP.note) document.querySelectorAll(".pnote").forEach(function (h) {
    var i = +h.getAttribute("data-i");
    EP.note.mount(h, { page: "prep", where: function () { return { screen: i, step: EP.steps(EP.screens[i]) }; } });
  });
  document.querySelectorAll(".pstage").forEach(function (box) {
    var sc = EP.screens[+box.getAttribute("data-i")];
    box.innerHTML = EP.stageHTML(sc, { numbered: true });
    EP.paint(box.firstElementChild, sc, EP.steps(sc));
  });
})();

</script>
</body>
</html>
