<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Help! It&#x27;s Stuck · Preparation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Episode lessons (format "episode"): the projected stage, the phone, and the teacher pages around them.
   The stage is a 16:9 frame; everything inside it is sized in cqw so it looks the same at any window size.
   The phone frame (.iph) is its own container: inside it, cqw means "% of the phone's width".
   Look: sketch A "Stage" (light canvas, white cards with depth, cast on a navy base) and sketch C (the event
   itself inside a phone). Tokens from docs/mock/sketches.src.html. */
:root{
  --bg:#eef2fb; --fg:#16202e; --muted:#5c6779; --card:#ffffff; --line:#dfe5f0; --brand:#15357b; --brand-dd:#0d2253; --gold:#be9648;
  --f-canvas:#eef2fb; --f-ink:#16202e; --f-muted:#5c6779; --f-brand:#15357b; --f-brand-dd:#0d2253; --f-gold:#e0a12e; --f-gold-soft:#f8efdb;
  --f-line:#dfe5f0; --past:#3b82c4; --past-soft:#e4effa; --present:#16a394; --present-soft:#dff4f0; --future:#e0792e; --future-soft:#fdeadb;
  --op:#6a3fc4; --rs:#0d8578; --ex:#b0610c; --op2:#4f2c9e;
  --ok:#3c8e6f; --ok-soft:#e6f4ee; --bad:#c0405c; --bad-soft:#fbe8ed; --assign:#d97706; --assign-soft:#fff3df;
  --display:'Sora','PingFang SC','Microsoft YaHei',system-ui,sans-serif; --body:'Plus Jakarta Sans','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --focus:#e0a12e;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b1324; --fg:#e8edf7; --muted:#9fb0cc; --card:#131e36; --line:#283858; --brand:#9db8ff; --gold:#e5c27a; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0b1324; --fg:#e8edf7; --muted:#9fb0cc; --card:#131e36; --line:#283858; --brand:#9db8ff; --gold:#e5c27a; color-scheme:dark }
*{box-sizing:border-box}
/* The resting transform of an element (a tilt, a lift). Motion keyframes start from it and end on it, so an
   animation never fights a static transform. Not inherited: each element has its own. */
@property --rest{syntax:"*";inherits:false;initial-value:translate(0,0)}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ======================= THE STAGE (16:9) ======================= */
.ep-stage{container-type:inline-size;aspect-ratio:16/9;position:relative;overflow:hidden;color:var(--f-ink);font-family:var(--body);
  background:radial-gradient(120% 90% at 10% 0%,#f6f8ff 0,var(--f-canvas) 55%,#dfe8fa 100%);user-select:none;-webkit-user-select:none}
.ep-stage.look-event{background:linear-gradient(135deg,#fdf6e8 0,var(--f-canvas) 45%,#dbe7fb 100%)}
.ep-stage button{font-family:inherit}
.ep-stage :focus-visible{outline:.3cqw solid var(--f-gold);outline-offset:.2cqw}
.st-main{position:absolute;inset:2cqw 3cqw 10.6cqw 3cqw;display:flex;flex-direction:column;gap:1.3cqw;z-index:2}
.st-hd{display:flex;flex-direction:column;gap:.5cqw;flex:none;padding-right:var(--castw,0)}
.st-row{display:flex;align-items:center;gap:1cqw;flex-wrap:wrap}
.pill{display:inline-block;background:var(--f-brand);color:#fff;font:800 1.05cqw var(--display);letter-spacing:.06em;border-radius:1cqw;padding:.45cqw 1.1cqw;text-transform:uppercase}
.kick{font:700 1.2cqw var(--body);color:var(--f-muted)}
.st-hd h2{margin:0;font:800 2.55cqw/1.12 var(--display);color:var(--f-brand-dd);letter-spacing:-.01em;text-wrap:balance}
.st-hd .sub{margin:0;font:600 1.4cqw/1.35 var(--body);color:var(--f-muted)}
.st-body{flex:1;min-height:0;display:grid;gap:2cqw;align-items:stretch;padding-right:var(--castw,0)}
.col{display:flex;flex-direction:column;gap:1.2cqw;min-width:0;min-height:0}
.col.dev{position:relative;align-items:center}
.score{margin-left:auto;display:flex;gap:.8cqw}
.score button{border:0;border-radius:1cqw;padding:.4cqw 1cqw;font:800 1.2cqw var(--display);background:#fff;color:var(--f-brand);box-shadow:0 .3cqw .8cqw rgba(20,33,50,.1)}
.score b{display:inline-block;min-width:1.6cqw;margin-left:.5cqw;color:var(--f-gold)}

/* revealing step by step: elements keep their space, so nothing jumps */
[data-at].pre{opacity:0;visibility:hidden}

/* cast on the navy base */
.cast{position:absolute;bottom:9cqw;height:32cqw;filter:drop-shadow(0 1.2cqw 1.4cqw rgba(13,34,83,.28));z-index:3;pointer-events:none}
.say{position:absolute;z-index:4;background:#fff;border:.22cqw solid var(--f-brand);border-radius:1.8cqw;padding:.9cqw 1.3cqw;font:700 1.45cqw/1.25 var(--body);color:var(--f-brand);max-width:18cqw;box-shadow:0 1cqw 2.4cqw rgba(14,36,86,.15)}
.say::after{content:"";position:absolute;bottom:-1.1cqw;left:45%;border:.6cqw solid transparent;border-top:.9cqw solid var(--f-brand)}

/* the dock: always there, quiet; chips light up only when this screen uses them */
.dock{position:absolute;left:0;right:0;bottom:0;height:9.6cqw;background:linear-gradient(180deg,var(--f-brand),var(--f-brand-dd));border-radius:3.4cqw 3.4cqw 0 0;display:flex;align-items:center;gap:1.2cqw;padding:0 2.4cqw;z-index:5}
.dock .lbl{font:800 .9cqw var(--body);letter-spacing:.16em;color:#b9c8ee;writing-mode:vertical-rl;transform:rotate(180deg)}
.words{display:grid;grid-template-columns:repeat(4,max-content);gap:.55cqw .6cqw;flex:1;min-width:0;align-content:center}
.w{position:relative;transform:var(--rest);font:700 1.12cqw var(--body);padding:.38cqw .95cqw;border-radius:99cqw;border:.14cqw solid rgba(255,255,255,.22);color:#9fb2e2;background:transparent;box-shadow:inset 0 .1cqw 0 rgba(255,255,255,.08),0 .2cqw 0 rgba(0,0,0,.18)}
.w.on{background:var(--f-gold);border-color:var(--f-gold);color:#2a1c00;--rest:translateY(-.3cqw);box-shadow:0 .25cqw 0 #a8741a,0 .6cqw 1.2cqw rgba(224,161,46,.45)}
.tools{display:flex;gap:.6cqw;flex:none;align-items:center}
.tool{position:relative;transform:var(--rest);box-shadow:inset 0 .1cqw 0 rgba(255,255,255,.14),0 .25cqw 0 rgba(0,0,0,.28);font:800 1.05cqw var(--body);border-radius:1cqw;border:0;padding:.65cqw 1cqw;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap;display:inline-flex;align-items:center;gap:.4cqw}
.tool[aria-expanded="true"],.tool.run{background:var(--f-gold);color:#2a1c00}
.tool.ghost{padding:.65cqw .7cqw}

/* pop cards over the stage: grammar tip, PPF legend, read-aloud */
.pop{position:absolute;right:2.4cqw;bottom:11cqw;width:34cqw;background:#fff;border-radius:1.6cqw;padding:1.4cqw 1.6cqw;font-size:1.35cqw;line-height:1.4;box-shadow:0 1.6cqw 4cqw rgba(13,34,83,.3);z-index:8}
.pop h4{margin:0 0 .4cqw;font:800 1.35cqw var(--display);color:var(--f-brand)}
.pop p{margin:.3cqw 0}
.pop .x{position:absolute;right:.8cqw;top:.6cqw;border:0;background:none;font:800 1.6cqw var(--body);color:var(--f-muted);padding:.2cqw .5cqw;border-radius:.6cqw}
.pop .bad-l,.pop .good-l{display:flex;gap:.6cqw;align-items:baseline;font-weight:700}
.pop .bad-l::before{content:"✗";color:var(--bad);font-weight:800}
.pop .good-l::before{content:"✓";color:var(--ok);font-weight:800}
.pop.legend{width:30cqw}
.legend .lg{display:grid;grid-template-columns:auto 1fr;gap:.7cqw 1cqw;align-items:center}
.readout{position:absolute;left:8cqw;right:8cqw;top:12cqw;z-index:9;background:#fff;border-radius:2cqw;padding:2.4cqw 3cqw;box-shadow:0 2cqw 5cqw rgba(13,34,83,.35);border-top:.6cqw solid var(--f-gold)}
.readout small{display:block;font:800 1.15cqw var(--body);letter-spacing:.12em;color:var(--f-muted);text-transform:uppercase;margin-bottom:.6cqw}
.readout p{margin:0;font:600 2.3cqw/1.4 var(--body);color:var(--f-ink)}
.readout .x{position:absolute;right:1cqw;top:.8cqw;border:0;background:none;font:800 2cqw var(--body);color:var(--f-muted);border-radius:.6cqw}

/* rich text marks */
.hl{background:linear-gradient(transparent 58%,var(--f-gold-soft) 58%);font-weight:800;border-radius:.2cqw}
b.sp{font-weight:800;color:var(--f-brand)}
u.lk{text-decoration:none;border-bottom:.18cqw solid var(--present);font-weight:700}
s.bad{text-decoration:none;color:var(--bad);font-weight:800;background:var(--bad-soft);border-radius:.3cqw;padding:0 .2cqw}
b.good{color:var(--ok);font-weight:800}

/* ---------- blocks ---------- */
.card{background:#fff;border-radius:1.6cqw;padding:1.2cqw 1.5cqw;box-shadow:0 .2cqw .4cqw rgba(20,33,50,.05),0 .8cqw 2.2cqw rgba(20,33,50,.07)}
.card.hero{font:700 2.3cqw/1.3 var(--display);color:var(--f-brand-dd);padding:1.8cqw 2.2cqw;border-left:.7cqw solid var(--f-gold)}
.card.hero b.sp{color:var(--f-gold);font-weight:800}
.b-title{display:flex;flex-direction:column;gap:1cqw;justify-content:center;flex:none}
.col:has(.b-title){justify-content:center}
.b-title .k{font:800 1.3cqw var(--body);letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.b-title h1{margin:0;font:800 6.6cqw/1 var(--display);color:var(--f-brand-dd);letter-spacing:-.02em}
.b-title p{margin:0;font:600 2cqw/1.35 var(--body);color:var(--f-muted);max-width:44cqw}
.note{border-radius:1.3cqw;padding:1cqw 1.4cqw;font:700 1.45cqw/1.35 var(--body)}
.note.big{font:800 2.4cqw/1.25 var(--display);color:var(--f-brand);padding:0;max-width:46cqw}
.note.do{background:var(--f-brand);color:#fff}
.note.do b.sp{color:var(--f-gold)}
.note.why{background:var(--f-gold-soft);color:#5a4210}
.note.plain{background:transparent;padding:0;font-weight:600;color:var(--f-muted)}
.note.win{background:linear-gradient(90deg,var(--f-gold),#f2c768);color:#2a1c00;font:800 1.6cqw/1.35 var(--display);padding:1.2cqw 1.6cqw}
.list h3,.qa h3,.kit h3{margin:0 0 .7cqw;font:800 1.15cqw var(--body);letter-spacing:.12em;color:var(--f-muted);text-transform:uppercase}
.list .grid{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:1cqw}
.list .it{background:#fff;border-radius:1.3cqw;padding:1cqw 1.2cqw;display:flex;gap:.8cqw;align-items:center;font:700 1.45cqw/1.3 var(--body);box-shadow:0 .6cqw 1.6cqw rgba(20,33,50,.07)}
.list .it .ic{font-size:2cqw;line-height:1}
.list.small .it{flex-direction:column;align-items:flex-start;gap:.4cqw;font-size:1.2cqw;padding:.8cqw 1cqw}
.list.small .it .ic{font-size:1.6cqw}
.list .it .sk{margin-left:auto;font:800 .95cqw var(--body);color:var(--f-muted);background:var(--f-canvas);border-radius:.6cqw;padding:.2cqw .5cqw}
.list.bullets .grid{gap:.7cqw}
.list.bullets .it{box-shadow:none;background:rgba(255,255,255,.75);font-weight:600;padding:.7cqw 1.1cqw}
.qa{background:#fff;border-radius:1.6cqw;padding:1.3cqw 1.6cqw;box-shadow:0 .8cqw 2.2cqw rgba(20,33,50,.08);display:flex;flex-direction:column}
.qa ol{margin:0;padding:0;list-style:none;display:grid;gap:.75cqw;counter-reset:q}
.qa li{counter-increment:q;display:grid;grid-template-columns:2.2cqw 1fr;column-gap:.6cqw;font-size:1.4cqw;line-height:1.3}
.qa li::before{content:counter(q);grid-row:span 2;width:2cqw;height:2cqw;border-radius:50%;background:var(--f-brand);color:#fff;font:800 1.1cqw/2cqw var(--display);text-align:center}
.qa .q{font-weight:700}
.qa .a{color:var(--ok);font-weight:600}
.qa .a b.sp{color:var(--ok)}
.listen{display:flex;align-items:center;gap:1cqw;background:#fff;border-radius:99cqw;padding:.6cqw 1.6cqw .6cqw .6cqw;box-shadow:0 .6cqw 1.6cqw rgba(20,33,50,.1);font:700 1.35cqw var(--body)}
.listen .wave{flex:1;height:1.6cqw;background:repeating-linear-gradient(90deg,var(--f-brand) 0 .25cqw,transparent .25cqw .6cqw);mask:linear-gradient(90deg,#000 0,#000 100%);opacity:.5;border-radius:.4cqw}
.listen .dur{color:var(--f-muted);font-size:1.15cqw}
.play{border:0;border-radius:50%;width:3.2cqw;height:3.2cqw;flex:none;background:var(--f-brand);color:#fff;display:grid;place-items:center;font-size:1.3cqw;box-shadow:0 .4cqw 1cqw rgba(21,53,123,.3)}
.play svg{width:45%;height:45%;fill:currentColor}
.play.playing{background:var(--f-gold);color:#2a1c00}
/* ▶ when stopped or paused, ❚❚ while playing: a press pauses, the next press goes on from there (note 62, 2026-10-09) */
.play .i-pause{display:none}
.play.playing .i-play{display:none}
.play.playing .i-pause{display:block}
.play.paused:not(.playing){box-shadow:0 0 0 .3cqw rgba(224,161,46,.7),0 .4cqw 1cqw rgba(21,53,123,.3)}
.mo .play.playing{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 .8cqw rgba(224,161,46,.25)}}
.scene{margin:0;position:relative;width:100%;border-radius:1.6cqw;border:.2cqw dashed #9fb2e2;background:repeating-linear-gradient(135deg,#f3f6fd 0 1.2cqw,#e9eefa 1.2cqw 2.4cqw);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5cqw;text-align:center;padding:1cqw 1.6cqw;color:var(--f-brand);flex:none;overflow:hidden}
.scene.has-img{border:0;padding:0;background:none;overflow:visible;display:block;min-height:0}
/* the picture fills the scene's own shape (`ratio`): without min-height:0 an aspect-ratio box grows to the image's
   natural height, and a 2:1 scene in a column drew at 3:2 (E04 screen 5, first draft) */
.scene.has-img > .sc-in{position:absolute;inset:0;width:auto;height:auto}
.scene.has-img img{display:block;width:100%;height:100%;object-fit:cover;border-radius:1.8cqw;box-shadow:0 .3cqw .6cqw rgba(20,33,50,.08),0 1.4cqw 3.4cqw rgba(14,36,86,.22)}
.scene{transform:var(--rest)}
.scene.tilt{--rest:perspective(150cqw) rotateY(-4deg) rotateX(1.5deg);transform-origin:50% 60%}
.ov{position:absolute;z-index:3}
.ov-say{background:#fff;border:.22cqw solid var(--f-brand);border-radius:1.6cqw;padding:.8cqw 1.2cqw;font:700 1.45cqw/1.3 var(--body);color:var(--f-brand);max-width:16cqw;box-shadow:0 1cqw 2.4cqw rgba(14,36,86,.2)}
.ov-say::after{content:"";position:absolute;left:-1.2cqw;top:45%;border:.6cqw solid transparent;border-right:.9cqw solid var(--f-brand)}
.snotifs{display:grid;gap:.9cqw;max-width:42cqw}
.snotif{background:#fff;border-radius:1.4cqw;padding:.8cqw 1.2cqw;display:grid;grid-template-columns:3.2cqw 1fr;gap:.15cqw 1cqw;box-shadow:0 .8cqw 2cqw rgba(14,36,86,.12)}
.snotif .ni{grid-row:span 2;width:3.2cqw;height:3.2cqw;border-radius:.9cqw;background:var(--f-canvas);display:grid;place-items:center;font-size:1.7cqw}
.snotif .nh{display:flex;justify-content:space-between;gap:1cqw;font:800 .95cqw var(--body);letter-spacing:.06em;color:var(--f-muted)}
.snotif .nh span{font-weight:600;letter-spacing:0}
.snotif p{margin:0;font:600 1.4cqw/1.3 var(--body)}
@keyframes sdrop{from{opacity:0;transform:translateY(-1.5cqw)}to{opacity:1;transform:none}}
.schat{display:grid;gap:.8cqw}
.sb{display:flex;gap:.8cqw;align-items:flex-start;background:#fff;border-radius:1.4cqw 1.4cqw 1.4cqw .4cqw;padding:.8cqw 1.1cqw;font:600 1.3cqw/1.32 var(--body);box-shadow:0 .6cqw 1.6cqw rgba(20,33,50,.08)}
.sb small{display:block;font:800 .95cqw var(--body);letter-spacing:.08em;color:var(--f-muted);text-transform:uppercase;margin-bottom:.15cqw}
.sb.me{background:#e2f5d6;border-radius:1.4cqw 1.4cqw .4cqw 1.4cqw;margin-left:3cqw}
.sb .av{width:3cqw;height:3cqw;border-radius:50%;background:#c9d3e6;overflow:hidden;flex:none;display:grid;place-items:center;font:800 1.1cqw var(--body)}
.sb .flag{display:block;margin-top:.3cqw;font:800 1.1cqw var(--body);color:var(--bad)}
.part.with-pic{grid-template-columns:auto 1fr 12cqw;align-items:center}
.part .ppic{width:12cqw;aspect-ratio:3/2;object-fit:cover;border-radius:1cqw;box-shadow:0 .5cqw 1.2cqw rgba(14,36,86,.18)}
.b-title.small h1{font-size:5cqw}
.scene .si{font-size:2.2cqw;line-height:1;opacity:.7}
.scene .sc{font:700 1.3cqw/1.3 var(--body)}
.scene .sn{font:800 .95cqw var(--body);letter-spacing:.12em;color:var(--f-muted);text-transform:uppercase}

/* PPF parts */
.ppf{display:grid;gap:1.1cqw;perspective:90cqw}
.part{display:grid;grid-template-columns:auto 1fr;gap:1.2cqw;align-items:start;background:#fff;border-radius:1.8cqw;padding:1.2cqw 1.5cqw;box-shadow:0 .2cqw .4cqw rgba(20,33,50,.05),0 .8cqw 2.2cqw rgba(20,33,50,.07);transform:var(--rest)}
.part.dim{opacity:.62;--rest:translate3d(0,0,-1.6cqw)}
.part.focus{--rest:translate3d(1cqw,0,2.6cqw);box-shadow:0 1.6cqw 4cqw rgba(14,36,86,.2);opacity:1}
.tag{font:800 1.02cqw var(--display);letter-spacing:.06em;color:#fff;border-radius:.9cqw;padding:.5cqw .9cqw;white-space:nowrap;display:inline-block;line-height:1.25}
.tag small{display:block;font:700 .9cqw var(--body);letter-spacing:0;opacity:.9;text-transform:none;white-space:normal}
.part p{margin:0;font:600 1.7cqw/1.38 var(--body)}
.t-P{background:var(--past)} .t-P2{background:var(--present)} .t-F{background:var(--future)}
/* OREO (opinion, reason, example, opinion again) and any tag without a colour of its own (t-x) */
.t-O{background:var(--op)} .t-R{background:var(--rs)} .t-E{background:var(--ex)} .t-O2{background:var(--op2)} .t-x{background:#4f5d75}
.c-P{color:var(--past)} .c-P2{color:var(--present)} .c-F{color:var(--future)}
.s-P{background:var(--past-soft)} .s-P2{background:var(--present-soft)} .s-F{background:var(--future-soft)}

/* word wall */
.ww{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.1cqw;flex:1;min-height:0}
.wcard{perspective:60cqw;min-height:0}
.wcard .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.wcard.flip .in{transform:rotateY(180deg)}
.wcard .face{position:absolute;inset:0;border-radius:1.6cqw;background:#fff;box-shadow:0 .8cqw 2cqw rgba(20,33,50,.08);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;padding:1cqw 1.3cqw;gap:.35cqw}
.wcard .front{align-items:center;text-align:center}
.wcard .front .ic{font-size:3cqw;line-height:1}
.wcard .front b{font:800 1.9cqw/1.15 var(--display);color:var(--f-brand-dd)}
.wcard .front i{font-style:normal;font-size:1.15cqw;color:var(--f-muted)}
.wcard .back{transform:rotateY(180deg);background:var(--f-brand);color:#fff}
.wcard .back b{font:800 1.35cqw var(--display);color:var(--f-gold)}
.wcard .back span{font:600 1.15cqw/1.3 var(--body);color:#dfe7fb}
.wcard .back q{font:700 1.3cqw/1.3 var(--body)}
.wcard.next .front{outline:.3cqw solid var(--f-gold);outline-offset:-.3cqw}

/* game */
.game{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.1cqw;flex:1;min-height:0}
.gcard{background:#fff;border-radius:1.5cqw;padding:1cqw 1.2cqw;display:flex;flex-direction:column;gap:.5cqw;box-shadow:0 .8cqw 2cqw rgba(20,33,50,.08);position:relative;min-height:0}
.gcard .n{position:absolute;right:1cqw;top:.8cqw;font:800 1.1cqw var(--display);color:var(--f-line)}
.gcard .src{font:800 1.05cqw var(--body);letter-spacing:.06em;color:var(--f-muted)}
.gcard .tx{font:600 1.3cqw/1.32 var(--body);flex:1}
.gcard .ans{display:flex;align-items:center;gap:.7cqw;flex-wrap:wrap;font:700 1.25cqw var(--body);color:var(--f-brand)}
.gcard .ans .chip{background:var(--f-gold);color:#2a1c00;border-radius:99cqw;padding:.25cqw .9cqw;font:800 1.15cqw var(--body)}
.gcard.now{box-shadow:0 0 0 .3cqw var(--f-gold),0 1cqw 2.4cqw rgba(20,33,50,.12)}
.gcard .callrow{display:flex;gap:.8cqw;align-items:center}

/* time control */
.time{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:1.3cqw;flex:1;min-height:0}
.tcol{background:#fff;border-radius:1.6cqw;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 .8cqw 2cqw rgba(20,33,50,.08)}
.tcol .th{padding:.9cqw 1.2cqw;color:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:1cqw}
.tcol .th b{font:800 1.3cqw var(--display);letter-spacing:.05em}
.tcol .th span{font:700 1.15cqw var(--body);opacity:.95}
.tcol .tb{padding:1cqw 1.3cqw;display:flex;flex-direction:column;gap:.55cqw;font-size:1.42cqw;line-height:1.3}
.tcol .hint{font:700 1.15cqw var(--body);color:var(--f-muted);padding-bottom:.3cqw;border-bottom:.12cqw solid var(--f-line)}
.tcol .ex{font-weight:600}
.tcol .ex b.sp{color:inherit;background:var(--f-gold-soft);border-radius:.2cqw;padding:0 .15cqw}
.tcol .pair{margin-top:.25cqw;display:grid;gap:.15cqw}
.wr{color:var(--f-muted);font-weight:600}
.wr::before{content:"✗ ";color:var(--bad);font-weight:800}
.rt{font-weight:700}
.rt::before{content:"✓ ";color:var(--ok);font-weight:800}

/* fix it */
.fix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.1cqw;flex:1;min-height:0}
.fcard{background:#fff;border-radius:1.5cqw;padding:1cqw 1.2cqw;display:flex;flex-direction:column;gap:.55cqw;box-shadow:0 .8cqw 2cqw rgba(20,33,50,.08);border-top:.45cqw solid var(--c)}
.fcard .lab{font:800 1cqw var(--body);letter-spacing:.08em;color:var(--c);text-transform:uppercase}
.fcard .wrong{font:700 1.4cqw/1.3 var(--body)}
.fcard .rem{font:600 1.08cqw/1.3 var(--body);color:var(--f-muted);background:var(--f-canvas);border-radius:.7cqw;padding:.35cqw .7cqw}
.fcard .right{font:700 1.4cqw/1.3 var(--body);margin-top:auto}
.fcard .right::before{content:"✓ ";color:var(--ok)}
.fcard.now{box-shadow:0 0 0 .3cqw var(--f-gold),0 1cqw 2.4cqw rgba(20,33,50,.12)}

/* kit rows (build a reply, retry, transfer) */
.kit{display:flex;flex-direction:column;gap:.9cqw}
.krow{background:#fff;border-radius:1.5cqw;padding:.9cqw 1.2cqw;display:grid;grid-template-columns:11.2cqw 1fr;gap:.4cqw 1.2cqw;box-shadow:0 .6cqw 1.6cqw rgba(20,33,50,.07);align-items:start}
.krow .tag{grid-row:span 3;align-self:start}
.krow .ask{font:700 1.3cqw/1.3 var(--body)}
.krow .st{font:700 1.2cqw/1.3 var(--body);color:var(--f-brand);background:var(--f-gold-soft);border-radius:.6cqw;padding:.2cqw .6cqw;justify-self:start}
.krow .ex{font:600 1.25cqw/1.35 var(--body);color:var(--f-ink);border-left:.3cqw solid var(--c);padding-left:.8cqw}
.kit.compact .krow{grid-template-columns:8cqw 1fr;padding:.65cqw 1cqw;align-items:center}
.kit.compact .krow .st{font-size:1.2cqw}

/* task cards */
.tcards{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:1.2cqw;flex:1;min-height:0}
.tcard{background:#fff;border-radius:1.6cqw;box-shadow:0 .8cqw 2cqw rgba(20,33,50,.08);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.tcard .top{display:flex;gap:1cqw;align-items:center;padding:.9cqw 1.1cqw .5cqw}
.tcard .top .scene{width:14cqw;flex:none;border-radius:1cqw;padding:.3cqw;gap:0}
.tcard .top .scene .sc,.tcard .top .scene .sn{display:none}
.tcard .top .scene .si{font-size:1.6cqw}
.tcard .top .scene.has-img img{border-radius:1cqw;box-shadow:0 .4cqw 1cqw rgba(14,36,86,.15)}
.tcards.many .tcard .top{flex-direction:column;align-items:stretch;gap:.6cqw}
.tcards.many .tcard .top .scene{width:auto}
.tcards.many .tcard h3{font-size:1.7cqw}
.tcard .letter{font:800 1cqw var(--body);letter-spacing:.1em;color:var(--f-muted);text-transform:uppercase}
.tcard h3{margin:0;font:800 1.8cqw/1.15 var(--display);color:var(--f-brand-dd)}
.tcard .tfacts{display:grid;grid-template-columns:1fr 1fr;gap:.8cqw;padding:.3cqw 1.1cqw 0;font:600 1.2cqw/1.3 var(--body)}
.tcard .tfacts b{font:800 1cqw var(--body);letter-spacing:.06em;color:var(--f-muted);text-transform:uppercase}
.tcard .tfacts ul.pts{margin:.2cqw 0 0}
.ph-facts .tfacts{display:grid;gap:8px;margin-top:10px;font:600 14px/1.4 var(--body)}
.ph-facts .tfacts b{font:800 12px var(--body);letter-spacing:.06em;color:var(--f-muted);text-transform:uppercase}
.tcard .notes{display:grid;gap:.7cqw;padding:.5cqw 1.1cqw 1.1cqw}
.tcard .nt{display:grid;grid-template-columns:2.2cqw 1fr;gap:.7cqw;font:600 1.36cqw/1.32 var(--body);align-items:start}
.tcard .nt .tag{padding:.2cqw 0;text-align:center;font-size:.95cqw}
.dolist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1cqw;flex:none}
.dolist div{background:var(--f-brand);color:#fff;border-radius:1.2cqw;padding:.8cqw 1cqw;font:700 1.2cqw/1.3 var(--body);display:flex;gap:.7cqw;align-items:flex-start}
.dolist b{font:800 1.4cqw var(--display);color:var(--f-gold)}

/* compare (before / after) */
.cmp{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:1.4cqw;align-items:stretch}
.cmp .bef{background:#fff;border-radius:1.6cqw;padding:1.3cqw 1.5cqw;display:flex;flex-direction:column;gap:.6cqw;justify-content:center;color:var(--f-muted);box-shadow:0 .6cqw 1.6cqw rgba(20,33,50,.06)}
.cmp .bef p{margin:0;font:700 1.7cqw/1.35 var(--display)}
.cmp .lb{font:800 1cqw var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--f-muted)}
.cmp .aft{background:#fff;border-radius:1.6cqw;padding:1.1cqw 1.4cqw;display:grid;gap:.6cqw;box-shadow:0 1.2cqw 3cqw rgba(14,36,86,.14);border-left:.6cqw solid var(--f-gold)}
.cmp .ln{display:grid;grid-template-columns:2.4cqw 1fr;gap:.8cqw;font:600 1.35cqw/1.35 var(--body);align-items:start}
.cmp .ln .tag{text-align:center;padding:.25cqw 0}
/* compare with tags:false: each side is a column (card + the listener's reaction as chat bubbles) */
.cmp.plain{align-items:start}
.cmp .ccol{display:flex;flex-direction:column;gap:1cqw;min-width:0}
.cmp.plain .bef,.cmp.plain .aft{display:flex;flex-direction:column;gap:.5cqw;justify-content:flex-start}
.cmp .atx{margin:0;font:600 1.42cqw/1.42 var(--body);color:var(--f-ink)}
.cmp.multi .atx{font-size:1.32cqw}
.cmp .creact{gap:.6cqw}
.cmp .creact .sb{font-size:1.32cqw}
.cmp.plain .ccol:first-child .creact .sb{margin-right:0}

/* summary */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.1cqw;flex:1;min-height:0;grid-template-rows:repeat(2,minmax(0,1fr))}
.sum .it{background:#fff;border-radius:1.5cqw;padding:1.1cqw 1.4cqw;box-shadow:0 .8cqw 2cqw rgba(20,33,50,.08);display:flex;flex-direction:column;gap:.6cqw;justify-content:center}
.sum .ic{font-size:2.8cqw;line-height:1}
.sum b{font:800 1.75cqw/1.2 var(--display);color:var(--f-brand-dd)}
.sum .stx{font:600 1.4cqw/1.35 var(--body);color:var(--f-muted)}
.sum .stx ul.pts{margin:0}

/* step numbers (prep page only) */
.numbered [data-at]:not([data-at="0"]){position:relative}
.numbered [data-at]:not([data-at="0"])::after{content:attr(data-at);position:absolute;top:-.6cqw;left:-.6cqw;width:2.2cqw;height:2.2cqw;border-radius:50%;background:var(--bad);color:#fff;font:800 1.15cqw/2.2cqw var(--display);text-align:center;z-index:6;box-shadow:0 .2cqw .6cqw rgba(0,0,0,.25)}
.numbered .wcard[data-at]::after{left:.4cqw;top:.4cqw}

/* ======================= iPHONE FRAME ======================= */
/* a real-phone look: thin even bezel (~3% of width), big corner radius, dynamic island */
.iph{container-type:inline-size;position:relative;aspect-ratio:9/19.5;background:#1c1c1f;border-radius:14%/6.46%;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 0 0 2px #0b0b0d,0 18px 40px rgba(13,34,83,.28)}
.iph-scr{position:absolute;inset:3cqw;border-radius:11.5cqw;overflow:hidden;background:#fff;display:flex;flex-direction:column;color:#111}
.iph-island{position:absolute;top:2.6cqw;left:50%;transform:translateX(-50%);width:31cqw;height:8.6cqw;border-radius:5cqw;background:#000;z-index:4}
.iph-status{flex:none;height:13cqw;display:flex;align-items:center;justify-content:space-between;padding:1.4cqw 8cqw 0 9cqw;font:700 4.1cqw var(--body);position:relative;z-index:3}
.iph-status .ic{display:flex;gap:1.4cqw;align-items:center}
.iph-status .ic i{display:block;background:currentColor;border-radius:.6cqw}
.iph-app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.iph{transform:var(--rest)}
.iph.tilt{--rest:perspective(120cqw) rotateY(10deg) rotateZ(-1.5deg)}
.st-body .iph{position:absolute;top:.6cqw;left:50%;width:var(--pw,24cqw);margin-left:calc(var(--pw,24cqw) / -2)}

/* apps inside the frame (sizes in % of the phone width) */
.app-hd{display:flex;align-items:center;gap:2.6cqw;padding:2cqw 4cqw 3cqw;border-bottom:1px solid rgba(0,0,0,.08);background:#f7f7f7;flex:none}
.app-hd .back{font:700 6cqw/1 var(--body);color:#1a7f64}
.app-hd .av{width:10cqw;height:10cqw;border-radius:50%;background:#c9d3e6;display:grid;place-items:center;font:800 3.6cqw var(--body);color:#33415c;overflow:hidden;flex:none}
.app-hd b{display:block;font:800 4.6cqw/1.15 var(--body)}
.app-hd small{display:block;font:600 3.4cqw var(--body);color:#6b7280}
.chat{flex:1;background:#e9e2d6;padding:3.5cqw 3.5cqw;display:flex;flex-direction:column;gap:2.2cqw;overflow:hidden}
.bub{flex:none;background:#fff;border-radius:3.4cqw 3.4cqw 3.4cqw 1cqw;padding:2.2cqw 3cqw 1.6cqw;font:500 4.5cqw/1.35 var(--body);max-width:88%;align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.08);position:relative}
.bub.me{align-self:flex-end;background:#d7f6c9;border-radius:3.4cqw 3.4cqw 1cqw 3.4cqw}
.bub time{display:block;text-align:right;font:600 2.9cqw var(--body);color:#8a8f98;margin-top:.6cqw}
.bub.quote{font-style:italic;color:#333;font-size:4.2cqw}
.bub.typing{opacity:.75;border:1px dashed #9cc49a}
.vnote{display:flex;align-items:center;gap:2.4cqw;min-width:62cqw}
.vnote .play{width:11cqw;height:11cqw;font-size:4cqw;background:#1a7f64;box-shadow:none}
.vnote .bars{flex:1;height:7cqw;background:repeating-linear-gradient(90deg,#7e8a84 0 .9cqw,transparent .9cqw 2cqw);-webkit-mask:linear-gradient(90deg,#000 0 100%);mask-image:radial-gradient(ellipse 60% 100% at 30% 50%,#000 60%,rgba(0,0,0,.45));border-radius:1cqw}
.vnote .d{font:700 3.2cqw var(--body);color:#6b7280}
.sms{flex:1;background:#fff;padding:3.5cqw;display:flex;flex-direction:column;gap:2.4cqw;overflow:hidden}
.sms .bub{background:#e9e9eb;box-shadow:none}
.sms .day{text-align:center;font:600 3cqw var(--body);color:#8a8f98}
.mail{flex:1;background:#fff;padding:3.5cqw 4.5cqw;display:flex;flex-direction:column;gap:2cqw;overflow:hidden;font-size:4.2cqw;line-height:1.35}
.mail .from{display:flex;gap:2.4cqw;align-items:center}
.mail .from .av{width:9cqw;height:9cqw;border-radius:50%;background:#5c6779;color:#fff;display:grid;place-items:center;font:800 3.6cqw var(--body);flex:none}
.mail .from b{display:block;font:800 4.2cqw var(--body)}
.mail .from small{display:block;font:600 3.2cqw var(--body);color:#6b7280;word-break:break-all}
.mail .subj{font:800 5cqw/1.2 var(--body)}
.lock{flex:1;background:linear-gradient(170deg,#2b4a8f 0,#6a4c93 55%,#d07a6a 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:1cqw 3.5cqw;gap:2.4cqw;overflow:hidden}
.lock .d{font:600 4.2cqw var(--body);opacity:.9}
.lock .t{font:700 20cqw/1 var(--display);letter-spacing:-.02em;margin-bottom:2cqw}
.notif{flex:none;width:100%;background:rgba(255,255,255,.82);color:#111;border-radius:4.5cqw;padding:2.6cqw 3.2cqw;display:grid;grid-template-columns:8cqw 1fr;gap:.6cqw 2.4cqw;backdrop-filter:blur(6px)}
.notif .ni{grid-row:span 2;width:8cqw;height:8cqw;border-radius:2cqw;background:#fff;display:grid;place-items:center;font-size:4.6cqw}
.notif .nh{display:flex;justify-content:space-between;font:800 3cqw var(--body);letter-spacing:.03em;color:#333}
.notif .nh span{font-weight:600;color:#666}
.notif p{margin:0;font:600 3.9cqw/1.3 var(--body)}
.notif:nth-child(3){animation-delay:.5s}.notif:nth-child(4){animation-delay:1s}.notif:nth-child(5){animation-delay:1.5s}
@keyframes drop{from{opacity:0;transform:translateY(-6cqw) scale(.96)}to{opacity:1;transform:none}}
.call{flex:1;background:linear-gradient(180deg,#2a3346 0,#121722 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:8cqw 6cqw 6cqw;gap:3cqw;text-align:center}
.call .cav{width:24cqw;height:24cqw;border-radius:50%;background:#4a5568;display:grid;place-items:center;font:800 9cqw var(--display);color:#e2e8f0}
.call b{font:700 7.4cqw/1.1 var(--display)}
.call small{font:600 4cqw var(--body);color:#a0aec0}
.call .lnk{display:flex;align-items:center;gap:2.4cqw;background:rgba(255,255,255,.1);border-radius:99cqw;padding:1.6cqw 4cqw 1.6cqw 1.6cqw;font:700 3.8cqw var(--body);margin-top:3cqw}
.call .lnk .play{width:10cqw;height:10cqw;font-size:3.6cqw;background:#38a169;box-shadow:none}
.call .btns{display:flex;gap:22cqw;margin-top:auto;margin-bottom:4cqw}
.call .btns i{width:17cqw;height:17cqw;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:7cqw}
.call .btns i:first-child{background:#e53e3e}.call .btns i:last-child{background:#38a169}
.stamp{position:absolute;z-index:5;left:50%;top:44%;--rest:translate(-50%,-50%) rotate(-12deg);transform:var(--rest);border:1.4cqw solid currentColor;border-radius:3cqw;padding:1cqw 5cqw;font:800 12cqw/1 var(--display);letter-spacing:.06em;background:rgba(255,255,255,.88)}
.stamp.bad{color:var(--bad)} .stamp.ok{color:var(--ok)}
.reason{flex:none;margin:0 3.5cqw 3cqw;background:#fff;border-radius:3.4cqw;padding:2.6cqw 3.4cqw;font:700 4.3cqw/1.35 var(--body);box-shadow:0 1.4cqw 4cqw rgba(0,0,0,.18);border-left:1.6cqw solid var(--ok);position:relative;z-index:6}
.reason.bad{border-left-color:var(--bad)}
.chat .reason,.sms .reason,.mail .reason{flex:none;margin:1cqw 0 0}

/* ======================= TEACHER SIDE PANELS (class.html, review.html) ======================= */
.ep-page{min-height:100vh;min-height:100dvh}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--card);color:var(--fg);box-shadow:-12px 0 40px rgba(0,0,0,.25);z-index:50;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .3s ease;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font:800 16px var(--display);flex:1}
.drawer header button{border:0;background:var(--bg);color:var(--fg);border-radius:10px;padding:6px 10px;font:800 14px var(--body)}
.drawer .dbody{flex:1;overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.tp-meta{display:flex;flex-wrap:wrap;gap:6px}
.tp-meta span{background:var(--bg);border-radius:99px;padding:3px 10px;font:700 12.5px var(--body);color:var(--muted)}
.tp-sec h5{margin:0 0 4px;font:800 11.5px var(--body);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.tp-sec p{margin:0;font-size:14.5px}
.tp-flex{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:14px;line-height:1.4}
.tp-flex li{padding-left:12px;position:relative}
.tp-flex li::before{content:"";position:absolute;left:0;top:.55em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.tp-flex b{font-weight:800}
.tp-steps{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.tp-steps li{display:grid;grid-template-columns:54px 1fr;gap:8px;font-size:14.5px;padding:6px 8px;border-radius:10px}
.tp-steps li b{font:800 11.5px var(--body);color:var(--muted);padding-top:2px}
.tp-steps li.now{background:var(--assign-soft);color:#3b2600}
.tp-steps li.now b{color:var(--assign)}
.tp-steps li.done{opacity:.6}
.tp-more{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}
.tp-more b{display:block;font:800 11.5px var(--body);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
.keys{font-size:12.5px;color:var(--muted)}
.keys kbd{font:700 11.5px var(--body);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px}

/* name panel */
.np-fake{background:var(--assign-soft);color:#7a4a00;border-radius:10px;padding:8px 10px;font:700 12.5px/1.4 var(--body)}
.np-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.np-grid button{border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:8px 10px;text-align:left;font:700 14px var(--body)}
.np-grid small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.np-grid button.cur{border-color:var(--brand)}
.np-grid button.m-used{border-color:var(--ok)} .np-grid button.m-practise{border-color:var(--assign);background:var(--assign-soft);color:#3b2600}
.np-sheet{background:var(--bg);border-radius:14px;padding:12px;display:grid;gap:10px}
.np-sheet .ans{background:var(--card);border-radius:12px;padding:10px 12px;font-size:15px}
.np-acts{display:flex;flex-wrap:wrap;gap:8px}
.np-acts button{border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:7px 14px;font:800 13px var(--body)}
.np-acts button.on{border-color:var(--gold);color:#7a4a00;background:var(--assign-soft)}
.np-note{font-size:13px;color:var(--muted)}

/* ======================= class.html ======================= */
body.ep-class{background:#0b1324;overflow:hidden}
.class-wrap{position:fixed;inset:0;display:grid;place-items:center}
.class-wrap .ep-stage{width:min(100vw,calc(100vh * 16 / 9));width:min(100vw,calc(100dvh * 16 / 9))}
.hud{position:fixed;left:50%;top:10px;transform:translateX(-50%);font:700 12px var(--body);color:#dfe7fb;background:rgba(11,19,36,.82);border-radius:99px;padding:5px 12px;z-index:20;pointer-events:none;transition:opacity .6s}
.hud.gone{opacity:0}
.hud kbd{font:700 11px var(--body);border:1px solid #33456b;border-radius:4px;padding:0 4px}

/* ======================= phone.html (the learner's own phone) ======================= */
body.ep-phone{background:#f3f5fb;color:#16202e}
.ph{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--f-canvas);color:var(--f-ink);font:15px/1.45 var(--body)}
.ph-scroll{flex:1;display:flex;flex-direction:column}
.ph-body{flex:1}
.ph-top{position:sticky;top:0;z-index:5;background:var(--f-brand);color:#fff;padding:10px 16px 12px;display:grid;gap:4px}
.ph-top .row{display:flex;align-items:center;gap:8px;font:700 12px var(--body);color:#c7d4f3;letter-spacing:.04em}
.ph-top .live{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border-radius:99px;padding:2px 9px;color:#fff;border:0;font:700 12px var(--body)}
.ph-top .live i{width:7px;height:7px;border-radius:50%;background:#7ee2a8}
.ph-top .live.off i{background:#f5b450}
.ph-top h1{margin:0;font:800 18px/1.2 var(--display)}
.ph-top .ask{margin:0;font:600 14px/1.35 var(--body);color:#e6ecfb}
.ph-prog{height:4px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.ph-prog i{display:block;height:100%;background:var(--f-gold)}
.ph-body{flex:1;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.ph-nav{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(238,242,251,.94);backdrop-filter:blur(8px);border-top:1px solid var(--f-line)}
.ph-nav button{flex:1;border:2px solid var(--f-line);background:#fff;color:var(--f-ink);border-radius:14px;padding:11px 12px;font:800 15px var(--body)}
.ph-nav button.pri{background:var(--f-brand);border-color:var(--f-brand);color:#fff}
.ph-nav span{font:700 12px var(--body);color:var(--f-muted);white-space:nowrap}
.ph-card{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 4px 14px rgba(20,33,50,.06)}
.ph-cap{font:800 11px var(--body);letter-spacing:.12em;color:var(--f-muted);text-transform:uppercase;margin:0}
.ph-q{font:600 15px/1.4 var(--body);margin:0}
.ph-opts{display:grid;gap:8px;margin-top:10px}
.ph-opts.two{grid-template-columns:1fr 1fr}
.ph-opts button{border:2px solid var(--f-line);background:#fff;color:var(--f-ink);border-radius:13px;padding:11px 12px;font:700 15px/1.3 var(--body);text-align:left;min-height:46px}
.ph-opts.two button{text-align:center;font:800 17px var(--display);padding:16px 6px}
.ph-opts button.sel{border-color:var(--f-brand);background:#eaf0fb}
.ph-opts button.right{border-color:var(--ok);background:var(--ok-soft)}
.ph-opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}

.ph-fb{margin:8px 0 0;font:700 13.5px/1.4 var(--body);color:var(--f-muted)}
.ph-fb.ok{color:var(--ok)} .ph-fb.no{color:var(--bad)}
.ph-old{opacity:.7}
.ph-sort .sent{display:grid;gap:6px}
.ph-sort .chips{display:flex;gap:6px;margin-top:8px}
.ph-sort .chips button{flex:1;border:0;border-radius:10px;padding:8px 4px;font:800 12.5px var(--body);color:#fff}
.ph-bins{display:grid;gap:8px}
.ph-bin{border:2px dashed var(--f-line);border-radius:14px;padding:8px 10px;background:#fff;min-height:48px}
.ph-bin>b{font:800 11px var(--body);letter-spacing:.1em;display:block;margin-bottom:4px}
.ph-bin .pl{display:flex;justify-content:space-between;gap:8px;align-items:center;font:600 14px var(--body);padding:4px 0;border-top:1px solid var(--f-line)}
.ph-bin .pl button{border:0;background:var(--f-canvas);border-radius:8px;padding:3px 8px;font:700 12px var(--body);color:var(--f-muted)}
.ph-bin .pl.ok::before{content:"✓";color:var(--ok);font-weight:800}
.ph-bin .pl.no::before{content:"✗";color:var(--bad);font-weight:800}
.ph-bin .pl span{flex:1}
.ph-starters{display:flex;flex-wrap:wrap;gap:6px}
.ph-starters button{border:0;background:var(--f-gold-soft);color:#4a3507;border-radius:99px;padding:6px 11px;font:700 13px var(--body)}
.ph textarea{width:100%;min-height:120px;border:2px solid var(--f-brand);border-radius:14px;padding:10px 12px;font:500 16px/1.45 var(--body);color:var(--f-ink);background:#fff;resize:vertical}
.ph .btn{border:0;border-radius:14px;padding:12px 14px;font:800 15px var(--body);background:var(--f-brand);color:#fff}
.ph .btn.sec{background:#fff;color:var(--f-brand);border:2px solid var(--f-line)}
.ph-bubble{background:#fff;border-radius:16px 16px 16px 4px;padding:10px 12px;font:500 15px/1.45 var(--body);box-shadow:0 2px 6px rgba(20,33,50,.06)}
.ph-bubble.me{background:#e4effa;border-radius:16px 16px 4px 16px}
.ph-bubble small{display:block;font:800 11px var(--body);letter-spacing:.08em;color:var(--f-muted);text-transform:uppercase;margin-bottom:3px}
.ph-bubble.saved{border:2px solid var(--ok)}
.ph-who{display:flex;align-items:center;gap:8px;font:800 13px var(--body);color:var(--f-muted)}
.ph-who .av{width:30px;height:30px;border-radius:50%;background:#c9d3e6;overflow:hidden;display:grid;place-items:center;font:800 12px var(--body);color:#33415c}
.ph-voice{display:flex;align-items:center;gap:10px;background:var(--ok-soft);border-radius:14px;padding:8px 12px;font:700 14px var(--body);color:var(--ok)}
.ph-voice .play{width:40px;height:40px;font-size:15px;background:var(--ok)}
.ph-voice .play.paused:not(.playing){box-shadow:0 0 0 3px rgba(224,161,46,.75)}
.ph-voice i{flex:1;height:14px;border-radius:7px;background:repeating-linear-gradient(90deg,var(--ok) 0 3px,transparent 3px 7px);opacity:.6}
.ph-qs{margin:6px 0 0;padding-left:20px;font-size:14px;display:grid;gap:2px}
.ph-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph-cards button{border:2px solid var(--f-line);background:#fff;border-radius:12px;padding:8px 4px;font:800 15px var(--display);color:var(--f-brand)}
.ph-cards button small{display:block;font:700 10.5px var(--body);color:var(--f-muted)}
.ph-cards button.sel{border-color:var(--f-brand);background:#eaf0fb}
.ph-notes{display:grid;gap:6px;font-size:14px}
.ph-notes div{display:grid;grid-template-columns:62px 1fr;gap:8px}
.ph-notes b{font:800 11px var(--body);letter-spacing:.06em;padding-top:2px}
.ph-mic{align-self:center;width:128px;height:128px;border-radius:50%;border:0;background:var(--f-brand);color:#fff;font:800 15px/1.2 var(--display);box-shadow:0 0 0 10px rgba(21,53,123,.14),0 0 0 22px rgba(21,53,123,.06);touch-action:none;-webkit-touch-callout:none}
.ph-mic.on{background:var(--bad);box-shadow:0 0 0 10px rgba(192,64,92,.2),0 0 0 22px rgba(192,64,92,.08)}
.ph-mic big{display:block;font:800 26px var(--display);margin-top:4px}
.ph-ticks{display:grid;gap:8px}
.ph-ticks button{border:2px solid var(--f-line);background:#fff;border-radius:12px;padding:10px 12px;font:700 14.5px var(--body);text-align:left;display:flex;gap:10px;align-items:center;color:var(--f-ink)}
.ph-ticks button::before{content:"";width:20px;height:20px;border-radius:6px;border:2px solid var(--f-line);flex:none}
.ph-ticks button[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.ph-ticks button[aria-pressed="true"]::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px #fff}
.ph-tabs{display:flex;background:#fff;border-radius:12px;padding:4px;gap:4px}
.ph-tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font:800 14px var(--body);color:var(--f-muted)}
.ph-tabs button[aria-pressed="true"]{background:var(--f-brand);color:#fff}
.ph-word{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.ph-word .ic{font-size:24px;grid-row:span 2}
.ph-word b{font:800 16px var(--display);color:var(--f-brand-dd)}
.ph-word i{font-style:normal;color:var(--f-muted);font-size:13px}
.ph-word .play{width:36px;height:36px;font-size:13px;grid-row:span 2}
.ph-word .mean{grid-column:1 / -1;font-size:14px;border-top:1px solid var(--f-line);padding-top:6px;margin-top:4px}
.ph-word.now{box-shadow:0 0 0 3px var(--f-gold)}
.ph-word.closed .mean{display:none}
.ph-look h2{margin:0;font:800 20px/1.25 var(--display);color:var(--f-brand-dd)}
.ph-look ul{margin:8px 0 0;padding-left:20px}
.ph-done{text-align:center;color:var(--f-muted);font:600 14px var(--body)}
.ph-tag{display:inline-block;color:#fff;border-radius:7px;padding:1px 7px;font:800 11px var(--body);letter-spacing:.06em}

/* ======================= review.html ======================= */
body.ep-review{background:var(--bg)}
.rv{max-width:1500px;margin:0 auto;padding:14px 16px 48px;display:flex;flex-direction:column;gap:14px}
.rv-banner{background:var(--assign-soft);color:#6b4100;border-radius:12px;padding:10px 14px;font:700 13.5px/1.45 var(--body)}
.rv-hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.rv-hd h1{margin:0;font:800 20px var(--display);color:var(--brand);flex:1;min-width:220px}
.rv-hd select{font:700 14px var(--body);border-radius:10px;border:2px solid var(--line);padding:7px 10px;background:var(--card);color:var(--fg);max-width:100%}
.rv-hd button{border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 14px;font:800 14px var(--body)}

.rv-hd .pos{font:700 13px var(--body);color:var(--muted)}
.rv-grid{display:grid;grid-template-columns:minmax(0,1fr) 284px 230px;gap:16px;align-items:start}
.rv-grid .ep-stage{border-radius:14px;box-shadow:0 14px 40px rgba(14,36,86,.2)}

.rv-phone .iph-scr.phscr{background:var(--f-brand);color:#fff}
.rv-phone .iph-app{background:var(--f-canvas)}
.rv-phone .ph{min-height:0;height:100%;max-width:none;overflow:hidden;color:var(--f-ink)}
.rv-phone .ph-scroll{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.rv-phone .ph-top{position:static;padding:4px 12px 10px}
.rv-phone .ph-top h1{font-size:15px}
.rv-phone .ph-top .ask{font-size:12.5px}

.rv-phone .ph-nav button{padding:8px;font-size:13.5px}
.rv-phone .ph-opts button{font-size:13.5px;padding:8px 10px;min-height:0}
.rv-phone .ph-opts.two button{font-size:15px;padding:11px 6px}
.rv-phone .ph-mic{width:104px;height:104px}
.rv-phone .ph textarea{min-height:90px;font-size:14px}
.rv-leaves{display:grid;gap:10px}
.rv-leaves div{background:var(--card);border-radius:12px;padding:10px 12px;font-size:14px}
.rv-leaves b{display:block;font:800 11.5px var(--body);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:2px}

@media (max-width:760px){ .rv-grid{grid-template-columns:minmax(0,1fr)} .rv-leaves{grid-template-columns:minmax(0,1fr)} .rv-teacher{grid-template-columns:minmax(0,1fr)} .rv-phone .iph{max-width:300px} }

/* ======================= prep.html ======================= */
body.ep-prep{background:var(--bg)}
.pp{max-width:1240px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:22px}
.pp h1{margin:0;font:800 28px/1.15 var(--display);color:var(--brand)}
.pp .kicker{font:800 12px var(--body);letter-spacing:.14em;color:var(--gold);text-transform:uppercase}

.snap{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.snap div{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14.5px}
.snap b{display:block;font:800 11.5px var(--body);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}

.prow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start;background:var(--card);border-radius:18px;padding:16px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{ .prow{break-inside:avoid} }


/* ======================= MOTION AND SOUND (src/ep/motion.js, fx.js) =======================
   Everything that moves runs only under html.mo (Motion switch on, no prefers-reduced-motion).
   Transforms and opacity only, so layout never shifts. Easing: spring-like with a little overshoot. */
html:not(.mo) .ep-stage, html:not(.mo) .ep-stage *, html:not(.mo) .ph, html:not(.mo) .ph *{animation:none!important;transition:none!important}
.mo [data-at]{transition:opacity .25s ease, visibility .25s}
.mo .w{transition:background .3s, color .3s, border-color .3s, box-shadow .3s, transform .35s cubic-bezier(.34,1.56,.64,1)}
.mo .part{transition:transform .55s cubic-bezier(.34,1.4,.64,1), box-shadow .5s, opacity .45s}
.mo .wcard .in{transition:transform .6s cubic-bezier(.34,1.3,.64,1)}

/* 1 arrive: pop in with depth; siblings are staggered by --d */
.mo .arrive,.mo .scene.has-img.arrive{animation:ep-arrive .5s cubic-bezier(.2,.8,.3,1) var(--d,0ms) both, ep-shadow .7s ease-out var(--d,0ms) both}
@keyframes ep-arrive{
  0%{opacity:0;transform:var(--rest) perspective(60cqw) translateY(1.4cqw) rotateX(10deg) scale(.92)}
  60%{opacity:1;transform:var(--rest) perspective(60cqw) translateY(-.15cqw) rotateX(0deg) scale(1.03)}
  100%{opacity:1;transform:var(--rest) perspective(60cqw) translateY(0) rotateX(0deg) scale(1)}}
@keyframes ep-shadow{from{box-shadow:0 0 0 rgba(14,36,86,0)}}

/* 2 point: swell and settle, with a gold ring */
.play,.score button,.gcard,.fcard,.krow{position:relative}
.mo .swell{animation:ep-swell .7s cubic-bezier(.34,1.56,.64,1)}
.mo .part.swell,.mo .gcard.swell,.mo .krow.swell{animation-name:ep-swell-s}
.mo .swell::after{content:"";position:absolute;inset:-.25em;border-radius:inherit;border:.18em solid var(--f-gold);pointer-events:none;animation:ep-ring .7s ease-out both}
@keyframes ep-swell{0%{transform:var(--rest) scale(1)}35%{transform:var(--rest) scale(1.18)}70%{transform:var(--rest) scale(.98)}100%{transform:var(--rest) scale(1)}}
@keyframes ep-swell-s{0%{transform:var(--rest) scale(1)}35%{transform:var(--rest) scale(1.04)}70%{transform:var(--rest) scale(.995)}100%{transform:var(--rest) scale(1)}}
@keyframes ep-ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}

/* 3 depth: press, lift, parallax, float */
.tool:active,.sw:active,.play:active,.score button:active{--rest:translateY(2px);box-shadow:none}
.play{transform:var(--rest);box-shadow:inset 0 .12cqw 0 rgba(255,255,255,.25),0 .3cqw 0 #0d2253,0 .5cqw 1.2cqw rgba(21,53,123,.3)}
.score button{transform:var(--rest);box-shadow:inset 0 .1cqw 0 #fff,0 .25cqw 0 #c9d3e6,0 .5cqw 1cqw rgba(20,33,50,.1)}
.sc-in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d}
.mo .scene.has-img{animation:ep-float 7s ease-in-out infinite}
.mo .sc-in{transform:perspective(80cqw) rotateY(calc(var(--px,0) * 3deg)) rotateX(calc(var(--py,0) * -2.5deg));transition:transform .6s cubic-bezier(.2,.8,.3,1)}
@keyframes ep-float{0%,100%{transform:var(--rest) translateY(0)}50%{transform:var(--rest) translateY(-.4cqw)}}

/* 4 moods */
.sc-in::after{content:"";position:absolute;inset:0;border-radius:1.8cqw;border:.3cqw solid rgba(232,96,120,.8);opacity:0;pointer-events:none}
.mo .scene.beating img{animation:ep-heart 1.1s ease-in-out infinite}
.mo .scene.beating .sc-in::after{animation:ep-hring 1.1s ease-out infinite}
@keyframes ep-heart{0%{transform:scale(1)}12%{transform:scale(1.035)}24%{transform:scale(1)}36%{transform:scale(1.02)}50%,100%{transform:scale(1)}}
@keyframes ep-hring{0%{opacity:.85;transform:scale(1)}70%{opacity:0;transform:scale(1.06)}100%{opacity:0;transform:scale(1.06)}}
.mo .scene.alarm,.mo .shake{animation:ep-shake .42s ease-in-out}
@keyframes ep-shake{0%,100%{transform:var(--rest)}20%{transform:var(--rest) translateX(-.6%) rotate(-1deg)}40%{transform:var(--rest) translateX(.6%) rotate(1deg)}60%{transform:var(--rest) translateX(-.4%) rotate(-.6deg)}80%{transform:var(--rest) translateX(.3%) rotate(.4deg)}}

/* 5 messages: typing dots, drop in, stamp slam */
.msg-wait{visibility:hidden!important;position:relative}
.msg-wait > .dots{visibility:visible;top:0;left:0}
.msg-wait > .dots.me{left:auto;right:0}
.dots{position:absolute;z-index:6;display:flex;gap:.35em;align-items:center;background:#fff;border-radius:1.2em;padding:.55em .8em;box-shadow:0 .2em .6em rgba(0,0,0,.12);pointer-events:none}
.dots.me{background:#d7f6c9}
.dots i{width:.5em;height:.5em;border-radius:50%;background:#98a2b3;animation:ep-dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes ep-dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-.35em);opacity:1}}
.st-main .dots{font-size:1.2cqw}
.st-main .iph-app .dots{font-size:4.6cqw}
.mo .msg-in{animation:ep-drop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes ep-drop{0%{opacity:0;transform:var(--rest) translateY(-35%) scale(.9)}70%{opacity:1;transform:var(--rest) translateY(4%) scale(1.02)}100%{opacity:1;transform:var(--rest)}}
.mo .slam{animation:ep-slam .55s cubic-bezier(.2,.9,.3,1.2) var(--d,0ms) both}
@keyframes ep-slam{0%{opacity:0;transform:var(--rest) scale(1.7) rotate(6deg)}55%{opacity:1;transform:var(--rest) scale(.94) rotate(-1deg)}75%{transform:var(--rest) scale(1.03)}100%{opacity:1;transform:var(--rest)}}

/* 6 voice: moving waveform, speaking glow */
.mo .vnote:has(.play.playing) .bars,.mo .listen:has(.play.playing) .wave,.mo .ph-voice:has(.play.playing) i{animation:ep-wave .45s ease-in-out infinite alternate}
@keyframes ep-wave{from{transform:scaleY(.5);opacity:.6}to{transform:scaleY(1.2);opacity:1}}
.sc-in::before{content:"";position:absolute;inset:-1.2cqw;border-radius:2.6cqw;background:radial-gradient(closest-side,rgba(224,161,46,.6),rgba(224,161,46,0));opacity:0;z-index:-1;pointer-events:none}
.mo .speaking .sc-in::before{animation:ep-glow 1.6s ease-in-out infinite}
.mo .cast.speaking{filter:drop-shadow(0 1.2cqw 1.4cqw rgba(13,34,83,.28)) drop-shadow(0 0 1.1cqw rgba(224,161,46,.8))}
.mo .app-hd .av.speaking{box-shadow:0 0 0 1cqw rgba(26,127,100,.3);animation:ep-glow 1.6s ease-in-out infinite}
@keyframes ep-glow{0%,100%{opacity:.55}50%{opacity:1}}

/* 7 before → after: grow out of the Before with a glow sweep; the last line shimmers */
.cmp .aft,.note.win,.bub.grow-src{position:relative;overflow:hidden}
.mo .grow{animation:ep-grow .8s cubic-bezier(.2,.9,.3,1.1) var(--d,0ms) both;transform-origin:0 50%}
.bub.grow-src.grow{transform-origin:100% 0}
.mo .grow::after,.mo .shimmer::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,214,120,.55) 50%,transparent 70%);mix-blend-mode:multiply;transform:translateX(-110%);pointer-events:none;animation:ep-sweep 1.1s ease-in-out .35s both}
.mo .shimmer::after{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.9) 50%,transparent 70%);mix-blend-mode:soft-light}
.mo .shimmer{animation:ep-arrive .55s cubic-bezier(.2,.8,.3,1) var(--d,0ms) both}
.mo .shimmer::after{animation-delay:calc(var(--d,0ms) + .45s)}
@keyframes ep-grow{0%{opacity:0;transform:var(--rest) translateX(-10%) scale(.7,.85)}60%{opacity:1;transform:var(--rest) scale(1.02)}100%{opacity:1;transform:var(--rest)}}
@keyframes ep-sweep{from{transform:translateX(-110%)}to{transform:translateX(110%)}}

/* 8 timer: the last ten seconds */
.timer.last .tm{background:var(--bad);color:#fff;border-color:var(--bad)}
.mo .timer.last .tm{animation:ep-pulse 1s ease-in-out infinite}
@keyframes ep-pulse{0%,100%{transform:var(--rest) scale(1)}50%{transform:var(--rest) scale(1.1)}}

/* switches in the dock */
.switches{display:inline-flex;gap:.3cqw;margin-left:.3cqw;padding-left:.6cqw;border-left:.1cqw solid rgba(255,255,255,.2)}
.sw{position:relative;transform:var(--rest);font:800 .9cqw var(--body);border:0;border-radius:.8cqw;padding:.5cqw .7cqw;background:rgba(255,255,255,.08);color:#9fb2e2;box-shadow:inset 0 .1cqw 0 rgba(255,255,255,.1),0 .22cqw 0 rgba(0,0,0,.28)}
.sw[aria-pressed="true"]{background:rgba(255,255,255,.2);color:#fff}
.sw[aria-pressed="false"]{text-decoration:line-through;opacity:.7}

/* phone page: pressable answers, cards arrive, the shown-back reply types itself */
.ph-opts button,.ph .btn,.ph-cards button,.ph-ticks button{box-shadow:0 3px 0 var(--f-line)}
.ph-sort .chips button{box-shadow:0 3px 0 rgba(0,0,0,.2)}
.ph .btn{box-shadow:0 3px 0 #0d2253}
.ph-opts button:active,.ph .btn:active,.ph-cards button:active,.ph-ticks button:active,.ph-sort .chips button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--f-line)}
.mo .ph .arrive{animation:ep-arrive-ph .42s cubic-bezier(.2,.8,.3,1) var(--d,0ms) both}
@keyframes ep-arrive-ph{0%{opacity:0;transform:translateY(10px) scale(.96)}60%{opacity:1;transform:translateY(-1px) scale(1.01)}100%{opacity:1;transform:none}}
.mo .ph-fb.ok{animation:ep-arrive-ph .4s cubic-bezier(.34,1.56,.64,1) both}
.ph-typing::after{content:"";display:inline-block;width:2px;height:1em;background:var(--f-brand);margin-left:2px;vertical-align:-2px;animation:ep-caret .8s steps(1) infinite}
@keyframes ep-caret{50%{opacity:0}}
.fxsw{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:2px 8px;font:700 12px var(--body)}

/* the dock: words get the room; the timer only on timed screens */
.dock{gap:2cqw}
.words{grid-template-columns:repeat(4,max-content);gap:.65cqw .8cqw}
.dock:not(.timed) .w{font-size:1.22cqw;padding:.42cqw 1.1cqw}
.dock:not(.timed) .words{gap:.75cqw 1.1cqw}
.timer{display:inline-flex;align-items:center;gap:.3cqw;padding:.35cqw .45cqw;border-radius:1.2cqw;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 .1cqw rgba(255,255,255,.12)}
.timer .tm{width:5.2cqw;text-align:center;font:800 1.35cqw var(--display);color:#fff;background:rgba(0,0,0,.18);border:.12cqw solid rgba(255,255,255,.18);border-radius:.8cqw;padding:.35cqw .2cqw;font-variant-numeric:tabular-nums;transform:var(--rest)}
.timer .tm:focus{outline:.25cqw solid var(--f-gold);background:#fff;color:var(--f-ink)}
.timer .tm[readonly]{cursor:default}
.timer .tool{padding:.55cqw .75cqw}
.timer .tool.run{background:var(--f-gold);color:#2a1c00}
.tchips{display:inline-flex;flex-direction:column;gap:.25cqw;margin-right:.3cqw}
.tchip{font:800 .85cqw var(--body);border:0;border-radius:.6cqw;padding:.3cqw .55cqw;background:rgba(255,255,255,.1);color:#cdd8f5;white-space:nowrap}
.tchip[aria-pressed="true"]{background:var(--f-gold);color:#2a1c00}
.dock.timed .w{font-size:1.05cqw;padding:.34cqw .8cqw}
/* LIVE: this phone follows the class (review.html above the phone, phone.html header) */
.livepill{display:inline-flex;align-items:center;gap:6px;margin-left:8px;vertical-align:1px;background:#fde8ec;color:#b42343;border-radius:99px;padding:2px 9px 2px 7px;font:800 11px var(--body);letter-spacing:.1em}
.livepill i,.ph-top .liveon i{width:8px;height:8px;border-radius:50%;background:#e5394f;box-shadow:0 0 0 0 rgba(229,57,79,.6)}
.mo .livepill i,.mo .ph-top .liveon i{animation:ep-live 1.6s ease-out infinite}
@keyframes ep-live{0%{box-shadow:0 0 0 0 rgba(229,57,79,.6)}70%,100%{box-shadow:0 0 0 7px rgba(229,57,79,0)}}
.ph-top .liveon{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font:800 11px var(--body);letter-spacing:.1em;color:#fff;background:rgba(229,57,79,.25);border-radius:99px;padding:2px 9px 2px 7px}
.ph-top .ph-right{margin-left:auto;display:inline-flex;gap:6px;align-items:center}
.ph-top .ph-right .live,.ph-top .ph-right .liveon{margin-left:0}

/* avatars: a real face (background crop) or a neutral grey silhouette */
.av,.cav{position:relative;overflow:hidden;color:#8d97a8;background:#dfe4ec}
.face{position:absolute;inset:0;background-repeat:no-repeat;border-radius:inherit}
.sil{width:78%;height:78%;margin-top:18%}
.cav .sil{color:#8b96a8}
.cav{background:#3b4558}
.mail .from .av{background:#dfe4ec}
.ni .av{display:block;width:100%;height:100%;border-radius:inherit}

/* ======================= TIME YOU CAN SEE (PPF parts: P past, P2 present, F future) =======================
   One rule wherever the three parts stand together. PAST sits behind (set back, a little lower, matte, a faint
   trailing shadow to the left); PRESENT is here (front plane, full white, the crispest shadow); FUTURE is ahead
   (forward along the direction of travel: to the right and a little raised, a lighter open fill, a dashed glowing
   leading edge). A thin time line ties them together, with "now" at PRESENT. Positions and finishes carry
   meaning, so they stay with Motion off; only the movement goes. Text keeps full contrast: the card is
   desaturated, never the text. */
.tz{position:relative;--rest:var(--tz,translate(0,0))}
.tz-P{--tzx:0cqw;--tz:perspective(80cqw) translate3d(0,.3cqw,-1.8cqw)}
.tz-P2{--tzx:1.6cqw;--tz:translate(0,0)}
.tz-F{--tzx:3.2cqw;--tz:perspective(80cqw) translate3d(0,-.3cqw,0)}
/* finishes on stacked cards (the PPF screen, kit rows) and on Fix-it cards */
.part.tz-P,.krow.tz-P,.fcard.tz-P{background:#f2f4f7;box-shadow:-.8cqw .55cqw 0 rgba(20,33,50,.05),0 .3cqw .8cqw rgba(20,33,50,.06)}
.part.tz-P2,.krow.tz-P2,.fcard.tz-P2{background:#fff;box-shadow:0 .12cqw .25cqw rgba(20,33,50,.14),0 1.1cqw 2.4cqw rgba(14,36,86,.17)}
.part.tz-F,.krow.tz-F,.fcard.tz-F{background:rgba(255,255,255,.66);box-shadow:.7cqw 0 1.6cqw -.5cqw rgba(224,121,46,.38),0 .4cqw 1cqw rgba(20,33,50,.05);border-right:.24cqw dashed var(--future)}
.tz-P .tag,.tz-P .th{filter:saturate(.55) brightness(1.06)}
.tz-P .ppic{filter:saturate(.7)}
/* stacked: each step in time moves to the right; a rail on the left with a marker per part */
.tstack{position:relative;padding-left:3.2cqw}
.tstack > h3{margin-left:-3.2cqw}
.tstack > .tz{margin-left:var(--tzx)}
/* in focus: comes to the reading position, keeps its finish, goes back to its place afterwards */
/* columns (Time control) and the Fix-it grid: the same idea with headers and a depth offset; no text shrinks */
.time{grid-template-rows:minmax(0,1fr) auto}
.tcol.tz-P{--tz:translateY(.5cqw);background:#f6f7f9;box-shadow:-.8cqw .55cqw 0 rgba(20,33,50,.05),0 .4cqw 1cqw rgba(20,33,50,.06)}
.tcol.tz-P2{box-shadow:0 .12cqw .25cqw rgba(20,33,50,.14),0 1.1cqw 2.4cqw rgba(14,36,86,.17)}
.tcol.tz-F{--tz:translateY(-.5cqw);background:rgba(255,255,255,.7);box-shadow:.7cqw 0 1.6cqw -.5cqw rgba(224,121,46,.38),0 .4cqw 1cqw rgba(20,33,50,.05);border-right:.24cqw dashed var(--future)}
.tcol.tz-F .th{background-image:linear-gradient(90deg,transparent 40%,rgba(255,255,255,.28))}
.fix{grid-template-rows:minmax(0,1fr) minmax(0,1fr) auto;grid-auto-flow:column}
.fcard.tz-P{--tz:translateY(.3cqw)}
.fcard.tz-F{--tz:translateY(-.3cqw)}
.tline{grid-column:1 / -1;grid-row:-2;position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:2.1cqw;align-items:center}
.fix .tline{grid-row:3}
.fix.f4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr)) auto;grid-auto-flow:row}
.fix.f4 .tline{grid-row:3}
/* arrivals: PAST slides back into place from the front, PRESENT comes straight at you and lands,
   FUTURE glides in from ahead and settles short of the present */
.mo .arrive[data-tz="P"]{animation:tz-in-P .6s cubic-bezier(.2,.8,.3,1) var(--d,0ms) both}
.mo .arrive[data-tz="P2"]{animation:tz-in-P2 .55s cubic-bezier(.34,1.4,.64,1) var(--d,0ms) both}
.mo .arrive[data-tz="F"]{animation:tz-in-F .65s cubic-bezier(.16,1,.3,1) var(--d,0ms) both}
@keyframes tz-in-P{0%{opacity:0;transform:var(--rest) perspective(60cqw) translate3d(.8cqw,-.6cqw,5cqw)}100%{opacity:1;transform:var(--rest)}}
@keyframes tz-in-P2{0%{opacity:0;transform:var(--rest) perspective(60cqw) translateZ(-7cqw)}65%{opacity:1;transform:var(--rest) perspective(60cqw) translateZ(.8cqw)}100%{opacity:1;transform:var(--rest)}}
@keyframes tz-in-F{0%{opacity:0;transform:var(--rest) translateX(8cqw)}100%{opacity:1;transform:var(--rest)}}
/* the phone's sort screen, in a simpler form */
.ph-bin.tzp-P{background:#f2f4f7;border:2px solid #e1e5ec;margin-right:20px;box-shadow:-5px 4px 0 rgba(20,33,50,.05)}
.ph-bin.tzp-P2{background:#fff;border:2px solid #c9d5ee;margin:0 10px;box-shadow:0 1px 2px rgba(20,33,50,.12),0 8px 18px rgba(14,36,86,.14)}
.ph-bin.tzp-F{background:rgba(255,255,255,.6);border:2px dashed var(--future);margin-left:20px;box-shadow:6px 0 14px -6px rgba(224,121,46,.4)}
.nowpill{display:inline-block;margin-left:4px;background:var(--f-brand);color:#fff;border-radius:99px;padding:0 6px;font:800 9.5px/16px var(--body);letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}
/* untimed screens: the word strip takes the room (even chips, a calm row of eight) */
.dock:not(.timed) .words{grid-template-columns:repeat(4,minmax(max-content,13.5cqw))}
.dock .w{text-align:center}
.kit.compact{gap:.55cqw}
.kit.compact .krow{padding:.5cqw 1cqw}

/* ======================= NAME IT · game-show screen ======================= */
.game2{flex:1;min-height:0;display:grid;grid-template-columns:13cqw minmax(0,1fr) 13.5cqw;gap:2cqw;align-items:stretch}
/* the deck: six numbered cards, the current one lifted, done ones turned over to show their word */
.gdeck{display:flex;flex-direction:column;gap:.55cqw;justify-content:flex-start;perspective:60cqw}
.gthumb{height:4.6cqw;flex:none;transition:transform .45s cubic-bezier(.34,1.4,.64,1)}
.gthumb .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.34,1.3,.64,1)}
.gthumb.flip .in{transform:rotateY(180deg)}
.gthumb .face{position:absolute;inset:0;border-radius:1cqw;display:flex;align-items:center;gap:.7cqw;padding:0 .8cqw;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 .3cqw .8cqw rgba(20,33,50,.08)}
.gthumb .front{background:#fff;font:700 1.02cqw/1.2 var(--body);color:var(--f-muted)}
.gthumb .back{background:var(--f-brand);color:#fff;transform:rotateY(180deg);font:800 1.1cqw/1.15 var(--body)}
.gthumb b{flex:none;width:2.1cqw;height:2.1cqw;border-radius:50%;display:grid;place-items:center;font:800 1.05cqw var(--display);background:var(--f-canvas);color:var(--f-brand)}
.gthumb .back b{background:rgba(255,255,255,.15);color:#fff}
.gthumb .back span{color:var(--f-gold)}
.gthumb.lift{--rest:translateX(1.4cqw) scale(1.04);transform:var(--rest)}
.gthumb.lift .front{box-shadow:0 0 0 .25cqw var(--f-gold),0 1cqw 2.2cqw rgba(14,36,86,.2);color:var(--f-ink)}
/* the situation, big, in the middle */
.gcenter{position:relative;min-height:0}
.gsit{position:absolute;inset:0;display:none}
.gsit.on{display:block}
.gsit .gans{position:absolute;display:flex;flex-direction:column;align-items:flex-start;gap:1cqw}
.gchip{display:inline-block;background:var(--f-gold);color:#2a1c00;border-radius:99cqw;padding:.55cqw 1.6cqw;font:800 2.3cqw var(--body);box-shadow:0 .35cqw 0 #a8741a,0 1cqw 2cqw rgba(224,161,46,.45);position:relative}
.gsay{font:800 2.2cqw/1.25 var(--display);color:var(--f-brand-dd);max-width:28cqw}
.k-email .gans,.k-chat .gans{left:3cqw;right:2cqw;bottom:1.2cqw;flex-direction:row;align-items:center;gap:1.6cqw}
.k-email .gsay,.k-chat .gsay{max-width:none}
.k-sms .gans,.k-call .gans{left:27cqw;top:11cqw}
.gsit .iph{left:12cqw!important}
/* the work email: a mail window, the fake sender address visible */
.gmail{position:absolute;left:3cqw;right:2cqw;top:.5cqw;background:#fff;border-radius:1.4cqw;overflow:hidden;box-shadow:0 .3cqw .6cqw rgba(20,33,50,.08),0 1.6cqw 3.6cqw rgba(14,36,86,.18);transform:var(--rest)}
.gm-bar{display:flex;align-items:center;gap:.5cqw;padding:.7cqw 1.1cqw;background:#eef1f6;font:700 1cqw var(--body);color:var(--f-muted)}
.gm-bar i{width:.9cqw;height:.9cqw;border-radius:50%;background:#e0625a}.gm-bar i:nth-child(2){background:#e8b33f}.gm-bar i:nth-child(3){background:#5cb85c}
.gm-bar span{margin-left:1cqw}
.gm-body{padding:1.4cqw 2cqw 1.8cqw;display:grid;gap:.9cqw}
.gm-from{display:flex;gap:1cqw;align-items:center}
.gm-from .av{width:3.6cqw;height:3.6cqw;border-radius:50%;display:grid;place-items:center;flex:none}
.gm-from b{display:block;font:800 1.6cqw var(--body)}
.gm-from .addr{font:700 1.45cqw var(--body);color:var(--bad);background:var(--bad-soft);border-radius:.4cqw;padding:0 .4cqw}
.gm-subj{font:800 2.1cqw/1.2 var(--display);color:var(--f-ink)}
.gmail p{margin:0;font:600 1.7cqw/1.4 var(--body)}
.gm-btn{justify-self:start;background:#2a6fdb;color:#fff;border-radius:.8cqw;padding:.55cqw 1.6cqw;font:800 1.4cqw var(--body)}
/* a chat line, big, with a face */
.gchat{position:absolute;left:3cqw;right:2cqw;top:2.5cqw}
.gchat .sb{font:600 2.3cqw/1.35 var(--body);padding:1.5cqw 2cqw;gap:1.6cqw;border-radius:2cqw 2cqw 2cqw .6cqw;box-shadow:0 .3cqw .6cqw rgba(20,33,50,.08),0 1.4cqw 3cqw rgba(14,36,86,.16);align-items:center}
.gchat .sb small{font-size:1.15cqw}
.gchat .sb .av{width:7cqw;height:7cqw;flex:none;display:grid;place-items:center}
.gchat .dots{font-size:2cqw}
/* the call: waveform while it plays */
.call .lnk .bars{width:16cqw;height:5cqw;background:repeating-linear-gradient(90deg,#9ae6b4 0 .9cqw,transparent .9cqw 2cqw);opacity:.7;border-radius:1cqw}
.mo .lnk:has(.play.playing) .bars{animation:ep-wave .45s ease-in-out infinite alternate}
.k-call .call b{font-size:8.5cqw}
/* the scoreboard: two big tiles */
.gboard{display:grid;grid-template-rows:1fr 1fr;gap:1cqw;max-height:30cqw}
.gtile{position:relative;border:0;border-radius:1.6cqw;background:#fff;color:var(--f-brand-dd);font:800 2.6cqw/1 var(--display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3cqw;
  transform:var(--rest);box-shadow:inset 0 .12cqw 0 #fff,0 .4cqw 0 #c9d3e6,0 1cqw 2cqw rgba(20,33,50,.12)}
.gtile + .gtile{background:var(--f-brand);color:#fff;box-shadow:inset 0 .12cqw 0 rgba(255,255,255,.2),0 .4cqw 0 #0d2253,0 1cqw 2cqw rgba(20,33,50,.16)}
.gtile small{font:800 .95cqw var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.gtile b{font:800 5cqw/1 var(--display);color:var(--f-gold);display:inline-block;position:relative}
.gtile:active{--rest:translateY(3px);box-shadow:none}
.gfly{pointer-events:none;transform-origin:0 0;box-shadow:0 1cqw 2cqw rgba(224,161,46,.5)}

/* Name it, round two: readable phones, the answer right under a window or chat line, a slot that asks */
.gsit.on.k-email,.gsit.on.k-chat{display:flex;flex-direction:column;gap:2.2cqw;padding:.5cqw 2cqw 0 3cqw}
.k-email .gmail,.k-chat .gchat{position:relative;left:auto;right:auto;top:auto}
.k-email .gans,.k-chat .gans,.k-email .gq,.k-chat .gq{position:relative;left:auto;right:auto;bottom:auto;top:auto}
.gsit .iph{left:13cqw!important}
.k-sms .gans,.k-call .gans,.k-sms .gq,.k-call .gq{position:absolute;left:28cqw;right:0;top:10cqw}
.gq{display:flex;align-items:center;gap:1.2cqw;font:800 2cqw var(--display);color:var(--f-muted)}
.gq span{display:inline-grid;place-items:center;min-width:12cqw;height:4.2cqw;border:.25cqw dashed var(--f-gold);border-radius:99cqw;color:var(--f-gold);font:800 2.4cqw var(--display);background:rgba(224,161,46,.07)}
.gans:not(.pre) + .gq{display:none}
.gans.pre{position:absolute!important}
.mo .gq span{animation:ep-pulse 1.6s ease-in-out infinite}
.gsit .notif p{font-size:5.6cqw;line-height:1.3}
.gsit .notif .nh{font-size:3.6cqw}
.gsit .notif{grid-template-columns:10cqw 1fr;padding:3.4cqw 3.8cqw}
.gsit .notif .ni{width:10cqw;height:10cqw;font-size:5.6cqw}
.k-call .call .lnk{font-size:5cqw;padding:2cqw 5cqw 2cqw 2cqw;gap:3cqw}
.k-call .call .lnk .play{width:15cqw;height:15cqw;font-size:5cqw}
.k-call .call small{font-size:4.6cqw}

/* ======================= SIXTH PASS ======================= */
/* --- the time line: beam (draft E) + time words (draft D) --- */
.tstack{padding-left:7.4cqw}
.tstack > h3{margin-left:-7.4cqw}
.tbeam{position:absolute;pointer-events:none;--len:0%;--dur:2.6s}
.tbeam > i{position:absolute;display:block}
.tbeam .track{background:rgba(21,53,123,.1);border-radius:1cqw}
.tbeam .beam{border-radius:1cqw;box-shadow:0 0 1.1cqw rgba(76,203,255,.45);transition:width .9s cubic-bezier(.3,.7,.2,1),height .9s cubic-bezier(.3,.7,.2,1)}
.tbeam .nowdot{width:1.5cqw;height:1.5cqw;border-radius:50%;background:#fff;border:.32cqw solid #3aa9e6;box-shadow:0 0 1cqw rgba(76,203,255,.9);z-index:2}
.tbeam .bead{width:1.25cqw;height:1.25cqw;border-radius:50%;opacity:0;z-index:3;background:radial-gradient(circle at 38% 34%,#dffbff,#7af0ff 72%);box-shadow:0 0 1.3cqw rgba(120,240,255,1),0 0 .45cqw rgba(170,246,255,1)}
.tbeam.empty .bead{display:none}
.tk{position:absolute;display:flex;align-items:center;gap:.45cqw;font:700 .95cqw var(--body);color:var(--f-muted);white-space:nowrap;opacity:.35}
.tk i{display:block;background:rgba(21,53,123,.25)}
.tk.on{opacity:1}
.tk[data-p="P"].on{color:#6b7891}.tk[data-p="P"].on i{background:#9aa5b8}
.tk[data-p="P2"].on{color:var(--f-brand)}.tk[data-p="P2"].on i{background:var(--f-brand)}
.tk[data-p="F"].on{color:#c4621d}.tk[data-p="F"].on i{background:var(--future)}
/* horizontal (under side-by-side parts) */
.tbeam.h{left:3%;right:3%;top:0;bottom:0}
.tbeam.h .track,.tbeam.h .beam{left:0;top:42%;height:.42cqw;margin-top:-.21cqw}
.tbeam.h .track{right:0}
.tbeam.h .beam{width:var(--len);background:linear-gradient(90deg,rgba(125,138,163,.25),rgba(125,138,163,.75) 25%,#4ccbff 50%,#6fe0ff 66%,rgba(224,121,46,.9) 85%,rgba(224,121,46,.35));background-size:calc(100cqw * .88) 100%}
.tbeam.h .nowdot{top:42%;margin:-.75cqw 0 0 -.75cqw}
.tbeam.h .bead{top:42%;margin:-.62cqw 0 0 -.62cqw;left:0}
.tbeam.h .tk{top:42%;transform:translate(-50%,-50%);flex-direction:column;gap:.15cqw}
.tbeam.h .tk i{width:.2cqw;height:1.1cqw}
.tbeam.h .tk b{position:absolute;top:1.1cqw;font:inherit}
.tline{height:2.8cqw}
/* vertical (beside stacked parts) */
.tbeam.v{left:5.2cqw;width:1.5cqw;top:0;height:100%}
.tbeam.v .track,.tbeam.v .beam{left:50%;width:.42cqw;margin-left:-.21cqw;top:0}
.tbeam.v .track{bottom:0}
.tbeam.v .beam{height:var(--len);background:linear-gradient(180deg,rgba(125,138,163,.25),rgba(125,138,163,.75) 25%,#4ccbff 50%,#6fe0ff 66%,rgba(224,121,46,.9) 85%,rgba(224,121,46,.35))}
.tbeam.v .nowdot{left:50%;margin:-.75cqw 0 0 -.75cqw}
.tbeam.v .bead{left:50%;margin:-.62cqw 0 0 -.62cqw;top:0}
.tbeam.v .tk{right:50%;transform:translateY(-50%);flex-direction:row-reverse;padding-right:.1cqw}
.tbeam.v .tk i{width:.9cqw;height:.18cqw;margin-right:-.45cqw}
.kit.compact .tbeam .tk{font-size:.85cqw}
/* only the bead moves, and only while Motion is on, on a live stage */
.mo .ep-stage.mounted .tbeam.h .bead{animation:ep-bead-h var(--dur) ease-in-out infinite}
.mo .ep-stage.mounted .tbeam.v .bead{animation:ep-bead-v var(--dur) ease-in-out infinite}
.mo .ep-stage.mounted .tk.on{animation:ep-tick var(--dur) linear var(--td,0s) infinite}
@keyframes ep-bead-h{0%{left:0;opacity:0}12%{opacity:1}84%{opacity:1}100%{left:var(--len);opacity:0}}
@keyframes ep-bead-v{0%{top:0;opacity:0}12%{opacity:1}84%{opacity:1}100%{top:var(--len);opacity:0}}
@keyframes ep-tick{0%{filter:drop-shadow(0 0 .5cqw rgba(76,203,255,.95));transform:var(--tkt) scale(1.12)}14%,100%{filter:none;transform:var(--tkt) scale(1)}}
.tbeam.h .tk{--tkt:translate(-50%,-50%)}
.tbeam.v .tk{--tkt:translateY(-50%)}
html:not(.mo) .tbeam .bead,.ep-stage:not(.mounted) .tbeam .bead{display:none}

/* --- stacked: the newest revealed part in front, earlier parts one depth level back each --- */
.tstack > .tz{transition:transform .6s cubic-bezier(.34,1.3,.64,1),background .5s,box-shadow .5s,opacity .45s}
.tstack > .tz[data-depth="0"]{--rest:translate(0,0);background:#fff;box-shadow:0 .12cqw .25cqw rgba(20,33,50,.14),0 1.1cqw 2.4cqw rgba(14,36,86,.17)}
.tstack > .tz[data-depth="1"]{--rest:perspective(80cqw) translate3d(0,.35cqw,-2.6cqw);background:#f0f2f6;box-shadow:-.7cqw .5cqw 0 rgba(20,33,50,.05),0 .3cqw .8cqw rgba(20,33,50,.06)}
.tstack > .tz[data-depth="2"]{--rest:perspective(80cqw) translate3d(0,.6cqw,-5cqw);background:#e9edf2;box-shadow:-.9cqw .6cqw 0 rgba(20,33,50,.06)}
.tstack > .tz[data-depth="1"] .tag,.tstack > .tz[data-depth="1"] .ppic{filter:saturate(.6) brightness(1.05)}
.tstack > .tz[data-depth="2"] .tag,.tstack > .tz[data-depth="2"] .ppic{filter:saturate(.4) brightness(1.08)}
.tstack > .tz.tz-F[data-depth="0"]{background:rgba(255,255,255,.92)}
/* FUTURE: the whole card border dashed */
.part.tz-F,.krow.tz-F,.tcol.tz-F{border:.22cqw dashed var(--future)!important}
.fcard.tz-F{border:.2cqw dashed var(--future);border-top:.45cqw dashed var(--future)}

/* --- new words in the text (Marco 2026-10-03, A): a quiet dotted underline, tap for the meaning card. Only on a
   screen that teaches vocabulary (.ep-stage.vocab) do the word-wall words light up as small gold chips --- */
.wch{text-decoration:underline dotted rgba(21,53,123,.55);text-underline-offset:.18em;text-decoration-thickness:.09em;cursor:pointer}
.ep-stage.vocab .wch{text-decoration:none;display:inline-block;background:var(--f-gold);color:#2a1c00;border-radius:99em;padding:0 .42em;font-weight:800;line-height:1.3;box-shadow:0 .1em 0 #a8741a;cursor:pointer;position:relative;transform:var(--rest)}
.ep-stage:not(.vocab) .hl{background:none;font-weight:inherit}
.note.do .wch,.do .wch,.dolist .wch,.wcard .back .wch,.wcard .back .gw{text-decoration-color:rgba(255,255,255,.6)}
.gw{text-decoration:underline dotted rgba(21,53,123,.45);text-underline-offset:.18em;text-decoration-thickness:.08em;cursor:pointer}
.note.do .gw,.do .gw,.dolist .gw{text-decoration-color:rgba(255,255,255,.55)}
.wch.gsel,.gw.gsel{outline:.2em solid rgba(76,203,255,.7);outline-offset:.05em;border-radius:.3em}
.mo .ep-stage.vocab .wch.wpulse{animation:ep-wpulse .8s cubic-bezier(.34,1.56,.64,1)}
@keyframes ep-wpulse{0%{transform:scale(1)}35%{transform:scale(1.22);box-shadow:0 0 0 .3em rgba(224,161,46,.45)}100%{transform:scale(1)}}
.ep-stage:not(.vocab) .wch.wglow{background:rgba(76,203,255,.22);border-radius:.25em;box-shadow:0 0 0 .15em rgba(76,203,255,.22)}
.ep-stage.vocab .wch.wglow{box-shadow:0 .1em 0 #a8741a,0 0 0 .25em rgba(255,214,120,.95),0 0 1.1em rgba(224,161,46,.95)}
.mo .wch.wglow{animation:ep-wglow 2s ease-in-out}
@keyframes ep-wglow{0%,100%{filter:none}20%,70%{filter:brightness(1.12)}}
.ph .wch{font-size:.95em}
.dock .w{cursor:pointer}
/* the arc from the dock to the word */
svg.arcs{position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none;overflow:visible}
svg.arcs .arc{fill:none;stroke:#f1b43c;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(241,180,60,.8))}
svg.arcs .arcdot{fill:#f1b43c;transition:opacity .2s}

/* --- the meaning card --- */
.gloss{position:absolute;z-index:10;width:27cqw;background:#fff;color:var(--f-ink);border-radius:1.4cqw;padding:1.1cqw 1.4cqw 1cqw;box-shadow:0 1.4cqw 3.6cqw rgba(13,34,83,.32),0 0 0 .12cqw rgba(21,53,123,.12);font-size:1.25cqw;line-height:1.4}
.gloss p{margin:0}
.gloss .gh{display:flex;align-items:center;gap:.7cqw;padding-right:2cqw}
.gloss .gh b{font:800 1.75cqw var(--display);color:var(--f-brand-dd)}
.gloss .gipa{color:var(--f-muted);font-size:1.1cqw}
.gloss .gplay{width:2.4cqw;height:2.4cqw;font-size:1cqw;margin-left:auto}
.gloss .gm{font:700 1.55cqw/1.4 var(--body);margin-top:.5cqw;color:var(--f-ink)}
.gloss .gm:lang(zh-Hans){font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',var(--body);font-size:1.75cqw}
.gloss .gen{color:var(--f-muted);font-size:1.1cqw;margin-top:.2cqw}
.gloss .guse{margin-top:.6cqw;padding-top:.6cqw;border-top:.1cqw solid var(--f-line);font-style:italic;color:#38445a}
.gloss .gx{position:absolute;right:.6cqw;top:.4cqw;border:0;background:none;font:800 1.7cqw var(--body);color:var(--f-muted);padding:.1cqw .5cqw;border-radius:.6cqw;cursor:pointer}
