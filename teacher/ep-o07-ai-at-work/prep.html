  snapshot: {
    goal: "Give your view on a change more clearly — so others can understand what you think, how sure you are, and why.",
    speakingWin: "Give a one-minute forecast on either side: what you think will happen and how sure you are, the main reason, one real example, what it means, and your view again; then keep it when someone is worried.",
    storyline: "Thursday at the showroom. For two weeks the team has tried an AI assistant (Ali set it up). After closing, Mr. Tan stops at your counter: for your job here, helper or threat? You answer in thirty seconds (round 1, the first try). On Monday last week the whole team answered him in one line each in the chat; he could not decide, nobody said who should check the replies, and three days later a customer took a day off for a dining table that was not coming. This Thursday Ali (helper) and Kumar (threat, for now) answer him properly, on opposite sides, and he can decide: both answers have the same four parts, O.R.E.O. The class learns to say how sure it is (will · will probably · might · I'm not sure, but I think …) and to describe a change happening now (more and more … are using …), then builds both sides of an answer for Siti, who is asking whether the assistant should answer staff questions in the HR chat. Round 2 is the Future Forecast: each learner forecasts a job from a card (two workplace, two daily life); the class votes which view it heard and asks “Why do you think so?”. Mr. Tan then voices three worries, and learners accept each worry, say what it means and keep their view. Round 3: Mr. Tan asks again, and learners compare their two answers. The close shows what a clear view does for Mr. Tan (either side), widens the skill beyond AI, looks back on the lesson and says thank you.",
    formula: "O.R.E.O · OPINION what I think will happen, and how sure → REASON why (The main reason is that …) → EXAMPLE a real case (a number, a date) → OPINION AGAIN what it means (What this means is that …) and my view again (So …)",
    timeControl: "Future Tense for how sure you are (OPINION, OPINION AGAIN): will / won't + verb (sure) · will probably + verb (very likely) · might + verb (possible) · I'm not sure, but I think … will … (not sure yet). Present Tense for what AI does now (REASON): it drafts, it frees up; and for a change happening now: more and more companies are using chatbots (are + -ing). The EXAMPLE tells one real case and may use the Past Tense untaught (it drafted, it told).",
    expressionTools: "The syllabus's three tools, in bold where taught: I think … will probably … (predict how sure you are: 8, 9, 10, 11) · What this means is that … (say the result or impact: 8, 9, 11, 13) · I'm not sure, but I think … (say how sure you are: 10, 11, 13). With them: The main reason is that … · For example, … · So … · That's a fair worry.",
    connectors: "result: what this means is · conclusion: so (O07's own discourse, both inside OPINION AGAIN; highlighted on 9, 11 and 13, and the push-back tool is built from them)",
    languageSupport: "will / won't: a prediction with certainty (AI won't replace people who handle difficult customers) · present continuous for a trend happening now (More and more companies are using chatbots). Both on screen 10, each with its purpose first.",
    task: "Future Forecast (syllabus O07: mini talk + questions), run whole-class in the main room (A12, D8): everyone chooses one job card (workplace: a bank teller, an accounts clerk · daily life: a nephew who wants to be a tuition teacher, a friend's son who wants to be a delivery driver), whose facts give both sides; two minutes to plan with O.R.E.O; the teacher chooses one or two speakers per card; each gives a one-minute forecast, either side; the listeners vote which view they heard (helper or threat) and one asks “Why do you think so?”; the speaker answers in a sentence or two. Product: the class's vote per card on the stage. A split vote means the view did not land, which the speaker can fix in one sentence.",
    transfer: "Inside the task: two workplace cards and two daily-life cards (the syllabus's life transfer: what jobs children should prepare for); a learner may forecast their own job instead. The build (11) is the syllabus's work transfer: a new tool the company wants to use. The close turns it outward: the summary names other roles, industries and everyday decisions, and this week's small step is to use the skill once.",
    evidence: [

    ladder: "Share one recent use of AI → answer Mr. Tan in thirty seconds (round 1) → guess and check eight words → finish six sentences → see what one-line answers cost → hear two full answers on opposite sides → name the four parts → place forecasts by how sure they are → build both sides of an answer together → forecast from a card to the class (round 2) → accept a worry and keep your view → answer Mr. Tan again, no starters (round 3) → see what it does for him → see the same skill in many places → think back, hear the class feedback",
    // Why this lesson is built this way (teachers; the Why button; inside snapshot so build.py strips it).
    why: {
      topic: "Every adult now meets AI at work and in daily life, and managers ask staff what they think before they buy a tool. Giving a clear view about something that is still changing is a real workplace job.",
      fn: "Express Opinion (syllabus O07): Mr. Tan already knows what the tool does; he wants each person's view before he decides. Sub-skills O1 State your opinion, O2 Give reasons, O3 Give examples, O5 Develop your main point, and E5 Explain results or impact (inside OPINION AGAIN: What this means is …).",
      formula: "O.R.E.O, because an opinion needs one reason and one real example to be believed, and the opinion again, with what it means, is what the listener remembers and acts on. Two models on opposite sides show that the formula carries either answer (A14). The goal page's three skills map onto it (question E6, our reading): 🔮 what will happen and how sure → OPINION · 🧩 a reason and a real example → REASON + EXAMPLE · 🎯 your view again → OPINION AGAIN.",
      timeControl: "The syllabus's time control is Present and Future: Future Tense for how sure you are (the OPINION is a prediction), Present Tense for what AI does now and for a trend happening now (the REASON). Screen 10 teaches them from sentences, as a scale of certainty and a now / changing-now pair, not as E10's fix-the-red-word.",
      shape: "B · Task first (lesson-arc-v2 §5), inside the 18 slots (question E7): round 1 of the forecast is the first try (4), round 2 is the task (12), round 3 the retry (14). Learners get stuck on purpose in a thirty-second answer, then get the tools.",
      variety: "Against E10, slot by slot (D7): hook = the assistant's screen and its week, not night notifications · warm-up = a recent experience (when did you last use AI, and for what?) in one sentence, then “did it help?”, not three items with a vote each · goal page = three numbered skill cards and a why row, not the route of stops · first try = a face-to-face question at the counter, round 1, thirty seconds · word page = words for both sides, guess then check, not flip cards · review = finish six sentences, not the Name-it game show · short message = a team chat and the customer's complaint on a phone, not a photo panel · models = two speakers on opposite sides with two afters · formula = both answers under each part, in four columns, not puffy cards · language = a scale of certainty and a trend, not fix-the-red-word · build = both sides at once, from Siti's question · task = a forecast with the class's vote per card as the product, not a briefing with three questions · push-back = a worry, answered with accept → what this means → so, not point + because · after = one before and two afters, either side.",
      task: "Future Forecast (syllabus O07), whole class (A12, D8: the syllabus's pairs and groups become one speaker at a time in the main room): the card holds facts on both sides, the speaker chooses the side and how sure, and the listeners' product is a vote of which view they heard plus one “Why do you think so?”. The vote is a listening check, not a judgement of the speaker: a split vote shows the view did not land.",
      bridge: "“Aren't you worried?” comes from Mr. Tan (the syllabus bridge) and pushes against both sides in turn. The tool is O07's own discourse (G11): accept the worry (That's a fair worry: the acknowledging line G11 allows), say what it means (What this means is that …), keep your view (So …). No debate.",

<script>
// Episode lessons · shared core (every page): content helpers, rich text, steps, audio, storage, sync,
// and the iPhone frame. Adds window.EP. Reads window.LESSON (the content file), window.AUDIO (recorded
// lines, from build.py) and window.EP_ASSETS (cast poses and scene pictures copied next to the pages).
(function () {
  var L = window.LESSON;
  var EP = (window.EP = { L: L });
  var ASSETS = window.EP_ASSETS || {};

  EP.esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  // ---------- words in the text ----------
  // Every word-wall word in visible text becomes a small gold chip (.wch, data-w = word id, data-g = glossary key);
  // every other glossary word becomes tappable (.gw, dotted underline). Forms come from words[].forms and
  // glossary[key].forms, so "fell for" finds "fall for".
  var FORM = {}, formList = [];
  function fkey(f) { return EP.esc(f).toLowerCase(); }
  (L.words || []).forEach(function (w) { (w.forms || [w.word]).forEach(function (f) { FORM[fkey(f)] = { w: w.id, g: w.word.toLowerCase() }; }); });
  Object.keys(L.glossary || {}).forEach(function (k) {
    var g = L.glossary[k];
    if ((L.words || []).some(function (w) { return w.word.toLowerCase() === k; })) return;
    (g.forms || [k]).forEach(function (f) { if (!FORM[fkey(f)]) FORM[fkey(f)] = { g: k }; });
  });
  formList = Object.keys(FORM).sort(function (a, b) { return b.length - a.length; });
  var WORD_RE = formList.length ? new RegExp("(^|[^A-Za-z])(" + formList.map(function (f) { return f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")(?![A-Za-z])", "gi") : null;
  function chip(text, hit) {
    if (hit.w) return '<span class="wch" data-w="' + hit.w + '" data-g="' + EP.esc(hit.g) + '" tabindex="0" role="button">' + text + "</span>";
    return '<span class="gw" data-g="' + EP.esc(hit.g) + '" tabindex="0" role="button">' + text + "</span>";
  }
  function markWords(html) {
    if (!WORD_RE) return html;
    var inside = 0;
    return html.split(/(<[^>]+>)/).map(function (part) {
      if (part.charAt(0) === "<") {
        if (/^<span class="(wch|gw)"/.test(part)) inside = 1;
        else if (inside && part === "</span>") inside = 0;
        return part;
      }
      if (inside) return part;
      return part.replace(WORD_RE, function (m, pre, word) { var hit = FORM[word.toLowerCase()]; return hit ? pre + chip(word, hit) : m; });
    }).join("");
  }
  // Content mark-up, applied after escaping:
  //   *starter phrase*   _linking word_   [word-wall word]   {wrong word}   ^corrected word^   a new line (\n)
  // Then every word-wall and glossary word is marked (opts.words === false to skip).
  // POINTS AS LISTS: a line that starts with "- " or "• " is one bullet point (one point per line); a run of them
  // becomes a list. A list of strings (`text: ["…", "…"]`) is drawn the same way (EP.richBlock).
  function points(h) {
    if (!/(^|\n)\s*[-•]\s/.test(h)) return h.replace(/\n/g, "<br>");
    var out = [], ul = [];
    function flush() { if (ul.length) { out.push('<ul class="pts">' + ul.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>"); ul = []; } }
    h.split("\n").forEach(function (ln) {
      var m = ln.match(/^\s*[-•]\s+(.*)$/);
      if (m) ul.push(m[1]);
      else { flush(); out.push(ln + "<br>"); }
    });
    flush();
    return out.join("").replace(/<br>$/, "").replace(/<br>(<ul)/g, "$1");
  }
  EP.rich = function (s, opts) {
    var h = EP.esc(s)
      .replace(/\{([^}]+)\}/g, '<s class="bad">$1</s>')
      .replace(/\^([^^]+)\^/g, '<b class="good">$1</b>')
      .replace(/\*([^*]+)\*/g, '<b class="sp">$1</b>')
      .replace(/(^|[\s(“"])_([^_]+)_/g, '$1<u class="lk">$2</u>')
      .replace(/\[([^\]]+)\]/g, function (m, x) { var hit = FORM[x.toLowerCase()]; return hit ? chip(x, hit) : '<span class="hl">' + x + "</span>"; });
    h = points(h);
    return opts && opts.words === false ? h : markWords(h);
  };
  // text that may be one string or a list of points
  EP.richBlock = function (s, opts) {
    if (Array.isArray(s)) return '<ul class="pts">' + s.map(function (x) { return "<li>" + EP.rich(x, opts) + "</li>"; }).join("") + "</ul>";
    return EP.rich(s, opts);
  };
  // Facts that belong to no side (O02 review M-1): a one-sided task card's `facts: {for: [...], against: [...]}` (labels
  // `factLabels`, default ["➕ For", "➖ Against"]) draws two plain lists above the part prompts, so a learner who stands
  // "against" never reads a minus under REASON. The stage card and the phone show the same lists.
  EP.factsHTML = function (c) {
    var f = c && c.facts;
    if (!f) return "";
    var lab = c.factLabels || ["➕ For", "➖ Against"];
    return '<div class="tfacts">' + [f["for"] || [], f.against || []].map(function (list, k) {
      return list.length ? '<div class="tf"><b>' + EP.esc(lab[k]) + "</b>" + EP.richBlock(list) + "</div>" : "";
    }).join("") + "</div>";
  };
  EP.glossKey = function (key) { return (L.glossary || {})[key] ? key : null; };
  // Plain text (for the voice and for aria labels): marks removed
  EP.plain = function (s) { return String(s || "").replace(/[{}^*\[\]]/g, "").replace(/(^|\s)_([^_]+)_/g, "$1$2"); };

  // ---------- the formula's parts ----------
  // A lesson names its parts in `parts` (PPF: P, P2, F · OREO: O, R, E, O2). Every part has a colour family
  // (c1 strong, c2 lip, c3 soft) from PARTCOL; a tag the table does not know takes a neutral slate, so a new
  // formula or a stray key never breaks a screen. A tag missing from `parts` still gets a sensible name.
  var PARTCOL = {
    P: { c1: "#6b7fa3", c2: "#b9c4d8", c3: "#e8edf5", solid: "var(--past)" },
    P2: { c1: "#1f5fb8", c2: "#9cc0ee", c3: "#e4effc", solid: "var(--present)" },
    F: { c1: "#e0792e", c2: "#f3c39b", c3: "#fff1e4", solid: "var(--future)" },
    O: { c1: "#6a3fc4", c2: "#c6b5ef", c3: "#f0ebfc", solid: "var(--op)" },
    R: { c1: "#0d8578", c2: "#9edbd1", c3: "#e1f5f1", solid: "var(--rs)" },
    E: { c1: "#b0610c", c2: "#efcb8e", c3: "#fff3de", solid: "var(--ex)" },
    O2: { c1: "#4f2c9e", c2: "#b9a3ea", c3: "#ece5fb", solid: "var(--op2)" }
  };
  var NEUTRAL = { c1: "#4f5d75", c2: "#c3cad6", c3: "#eef1f5", solid: "#4f5d75" };
  // any other formula (Optional organisers such as S1–S4): a calm set by the part's place in `parts`
  var MORE = [{ c1: "#1f6fb2", c2: "#a9cbea", c3: "#e5f0fa" }, { c1: "#13866f", c2: "#9fd8c9", c3: "#e0f4ee" },
    { c1: "#b4560f", c2: "#efc39a", c3: "#fdeedf" }, { c1: "#8a3fa8", c2: "#d6b5e6", c3: "#f4eaf9" }, { c1: "#b8364f", c2: "#eeb0bd", c3: "#fbe8ec" }];
  MORE.forEach(function (c) { c.solid = c.c1; });
  var KNOWN = { P: ["PAST", "What happened"], P2: ["PRESENT", "What is happening now"], F: ["FUTURE", "What will happen"],
    O: ["OPINION", "What I think"], R: ["REASON", "Why"], E: ["EXAMPLE", "A real case"], O2: ["OPINION AGAIN", "So …"] };
  EP.part = function (tag) {
    var p = (L.parts || []).filter(function (x) { return x.tag === tag; })[0];
    if (p) return p;
    var k = KNOWN[tag];
    return { tag: tag, name: k ? k[0] : String(tag || ""), label: k ? k[1] : "" };
  };
  EP.partCol = function (tag) {
    if (PARTCOL[tag]) return PARTCOL[tag];
    var i = (L.parts || []).map(function (p) { return p.tag; }).indexOf(tag);
    return i >= 0 ? MORE[i % MORE.length] : NEUTRAL;
  };
  // a CSS class suffix that always has a colour: t-<tag> for known tags, t-x (+ EP.tagStyle) for anything else
  EP.partCls = function (tag) { return PARTCOL[tag] ? String(tag) : "x"; };
  EP.tagStyle = function (tag) { return PARTCOL[tag] ? "" : ' style="background:' + EP.partCol(tag).c1 + '"'; };
  // the short letter on small tags: PPF keeps its approved P / P / F; other formulas drop a trailing number (O2 → O)
  EP.partShort = function (tag) {
    var p = EP.part(tag);
    if (p.short) return p.short;
    if (EP.timeFormula) return tag === "F" ? "F" : "P";
    return String(tag).replace(/\d+$/, "");
  };
  // the formula's tags in order, and whether its parts are places in time (PAST / PRESENT / FUTURE): only then
  // are the time line, the time words and the receding past drawn
  EP.order = (L.parts || []).map(function (p) { return p.tag; });
  // `tenseColor` (2026-10-14): the colour tenses wear (the violet `--f-tense` by default, close to O.R.E.O's OPINION);
  // "oreo" = the rose token `--f-tense-oreo` for O.R.E.O lessons, or any CSS colour. Set on the page root, so the stage,
  // the prep view and the phone all follow it.
  // `purposeLook: "l"` (2026-10-16, E10 version two, the curriculum lead's first priority: a page's reason must not be
  // small print): a larger purpose line with a gold rule, on the stage and the phone. Opt-in; without it nothing changes.
  if (L && L.purposeLook === "l" && document.documentElement) document.documentElement.classList.add("ep-purpose-l");
  if (L && L.tenseColor && document.documentElement) document.documentElement.style.setProperty("--f-tense", L.tenseColor === "oreo" ? "var(--f-tense-oreo)" : String(L.tenseColor));
  EP.timeFormula = EP.order.length > 0 && EP.order.every(function (t) { return t === "P" || t === "P2" || t === "F"; });
  // the name on the formula button: an Optional lesson names its organiser (`formulaName`, e.g. "Guide")
  // An acronym formula is shown with dots so learners read it as a formula, not a word: P.P.F, O.R.E.O
  // (colleague's review 2026-10-03). A named organiser ("Guide") stays as it is.
  EP.dotted = function (s) { s = String(s || ""); return /^[A-Z]{2,6}$/.test(s) ? s.split("").join(".") : s; };
  EP.formulaName = EP.dotted(L.formulaName || L.formula || EP.order.join(""));
  // Where tenses are taught (the `time` block, `fix` cards), P / P2 / F are labelled as tenses so they are not
  // confused with the parts of P.P.F (whose names are PAST / PRESENT / FUTURE).
  EP.tense = function (tag) { return { P: "Past Tense", P2: "Present Tense", F: "Future Tense" }[tag] || ""; };
  EP.numberWord = function (n) { return ["no", "one", "two", "three", "four", "five", "six", "seven", "eight"][n] || String(n); };
  EP.word = function (id) { return (L.words || []).filter(function (w) { return w.id === id; })[0]; };
  EP.wordByText = function (t) { return (L.words || []).filter(function (w) { return w.word === t; })[0]; };
  // The lesson's name as a LEARNER sees it (the student phone page): without a review marker at its end. A lesson made
  // to compare with another carries the marker in its title (" · Version 2") and in its `hubNote` ("Version 2 · to
  // compare …"); the teacher pages keep it, a learner never needs it (R11 v2 review R2, E10 v2 C12, 2026-10-16). Removed:
  // a trailing " · Version <n>", and a trailing " · <hubNote's first part>" (E10's style draft "· 风格 A 草稿").
  EP.learnerTitle = function () {
    var full = String(L.title || ""), t = full, mk = L.hubNote ? String(L.hubNote).split(/\s+·\s+/)[0].trim() : "", was;
    do { // both markers, in either order ("X · 风格 A 草稿 · Version 2")
      was = t;
      if (mk && t.slice(-(mk.length + 3)) === " · " + mk) t = t.slice(0, -(mk.length + 3));
      t = t.replace(/\s+·\s+Version\s+\d+\s*$/i, "");
    } while (t !== was);
    return t.trim() ? t : full; // a title that is only a marker stays as it is
  };
  EP.line = function (id) { return typeof id === "string" ? (L.lines || {})[id] : id; };

  // same words with the content mark-up (*tool*, _linking word_ …; R11 8 → 9, 2026-10-14), else its `text`. The voice
  // and the recorded clip always use `text`, so marking a line never needs a new recording. A `mark` whose words are not
  // exactly the `text` is ignored (build.py warns), so a transcript can never show other words than the ones heard.
  // `show` (2026-10-16, R11 v2 review R1): the words as they are WRITTEN when they differ from the words as they are
  // SPOKEN, e.g. "RM350" on screen for "three hundred and fifty ringgit" in the voice. Every place that shows a line
  // (stage, phone, transcripts, prep) uses `show`; the voice, the recordings and their file names keep `text`, so a
  // `show` never needs a new recording. A `mark` then marks the `show` words (its words must be exactly those).
  EP.lineText = function (ln) {
    if (!ln) return "";
    function bare(t) { return String(t).replace(/[{}^*\[\]_]/g, "").replace(/\s+/g, " ").trim(); }
    var shown = ln.show != null ? ln.show : ln.text;
    if (ln.mark && bare(ln.mark) === bare(shown)) return ln.mark;
    return shown;
  };
  EP.asset = function (name) { return ASSETS[name] || ""; };
  // The 24 Level 2 sub-skills: ids E1–R6 in the colleague's syllabus order (docs/reference/level2-syllabus-v1.txt),
  // names exactly as the syllabus writes them. One list for every lesson and for the e-learning App, so data from
  // class and App can be joined on the id. A lesson may still override a name in L.subskillNames, but should not.

<script>
// Episode lessons · tap a word → its meaning in the learner's language (no machine translation: the meanings are
// written in the content's `glossary`, with zh and ms, and checked by native readers). EP.gloss.open(el) opens a
// small card next to a word (.wch / .gw on the stage or the phone, or a dock chip); Esc or a tap outside closes it.
// Language: EN / 中文 / BM. Stage default EN (the teacher switches); phone default from the browser language.
// Remembered per device: touch:ep:lang-stage, touch:ep:lang-phone.
(function () {
  var EP = window.EP, L = EP.L, esc = EP.esc;
  var SCOPE = window.EP_FX_SCOPE === "phone" ? "phone" : "stage";
  var LANGS = ["en", "zh", "ms"], LABEL = { en: "EN", zh: "中文", ms: "BM" };
  function defaultLang() {
    if (SCOPE !== "phone") return "en";
    var n = (navigator.language || "en").toLowerCase();
    return /^zh/.test(n) ? "zh" : /^(ms|id)/.test(n) ? "ms" : "en";
  }
  var lang;
  try { lang = localStorage.getItem("touch:ep:lang-" + SCOPE); } catch (e) {}
  if (LANGS.indexOf(lang) < 0) lang = defaultLang();
  var card = null, anchor = null;

  function entry(key) {
    key = String(key || "").toLowerCase();
    var w = (L.words || []).filter(function (x) { return x.word.toLowerCase() === key; })[0];
    // every word-wall word opens a card, even before its glossary entry is written (English only until then)
    var g = (L.glossary || {})[key] || (w ? {} : null);
    if (!g) return null;
    return { word: w ? w.word : key, ipa: g.ipa || (w && /^\//.test(w.ipa) ? w.ipa : ""), en: g.en || (w ? w.meaning : ""), zh: g.zh, ms: g.ms, use: g.use || (w ? w.example : "") };
  }
  function body(e) {
    var main = lang === "en" ? e.en : e[lang];
    return '<button type="button" class="gx" aria-label="Close">×</button>' +
      '<p class="gh"><b>' + esc(e.word) + "</b>" + (e.ipa ? ' <span class="gipa">' + esc(e.ipa) + "</span>" : "") +
      EP.playTextBtn("Bella", e.word, "Say " + e.word, "gplay") + "</p>" +
      '<p class="gm" lang="' + (lang === "zh" ? "zh-Hans" : lang === "ms" ? "ms" : "en") + '">' + esc(main || e.en) + "</p>" +
      (lang !== "en" && e.en ? '<p class="gen">' + esc(e.en) + "</p>" : "") +
      (e.use ? '<p class="guse">“' + esc(e.use) + "”</p>" : "") +
      EP.gloss.seg("in-card");
  }
  function place() {
    if (!card || !anchor) return;
    var stage = anchor.closest(".ep-stage");
    if (stage) {
      var sr = stage.getBoundingClientRect(), ar = anchor.getBoundingClientRect(), dock = stage.querySelector(".dock");
      var limit = (dock ? dock.getBoundingClientRect().top : sr.bottom) - sr.top - sr.width * 0.008;
      var gap = sr.width * 0.008, w = card.offsetWidth, h = card.offsetHeight;
      var left = Math.min(Math.max(ar.left - sr.left + ar.width / 2 - w / 2, gap), sr.width - w - gap);
      var top = ar.top - sr.top - h - gap;                         // above the word
      if (top < gap) top = ar.bottom - sr.top + gap;               // or below it
      if (top + h > limit) top = Math.max(gap, limit - h);         // never over the dock
      card.style.left = left + "px"; card.style.top = top + "px";

  }

    lang: function () { return lang; },
    label: function () { return LABEL[lang]; },
    // the iOS-style segmented control: a pill, three segments, a white thumb that slides (spring) behind the
    // chosen one. One tap switches; ←/→ move it (roving focus); it appears in the dock, the card and the phone.
    seg: function (cls) {
      var i = LANGS.indexOf(lang);
      return '<div class="seg3 ' + (cls || "") + '" role="radiogroup" aria-label="Meaning language" style="--i:' + i + '"><span class="thumb" aria-hidden="true"></span>' +
        LANGS.map(function (l, k) {
          return '<button type="button" role="radio" data-lang="' + l + '" aria-checked="' + (k === i) + '" tabindex="' + (k === i ? 0 : -1) + '"' + (l === "zh" ? ' lang="zh-Hans"' : "") + ">" + LABEL[l] + "</button>";
        }).join("") + "</div>";
    },
    paint: function () {
      var i = LANGS.indexOf(lang);
      document.querySelectorAll(".seg3").forEach(function (s) {
        s.style.setProperty("--i", i);
        s.querySelectorAll("[data-lang]").forEach(function (b, k) { b.setAttribute("aria-checked", k === i ? "true" : "false"); b.tabIndex = k === i ? 0 : -1; });

    set: function (l) {
      if (LANGS.indexOf(l) < 0) return;
      lang = l;
      try { localStorage.setItem("touch:ep:lang-" + SCOPE, l); } catch (e) {}

    isOpen: function () { return !!card; },
    open: function (el) {
      var e = entry(el.getAttribute("data-g"));
      if (!e) return;

      anchor = el;
      card = document.createElement("div");
      card.className = "gloss";
      card.setAttribute("role", "dialog");
      card.setAttribute("aria-label", "Meaning of " + e.word);

      host.appendChild(card);

      el.classList.add("gsel");
      if (EP.fx) EP.fx.play("pop");
    },
    close: function () {
      if (card) card.remove();
      if (anchor) anchor.classList.remove("gsel");
      card = anchor = null;
    }

      e.stopPropagation();
      if (b.classList.contains("gx")) EP.gloss.close();
      else if (b.hasAttribute("data-lang")) EP.gloss.set(b.getAttribute("data-lang"));
      return;
    }
    if (e.target.closest && e.target.closest(".seg3")) return;

    if (!e.target.closest(".gloss, .wch, .gw, .dock .w, .ep-stage.mounted")) EP.gloss.close();

  // the segmented control anywhere (dock, phone header): one tap switches
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest(".seg3 [data-lang]");
    if (!b || (card && card.contains(b))) return;
    e.stopPropagation();
    EP.gloss.set(b.getAttribute("data-lang"));

    var sb = e.target.closest && e.target.closest(".seg3 [data-lang]");

      e.preventDefault(); e.stopPropagation();
      var k = LANGS.indexOf(lang);
      k = e.key === "Home" ? 0 : e.key === "End" ? LANGS.length - 1 : (k + (e.key === "ArrowRight" ? 1 : -1) + LANGS.length) % LANGS.length;
      var seg = sb.closest(".seg3"), inCard = card && card.contains(seg);
      EP.gloss.set(LANGS[k]);
      var target = (inCard ? card.querySelector(".seg3") : seg).querySelector('[data-lang="' + LANGS[k] + '"]');
      if (target) target.focus();
      return;
    }
    if (sb && (e.key === " " || e.key === "Enter")) { e.preventDefault(); e.stopPropagation(); EP.gloss.set(sb.getAttribute("data-lang")); return; }
    if (e.key === "Escape" && card) { EP.gloss.close(); e.stopPropagation(); return; }
    var w = e.target.closest && e.target.closest(".wch, .gw");
    if (w && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); EP.gloss.open(w); }
  }, true);
  // words on pages that have no stage handler (phone, prep) open on tap
  document.addEventListener("click", function (e) {
    var w = e.target.closest && e.target.closest(".wch, .gw");
    if (w && !w.closest(".ep-stage.mounted")) { e.stopPropagation(); EP.gloss.open(w); }
  });
  window.addEventListener("resize", place);
})();

</script>
<script>
// Episode lessons · "✎ Feedback": a short note about the screen that is showing, sent to the platform.
// The address is feedback.json's endpoint (build.py → window.EP_NOTE_ENDPOINT). POST as text/plain (a simple
// request, no preflight) with {lesson, code, screen, step, kind, size, text, page, reviewer}. Answers: 204 saved ·
// 400 bad note · 403 wrong origin · 404 switched off (the button hides for the session) · 413 too big ·
// 429 too many · 503 save failed. On any failure the text stays so it can be sent again. No names are asked.
// EP.note.mount(host, {page, where, jump}) puts the button in host; where() → {screen, step} (0-based screen);
// jump(screen, step), when given, moves this page to a screen without reloading.
// "My notes" (Marco 2026-10-03, A): a reviewer could not see a note once it was sent. Every note that is saved is
// also kept in THIS browser (localStorage, never sent anywhere else) and listed in the panel: this screen first,
// then the rest of this lesson, then other lessons; a tap goes to that screen. The button shows how many notes the
// screen already has. Another device or a cleared browser shows none; the notes themselves are safe on the platform.
// Who wrote it (2026-10-21): a teacher's own link carries ?by=<code> (or #…&by=<code>), a short code such as t2, never
// a name. The code must match ^[a-z0-9-]{1,20}$ (lower-cased first; anything else is ignored); it is remembered on this
// device (localStorage "touch:ep:reviewer"), so the hub links and every other lesson keep it, and a later ?by=
// replaces it, and an empty ?by= (or ?by=none) forgets it, for a shared classroom computer. Every note sends it as
// `reviewer`; the panel says "Sending as <code>" so the teacher can see the link worked. Without a code nothing
// changes. Which person a code stands for is kept privately by the coordinator.
(function () {
  var EP = window.EP, L = EP.L, esc = EP.esc;

  function off() { try { return sessionStorage.getItem(OFF) === "1"; } catch (e) { return false; } }
  var BY = "touch:ep:reviewer", BY_OK = /^[a-z0-9-]{1,20}$/;

    if (!m) return null;
    try { v = decodeURIComponent(m[1].replace(/\+/g, " ")).trim().toLowerCase(); } catch (e) { return null; }
    if (v === "" || v === "none") { try { localStorage.removeItem(BY); } catch (e) {} return null; }
    if (!BY_OK.test(v)) return null;
    try { localStorage.setItem(BY, v); } catch (e) {}
    return v;
  })();
  function reviewer() {
    if (pageBy) return pageBy;
    var v = null; try { v = localStorage.getItem(BY); } catch (e) {}

  }
  var KINDS = [["problem", "Problem"], ["suggestion", "Suggestion"], ["idea", "Teaching idea"]];
  var SIZES = ["1", "2–4", "5–7", "8–12"];
  var MSG = {
    204: "Sent — thank you.",
    400: "Not sent: a note can hold up to 20,000 characters. Your text is still here.",
    403: "Notes can't be sent from this page (open this page from its usual link). Your text is still here.",
    413: "Not sent: too long (20,000 characters at most). Your text is still here.",
    429: "Too many notes in ten minutes. Please wait a few minutes and send again. Your text is still here.",
    503: "Not sent this time. Please press Send again in a moment. Your text is still here.",
    net: "No internet connection. Please press Send again in a moment. Your text is still here."

      .then(function (r) {

      " <small>" + esc(KIND_NAME[n.kind] || "") + " · " + when(n.at) + (n.pics ? " · 📎" + n.pics : "") + "</small>";

    var tag = go && n.lesson !== L.id ? "a" : "button";

  }

    return '<details class="nmine"' + (here.length ? " open" : "") + "><summary>My notes · " + lesson + " in this lesson" + (other.length ? " · " + other.length + " in other lessons" : "") + "</summary>" +
      '<div class="nml">' + here.map(function (n) { return item(n, true, opts); }).join("") + rest.map(function (n) { return item(n, false, opts); }).join("") +
      (other.length ? '<p class="nmh">Other lessons</p>' + other.map(function (n) { return item(n, false, opts); }).join("") : "") + "</div></details>";

  EP.note = {

        var t = document.createElement("div");
        t.className = "note-toast"; t.textContent = !fresh ? (all === 1 ? "The note from this link was already here." : "All " + all + " notes from this link were already here.") :
          "Restored " + count(fresh, "earlier note") + " (tap “✎ Feedback” to see " + (fresh === 1 ? "it" : "them") + ")" + (all > fresh ? "; " + count(all - fresh, "other note") + (all - fresh === 1 ? " was" : " were") + " already here" : "") + ".";
        document.body.appendChild(t); setTimeout(function () { t.remove(); }, 6000);
      });
      if (window.MutationObserver) new MutationObserver(badge).observe(document.documentElement, { attributes: true, attributeFilter: ["data-pos"] });
      // A half-written note is never lost (Marco 2026-10-03: the panel closed by accident and the text was gone):
      // whatever is in the box is kept as a draft in this browser on every keystroke and on close, and comes back
      // the next time the panel opens, on any screen, until it is sent. A click outside no longer closes a panel
      // that holds text; Cancel, Esc and the button still do, and the draft stays.
      var DRAFT = "touch:ep:note-draft:" + L.id + ":" + opts.page;
      function draft(v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(DRAFT) || "null"); if (v) localStorage.setItem(DRAFT, JSON.stringify(v)); else localStorage.removeItem(DRAFT); } catch (e) { return null; } }
      function keepDraft() {
        if (!panel) return;
        var t = panel.querySelector("textarea").value;
        if (t.trim()) draft({ text: t, screen: opts.where().screen + 1, at: Date.now() }); else draft(null);
      }
      function close() { keepDraft(); if (panel) panel.remove(); panel = null; btn.setAttribute("aria-expanded", "false"); badge(); }
      function open() {
        badge();
        var w = opts.where();
        panel = document.createElement("div");
        panel.className = "note-panel";
        panel.setAttribute("role", "dialog");
        var by = reviewer();
        panel.setAttribute("aria-label", by ? "Feedback · " + by : "Feedback");
        panel.innerHTML = '<p class="nw">Screen ' + (w.screen + 1) + " · step " + w.step + " · " + esc(EP.screens[w.screen].title) + "</p>" +
          (by ? '<p class="nby">Sending as <b>' + esc(by) + "</b> · not you? Open your own link.</p>" : "") +
          '<div class="nchips" data-g="kind">' + KINDS.map(function (k) { return '<button type="button" data-v="' + k[0] + '" aria-pressed="' + (k[0] === kind) + '">' + k[1] + "</button>"; }).join("") + "</div>" +
          '<div class="nchips small" data-g="size"><span>Class size (optional)</span>' + SIZES.map(function (k) { return '<button type="button" data-v="' + k + '" aria-pressed="' + (k === size) + '">' + k + "</button>"; }).join("") + "</div>" +
          '<textarea maxlength="20000" placeholder="What should change on this screen? For example: the picture could be bigger. (You can paste a screenshot straight in.)" aria-label="Your note"></textarea>' +
          '<div class="npics"></div><div class="npickrow"><button type="button" class="npick">📎 Add pictures (up to 3)</button>' +
          '<input type="file" class="nfile" accept="image/png,image/jpeg,image/webp" multiple hidden></div>' +
          '<div class="nrow"><span class="nmsg" role="status"></span><span><button type="button" class="ncancel">Cancel</button> <button type="button" class="nsend">Send</button></span></div>' +
          mineHTML(w, opts);
        (opts.panelHost || document.body).appendChild(panel);
        var r = btn.getBoundingClientRect();
        if (!opts.panelHost) {
          panel.style.top = Math.min(window.innerHeight - 20, r.bottom + 8) + "px";
          panel.style.right = Math.max(8, window.innerWidth - r.right) + "px";
          // a long note and "My notes" together can be taller than a phone: the panel stops at the screen's foot and scrolls
          panel.style.maxHeight = Math.max(160, window.innerHeight - parseFloat(panel.style.top) - 8) + "px";
        }
        btn.setAttribute("aria-expanded", "true");
        var ta0 = panel.querySelector("textarea"), d = draft();
        if (d && d.text) {
          ta0.value = d.text;
          var hint = document.createElement("p");
          hint.className = "ndraft";
          hint.textContent = "This is your draft, not sent yet" + (d.screen && d.screen !== w.screen + 1 ? ". You started it on screen " + d.screen + "; it will be sent for this screen" : "") + ".";
          ta0.parentNode.insertBefore(hint, ta0);
        }
        // the box grows with the text up to its CSS max-height, then scrolls (long notes, 2026-10-29)
        function grow() { ta0.style.height = "auto"; ta0.style.height = (ta0.scrollHeight + 4) + "px"; }
        ta0.addEventListener("input", function () { grow(); keepDraft(); });
        grow();
        drawPics();
        panel.querySelector(".nfile").addEventListener("change", function (e) { addPics(e.target.files); e.target.value = ""; });
        ta0.addEventListener("paste", function (e) {
          var items = (e.clipboardData && e.clipboardData.files) || [];
          if (items.length) { e.preventDefault(); addPics(items); }
        });
        ta0.focus();
      }
      function drawPics() {
        if (!panel) return;
        var box = panel.querySelector(".npics");
        box.innerHTML = pics.map(function (p, i) { return '<span class="npic"><img src="' + p.url + '" alt="Picture ' + (i + 1) + '"><button type="button" data-rm="' + i + '" aria-label="Remove this picture">✕</button></span>'; }).join("");
        var pick = panel.querySelector(".npick"); pick.disabled = pics.length >= MAXPICS;
        pick.textContent = pics.length ? "📎 Add another (" + pics.length + "/" + MAXPICS + ")" : "📎 Add pictures (up to 3)";
      }
      function addPics(list) {
        var files = [].slice.call(list).filter(function (f) { return /^image\/(png|jpeg|webp)$/.test(f.type); });
        var msg = panel && panel.querySelector(".nmsg");
        if (!files.length) { if (msg) msg.textContent = "Only PNG, JPG and WebP pictures can be added."; return; }
        files.slice(0, MAXPICS - pics.length).forEach(function (f) {
          shrink(f).then(function (b) { if (pics.length >= MAXPICS) return; pics.push({ blob: b, url: URL.createObjectURL(b) }); drawPics(); });
        });
        if (files.length > MAXPICS - pics.length && msg) msg.textContent = "A note can have up to 3 pictures.";
      }
      // send the pictures of a saved note one by one; on failure keep the rest for Retry
      function sendPics(msg, done) {
        var i = 0, failed = [], total = pending.left.length;
        (function next() {
          if (i >= pending.left.length) {
            if (!failed.length) { pending = null; done(true); return; }
            pending.left = failed.map(function (f) { return f.p; });
            msg.innerHTML = esc("Your note was sent, but " + count(failed.length, "picture") + (failed.length === 1 ? " was" : " were") + " not (" + (PICMSG[failed[0].st] || PICMSG[503]) + ").") + ' <button type="button" class="nretry">Retry pictures</button>';
            done(false); return;
          }
          var p = pending.left[i++];
          msg.textContent = "Uploading picture " + i + "/" + total + "…";
          upload(pending.id, pending.token, p.n, p.blob).then(function (st) {
            if (st !== 204 && !(st >= 200 && st < 300)) failed.push({ p: p, st: st });
            next();
          });
        })();
      }
      btn.addEventListener("click", function (e) { e.stopPropagation(); if (panel) close(); else open(); });
      // keys and clicks inside the panel never reach the lesson (no slide moves while typing)
      document.addEventListener("keydown", function (e) {
        if (!panel) return;
        if (panel.contains(e.target)) { e.stopPropagation(); if (e.key === "Escape") close(); return; }
        if (e.key === "Escape") { close(); e.stopPropagation(); }
      }, true);
      document.addEventListener("click", function (e) {
        if (!panel) return;
        if (panel.contains(e.target)) {
          e.stopPropagation();
          var a = e.target.closest("a.nmi");
          if (a) { e.preventDefault(); location.href = a.getAttribute("href"); return; }
          var b = e.target.closest("button");
          if (!b) return;
          if (b.hasAttribute("data-go")) {
            var g2 = b.getAttribute("data-go").split(":"), s2 = +g2[0], k2 = +g2[1];
            close();
            if (opts.jump) opts.jump(s2, k2);
            else { location.hash = "s=" + (s2 + 1) + "&k=" + k2 + (EP.embedHash || ""); location.reload(); }
            return;
          }
          var g = b.parentElement.getAttribute("data-g");
          if (b.classList.contains("npick")) { panel.querySelector(".nfile").click(); return; }
          if (b.hasAttribute("data-rm")) { var rm = pics.splice(+b.getAttribute("data-rm"), 1)[0]; if (rm) URL.revokeObjectURL(rm.url); drawPics(); return; }
          if (b.classList.contains("nretry") && pending) {
            var m3 = panel.querySelector(".nmsg");
            sendPics(m3, function (ok) { if (ok) { m3.textContent = "All pictures sent — thank you."; setTimeout(close, 1200); } });
            return;
          }
          if (g === "kind") { kind = b.getAttribute("data-v"); panel.querySelectorAll('[data-g="kind"] button').forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); }
          else if (g === "size") { size = size === b.getAttribute("data-v") ? "" : b.getAttribute("data-v"); panel.querySelectorAll('[data-g="size"] button').forEach(function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-v") === size); }); }
          else if (b.classList.contains("ncancel")) close();
          else if (b.classList.contains("nsend")) {
            var ta = panel.querySelector("textarea"), text = ta.value.trim(), msg = panel.querySelector(".nmsg");
            if (!text) { ta.focus(); return; }
            var w = opts.where();
            var body = { lesson: L.id, code: L.code, screen: w.screen + 1, step: w.step, kind: kind, text: text, page: opts.page };
            if (size) body.size = size;
            var by2 = reviewer(); if (by2) body.reviewer = by2;
            b.disabled = true; msg.textContent = "Sending…";
            send(body).then(function (res) {
              var st = res.st;
              b.disabled = false;
              if (st === 204) {
                var withPics = pics.length;
                keep({ lesson: L.id, code: L.code, screen: body.screen, step: body.step, kind: kind, page: opts.page, title: EP.screens[w.screen].title, text: body.text, pics: withPics, at: Date.now() });
                ta.value = ""; ta.style.height = ""; draft(null); badge();
                var finish = function () { msg.textContent = MSG[204] + " It’s saved under “My notes”."; setTimeout(close, 1400); };
                if (!withPics) { finish(); return; }
                if (!res.d.id || !res.d.uploadToken) { pics = []; drawPics(); msg.textContent = "Your note was sent, but its pictures could not be sent this time (the platform gave no upload code)."; return; }
                pending = { id: res.d.id, token: res.d.uploadToken, left: pics.map(function (p, i) { return { n: i + 1, blob: p.blob }; }) };
                pics.forEach(function (p) { URL.revokeObjectURL(p.url); }); pics = []; drawPics();
                sendPics(msg, function (ok) { if (ok) finish(); });
                return;
              }
              if (st === 404) { try { sessionStorage.setItem(OFF, "1"); } catch (x) {} close(); buttons.forEach(function (x) { x.remove(); }); return; }
              msg.textContent = MSG[st] || MSG[503];
            });
          }
          return;
        }
        // a click outside closes the panel and does nothing else (it does not move the lesson on)
        if (!btn.contains(e.target)) {
          e.stopPropagation(); e.preventDefault();
          if (panel.querySelector("textarea").value.trim()) { var m2 = panel.querySelector(".nmsg"); m2.textContent = "Not sent yet: press Send, or Cancel to close (your text is kept)."; return; }
          close();
        }
      }, true);
      return wrap;
    }
  };
})();

<script>
// Episode lessons · the projected stage: one 16:9 screen built from the content's blocks, revealed step by
// step. EP.stageHTML draws a screen; EP.paint shows a step; EP.mountStage runs it with the dock tools.
(function () {
  var EP = window.EP, L = EP.L, esc = EP.esc, rich = EP.rich;
  function at(n) { return typeof n === "number" && n > 0 ? ' data-at="' + n + '"' : ""; }
  // shown from step `a` until step `u` (then hidden again; its space is kept)
  function atu(a, u) { return typeof u === "number" ? ' data-at="' + (typeof a === "number" ? a : 0) + '" data-until="' + u + '"' : at(a); }
  // TIME YOU CAN SEE: every element that stands for one part of the formula carries its place in time
  // (class tz tz-P | tz-P2 | tz-F, and data-tz for the arrival). The finish and the depth are in ep.css.
  function tz(t) { return ' tz tz-' + esc(t); }
  function tzd(t) { return ' data-tz="' + esc(t) + '"'; }
  // THE TIME LINE (drafts E + D, docs/mock/timeline-sketch.html): a glowing beam grey (past) → blue (now) →
  // orange (future), filled up to the newest revealed part; a cyan bead travels along the filled part and fades,
  // again and again; ticks with the time words, each lighting as the bead passes. Only the bead moves.
  // Positions are set by EP.timeLayout after each step (horizontal under side-by-side parts, vertical beside
  // stacked ones).
  var TIMEWORDS = [["last week", "P", 0.30], ["yesterday", "P", 0.70], ["now", "P2", 0.5], ["tomorrow", "F", 0.30], ["next time", "F", 0.70]];
  function beamHTML(dir) {
    return '<div class="tbeam ' + dir + '" aria-hidden="true"><i class="track"></i><i class="beam"></i><i class="nowdot"></i>' +
      TIMEWORDS.map(function (t, k) { return '<span class="tk" data-k="' + k + '" data-p="' + t[1] + '"><i></i><b>' + t[0] + "</b></span>"; }).join("") +
      '<i class="bead"></i></div>';
  }
  // The time line belongs to PPF lessons only (parts P, P2, F): a formula whose parts are not places in time
  // (OREO: opinion, reason, example, opinion again) gets no beam, no time words and no receding past.
  function tline() { return EP.timeFormula ? '<div class="tline">' + beamHTML("h") + "</div>" : ""; }
  function vbeam() { return EP.timeFormula ? beamHTML("v") : ""; }
  // the colour family of a part as CSS variables (puffy cards of a formula that is not PPF)
  function pcVars(t, i, n) {
    var c = EP.partCol(t), r = n > 1 ? -2 + 4 * i / (n - 1) : 0;
    return "--c1:" + c.c1 + ";--c2:" + c.c2 + ";--c3:" + c.c3 + ";--r:" + r.toFixed(2) + "deg";
  }
  // "the customer's phone", but "Mr. Tan's phone": a name (capitals after its first letter) keeps them and takes no "the"
  function ownerPhone(who) { return /[A-Z]/.test(who.slice(1)) ? who + "'s phone" : "the " + who.toLowerCase() + "'s phone"; }
  // one side of a two-sided task card: face down on the stage (only its owner reads it, on the phone)
  function sideHTML(sd, flipAt) {
    var who = sd.who || "Card", notes = [].concat(sd.notes || sd.text || []);
    return '<div class="tside"' + (flipAt ? ' data-flip="' + esc(flipAt) + '"' : "") + '><div class="in">' +
      '<div class="face cover"><span class="ic" aria-hidden="true">' + esc(sd.icon || "🔒") + "</span><b>" + esc(who) + "</b><small>" + esc(sd.hint || "🔒 Secret · on " + ownerPhone(who)) + "</small></div>" +
      '<div class="face open"><b>' + (sd.icon ? esc(sd.icon) + " " : "") + esc(who) + "</b>" + bullets(notes) + "</div></div></div>";
  }
  // THE ELABORATION TOOL (push-back, round 4, note 70, after the curriculum lead's sketch): `because` with `tool`. One
  // doubt at a time: its label, the doubt big, the question ("How would you answer Kumar?"), then the tool as three boxes
  // (YOUR POINT | because | YOUR REASON) that stay empty ("?") while the class brainstorms, with the block's `starters`
  // in the developed-response slot; at the item's `answersAt` the boxes fill and the developed response replaces the
  // starters. {tool: {title?, formula?, point?, reason?}, doubtLabel?, ask?, starters?, fullLabel?, items: [{who, avatar?,
  // doubt, claim, reason, full?, at, askAt?, toolAt?, answersAt}]}
  // Round 7 (note 89): an item's `askAt` brings the question ("How would you answer Kumar?") one step after the doubt, and
  // its `toolAt` the empty tool and the starters after that, so the doubt is read first, then the question, then the help.
  // THE MIDDLE WORD (2026-10-14, requirements G11: each lesson's own discourse): "because" unless the block says
  // otherwise. `link: "so"` for the whole block, `link: ["so", "but", …]` one word per item in order (the last one
  // repeats), or an item's own `link`. It is the gold word between the point and the reason, the middle of the tool,
  // the default formula line ("Point + _so_ + reason") and the default developed response.
  function linkOf(b, x, i) {
    if (x && x.link) return String(x.link);
    if (Array.isArray(b.link) && b.link.length) return String(b.link[Math.min(i, b.link.length - 1)]);
    return b.link ? String(b.link) : "because";
  }
  function becauseTool(b) {
    var t = b.tool === true ? {} : b.tool, n = b.items.length;
    return '<div class="bcz bctool' + (b.ghost ? " ghosts" : "") + '"' + at(b.at) + ">" + b.items.map(function (x, i) {
      var nx = b.items[i + 1], a = x.answersAt, ta = x.toolAt, claim = String(x.claim).replace(/[,\s]+$/, ""), lk = linkOf(b, x, i);
      var full = x.full || claim + " _" + lk + "_ " + x.reason;
      function box(cls, label, text) {
        return '<div class="bct-box ' + cls + '"><small>' + esc(label) + '</small><span class="bct-v"><i class="bct-q"' + atu(0, a) + ' aria-hidden="true">?</i><span' + at(a) + ">" + rich(text) + "</span></span></div>";
      }
      return '<div class="bcz-it"' + atu(x.at || 0, nx ? nx.at : null) + ">" +
        '<span class="bcz-n">' + esc(b.doubtLabel || ((x.who || "") + " doubts your warning")) + (n > 1 ? " · " + (i + 1) + " of " + n : "") + "</span>" +
        '<div class="bcz-doubt"><span class="av">' + EP.face(x.avatar, x.who) + "</span><div><p>“" + rich(x.doubt) + "”</p></div></div>" +
        (b.ask ? '<p class="bct-ask"' + at(x.askAt) + ">" + rich(b.ask) + "</p>" : "") +
        '<div class="bct"' + at(ta) + '><div class="bct-h"><small>' + rich(t.title || "Your elaboration tool") + "</small><b>" + rich(t.formula || "Point + _" + lk + "_ + reason") + "</b></div>" +
        '<div class="bct-row">' + box("pt", t.point || "Your point", claim) + '<span class="bct-bec">' + esc(lk) + "</span>" + box("rs", t.reason || "Your reason", x.reason) + "</div></div>" +
        '<div class="bct-slot">' + (b.starters ? '<div class="bct-st"' + atu(ta || 0, a) + "><small>Try it</small>" + b.starters.map(function (s) { return "<span>" + rich(s) + "</span>"; }).join("") + "</div>" : "") +
        '<div class="bct-full"' + at(a) + "><small>" + rich(b.fullLabel || "Developed response") + "</small><p>“" + rich(full) + "”</p></div></div></div>";
    }).join("") + "</div>";
  }
  // poll colours: the content may set its own (`colors`), else a calm categorical set
  var POLLCOL = ["#2f6fd0", "#e0792e", "#8a96ab", "#7a4fc4", "#14a38b", "#c0405c"];
  var curSc = null, titleDone = false;
  // a short list inside a card or a task-card side: ["…", "…"] → bullet lines (rich text)
  function bullets(items, cls) {
    return items && items.length ? '<ul class="' + (cls || "clist") + '">' + items.map(function (x) { return "<li>" + rich(x) + "</li>"; }).join("") + "</ul>" : "";
  }
  // a picture for a part: the item's own (a scene id or a list of ids, first one that exists), else the lesson's
  // partPics {P: [...], P2: [...], F: [...]}
  EP.partPic = function (tagName, own) {
    if (own === false) return ""; // a part may opt out of the lesson's partPics
    var list = [].concat(own || [], (L.partPics || {})[tagName] || []);
    for (var k = 0; k < list.length; k++) { var src = EP.asset("scene:" + list[k]); if (src) return src; }
    return "";
  };
  function glassPair(tagName, wrong, right, revealAt, pic, hint) {
    var src = EP.partPic(tagName, pic);
    return '<div class="glasswrap tzg-' + esc(tagName || "P2") + '">' + (src ? '<span class="gbg" style="background-image:url(\'' + esc(src) + '\')"></span>' : "") +
      '<div class="glass"><div class="gl bad"><span class="mk" aria-hidden="true">✕</span><span>' + rich(wrong) + "</span></div>" +
      (hint ? '<div class="ghint">' + esc(hint) + "</div>" : "") +
      '<div class="gl ok"' + tzd(tagName) + at(revealAt) + '><span class="mk" aria-hidden="true">✓</span><span>' + rich(right) + "</span></div></div></div>";
  }
  function tag(t, withLabel) {
    var p = EP.part(t);
    return '<span class="tag t-' + esc(EP.partCls(t)) + '"' + EP.tagStyle(t) + ">" + esc(p.name) + (withLabel ? "<small>" + esc(p.label) + "</small>" : "") + "</span>";
  }

  // ---------- phone apps (sketch C): the event itself, inside a real-looking phone ----------
  var APPS = {
    lock: function (b) {
      return '<div class="lock"><div class="d">' + esc(b.date || "") + '</div><div class="t">' + esc(b.time || "9:41") + "</div>" +
        (b.items || []).map(function (n) {
          return '<div class="notif"' + at(n.at) + '><span class="ni">' + (n.avatar ? '<span class="av">' + EP.face(n.avatar, n.from) + "</span>" : esc(n.icon || "")) + '</span><div class="nh">' + esc(n.from) + "<span>" + esc(n.time || "") + "</span></div><p>" + rich(n.text) + "</p></div>";
        }).join("") + "</div>";
    },
    chat: function (b) {
      return hd(b, true) + '<div class="chat">' + bubbles(b) + reason(b) + "</div>";
    },
    sms: function (b) {
      return hd(b, false) + '<div class="sms"><div class="day">Today</div>' + bubbles(b) + reason(b) + "</div>";
    },
    email: function (b) {
      return '<div class="app-hd"><span class="back">‹</span><div><b>' + esc(b.name || "Inbox") + "</b></div></div>" +
        '<div class="mail"><div class="from"><span class="av">' + EP.face(b.fromAvatar, b.from) + "</span><div><b>" + esc(b.from) + "</b><small>" + esc(b.addr || "") + '</small></div></div><div class="subj">' + esc(b.subject || "") + "</div>" +
        (b.items || []).map(function (m) { return "<div" + at(m.at) + ">" + rich(m.text) + "</div>"; }).join("") + reason(b) + "</div>";
    },
    // An incoming call. `video: true` says "Incoming video call …"; `video: "<scene id>"` shows the other side's camera
    // (the picture fills the call screen, a small self-view in the corner); `label` sets the top line yourself.
    call: function (b) {
      var ln = EP.line(b.line), vsrc = typeof b.video === "string" ? EP.asset("scene:" + b.video) : "";
      var label = b.label || (b.video ? (vsrc ? "Video call" : "Incoming video call …") : "Incoming call …");
      var play = ln ? '<div class="lnk">' + EP.playBtn(b.line, "Hear the call") + EP.scrub(b.line, b.dur) + "</div>" : "";
      if (vsrc) {
        return '<div class="call vcall"><img class="vfeed" src="' + esc(vsrc) + '" alt="' + esc(b.videoAlt || "") + '"><div class="vtop"><small>' + esc(label) + "</small><b>" + esc(b.name) + "</b>" +
          (b.sub ? "<small>" + esc(b.sub) + "</small>" : "") + '</div><span class="vself" aria-hidden="true"></span>' + play + '<div class="btns" aria-hidden="true"><i>✕</i></div></div>';
      }
      return '<div class="call"><small>' + esc(label) + '</small><div class="cav">' + EP.face(b.avatar, b.name) + "</div><b>" + esc(b.name) + "</b><small>" + esc(b.sub || "") + "</small>" +
        play + '<div class="btns" aria-hidden="true"><i>✕</i><i>✆</i></div></div>';

    // BEFORE → AFTER. By default the after is a list of lines, each with its part letter (O R E O / P P F).

    // a plain string (a list of {tag, text} is joined into one paragraph). `reaction: {before, after}` puts the
    // listener's reply under each side as chat bubbles (a chat item or a list: {who, text} · {who, line, quote: true,
    // play: true} for words and voice); the before's reaction shows with it, the after's one step after `afterAt`
    // unless the item sets `at`. `afters: [{label?, text, at, reaction?}]` instead of `after` shows several afters side

          b.after.map(function (x) { return '<div class="ln">' + '<span class="tag t-' + esc(EP.partCls(x.tag)) + '"' + EP.tagStyle(x.tag) + ' title="' + esc(EP.part(x.tag).name) + '">' + esc(EP.partShort(x.tag)) + "</span><span>" + rich(x.text) + "</span></div>"; }).join("") + "</div></div>";
      }
      var labels = b.labels || {}, react = b.reaction || {}, res = b.results || {};
      // the label's first part ("Before", "After") stands out as a tag; the rest ("two weeks ago · team chat") is small
      function lbl(t) { var p = String(t).split(/\s+·\s+/); return '<span class="lb"><b class="lbw">' + esc(p.shift()) + "</b>" + (p.length ? " " + esc(p.join(" · ")) : "") + "</span>"; }
      // `results: {before, after}`: what happened next, one line under each side's reactions (a red line for the cost of
      // the short version, a green one for the full one): E10 screen 8, note 65. A string, or {text, at}.
      function result(r, dflt) {
        if (!r) return "";

      }

      // `ask: {text, at}` (round 7, note 87): the question about the After, drawn under the After side's result, so it
      // sits on the side it is about (E10 8: "What did this warning have that the first one didn't?")
      var ask = b.ask ? '<div class="note do cask"' + at(b.ask.at) + ">" + EP.richBlock(b.ask.text) + "</div>" : "";
      function plain(t) { return Array.isArray(t) ? t.map(function (x) { return typeof x === "string" ? x : x.text; }).join(" ") : t; }
      function replies(list, dflt) {

      }

      var cols = b.stack ? "minmax(0,1fr)" : "minmax(0,.8fr)" + afters.map(function () { return afters.length > 1 ? " minmax(0,1.1fr)" : " minmax(0,1.6fr)"; }).join("");
      // Several afters (2026-10-14, O07 8): each after may carry its own `result` (or `results.after` is a list, one per
      // after), drawn under that after's replies; a single `results.after` and the `ask` belong to all of them, so they
      // sit in a band under the after columns (before 2026-10-14 both were drawn under the first after only).
      var multi = afters.length > 1, last0 = 0;

        return '<div class="ccol"><div class="aft"' + at(a.at) + ">" + lbl(a.label || labels.after || "After") + '<p class="atx">' + rich(plain(a.text)) + "</p></div>" + replies(a.reaction, a0 + 1) +
          (multi ? result(own, a0 + 1) : i === 0 ? result(res.after, a0 + 1) + ask : "") + "</div>";
      }).join("");
      var band = multi ? (res.after && !Array.isArray(res.after) ? result(res.after, last0 + 1) : "") + ask : "";
      return '<div class="cmp plain' + (multi ? " multi" : "") + (band ? " banded" : "") + (b.stack ? " stack" : "") + '" style="grid-template-columns:' + cols + '"' + at(b.at) + ">" +
        '<div class="ccol"><div class="bef">' + lbl(labels.before || "Before") + "<p>" + rich(plain(b.before)) + "</p></div>" + replies(react.before, 0) + result(res.before, 0) + "</div>" +

    // LIVE POLL · the class's answers to the phone's poll question(s) (tap items with answer: null) as bars.

    // A CHECKLIST that ticks: each item has a question (always shown) and an answer that appears with its tick at

    checklist: function (b) {

        else if (tool === "tminus" || tool === "tplus") setSeconds((timer.h ? seconds() : timer.left) + (tool === "tplus" ? 30 : -30));
        else if (t.hasAttribute("data-tchoice")) {
          api.el.querySelectorAll("[data-tchoice]").forEach(function (c) { c.removeAttribute("data-picked"); });
          t.setAttribute("data-picked", "");
          setSeconds(sc().timerChoices[+t.getAttribute("data-tchoice")].seconds);
        }
        else if (t.hasAttribute("data-hand")) { EP.pollHand(api.el, sc(), t, e.shiftKey ? -1 : 1); }
        else if (tool === "fx") { if (EP.fx) EP.fx.toggle(); }
        else if (t.classList.contains("w") && t.closest(".dock")) { if (EP.showWord) EP.showWord(api.el, t.getAttribute("data-w"), true); if (EP.gloss) EP.gloss.open(t); }
        else if (tool === "motion") { if (EP.setMotion) EP.setMotion(!EP.motionOn()); }
        else if (t.hasAttribute("data-team")) { var k = t.getAttribute("data-team"); scores[k] = (scores[k] || 0) + (e.shiftKey ? -1 : 1); if (scores[k] < 0) scores[k] = 0; paintScore(); if (EP.swell) EP.swell(t.querySelector("b"), api.el); if (EP.fx) EP.fx.play("pop"); }
        return;
      }
      if (e.target.closest(".pop,.readout,.tscript")) return;
      // a message inside a stage phone (a quoted voice message, a text) opens large, like a magnifying glass
      var qb = e.target.closest(".bub.quote, .bub.zoomable");
      if (qb && !qb.closest(".pre") && qb.closest(".st-main")) { zoom(qb); return; }
      if (opts.onClick) opts.onClick(e);
    });
    function zoom(bub) {
      var q = api.el.querySelector(".readout");
      if (!q) return;
      api.closeAll(true);
      var ph = bub.closest(".iph"), who = ph ? (ph.querySelector(".app-hd b") || {}).textContent : "";
      q.querySelector("small").textContent = bub.classList.contains("me") ? "You wrote" : who ? who + (bub.classList.contains("quote") ? " said" : " wrote") : "The message";
      q.querySelector("p").innerHTML = bub.innerHTML.replace(/<time>.*?<\/time>/, "");
      q.hidden = false;
    }
    api.timer = { toggle: toggleTimer, reset: resetTimer };
    return api;
  };

})();

</script>
<script>
// Episode lessons · prep.html: the teacher's preparation view. A lesson snapshot, the flow by phase, then
// every screen with all its steps shown and numbered (red dots = the click that reveals it), notes beside it.
(function () {
  var EP = window.EP, L = EP.L, esc = EP.esc, S = L.snapshot || {};
  document.body.classList.add("ep-prep");
  var phases = [], mins = {};
  EP.screens.forEach(function (s) { if (!(s.phase in mins)) { phases.push(s.phase); mins[s.phase] = 0; } mins[s.phase] += s.min; });
  function cell(label, v, wide) {
    if (!v) return "";
    var body = Array.isArray(v) ? "<ul>" + v.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : esc(v);
    return '<div class="' + (wide ? "wide" : "") + '"><b>' + esc(label) + "</b>" + body + "</div>";
  }
  var snap = '<div class="snap">' +
    cell("Goal", S.goal) + cell("Speaking win", S.speakingWin) + cell("Formula", S.formula) +
    cell("Storyline · one day with the cast", S.storyline, true) +
    cell("Time control", S.timeControl) + cell("Expression tools", S.expressionTools) + cell("Connectors", S.connectors) +
    cell("Language support", S.languageSupport) + cell("Task", S.task) + cell("Transfer", S.transfer) +
    cell("Evidence of success", S.evidence) +
    cell("Word wall", L.words.map(function (w) { return w.word; }).join(" · ")) +
    cell("Sub-skills", L.subskills.map(function (x) { return x + " " + EP.subskill(x); }).join(" · ")) +
    cell("Speaking ladder", S.ladder, true) +
    cell("Timed screens (the dock shows a timer only here; − / + or type to change it before you start)", EP.screens.map(function (x, i) {
      return x.timer ? (i + 1) + " " + x.title + ": " + timerText(x) : null;
    }).filter(Boolean), true) + "</div>";
  function timerText(x) {
    return (x.timerChoices || []).length ? x.timerChoices.map(function (c) { return c.label + " " + EP.fmt(c.seconds); }).join(" · ") : EP.fmt(x.timer);
  }
  var flow = '<div class="flow">' + phases.map(function (p) { return "<span>" + esc(p) + " · " + mins[p] + " min</span>"; }).join("") + '<span class="tot">Total · ' + EP.total() + " min</span></div>";
  // listening steps: when the recording plays by itself, and the transcript the class sees after the answers
  function listening(sc) {
    var ls = EP.listens(sc).filter(function (x) { return x.lines && x.lines.length; });
    if (!ls.length) return "";
    return '<div class="tp-sec"><h5>Listening</h5>' + ls.map(function (x) {
      var txt = x.lines.map(EP.line).filter(Boolean).map(function (ln) { return "<b>" + esc(ln.who) + ":</b> " + esc(EP.plain(EP.lineText(ln))); }).join("<br>");
      return "<p>" + (x.at ? "Click " + x.at : "Start") + ": nothing plays by itself; the first → (or the ▶ Listen button) plays it, the next → goes on." +
        (typeof x.transcriptAt === "number" ? " The captions button is on the picture from " + (x.at ? "click " + x.at : "the start") + ": press it for the full text at any time; at click " + x.transcriptAt + " the lesson points to it." : "") + "</p><p>" + txt + "</p>";
    }).join("") + "</div>";
  }
  // discussion steps (`discuss`, note 75): where the first → only holds, so the answers wait for the class
  function discussion(sc) {
    var ds = EP.discusses ? EP.discusses(sc) : [];
    if (!ds.length) return "";
    return '<div class="tp-sec"><h5>Discussion holds</h5><p>' + ds.map(function (x) { return x.at ? "Click " + x.at : "Start"; }).join(" · ") +
      ": the class talks first. The first → only holds (the 💬 cue says so); the next → or a tap on the cue shows the answer.</p></div>";
  }
  var rows = EP.screens.map(function (sc, i) {
    var t = sc.teacher || {}, n = EP.steps(sc);
    var steps = (t.say || []).map(function (s, k) {
      var last = k === t.say.length - 1 && n > k;
      return "<li><b>" + (k === 0 ? "Start" : "Click " + k) + (last ? "–" + n : "") + "</b><span>" + esc(s) + "</span></li>";
    }).join("");
    var more = Object.keys(t.more || {}).map(function (k) { return '<div class="tp-more"><b>' + esc(k) + "</b>" + esc(t.more[k]) + "</div>"; }).join("");
    var grammar = [].concat(sc.grammar || []).map(function (g) { return esc(g.title) + ": " + esc(EP.plain(g.rule)); }).join("<br>");
    return '<section class="prow" id="s' + (i + 1) + '"><div class="pstage" data-i="' + i + '"></div><div>' +
      '<h2>' + (i + 1) + " · " + esc(sc.title) + '<span class="pnote" data-i="' + i + '"></span></h2>' +
      '<div class="tp-meta"><span>' + esc(sc.phase) + "</span><span>" + sc.min + " min</span><span>" + n + " click" + (n === 1 ? "" : "s") + "</span>" +
      (sc.timer ? "<span>⏱ Timer " + esc(timerText(sc)) + "</span>" : "") +
      (sc.ladder ? "<span>Ladder: " + esc(sc.ladder) + "</span>" : "") + (sc.who ? "<span>Who: " + esc(sc.who) + "</span>" : "") +
      ((sc.trains || []).length ? "<span>Trains: " + esc(sc.trains.join(", ")) + "</span>" : "") + "</div>" +
      '<div class="tp-sec"><h5>Goal</h5><p>' + esc(t.goal || "") + "</p></div>" +
      '<div class="tp-sec"><h5>Steps</h5><ol class="tp-steps">' + steps + "</ol></div>" +
      (t.answers ? '<div class="tp-sec"><h5>Answers</h5><p>' + esc(t.answers) + "</p></div>" : "") +
      (t.flex ? '<div class="tp-sec"><h5>Flex · four versions</h5>' + EP.flexHTML(t.flex) + "</div>" : "") +
      (grammar ? '<div class="tp-sec"><h5>Grammar tip (G)</h5><p>' + grammar + "</p></div>" : "") +
      listening(sc) + discussion(sc) +
      (more ? '<div class="tp-sec">' + more + "</div>" : "") +
      '<p class="pp-phone"><b>On the phone:</b> ' + esc((sc.phone || {}).ask || "look up") + "</p></div></section>";
  }).join("");
  // embedded in another system's screen (core.js) the other pages are named, not linked: a link would leave the page
  function page(n) { return EP.embedded ? "<b>" + n + ".html</b>" : '<a href="' + n + '.html">' + n + ".html</a>"; }
  document.getElementById("app").innerHTML = '<main class="pp"><header><p class="kicker">' + esc(L.level) + " · " + esc(L.skill || L.fn) + " · " + esc(L.code) + " · preparation</p>" +
    "<h1>" + esc(L.title) + "</h1><p class=\"lead\">" + esc(L.draft || "") + ". Every screen with all its steps shown; a red number is the click that reveals that part. Open " + page("class") + " to teach (T = your notes, N = names), " + page("review") + " to see the phone beside it.</p></header>" +
    snap + flow + rows + "</main>";
  if (EP.note) document.querySelectorAll(".pnote").forEach(function (h) {
    var i = +h.getAttribute("data-i");
    EP.note.mount(h, { page: "prep", where: function () { return { screen: i, step: EP.steps(EP.screens[i]) }; } });
  });
  document.querySelectorAll(".pstage").forEach(function (box) {
    var sc = EP.screens[+box.getAttribute("data-i")];
    box.innerHTML = EP.stageHTML(sc, { numbered: true });
    EP.paint(box.firstElementChild, sc, EP.steps(sc));
  });
})();

</script>
</body>
</html>
