<style>
/* TOUCH English lesson theme. Light, brand-first: navy carries the page, red marks the one thing in focus. */
:root {
  --navy: #172D55;
  --navy-2: #22427A;
  --ink: #13203B;
  --muted: #56647E;
  --line: #DAE0EA;
  --mist: #F1F4F9;
  --paper: #FFFFFF;
  --red: #ED1C24;
  --red-ink: #B8141B;
  --blush: #FDEBEC;
  --ok: #1D7447;
  --ok-bg: #E3F2E9;
  --warn: #8A5700;
  --warn-bg: #FCF0D9;
  --display: "Manrope", "Segoe UI", system-ui, sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --ipa: "Noto Sans", "Segoe UI", "Lucida Grande", sans-serif;
  --r: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid color-mix(in srgb, var(--navy) 55%, white); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); color: var(--navy); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.ipa { font-family: var(--ipa); color: var(--muted); font-weight: 400; }
.kicker { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--red-ink); }
.ico { width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex: none; }
.pic { display: inline-block; vertical-align: middle; flex: none; }
.pic svg, .pic img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
.brand { display: inline-flex; align-items: baseline; gap: .35em; font-family: var(--display); font-weight: 800; white-space: nowrap; }
.brand b { color: var(--navy); letter-spacing: .18em; font-weight: 800; }
.brand i { color: var(--red); font-style: normal; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- Shared controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--paper); color: var(--navy); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 15px; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--navy); }
.btn.solid { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.solid:hover { background: var(--navy-2); }
.btn.small { padding: 5px 12px; font-size: 13px; }
.say { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--paper); color: var(--navy); flex: none; transition: background .15s; }
.say:hover { background: var(--mist); }
.say.playing { background: var(--navy); color: #fff; border-color: var(--navy); }
.chip { display: inline-flex; align-items: center; border: 2px solid var(--navy); color: var(--navy); background: var(--paper); border-radius: 10px; padding: 2px 10px; font-weight: 700; transition: background .15s; }
.chip:hover, .chip.on { background: var(--navy); color: #fff; }
.opt { border: 2px solid var(--line); background: var(--paper); color: var(--navy); border-radius: 12px; padding: 10px 14px; font-weight: 600; text-align: left; transition: background .15s, border-color .15s; }
.opt:hover { border-color: var(--navy); }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.opt.no { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.feedback { font-size: 14px; font-weight: 600; min-height: 1.5em; }
.feedback.ok { color: var(--ok); }
.feedback.no { color: var(--warn); }

/* ---------- Translation (globe) ---------- */
.globe { position: relative; }
.globe-btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--paper); color: var(--navy); border-radius: 999px; padding: 6px 12px 6px 9px; font-weight: 700; font-size: 13px; }
.globe-btn:hover { border-color: var(--navy); }
.globe-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 50; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(19, 32, 59, .14); padding: 6px; min-width: 210px; }
.globe-menu p { margin: 4px 10px 6px; font-size: 12px; color: var(--muted); }
.globe-menu button { display: flex; width: 100%; justify-content: space-between; align-items: center; border: 0; background: none; border-radius: 8px; padding: 8px 10px; font-size: 15px; color: var(--ink); text-align: left; }
.globe-menu button:hover { background: var(--mist); }
.globe-menu button[aria-checked="true"] { color: var(--navy); font-weight: 700; }
html[data-lang="zh"] .gw, html[data-lang="ms"] .gw { border-bottom: 2px dotted color-mix(in srgb, var(--navy) 55%, white); cursor: pointer; }
html[data-lang="zh"] .gw:hover, html[data-lang="ms"] .gw:hover { background: var(--mist); }
.gpop { position: absolute; z-index: 60; background: var(--navy); color: #fff; border-radius: 10px; padding: 7px 12px; font-size: 15px; line-height: 1.35; box-shadow: 0 8px 24px rgba(19, 32, 59, .25); max-width: 260px; pointer-events: none; }
.gpop small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #BFCBE0; }

/* ---------- Class deck ---------- */
body.deck { background: #0F1D38; height: 100vh; overflow: hidden; }
body.deck #app { height: 100vh; display: flex; flex-direction: column; }
.stage-wrap { flex: 1; position: relative; min-height: 0; }
.stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: center; background: var(--paper); border-radius: 6px; overflow: hidden; }
.slide { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 34px 64px 44px; visibility: hidden; }
.slide.active { visibility: visible; }
.slide-head { display: flex; align-items: center; gap: 18px; font-size: 16px; color: var(--muted); padding-bottom: 20px; }
.slide-head .brand { font-size: 17px; }
.slide-head .sep { color: var(--line); }
.slide-head .num { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--navy); }
.slide-title { display: flex; flex-direction: column; gap: 6px; margin-bottom: 26px; }
.slide-title h2 { font-size: 54px; font-weight: 800; line-height: 1.05; }
.slide-title .kicker { font-size: 15px; }
.slide-body { flex: 1; min-height: 0; display: flex; flex-direction: column; font-size: 26px; }
.slide .note { position: absolute; left: 64px; right: 64px; bottom: 18px; background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 12px 18px; font-size: 19px; display: none; }
body.show-notes .slide .note { display: block; }
.slide .note b { font-weight: 800; }

.toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 18px; color: #C9D3E6; font-size: 14px; }
.toolbar .tb { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: #fff; border-radius: 999px; padding: 7px 13px; font-weight: 600; font-size: 14px; }
.toolbar .tb:hover { background: rgba(255,255,255,.16); }
.toolbar .tb.on { background: #fff; color: var(--navy); }
.toolbar .where { font-variant-numeric: tabular-nums; min-width: 230px; }
.toolbar .bar { flex: 1; height: 4px; background: rgba(255,255,255,.14); border-radius: 4px; overflow: hidden; }
.toolbar .bar i { display: block; height: 100%; background: var(--red); transition: width .25s; }
.toolbar kbd { font-family: var(--body); font-size: 11px; opacity: .7; }

.overview { position: absolute; inset: 0; z-index: 40; background: rgba(15, 29, 56, .96); padding: 36px; overflow: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-content: start; }
.overview button { text-align: left; background: var(--paper); border: 3px solid transparent; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.overview button.current { border-color: var(--red); }
.overview button span { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--red-ink); }
.overview button strong { font-family: var(--display); font-size: 20px; color: var(--navy); }

/* Slide components */
.title-slide { flex-direction: row; padding: 0; }
.title-slide .left { flex: 1.05; padding: 64px; display: flex; flex-direction: column; justify-content: space-between; }
.title-slide .right { flex: 1; background: var(--mist); display: grid; place-items: center; padding: 40px; }
.title-slide .logo { width: 240px; }
.title-slide h1 { font-size: 104px; font-weight: 800; line-height: .98; letter-spacing: -0.03em; }
.title-slide h1 em { font-style: normal; color: var(--red); }
.title-slide .meta { display: flex; gap: 10px; flex-wrap: wrap; }
.tag { border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 16px; font-size: 18px; font-weight: 700; color: var(--navy); }
.mission { font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; max-width: 640px; }

.goals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.goal { display: flex; gap: 20px; align-items: flex-start; background: var(--mist); border-radius: var(--r); padding: 26px 28px; }
.goal .n { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; color: var(--red); width: 36px; }
.goal h3 { font-size: 30px; margin-bottom: 6px; }
.goal p { margin: 0; font-size: 22px; color: var(--muted); }
.goal .tick { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--paper); display: grid; place-items: center; color: transparent; flex: none; }
.goal .tick.on { background: var(--ok); border-color: var(--ok); color: #fff; }

.vocab-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
.vrow { display: grid; grid-template-columns: 58px 196px 182px 1fr; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 21px; }
.vrow .pic { width: 52px; height: 52px; background: var(--mist); border-radius: 10px; padding: 4px; }
.vrow .word { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.15; color: var(--navy); }
.vrow .ipa { font-size: 18px; white-space: nowrap; }
.vrow .ex { color: var(--ink); }
.hide-ex .vrow .ex { color: transparent; background: var(--mist); border-radius: 6px; }
.sound-focus { margin-top: auto; padding-top: 14px; font-size: 19px; color: var(--muted); }
.sound-focus b { color: var(--navy); }

.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; flex: 1; min-height: 0; }
.scene { background: var(--mist); border-radius: var(--r); padding: 20px; display: grid; place-items: center; }
.qlist { display: flex; flex-direction: column; gap: 14px; }
.qitem { display: flex; gap: 16px; align-items: center; padding: 16px 20px; border-radius: 16px; border: 2px dashed var(--line); color: var(--muted); font-size: 26px; text-align: left; background: var(--paper); }
.qitem.shown { border-style: solid; border-color: var(--navy); color: var(--ink); }
.qitem .n { font-weight: 800; color: var(--red); }
.starter { margin-top: auto; background: var(--navy); color: #fff; border-radius: 16px 16px 16px 4px; padding: 18px 24px; font-size: 28px; font-weight: 700; align-self: flex-start; }

.steps { display: flex; gap: 12px; margin-bottom: 22px; }
.step { display: flex; align-items: center; gap: 10px; border-radius: 999px; padding: 10px 20px; background: var(--mist); color: var(--muted); font-weight: 700; font-size: 21px; border: 0; }
.step.on { background: var(--red); color: #fff; }
.chunk-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
.chunk-cols h3 { font-size: 22px; color: var(--muted); font-weight: 700; margin-bottom: 12px; }
.bubble { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--mist); border: 2px solid transparent; border-radius: 18px 18px 18px 4px; padding: 14px 18px; margin-bottom: 12px; font-size: 25px; font-weight: 600; color: var(--ink); transition: border-color .15s, background .15s; }
.bubble:hover { border-color: var(--navy); }
.bubble.playing { background: var(--navy); color: #fff; }

.match { display: flex; flex-direction: column; gap: 22px; flex: 1; }
.match-pics { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px; }
.mpic { background: var(--mist); border: 3px solid transparent; border-radius: 18px; padding: 16px 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.mpic .pic { width: 150px; height: 150px; }
.mpic .slot { min-height: 40px; font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--ok); }
.mpic.ok { border-color: var(--ok); background: var(--ok-bg); }
.mpic.no { border-color: var(--warn); animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.match-words { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.mword { border: 2px solid var(--navy); background: var(--paper); color: var(--navy); border-radius: 999px; padding: 10px 26px; font-weight: 800; font-size: 26px; }
.mword.sel { background: var(--navy); color: #fff; }
.mword.used { visibility: hidden; }
.match-bar { display: flex; justify-content: center; gap: 12px; margin-top: auto; }

.dlg { display: flex; flex-direction: column; gap: 14px; }
.line { display: flex; gap: 16px; align-items: flex-start; max-width: 88%; }
.line.B { align-self: flex-end; flex-direction: row-reverse; }
.avatar { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 24px; flex: none; background: var(--mist); color: var(--navy); }
.line.B .avatar { background: var(--navy); color: #fff; }
.says { background: var(--mist); border-radius: 22px 22px 22px 6px; padding: 12px 22px; font-size: 29px; font-weight: 600; }
.says small { display: block; font-size: 15px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.line.B .says { background: var(--navy); color: #fff; border-radius: 22px 22px 6px 22px; }
.line.B .says small { color: #BFCBE0; }
.line.pending { opacity: .18; }
.line.speaking .says { box-shadow: 0 0 0 4px var(--red); }
.hl { border-radius: 6px; padding: 0 3px; transition: background .2s; }
.hl.on { background: #FFE08A; color: var(--ink); }
.line.B .hl.on { color: var(--ink); }
.tasks { display: flex; flex-direction: column; gap: 12px; }
.task { display: flex; gap: 14px; align-items: center; text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 14px; padding: 13px 18px; font-size: 23px; font-weight: 700; color: var(--navy); }
.task .ico { width: 30px; height: 30px; color: var(--red); }
.task.on { border-color: var(--navy); background: var(--mist); }
.task .ans { margin-left: auto; font-size: 17px; color: var(--muted); font-weight: 600; }

.guided .says .chip { font-size: 29px; padding: 0 12px; margin: 0 2px; }
.line.B .says .chip { border-color: #fff; color: #fff; background: transparent; }
.line.B .says .chip:hover { background: #fff; color: var(--navy); }

.ptable { display: flex; flex-direction: column; gap: 16px; }
.prow { display: grid; grid-template-columns: 220px 1fr; align-items: center; gap: 18px; background: var(--mist); border-radius: 18px; padding: 14px 20px; }
.prow .lab { font-size: 17px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--red-ink); }
.prow .sent { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 30px; font-weight: 700; color: var(--ink); }
.prow .sent > .tight { margin-left: -10px; }
.slotcol { display: inline-flex; flex-wrap: wrap; gap: 6px; background: var(--paper); border-radius: 12px; padding: 5px; }
.slotcol button { border: 0; background: none; border-radius: 8px; padding: 3px 12px; font-size: 22px; font-weight: 600; color: var(--muted); }
.slotcol button.on { background: var(--navy); color: #fff; font-size: 28px; font-weight: 800; }
.built { margin-top: 18px; font-size: 38px; font-weight: 800; color: var(--navy); display: flex; align-items: center; gap: 16px; }
.built .say { width: 54px; height: 54px; }

.rp { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 40px; flex: 1; min-height: 0; }
.sitcard { background: var(--mist); border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.sitcard .pic { width: 170px; height: 170px; align-self: center; }
.sitcard h3 { font-size: 34px; }
.sitcard p { margin: 0; font-size: 28px; }
.rp-controls { display: flex; gap: 12px; align-items: center; margin-top: auto; flex-wrap: wrap; }
.timer { font-family: var(--display); font-weight: 800; font-size: 46px; color: var(--navy); font-variant-numeric: tabular-nums; min-width: 120px; }
.timer.low { color: var(--red); }
.tmpl .line { max-width: 100%; }
.tmpl .says { font-size: 24px; padding: 8px 18px; }
.tmpl .avatar { width: 44px; height: 44px; font-size: 19px; }

.review { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 44px; }
.rq { margin-bottom: 18px; }
.rq p { margin: 0 0 8px; font-size: 26px; font-weight: 700; }
.rq .opts { display: flex; gap: 10px; }
.rq .opt { font-size: 22px; padding: 6px 18px; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; }
.tile { border: 2px solid var(--navy); background: var(--paper); color: var(--navy); border-radius: 10px; padding: 4px 14px; font-weight: 700; font-size: 22px; }
.tile.placed { background: var(--navy); color: #fff; }
.answer-line { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; border-bottom: 2px solid var(--line); padding: 4px 0 8px; margin-bottom: 8px; align-items: center; }
.uq { margin-bottom: 22px; }
.uq.ok .answer-line { border-color: var(--ok); }

.qa { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; }
.qa ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.qa li { font-size: 28px; }
.qa .phr .bubble { font-size: 28px; }
.bigq { font-family: var(--display); font-size: 64px; font-weight: 800; color: var(--navy); line-height: 1.05; margin-bottom: 22px; }

.fb-table { width: 100%; border-collapse: collapse; font-size: 24px; }
.fb-table th { text-align: left; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; }
.fb-table td { border-top: 1px solid var(--line); padding: 10px; }
.fb-table td:first-child { font-weight: 700; }
.lvl { width: 64px; height: 50px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); font-weight: 800; font-size: 22px; color: var(--navy); }
.lvl.on[data-v="1"] { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.lvl.on[data-v="2"] { background: var(--mist); border-color: var(--navy); }
.lvl.on[data-v="3"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.action { margin-top: auto; font-size: 30px; font-weight: 700; color: var(--navy); background: var(--mist); border-radius: 18px; padding: 18px 26px; }

.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.thanks { flex-direction: row; padding: 0; background: var(--navy); color: #fff; }
.thanks .left { flex: 1.2; padding: 72px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
.thanks h1 { color: #fff; font-size: 130px; font-weight: 800; line-height: .95; letter-spacing: -0.03em; }
.thanks .mission { color: #BFCBE0; font-size: 18px; }
.thanks .right { flex: 1; background: var(--paper); display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 64px; color: var(--ink); }
.thanks .right h3 { font-size: 36px; }
.thanks .right p { font-size: 24px; margin: 0; color: var(--muted); }

/* ---------- Student pages (before / after) ---------- */
body.student { background: var(--mist); }
.s-top { position: sticky; top: 0; z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); }
.s-top .in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 18px; }
.s-top .brand { font-size: 14px; }
.s-top .page { font-size: 13px; font-weight: 700; color: var(--muted); }
.s-top .globe { margin-left: auto; }
.s-main { max-width: 640px; margin: 0 auto; padding: 18px 16px 60px; display: flex; flex-direction: column; gap: 16px; }
.s-hero { padding: 18px 4px 4px; }
.s-hero h1 { font-size: 40px; font-weight: 800; line-height: 1.05; margin: 6px 0 10px; }
.s-hero p { margin: 0; color: var(--muted); font-size: 16px; }
.s-hero .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.s-hero .tag { font-size: 13px; padding: 4px 12px; background: var(--paper); }
.card { background: var(--paper); border-radius: 20px; padding: 20px; }
.card > header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.card > header h2 { font-size: 22px; font-weight: 800; }
.card > header .step-n { font-size: 12px; font-weight: 800; color: var(--red-ink); letter-spacing: .1em; text-transform: uppercase; }
.card > header .done { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--ok); }
.card .lead { margin: -6px 0 14px; color: var(--muted); font-size: 15px; }
.s-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.s-list li { display: flex; gap: 12px; align-items: flex-start; }
.s-list .n { font-weight: 800; color: var(--red); min-width: 18px; }

.wcards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.wcard { display: flex; flex-direction: column; gap: 4px; background: var(--mist); border-radius: 16px; padding: 12px; }
.wcard .top { display: flex; align-items: center; justify-content: space-between; }
.wcard .pic { width: 64px; height: 64px; }
.wcard .w { font-family: var(--display); font-weight: 800; font-size: 19px; color: var(--navy); line-height: 1.2; }
.wcard .ipa { font-size: 14px; }
.wcard .ex { font-size: 14px; color: var(--ink); }

.sent-list { display: flex; flex-direction: column; gap: 8px; }
.sent { display: flex; align-items: center; gap: 12px; background: var(--mist); border-radius: 14px; padding: 10px 12px; font-weight: 600; }
.s-dlg { display: flex; flex-direction: column; gap: 10px; }
.s-dlg .line { max-width: 92%; gap: 10px; align-items: flex-end; }
.s-dlg .avatar { width: 38px; height: 38px; font-size: 15px; }
.s-dlg .says { font-size: 16px; padding: 9px 14px; border-radius: 16px 16px 16px 4px; }
.s-dlg .line.B .says { border-radius: 16px 16px 4px 16px; }
.s-dlg .says small { font-size: 11px; }
.s-dlg .say { width: 32px; height: 32px; }

.note-box { width: 100%; min-height: 64px; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; color: var(--ink); resize: vertical; background: var(--paper); }
.think { display: flex; flex-direction: column; gap: 14px; }
.think label { font-weight: 700; display: block; margin-bottom: 6px; }
.saved { font-size: 12px; color: var(--muted); }

.quiz { display: flex; flex-direction: column; gap: 18px; }
.quiz .q p { margin: 0 0 8px; font-weight: 700; font-size: 17px; }
.quiz .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
.quiz .opt.picopt { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; }
.quiz .opt.picopt .pic { width: 64px; height: 64px; }
.listen-q { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-weight: 700; }
.ready { text-align: center; padding: 16px; border-radius: 16px; background: var(--ok-bg); color: var(--ok); font-weight: 800; font-size: 20px; }

.flash { perspective: 1000px; }
.flash-card { position: relative; height: 230px; border: 0; background: none; padding: 0; width: 100%; transform-style: preserve-3d; transition: transform .45s; }
.flash-card.flipped { transform: rotateY(180deg); }
.flash-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 18px; background: var(--mist); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px; }
.flash-face .pic { width: 120px; height: 120px; }
.flash-face.back { transform: rotateY(180deg); background: var(--navy); color: #fff; }
.flash-face.back .w { font-family: var(--display); font-size: 32px; font-weight: 800; }
.flash-face.back .ipa { color: #BFCBE0; font-size: 18px; }
.flash-face .hint { font-size: 13px; color: var(--muted); }
.flash-face.back .ex { font-size: 16px; }
.flash-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.flash-row .btn { white-space: nowrap; }
.flash-row .count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.vocab-grid .vrow { padding: 13px 0; }
.score span { display: block; line-height: 1.3; }

.s-match { display: flex; flex-direction: column; gap: 12px; }
.s-match .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.s-match .mpic { padding: 10px 6px 6px; border-radius: 14px; }
.s-match .mpic .pic { width: 70px; height: 70px; }
.s-match .mpic .slot { font-size: 14px; min-height: 22px; }
.s-match .match-words { gap: 8px; }
.s-match .mword { font-size: 15px; padding: 6px 14px; }

.bank { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; background: var(--mist); border-radius: 12px; margin-bottom: 12px; }
.bank span { font-weight: 700; color: var(--navy); padding: 2px 8px; border-radius: 6px; background: var(--paper); }
.bank span.used { text-decoration: line-through; color: var(--muted); }
.fill-item { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
.fill-item select { font: inherit; font-weight: 700; color: var(--navy); border: 1.5px solid var(--line); border-radius: 8px; padding: 4px 6px; background: var(--paper); }
.fill-item.ok select { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.fill-item.no select { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
.choose-item { padding: 10px 0; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.choose-item .opt { padding: 3px 10px; border-radius: 8px; font-size: 15px; }
.s-uq .tile { font-size: 16px; padding: 3px 10px; }
.s-uq .answer-line { min-height: 40px; }
.order-list { display: flex; flex-direction: column; gap: 8px; }
.order-list .opt { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.order-list .opt .pos { min-width: 22px; height: 22px; border-radius: 50%; background: var(--mist); display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--navy); }
.order-list .opt.ok .pos { background: var(--ok); color: #fff; }
.write-item { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.write-item .row { display: flex; gap: 8px; }
.write-item input { flex: 1; font: inherit; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--ink); min-width: 0; }
.cando { display: flex; flex-direction: column; gap: 10px; }
.cando .row { display: flex; align-items: center; gap: 10px; }
.cando .row span { flex: 1; font-weight: 600; }
.cando .opt { padding: 5px 12px; font-size: 14px; }
.score { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.score div { background: var(--mist); border-radius: 14px; padding: 12px; }
.score b { display: block; font-family: var(--display); font-size: 28px; color: var(--navy); font-variant-numeric: tabular-nums; }
.score span { font-size: 12px; color: var(--muted); font-weight: 700; }
.s-foot { text-align: center; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; padding: 10px 20px 30px; }

/* Lesson index */
body.index { background: var(--mist); }
.ix { max-width: 880px; margin: 0 auto; padding: 40px 20px 60px; }
.ix .logo { width: 150px; }
.ix h1 { font-size: 44px; font-weight: 800; margin: 18px 0 6px; }
.ix > p { color: var(--muted); margin: 0 0 26px; }
.ix-lesson { background: var(--paper); border-radius: 20px; padding: 22px; margin-bottom: 14px; display: grid; grid-template-columns: 90px 1fr; gap: 18px; align-items: center; }
.ix-lesson .pic { width: 90px; height: 90px; }
.ix-lesson h2 { font-size: 26px; font-weight: 800; }
.ix-lesson .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.ix-lesson.soon { opacity: .6; }
.ix a.btn { text-decoration: none; }

/* ---------- Additions used across pages ---------- */
.blank { display: inline-block; width: 3.6em; height: .9em; border-bottom: .09em solid currentColor; vertical-align: baseline; margin: 0 .15em; }
.says .wb-opts { display: inline; font-size: 12px; margin: 0 4px 0 0; }
.says .wline.inline { width: 7em; }
.wb-sub-h { margin: 14px 0 8px; }
.wb-sub-h:first-child { margin-top: 0; }

/* Back to the lesson list */
.home-link { display: inline-flex; align-items: center; gap: 2px; color: var(--navy); text-decoration: none; font-weight: 700; font-size: 13px; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 11px 5px 6px; white-space: nowrap; }
.home-link:hover { border-color: var(--navy); }
.toolbar a.tb { text-decoration: none; }
@media (max-width: 420px) {
  .s-top .page { display: none; }
  .s-top .in { gap: 8px; padding: 10px 12px; }
  .s-top .brand b { letter-spacing: .08em; }
  .s-top .home-link { padding: 5px; }
  .s-top .home-link span { display: none; }
}
@media print { .home-link { display: none !important; } }

/* Lesson hubs */
.ix-steps { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.ix-steps h3 { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ix-step { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.ix-step b { color: var(--navy); font-size: 14px; line-height: 1.3; }
.ix-step b small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; }
.ix-url { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--muted); background: var(--mist); border-radius: 8px; padding: 6px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ix-step .btn { text-decoration: none; }
@media (max-width: 640px) {
  .ix-step { grid-template-columns: minmax(0, 1fr) auto auto; }
  .ix-step .ix-url { grid-column: 1 / -1; grid-row: 2; }
}
.ix-note { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; margin: -10px 0 22px; }
.ix-choose { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.ix-choose a { background: var(--paper); border: 2px solid transparent; border-radius: 20px; padding: 22px; text-decoration: none; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.ix-choose a:hover { border-color: var(--navy); }
.ix-choose a strong { font-family: var(--display); font-size: 26px; color: var(--navy); }
@media (max-width: 560px) {
  .ix { padding: 28px 16px 48px; }
  .ix h1 { font-size: 34px; }
  .ix-lesson { grid-template-columns: 56px minmax(0, 1fr); padding: 18px; }
  .ix-lesson .pic { width: 56px; height: 56px; }
  .ix-lesson h2 { font-size: 22px; }
}
@media print {
  .card .wb-find, .card .wb-uns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; row-gap: 4px; }
  .card .wb-patterns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; }
  .card .wb-patterns .wb-pattern { border-top: 0; padding: 4px 0 10px; }
  .card .s-dlg { gap: 6px; }
  .card .s-dlg .says { padding: 6px 12px; }
}
.slide-title h2 { max-width: 1060px; }
.slide-actions { position: absolute; top: 108px; right: 64px; display: flex; gap: 10px; align-items: center; }
.slide-actions .btn.small { font-size: 17px; padding: 8px 16px; }
.slide-actions .tag { font-size: 18px; font-variant-numeric: tabular-nums; }
.slide-head .globe { margin-left: 14px; }
.slide-head .globe-btn { font-size: 15px; }
.scene .pic { width: 100%; max-width: 640px; }
.title-slide .right .pic { width: 100%; }
.qa li .ico, .task .ico { color: var(--red); }
.find-slide .says { font-size: 25px; padding: 10px 20px; }
.find-slide .avatar { width: 50px; height: 50px; }
div.bubble { cursor: default; }
div.bubble:hover { border-color: transparent; }
.times-up { color: var(--red-ink); border-color: var(--red); }
.vrow .word .gw, .bubble .gw { border-bottom-color: currentColor; }
.line.B .says .gw { border-bottom-color: #BFCBE0; }

/* ---------- Student workbook ---------- */
.wb-cover { display: flex; flex-direction: column; gap: 2px; }
.wb-logo { width: 120px; margin-bottom: 8px; }
.wb-name { display: none; margin-top: 12px; font-weight: 700; color: var(--navy); }
.wb-fill { display: inline-block; width: 45%; border-bottom: 1.5px solid var(--line); margin-right: 16px; }
.wb-fill.short { width: 22%; }
.pdf-btn { text-decoration: none; margin-left: auto; }
.s-top .pdf-btn + .globe { margin-left: 0; }
.wline { font: inherit; color: var(--ink); border: 0; border-bottom: 1.5px solid var(--line); background: transparent; padding: 6px 2px; width: 100%; min-width: 0; border-radius: 0; }
.wline:focus { border-bottom-color: var(--navy); outline: none; background: var(--mist); }
.wline.inline { display: inline-block; width: 9em; margin: 0 4px; padding: 2px; }
.says .wline.inline { border-bottom-color: currentColor; }
.wb-opts { display: block; font-size: 12px; font-weight: 600; opacity: .75; }
.wb-vocab { width: 100%; border-collapse: collapse; font-size: 14px; }
.wb-vocab th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 6px; }
.wb-vocab td { border-top: 1px solid var(--line); padding: 6px; vertical-align: middle; }
.wb-vocab .pic { width: 40px; height: 40px; }
.wb-vocab .w { font-family: var(--display); font-weight: 800; color: var(--navy); font-size: 16px; white-space: nowrap; }
.wb-vocab .w .say { width: 28px; height: 28px; vertical-align: middle; margin-left: 2px; }
.wb-vocab .ipa { font-size: 13px; white-space: nowrap; }
.wb-vocab .mean { width: 22%; }
@media (max-width: 560px) {
  .wb-vocab thead { display: none; }
  .wb-vocab tr { display: grid; grid-template-columns: 48px 1fr; column-gap: 10px; border-top: 1px solid var(--line); padding: 8px 0; }
  .wb-vocab td { border: 0; padding: 1px 0; }
  .wb-vocab td:first-child { grid-row: span 4; }
  .wb-vocab .mean { width: auto; }
}
.wb-warm { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.wb-scene { background: var(--mist); border-radius: 14px; padding: 10px; }
.wb-scene .pic { max-width: 320px; margin: 0 auto; }
.wb-q, .wb-find, .wb-mcq, .wb-uns { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 10px; }
.wb-q p, .wb-mcq p, .wb-uns p { margin: 0; font-weight: 600; }
.wb-find li span { font-weight: 600; }
.wb-starter { margin: 12px 0 0; color: var(--muted); }
.wb-starter b { color: var(--navy); }
.wb-chunks { display: flex; flex-direction: column; gap: 12px; }
.wb-chunks h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.wb-chunks .sent { margin-bottom: 6px; cursor: pointer; }
.wb-chunks .sent span { flex: 1; }
.wb-chunks input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--ok); flex: none; }
.wb-pics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.wb-pic { background: var(--mist); border-radius: 14px; padding: 10px 10px 4px; display: flex; flex-direction: column; align-items: center; }
.wb-pic .pic { width: 72px; height: 72px; }
.wb-pic .wline { text-align: center; }
.wb-guided .says { line-height: 2; }
.wb-pattern { padding: 10px 0; border-top: 1px solid var(--line); }
.wb-pattern:first-of-type { border-top: 0; }
.wb-sub { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 6px 0; font-weight: 700; }
.wb-sub .col { background: var(--mist); border-radius: 10px; padding: 6px 12px; color: var(--navy); line-height: 1.5; }
.wb-sits { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-bottom: 14px; }
.wb-sit { display: flex; gap: 12px; align-items: center; background: var(--mist); border-radius: 14px; padding: 8px 12px; }
.wb-sit .pic { width: 48px; height: 48px; flex: none; }
.wb-sit p { margin: 0; font-size: 14px; }
.wb-choices { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.wb-choices label, .lv { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-weight: 600; }
.wb-choices input, .lv input { accent-color: var(--navy); margin: 0; }
.wb-tokens { color: var(--navy); }
.wb-fb { width: 100%; border-collapse: collapse; }
.wb-fb td { border-top: 1px solid var(--line); padding: 8px 4px; font-weight: 600; }
.wb-fb td:last-child { text-align: right; white-space: nowrap; }
.lv { margin-left: 4px; padding: 3px 10px; }
.wb-action { margin: 12px 0 0; }
.wline.wide { margin-top: 8px; }
.wb-next { display: inline-block; margin-top: 6px; letter-spacing: 0; text-transform: none; font-size: 13px; color: var(--navy); }

@page { size: A4; margin: 13mm 14mm; }
@media print {
  html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body.student { background: #fff; font-size: 11pt; }
  .s-top, .say, .pdf-btn, .globe, .gpop { display: none !important; }
  .s-main { max-width: none; padding: 0; gap: 10px; }
  .card { padding: 10px 0 12px; border-radius: 0; border-bottom: 1px solid var(--line); break-inside: avoid; }
  .card.wb:has(.wb-vocab) { break-inside: auto; }
  .card > header { margin-bottom: 6px; }
  .card > header h2 { font-size: 16pt; }
  .card .lead { margin: -2px 0 8px; font-size: 10pt; }
  .s-hero { padding: 0 0 6px; }
  .s-hero h1 { font-size: 30pt; }
  .wb-name { display: block; }
  .wline { border-bottom: 1px solid #9AA8C2; height: 26px; }
  .wline::placeholder { color: transparent; }
  .wb-vocab .mean .wline { height: 20px; }
  .wb-vocab tr { break-inside: avoid; }
  .wb-warm { grid-template-columns: 38% minmax(0, 1fr); align-items: start; }
  .wb-chunks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .wb-chunks .sent { padding: 6px 8px; font-size: 10pt; }
  .wb-pics { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .wb-sits { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .s-dlg .says { font-size: 11pt; }
  .wb-find, .wb-uns { gap: 6px; }
  .s-foot { padding: 10px 0 0; }
}

/* ---------- Level 2 (CONVEY) ---------- */
/* Formula tags: O·R·E·O and P·P·F + "still open". Navy family, red only for the open point. */
.ftag { display: inline-grid; place-items: center; width: 1.7em; height: 1.7em; border-radius: 9px; font-family: var(--display); font-weight: 800; font-size: 20px; color: #fff; background: var(--navy); flex: none; }
.ft-R, .ft-P2, .ft-S2 { background: var(--navy-2); }
.ft-E, .ft-F, .ft-S3 { background: #3E63A8; }
.ft-X, .ft-S4 { background: var(--red); }
.avatar.av-tan { background: var(--navy); color: #fff; }
.avatar.av-kumar { background: #3E63A8; color: #fff; }
.avatar.av-ali { background: #22427A; color: #fff; }
.avatar.av-meiling { background: #F2B233; color: var(--navy); }
.avatar.av-siti { background: #1D7447; color: #fff; }
.avatar.av-amy { background: var(--red); color: #fff; }
.avatar.sm { width: 26px; height: 26px; font-size: 12px; display: inline-grid; vertical-align: middle; }
.say.mini { width: 30px; height: 30px; }
.say.mini .ico { width: 1em; height: 1em; }
body.no-sound .play { display: none !important; }
body.no-sound .sim { display: none !important; }
.hint { color: var(--muted); font-size: 19px; margin: auto 0 0; }
.lead-big { font-size: 24px; color: var(--muted); margin: -8px 0 18px; }

/* 02 goal */
.cando-big { font-family: var(--display); font-size: 36px; font-weight: 800; color: var(--navy); line-height: 1.2; background: var(--mist); border-radius: 18px; padding: 22px 28px; margin-bottom: 22px; }
.scn { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 40px; font-size: 22px; }
.scn-row { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: start; }
.scn-k { font-size: 14px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--red-ink); padding-top: 6px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
.facts > div { background: var(--mist); border-radius: 14px; padding: 14px 20px; }
.facts h3 { font-size: 22px; margin-bottom: 6px; }
.facts ul { margin: 0; padding-left: 1.2em; font-size: 20px; }
.title-slide .sub { margin: 14px 0 0; font-size: 22px; color: var(--muted); }
.title-slide .meta { margin-top: 20px; }

/* 03 warm-up + timers */
.warm-left { display: flex; flex-direction: column; gap: 20px; }
.warm-left .line { max-width: 100%; }
.warm-left .says { display: flex; flex-direction: column; gap: 8px; }
.warm-left .says .big { font-size: 34px; line-height: 1.25; }
.warm-left .says .play { align-self: flex-start; }
.tm { background: var(--mist); border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 30px; }

  skill: "CONVEY · Explain",
  fn: "Explain",

  formulaLabels: { P: "When it started", P2: "What is wrong now", F: "What I need next", X: "Still open" },
  time: ["Present", "Past"],
  taskType: "Service Desk Role-play",
  translate: true,
  scene: "scene-service",
  coverPic: "scene-service",

  cando: "Tell a repair shop, clinic or bank when a problem started, what is wrong now, what you have tried and what you need, then answer their questions.",

  // Minutes per slide for a 90-minute class (shown on the slides; the teacher may shift time between them)
  timing: { goal: 3, warmup: 4, model: 6, organiser: 5, bank: 6, connectors: 4, time: 4, support: 3, build: 6, task: 25, respond: 6, transfer: 5, evidence: 5, summary: 5 },

  // The reasoning, for teachers (design notes page and the W panel on each slide)
  why: {
    topic: "Every adult in JB takes something to be repaired, or tells a doctor or a bank what is wrong. The person behind the counter can only help with the facts: when it started, what happens now, what you have already tried and when you need it. Without them the shop says 'Try restarting it' and the customer loses days. Here Siti's phone switches off three or four times a day, and she needs it back by Saturday for work calls.",
    fn: "This is Explain, not Narrate: the shop needs facts it can act on, not a story, so 'when it started' is one line and the weight is on what is wrong now. It is not Recommend: the customer chooses nothing. It is the 'problem' kind of explaining in our research note, with one limit: the customer says what happens and does not guess the cause. Finding the cause is the technician's job, and guessing causes is B2.",
    formula: "The row gives PPF with its own four labels: when it started (past) → what is wrong now, with what I have already tried → what I need next → still open (the one question I still have). We chose this order because it matches the four lines of the lesson's job sheet. Fitting a service problem to PPF is our own design choice; no research was found on PPF for adult speaking. We use it because it is easy to teach and to remember.",
    task: "In the Service Desk Role-play the customer holds the problem facts in a mixed-up order. The service person cannot see them: they fill a job sheet, ask about any empty line, then answer the customer's question from their own side of the card, and the customer says the answer back, so each side holds something the other lacks. With 12 people six pairs talk at once and the service people move one seat each round, so every customer explains the same problem three times (3:00, 2:00, then 2:00 with the workbook turned over) before the roles swap.",
    level: "A2 moving to selected B1 outcomes: an A2 customer can say 'Phone broken. Can fix?'; here they give a short, prepared account of a familiar problem (when, what now, one example, what they tried, what they need), close to the B1 descriptor about reporting 'the nature of a problem'. Left out on purpose: guessing what is wrong inside the machine, describing a long technical procedure, and arguing with the shop about who pays or asking for compensation. Those are B2 or Level 3.",
    brief: [
      "§4 Explain: describe the situation, add relevant details, clarify when needed",
      "§6 The title is an action and a situation",
      "§10 One primary communication function",
      "§12 PPF: connect the past to the current situation and the next step",
      "§14 The formula is not forced: PPF with this lesson's own four labels",
      "§15 Formula support fades: the last task round is done with the frames closed",
      "§18 Core time control: past for when it started, present for what is wrong now",
      "§20 Function-support structures for Explain: Present Perfect for what I have tried",
      "§21 Connection support: so for the result, because for the reason, but for 'tried, not fixed' (for example is our own addition; giving an example is an A2 descriptor in the research note)",
      "§22 Required Communication Task",
      "§24 A task with an action and an outcome: the service person fills a job sheet",
      "§25 The task works for 1–12 students",
      "§26 Scenario: who, situation, need, goal",
      "§27 Service situations are part of a working adult's life, not only the office",
      "§29 Transfer from everyday life to work",
      "§33 Pre-convince weight for Explain: respond to simple follow-up questions",
      "§34 No Level 3 in Level 2",
      "§35 Evidence of success for Explain",
      "§36 Evidence is not written as an absolute",
      "§38 Same skill as E03 and E07, different challenge: the learner is the customer, and the listener must act on the facts",
      "§57 Difficulty from depth: when it started, what is wrong now, what was tried, what is needed"

    sources: [
      "Council of Europe (2020), Common European Framework of Reference for Languages: Learning, teaching, assessment — Companion volume",
      "North, B., Ortega, A. & Sheehan, S. (2010), British Council – EAQUALS Core Inventory for General English",
      "Meyer, B. J. F. & Ray, M. N. (2011), Structure strategy interventions",
      "Pica, T., Kanagy, R. & Falodun, J. (1993), Choosing and using communication tasks for second language instruction",
      "Foster, P. & Skehan, P. (1996), The influence of planning and task type on second language performance",
      "de Jong, N. & Perfetti, C. A. (2011), Fluency training in the ESL classroom",
      "Long, M. H. & Porter, P. A. (1985), Group work, interlanguage talk, and second language acquisition",
      "Mehat, S. Z. & Ismail, L. (2021), Malaysian tertiary ESL students' writing errors"
    ],
    slides: {
      warmup: "Mei Ling tells the learner to take the phone back to the shop before anything is taught. Many learners say 'It's broken, can you fix it?' and stop: no day, no example, nothing about what they tried. That is the gap the model fills.",
      model: "Siti gives a day (last Saturday), how often it happens now (three or four times a day), one example with for example (twice this morning at 60% battery), what she has tried with already … but it still, the result with so (she needs it by Saturday), and one reason with because (why she asks about the warranty). She never guesses what is wrong inside the phone. That is what the three evidence rows look for.",
      organiser: "Kumar at a clinic is a different speaker and a different kind of service (a doctor, not a shop), so learners see that the same four parts work for a cough as for a phone.",
      bank: "What was tried sits in the 'What is wrong now' group (I've already tried …, but it still …), because it is the line service people most often have to ask for. The Check group is for checking understanding, a B1 function in the Core Inventory: here the customer checks that the job sheet is right.",
      connectors: "Four connectors carry the explanation: so for the result, for example for one real case, but for 'tried, not fixed', because for the reason.",
      time: "Past for the day it started, present for what happens now, have + tried for what was done up to now. In a study of 30 adult learners in Malaysia most writing errors were in verb tenses and agreement (Mehat & Ismail, 2021); no such study was found for speaking. So 'it switch off' is worth one quick look, but a slip is corrected only when it changes when something happened.",

  scenario: {

    pic: "scene-service"

  warmup: {

    opener: "Your phone switched off again? Take it back to the shop at lunch. What will you tell them?",
    seconds: 30,
    prompts: ["When did it start?", "What is wrong now?", "What have you tried?"]

      { tag: "P2", label: "What is wrong now · what I've tried", text: "Now it switches off three or four times a day. For example, this morning it went off twice at 60% battery. I've already tried a new charger, but it still happens." },
      { tag: "F", label: "What I need next", text: "I use it for work calls, so I need it back by Saturday. Can you check it today and tell me the price before you repair it?" },

      { part: "X", text: "One thing I'm not sure about: can I still play futsal on Saturday?" }

  bank: [

    { a: "I use my phone for work calls.", b: "I need it back by Saturday.", options: ["so", "because", "For example,"], answer: 0 },
    { a: "It switches off three or four times a day.", b: "This morning it went off twice at 60% battery.", options: ["because", "For example,", "but"], answer: 1 },

    { prompt: "What happens now, again and again", sentence: "Now it ____ off three or four times a day.", options: ["switch", "switches", "switching"], answer: 1, why: "Something that happens again and again now → Present Simple. It → switches (with -es)" },

    { prompt: "Not fixed yet", sentence: "I changed the charger, but the problem still ____.", options: ["happen", "happening", "happens"], answer: 2, why: "True now, still not fixed → Present Simple with still. The problem → happens" }
  ],

  support: {
    title: "What I've tried: already … but still",
    note: "For what you have done up to now, with no exact time, use have / has + past participle, often with already. Add but … still for a problem that is not fixed. With an exact past time, use the past.",
    examples: [

      { tag: "F", label: "What I need next", starter: "I use it for …, so I need it back by … Can you …?" },

  task: {
    name: "Service Desk Role-play",
    goal: "The customer explains a problem from a mixed-up card. The service person cannot see it: they fill the job sheet, then answer the customer's question.",

  tips: {
    goal: "Read the scenario aloud. Pairs answer together: what does the shop need to know before it can help? (When it started, what is wrong now, what you have tried, when you need it.) Write four words on the board: When? · Now? · Tried? · Need?",
    warmup: "Learners keep the workbook open at the scenario. Play Mei Ling. Everyone tells a partner what they will say at the shop, 30 seconds, then swap, all pairs at the same time. Each learner writes one line of what they said. Do not correct. Many learners say 'My phone is broken, can you fix it?' and stop: no day, no example, nothing about what they tried. That is today's gap.",
    model: "First point back to the try-out line: which part did you already have, which was missing? Then play Siti once. Pairs answer each question to each other first, all at the same time, then one pair says it: when did it start? How often now? What is her example (for example)? What has she tried (already … but still)? Why does she need it by Saturday (so)? What is her question, and why does she ask it (because)? Reveal the parts.",
    organiser: "Pairs say the order to each other before you tap. Ask: which sentence says what Kumar has tried? (Cough syrup, but it's still bad.) Which sentence is his example? (Last night he woke up four times.) Point out that the order is the same at a clinic as at a phone shop.",
    bank: "Repeat each expression once. Then pairs practise with two problems written on the board, all at the same time: a rice cooker (started last week; the rice comes out hard) · a laptop at home (since Monday, very slow). 'It started … Now it … I've already tried …, but it still …' Point to the Check group: the customer checks that the job sheet is right. Show how a customer says the answer back: 'So you'll check it today and phone me with the price. Thank you.'",
    connectors: "so = the result, for example = one real case, but = tried, not fixed, because = the reason. Pairs say each pair aloud with the connector. If someone picks 'so' for the charger, ask: did the new charger make the problem?",
    time: "Four questions. An exact past time? → started. Again and again, now? → switches (it + -es). Tried up to now? → have tried. Still not fixed? → happens. Keep it to four minutes. Correct a verb only when it changes when something happened. Fast pairs: say each sentence again about a problem of their own.",
    support: "Only if needed; if the last slides were easy, skip it and give the minutes to the task. Each learner tells a partner about something at home that does not work: 'I've already …, but it still …'.",
    build: "Two silent minutes to plan Siti's problem in your own words with the four frames, or a real problem of your own (a phone, a car, a bill). Weak learners copy the starters; strong learners write only the days and numbers. Then each learner says it once to a partner, one minute each, all pairs at the same time. The partner holds up one finger for each part they hear: when, now, tried, need. In the last minute, listener cards and speaker cards are cut from the last pages before round 1, and the class makes two lines facing each other.",
    task: "Listener cards and speaker cards are cut from the last pages before round 1; give cards by seat (see 5–12). Each customer puts their card's listener card on the table for whoever sits opposite. Demonstrate with Siti's phone, not a card (3 min): you are the shop assistant; the class reads Siti's lines aloud together while you fill the job sheet on the board and ask about one empty line. One silent minute: customers number their facts. Press 3:00, 2:00, 2:00, with a seat move after rounds 1 and 2; in round 3 customers turn the workbook over. A line the service person had to ask for gets a '?'. Then swap and repeat. With 12: demo 3 + half (1 + 3 + 2 + 2 + moves 1) 9 + swap 2 + half 9 = 23 of 25. Listen for what was tried, the line most often missing. Do not correct: write two things you hear for 'Two things I heard'.",
    respond: "Learners open the workbook at the scenario. Play Amy's three questions one at a time. After each, pairs at the same time: one partner asks it again and the other answers in one or two sentences, then the other way round in their own words. Then one pair shares. The answers are in the scenario: 11 months ago, with the receipt; no, at any time, for example at 60% battery this morning; please call me first and tell me the price.",
    transfer: "Give one minute to read. Pairs, all at once: one partner is Ali, the other explains the printer problem, one minute, then swap. If a learner has no question, offer one: 'Can I print from another laptop?' 'Ali' writes in the margin of the workbook when it started, what is wrong, what was tried and the deadline, then answers the question honestly ('I'll check and tell you by …' is fine). One pair may share. Point out that the four parts are the same as at the phone shop.",
    evidence: "Everyone looks at their own job sheets with a partner, customer by customer: which lines were filled with no '?'. 'Started' and 'Wrong now + example' with no '?' = row 1; 'Already tried' with no '?' = row 2; 'Need, by when + question' with no '?' = row 3. A '?' in round 1 that is gone in round 2 or 3 counts as a tick. Then all at once, hands up for each row. Add what you heard yourself. Then show 'Two things I heard': one expression that worked, one thing to fix, no names.",
    feedback: "Learners show 1, 2 or 3 fingers for each area. Tap to record the class result. Each learner tells a partner their 'Next time, I will …' sentence, all pairs at once.",
    summary: "Everyone explains Siti's phone, or their own problem, once more to a partner, workbook closed: when it started → what is wrong now and what I tried → what I need → my question. Read the four points together. Then learners show 1, 2 or 3 fingers for each area; tap to record the class result. Each tells a partner their 'Next time, I will …' sentence."
  },

    write: [
